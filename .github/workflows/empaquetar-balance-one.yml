name: Empaquetar Balance One 0.2.10 Beta
on:
  pull_request:
    branches: [android-native]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  apk:
    if: github.head_ref == 'apk/0.2.10-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Generar APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Balance-One-0.2.10-Beta
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
