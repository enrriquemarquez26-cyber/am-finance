
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AM Finance">
<title>AM Finance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#17212e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:white;padding:25px 20px;border-bottom:1px solid #eee}
.logo{font-size:25px;font-weight:800}
.logo span{color:#328d94}
.sub{font-size:13px;color:#87929f;margin-top:6px}
main{padding:20px 16px 110px;max-width:650px;margin:auto}
h2{font-size:21px;margin:0 0 17px}
h3{margin:0 0 15px}
.card{background:white;border:1px solid #e9edf0;border-radius:19px;padding:19px;margin-bottom:14px}
.label{font-size:13px;color:#87919e}
.amount{font-size:34px;font-weight:800;margin:12px 0}
.smallamount{font-size:24px;font-weight:750;margin:9px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.green{color:#16845d}
.red{color:#ca5058}
.primary{width:100%;background:#1b2c39;color:white;border:0;border-radius:13px;padding:14px;font-size:15px;font-weight:650;margin-top:5px}
.secondary{width:100%;background:#e9f3f4;color:#237f87;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:650;margin-top:12px}
input,select{width:100%;border:1px solid #dce2e7;border-radius:12px;padding:13px;font-size:16px;background:white;margin:7px 0 13px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8eaed;display:flex;justify-content:space-around;padding:11px 2px calc(12px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:#87919d;font-size:10px;padding:5px 2px;min-width:19%}
nav button b{display:block;font-size:21px;margin-bottom:5px}
nav button.active{color:#147e86;font-weight:750}
.item{border-bottom:1px solid #edf0f2;padding:13px 0}
.item:last-child{border:0}
.note{font-size:12px;color:#89939f;line-height:1.5}
.payment{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<div class="logo">AM <span>Finance</span></div>
<div class="sub">Control inteligente de tus finanzas</div>
</header>
<main id="content"></main>
<nav>
<button id="nav-inicio" onclick="go('inicio')"><b>⌂</b>Inicio</button>
<button id="nav-movimientos" onclick="go('movimientos')"><b>⇄</b>Movimientos</button>
<button id="nav-vehiculos" onclick="go('vehiculos')"><b>🚘</b>Vehículos</button>
<button id="nav-tarjetas" onclick="go('tarjetas')"><b>▤</b>Tarjetas</button>
<button id="nav-presupuestos" onclick="go('presupuestos')"><b>◉</b>Presupuestos</button>
</nav>
<script>
const KEY="amfinance-demo-v1";
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!Array.isArray(data.movimientos)){
data={movimientos:[],vehiculos:[],tarjetas:[]};
}
if(!Array.isArray(data.vehiculos))data.vehiculos=[];
if(!Array.isArray(data.tarjetas))data.tarjetas=[];
if(!Array.isArray(data.pagos))data.pagos=[];

const money=n=>new Intl.NumberFormat("en-US",{
style:"currency",currency:"USD"
}).format(Number(n)||0);

const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const el=()=>document.getElementById("content");
const safe=s=>String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));

const today=()=>new Date().toLocaleDateString("en-CA");
const month=()=>today().slice(0,7);
let page="inicio";

function go(p){
page=p;
document.querySelectorAll("nav button").forEach(b=>{
b.classList.toggle("active",b.id==="nav-"+p);
});
render();
}

function render(){
if(page==="inicio")return inicio();
if(page==="movimientos")return movimientos();
if(page==="vehiculos")return vehiculos();
if(page==="tarjetas")return tarjetas();
presupuestos();
}

function inicio(){
let movimientosMes=data.movimientos.filter(m=>m.fecha.slice(0,7)===month());
let ingresos=movimientosMes.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+Number(m.monto),0);
let gastos=movimientosMes.filter(m=>m.tipo==="gasto").reduce((a,m)=>a+Number(m.monto),0);
let pagosMes=data.pagos.filter(p=>p.fecha.slice(0,7)===month());
let pagos=pagosMes.reduce((a,p)=>a+Number(p.monto),0);
let autos=data.vehiculos.reduce((a,v)=>a+Number(v.saldo),0);
let tarjetas=data.tarjetas.reduce((a,t)=>a+Number(t.saldo),0);

el().innerHTML=`
<h2>Resumen financiero</h2>
<div class="card">
<div class="label">Balance del mes</div>
<div class="amount">${money(ingresos-gastos-pagos)}</div>
<div class="note">Ingresos menos gastos y pagos realizados. No descuenta deudas pendientes.</div>
</div>
<div class="row">
<div class="card" style="width:50%">
<div class="label">Ingresos</div>
<div class="smallamount green">${money(ingresos)}</div>
</div>
<div class="card" style="width:50%">
<div class="label">Gastos y pagos</div>
<div class="smallamount red">${money(gastos+pagos)}</div>
</div>
</div>
<div class="card">
<div class="label">Mis deudas pendientes</div>
<div class="smallamount">${money(autos+tarjetas)}</div>
<div class="note">Vehículos: ${money(autos)} · Tarjetas: ${money(tarjetas)}</div>
</div>
<button class="primary" onclick="go('movimientos')">+ Registrar movimiento</button>
<p class="note">Versión de prueba. Utiliza solamente datos ficticios.</p>`;
}

function movimientos(){
let movs=data.movimientos.map(m=>({
nombre:m.nombre,fecha:m.fecha,monto:Number(m.monto),
tipo:m.tipo
}));
let pagos=data.pagos.map(p=>({
nombre:"Pago: "+p.nombre,fecha:p.fecha,
monto:Number(p.monto),tipo:"gasto"
}));
let items=[...movs,...pagos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
el().innerHTML=`
<h2>Movimientos</h2>
<div class="card">
<form id="formMov">
<label class="label">Tipo</label>
<select name="tipo">
<option value="ingreso">Ingreso</option>
<option value="gasto">Gasto o compra en efectivo</option>
</select>
<label class="label">Descripción</label>
<input name="nombre" placeholder="Trabajo, supermercado..." maxlength="80" required>
<label class="label">Cantidad ($)</label>
<input name="monto" type="number" min="0.01" step="0.01" required>
<button class="primary">Guardar movimiento</button>
</form>
</div>
<div class="card">
<h3>Historial</h3>
${items.map(m=>`
<div class="item row">
<div><strong>${safe(m.nombre)}</strong>
<div class="label">${safe(m.fecha)}</div></div>
<strong class="${m.tipo==="ingreso"?"green":"red"}">
${m.tipo==="ingreso"?"+":"−"}${money(m.monto)}
</strong>
</div>`).join("")||'<p class="note">Sin movimientos.</p>'}
</div>`;
document.getElementById("formMov").onsubmit=e=>{
e.preventDefault();
let f=new FormData(e.target);
data.movimientos.push({
tipo:f.get("tipo"),
nombre:f.get("nombre"),
monto:Number(f.get("monto")),
fecha:today()
});
save();render();
};
}

function vehiculos(){
el().innerHTML=`
<h2>Préstamos de vehículos</h2>
<div class="card">
<form id="formAuto">
<input name="nombre" placeholder="Nombre del vehículo" required>
<input name="saldo" type="number" min="0" step="0.01" placeholder="Saldo pendiente ($)" required>
<input name="apr" type="number" min="0" step="0.01" placeholder="APR (%)" required>
<input name="pago" type="number" min="0" step="0.01" placeholder="Pago mensual ($)" required>
<button class="primary">Añadir vehículo</button>
</form>
</div>
${data.vehiculos.map((v,i)=>`
<div class="card">
<strong>${safe(v.nombre)}</strong>
<div class="smallamount">${money(v.saldo)}</div>
<div class="label">APR ${v.apr}% · Pago mensual ${money(v.pago)}</div>
<button class="secondary" onclick="toggle('auto${i}')">Registrar pago</button>
<div class="payment hidden" id="auto${i}">
<form onsubmit="pagarAuto(event,${i})">
<label class="label">Cantidad pagada ($)</label>
<input name="monto" type="number" min="0.01" step="0.01" value="${v.pago}" required>
<button class="primary">Confirmar pago</button>
</form>
<p class="note">Interés estimado: saldo × APR ÷ 12. El cálculo real del banco puede ser diferente.</p>
</div>
</div>`).join("")}`;
document.getElementById("formAuto").onsubmit=e=>{
e.preventDefault();
let f=new FormData(e.target);
data.vehiculos.push({
nombre:f.get("nombre"),
saldo:Number(f.get("saldo")),
apr:Number(f.get("apr")),
pago:Number(f.get("pago"))
});
save();render();
};
}

function tarjetas(){
el().innerHTML=`
<h2>Tarjetas de crédito</h2>
<div class="card">
<form id="formTarjeta">
<input name="nombre" placeholder="Ej. Chase Visa" required>
<input name="saldo" type="number" min="0" step="0.01" placeholder="Saldo ($)" required>
<input name="limite" type="number" min="0" step="0.01" placeholder="Límite ($)" required>
<input name="apr" type="number" min="0" step="0.01" placeholder="APR (%)" required>
<button class="primary">Añadir tarjeta</button>
</form>
</div>
${data.tarjetas.map((t,i)=>`
<div class="card">
<strong>${safe(t.nombre)}</strong>
<div class="smallamount">${money(t.saldo)}</div>
<div class="label">Límite ${money(t.limite)} · APR ${t.apr}%</div>
<button class="secondary" onclick="toggle('tarjeta${i}')">Registrar pago</button>
<div class="payment hidden" id="tarjeta${i}">
<form onsubmit="pagarTarjeta(event,${i})">
<label class="label">Cantidad pagada ($)</label>
<input name="monto" type="number" min="0.01" step="0.01" required>
<button class="primary">Confirmar pago</button>
</form>
</div>
</div>`).join("")}`;
document.getElementById("formTarjeta").onsubmit=e=>{
e.preventDefault();
let f=new FormData(e.target);
data.tarjetas.push({
nombre:f.get("nombre"),
saldo:Number(f.get("saldo")),
limite:Number(f.get("limite")),
apr:Number(f.get("apr"))
});
save();render();
};
}

function toggle(id){
document.getElementById(id).classList.toggle("hidden");
}

function pagarAuto(e,i){
e.preventDefault();
let v=data.vehiculos[i];
let monto=Number(new FormData(e.target).get("monto"));
let saldo=Number(v.saldo);
let interes=Math.round(saldo*Number(v.apr)/1200*100)/100;
let capital=Math.round((monto-interes)*100)/100;

if(!Number.isFinite(monto)||monto<=0)return;
if(capital<=0){
alert("El pago no cubre el interés mensual estimado.");
return;
}
if(capital>saldo){
alert("El pago supera el saldo más el interés estimado.");
return;
}
if(!confirm("Registrar pago de "+money(monto)+"?"))return;

v.saldo=Math.round((saldo-capital)*100)/100;
data.pagos.push({
nombre:v.nombre,
monto:monto,
interes:interes,
capital:capital,
tipo:"vehiculo",
fecha:today()
});
save();
alert("Pago registrado.\nInterés estimado: "+money(interes)+"\nCapital: "+money(capital)+"\nNuevo saldo: "+money(v.saldo));
render();
}

function pagarTarjeta(e,i){
e.preventDefault();
let t=data.tarjetas[i];
let monto=Number(new FormData(e.target).get("monto"));
if(!Number.isFinite(monto)||monto<=0)return;
if(monto>Number(t.saldo)){
alert("El pago supera el saldo de la tarjeta.");
return;
}
if(!confirm("Registrar pago de "+money(monto)+"?"))return;

t.saldo=Math.round((Number(t.saldo)-monto)*100)/100;
data.pagos.push({
nombre:t.nombre,
monto:monto,
tipo:"tarjeta",
fecha:today()
});
save();
alert("Pago registrado. Nuevo saldo: "+money(t.saldo));
render();
}

function presupuestos(){
el().innerHTML=`
<h2>Presupuestos</h2>
<div class="card">
<h3>Próximamente</h3>
<p class="note">Aquí añadiremos límites mensuales para comida, gasolina, compras y otras categorías.</p>
</div>`;
}

go("inicio");
</script>
</body>
</html>

<body>

<div class="logo">AM <span>Finance</span></div>

<main id="content"></main>
<nav>

<button onclick="go('vehiculos')" id="nav-vehiculos"><b>🚘</b>Vehículos</button>
<button onclick="go('tarjetas')" id="nav-tarjetas"><b>▤</b>Tarjetas</button>

<script>
const KEY="amfinance-demo-v1";
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!Array.isArray(data.movimientos))data={movimientos:[],vehiculos:[],tarjetas:[]};
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const el=()=>document.getElementById("content");
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let page="inicio";
function go(p){
page=p;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.id==="nav-"+p));
render();
}
function render(){
if(page==="inicio")return inicio();
if(page==="movimientos")return movimientos();
if(page==="vehiculos")return vehiculos();
if(page==="tarjetas")return tarjetas();
presupuestos();
}
function inicio(){
let mes=new Date().toISOString().slice(0,7);
let movimientos=data.movimientos.filter(m=>m.fecha.slice(0,7)===mes);
let ingresos=movimientos.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+m.monto,0);
let gastos=movimientos.filter(m=>m.tipo==="gasto").reduce((a,m)=>a+m.monto,0);
let deudaAutos=data.vehiculos.reduce((a,v)=>a+v.saldo,0);
let deudaTarjetas=data.tarjetas.reduce((a,t)=>a+t.saldo,0);
el().innerHTML=`
<h2>Resumen financiero</h2>
<div class="card"><div class="label">Balance del mes</div><div class="amount">${money(ingresos-gastos)}</div><div class="note">Ingresos menos salidas de dinero registradas. No descuenta las deudas pendientes.</div></div>
<div class="row">
<div class="card" style="width:50%"><div class="label">Ingresos</div><div class="smallamount green">${money(ingresos)}</div></div>
<div class="card" style="width:50%"><div class="label">Gastos y pagos</div><div class="smallamount red">${money(gastos)}</div></div>
</div>
<div class="card"><div class="label">Mis deudas pendientes</div><div class="smallamount">${money(deudaAutos+deudaTarjetas)}</div><div class="note">Vehículos: ${money(deudaAutos)} · Tarjetas: ${money(deudaTarjetas)}</div></div>
<button class="primary" onclick="go('movimientos')">+ Registrar movimiento</button>
<p class="note">Versión de prueba. No introduzcas datos financieros reales todavía.</p>`;
}
function movimientos(){
let items=[...data.movimientos].reverse().map(m=>`<div class="item row"><div><strong>${safe(m.nombre)}</strong><div class="label">${safe(m.fecha)}</div></div><strong class="${m.tipo==="ingreso"?"green":"red"}">${m.tipo==="ingreso"?"+":"−"}${money(m.monto)}</strong></div>`).join("");
el().innerHTML=`
<h2>Movimientos</h2>
<div class="card">
<form id="formMov">
<label class="label">Tipo</label>
<select name="tipo"><option value="ingreso">Ingreso</option><option value="gasto">Gasto o pago</option></select>
<label class="label">Descripción</label>
<input name="nombre" placeholder="Ej. Trabajo, supermercado" maxlength="80" required>
<label class="label">Cantidad ($)</label>
<input name="monto" type="number" min="0.01" step="0.01" placeholder="0.00" required>

</form></div>
<div class="card"><strong>Historial</strong>${items||'<p class="note">Todavía no hay movimientos.</p>'}</div>`;
document.getElementById("formMov").onsubmit=e=>{
e.preventDefault();let f=new FormData(e.target);
data.movimientos.push({tipo:f.get("tipo"),nombre:f.get("nombre"),monto:Number(f.get("monto")),fecha:new Date().toLocaleDateString("en-CA")});
save();render();
};
}
function vehiculos(){
el().innerHTML=`<h2>Préstamos de vehículos</h2>
<div class="card"><form id="formAuto">
<input name="nombre" placeholder="Nombre del vehículo" required>
<input name="saldo" type="number" min="0" step="0.01" placeholder="Saldo del préstamo ($)" required>
<input name="apr" type="number" min="0" step="0.01" placeholder="APR (%)" required>
<input name="pago" type="number" min="0" step="0.01" placeholder="Pago mensual ($)" required>
<button class="primary">Añadir vehículo</button></form></div>
${data.vehiculos.map(v=>`<div class="card"><strong>${safe(v.nombre)}</strong><div class="smallamount">${money(v.saldo)}</div><div class="label">APR ${v.apr}% · Cuota ${money(v.pago)}</div></div>`).join("")}`;

save();render();
};
}

<input name="nombre" placeholder="Ej. Chase Visa" required>

${data.tarjetas.map(t=>`<div class="card"><strong>${safe(t.nombre)}</strong><div class="smallamount">${money(t.saldo)}</div><div class="label">Límite ${money(t.limite)} · APR ${t.apr}%</div></div>`).join("")}`;
document.getElementById("formTarjeta").onsubmit=e=>{

save();render();
};

function presupuestos(){
el().innerHTML=`<h2>Presupuestos</h2><div class="card"><strong>Próximamente</strong><p class="note">Aquí añadiremos límites mensuales para comida, gasolina, compras y otras categorías.</p></div>`;
