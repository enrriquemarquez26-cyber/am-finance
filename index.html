<body>
<header>
<div class="logo">AM <span>Finance</span></div>
<div class="sub">Control inteligente de tus finanzas · V3</div>
</header>
<main id="content"></main>
<nav>
<button onclick="go('inicio')" id="nav-inicio"><b>⌂</b>Inicio</button>
<button onclick="go('movimientos')" id="nav-movimientos"><b>⇄</b>Movimientos</button>
<button onclick="go('vehiculos')" id="nav-vehiculos"><b>🚘</b>Vehículos</button>
<button onclick="go('tarjetas')" id="nav-tarjetas"><b>▤</b>Tarjetas</button>
<button onclick="go('presupuestos')" id="nav-presupuestos"><b>◉</b>Presupuestos</button>
</nav>
<script>
const KEY="amfinance-demo-v1";
let data;
try{
 data=JSON.parse(localStorage.getItem(KEY));
}catch(e){}

if(!data||!Array.isArray(data.movimientos)){
 data={movimientos:[],vehiculos:[],tarjetas:[],pagos:[]};
}
if(!Array.isArray(data.vehiculos))data.vehiculos=[];
if(!Array.isArray(data.tarjetas))data.tarjetas=[];
if(!Array.isArray(data.pagos))data.pagos=[];

const money=n=>new Intl.NumberFormat("en-US",{
 style:"currency",currency:"USD"
}).format(Number(n)||0);

const round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const el=()=>document.getElementById("content");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));

function today(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const month=()=>today().slice(0,7);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(data));
  return true;
 }catch(e){
  alert("No se pudieron guardar los cambios en este dispositivo.");
  return false;
 }
}

function validAmount(n){
 return Number.isFinite(n)&&n>0;
}

function validDate(s){
 return /^\d{4}-\d{2}-\d{2}$/.test(s)&&
 !Number.isNaN(new Date(s+"T12:00:00").getTime());
}

// Añade identificadores a los registros antiguos sin borrarlos.
let changed=false;
for(const group of ["movimientos","vehiculos","tarjetas","pagos"]){
 for(const item of data[group]){
  if(!item.id){item.id=id();changed=true;}
 }
}

// Relaciona los pagos antiguos con su vehículo o tarjeta.
for(const p of data.pagos){
 if(!p.cuentaId){
  const group=p.tipo==="vehiculo"?data.vehiculos:
              p.tipo==="tarjeta"?data.tarjetas:[];
  const matches=group.filter(x=>x.nombre===p.nombre);
  if(matches.length===1){
   p.cuentaId=matches[0].id;
   changed=true;
  }
 }
}
if(changed)save();

let page="inicio";
let openEdit=null;

function go(p){
 page=p;
 openEdit=null;
 document.querySelectorAll("nav button").forEach(b=>
  b.classList.toggle("active",b.id==="nav-"+p)
 );
 render();
 window.scrollTo(0,0);
}

function render(){
 if(page==="inicio")return inicio();
 if(page==="movimientos")return movimientos();
 if(page==="vehiculos")return vehiculos();
 if(page==="tarjetas")return tarjetas();
 return presupuestos();
}
function diasParaVencer(dia){
const hoy=new Date();
hoy.setHours(0,0,0,0);

let fecha=new Date(
hoy.getFullYear(),
hoy.getMonth(),
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+1,0
).getDate())
);

if(fecha<hoy){
fecha=new Date(
hoy.getFullYear(),
hoy.getMonth()+1,
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+2,0
).getDate())
);
}

return Math.round((fecha-hoy)/86400000);
}

function avisosVencimiento(){
const cuentas=[
...data.vehiculos.map(v=>({...v,tipo:"Vehículo"})),
...data.tarjetas.map(t=>({...t,tipo:"Tarjeta"}))
];

return cuentas.map(c=>{
const dia=Number(c.vencimiento);
if(!Number.isInteger(dia)||dia<1||dia>31)return "";

const faltan=diasParaVencer(dia);

if(![7,3,0].includes(faltan))return "";

const mensaje=faltan===0
?"¡Vence hoy!"
:`Faltan ${faltan} días`;

return `
<div class="card">
<strong>🔔 ${safe(c.tipo)}: ${safe(c.nombre)}</strong>
<p>${mensaje} para tu próximo pago.</p>
</div>`;
}).join("");
}=
function inicio(){
 const mov=data.movimientos.filter(m=>
  String(m.fecha).slice(0,7)===month()
 );
 const ingresos=mov.filter(m=>m.tipo==="ingreso")
  .reduce((a,m)=>a+Number(m.monto),0);
 const gastos=mov.filter(m=>m.tipo==="gasto")
  .reduce((a,m)=>a+Number(m.monto),0);
 const pagos=data.pagos.filter(p=>
  String(p.fecha).slice(0,7)===month()
 ).reduce((a,p)=>a+Number(p.monto),0);
 const autos=data.vehiculos.reduce((a,v)=>a+Number(v.saldo),0);
 const tarjetas=data.tarjetas.reduce((a,t)=>a+Number(t.saldo),0);

 el().innerHTML=`
 <h2>Resumen financiero</h2>
 <div class="card">
  <div class="label">Balance del mes</div>
  <div class="amount">${money(ingresos-gastos-pagos)}</div>
  <div class="note">Ingresos menos gastos y pagos realizados. No descuenta las deudas pendientes.</div>
 </div>
 <div class="row">
  <div class="card" style="width:50%">
   <div class="label">Ingresos</div>
   <div class="smallamount green">${money(ingresos)}</div>
  </div>
  <div class="card" style="width:50%">
   <div class="label">Gastos y pagos</div>
   <div class="smallamount red">${money(gastos+pagos)}</div>
  </div>
 </div>
 <div class="card">
  <div class="label">Mis deudas pendientes</div>
  <div class="smallamount">${money(autos+tarjetas)}</div>
  <div class="note">Vehículos: ${money(autos)} · Tarjetas: ${money(tarjetas)}</div>
 </div>
 <button class="primary" onclick="go('movimientos')">+ Registrar movimiento</button>
 <p class="note">Versión de prueba V3. Utiliza solamente datos ficticios.</p>`;
}

function movimientos(){
 const items=[
  ...data.movimientos.map(m=>({...m,origen:"movimiento"})),
  ...data.pagos.map(p=>({
   ...p,origen:"pago",tipo:"gasto",
   nombre:"Pago: "+p.nombre
  }))
 ].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));

 el().innerHTML=`
 <h2>Movimientos</h2>
 <div class="card">
  <form id="formMov">
   <label class="label">Tipo</label>
   <select name="tipo">
    <option value="ingreso">Ingreso</option>
    <option value="gasto">Gasto o compra en efectivo</option>
   </select>
   <label class="label">Descripción</label>
   <input name="nombre" placeholder="Trabajo, supermercado..." maxlength="80" required>
   <label class="label">Cantidad ($)</label>
   <input name="monto" type="number" min="0.01" step="0.01" required>
   <label class="label">Fecha</label>
   <input name="fecha" type="date" value="${today()}" required>
   <button class="primary">Guardar movimiento</button>
  </form>
 </div>
 <div class="card">
  <h3>Historial</h3>
  ${items.map(m=>`
   <div class="item">
    <div class="row">
     <div>
      <strong>${safe(m.nombre)}</strong>
      <div class="label">${safe(m.fecha)}</div>
     </div>
     <strong class="${m.tipo==="ingreso"?"green":"red"}">
      ${m.tipo==="ingreso"?"+":"−"}${money(m.monto)}
     </strong>
    </div>
    <div class="actions">

    </div>
    ${openEdit===m.origen+":"+m.id?editor(m):""}
   </div>
  `).join("")||'<p class="note">Sin movimientos.</p>'}
 </div>`;

 document.getElementById("formMov").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const monto=round(f.get("monto"));
  const fecha=String(f.get("fecha"));
  if(!validAmount(monto)||!validDate(fecha))return;
  data.movimientos.push({
   id:id(),tipo:f.get("tipo"),
   nombre:String(f.get("nombre")).trim(),
   monto,fecha
  });
  save();render();
 };
}

function editor(m){
 const pago=m.origen==="pago";
 return `
 <div class="editbox">
  <h3>Editar ${pago?"pago":"movimiento"}</h3>
  <form onsubmit="guardarEdicion(event,'${m.origen}','${m.id}')">
   ${pago?`
    <p class="note">Cuenta: ${safe(m.nombre)}. Se conservará la distribución original de intereses y capital, ajustando el capital por la diferencia del pago.</p>
   `:`
    <label class="label">Tipo</label>
    <select name="tipo">
     <option value="ingreso" ${m.tipo==="ingreso"?"selected":""}>Ingreso</option>
     <option value="gasto" ${m.tipo==="gasto"?"selected":""}>Gasto</option>
    </select>
    <label class="label">Descripción</label>
    <input name="nombre" maxlength="80" value="${safe(m.nombre)}" required>
   `}
   <label class="label">Cantidad ($)</label>
   <input name="monto" type="number" min="0.01" step="0.01" value="${m.monto}" required>
   <label class="label">Fecha</label>
   <input name="fecha" type="date" value="${safe(m.fecha)}" required>
   <button class="primary">Guardar cambios</button>
   <button type="button" class="secondary" onclick="cancelarEdicion()">Cancelar</button>
  </form>
 </div>`;
}

function editar(origen,ident){
 const key=origen+":"+ident;
 openEdit=openEdit===key?null:key;
 render();
}

function cancelarEdicion(){
 openEdit=null;
 render();
}

function findItem(origen,ident){
 const group=origen==="pago"?data.pagos:data.movimientos;
 return group.find(x=>x.id===ident);
}

function cuentaDePago(p){
 const group=p.tipo==="vehiculo"?data.vehiculos:
             p.tipo==="tarjeta"?data.tarjetas:[];
 if(p.cuentaId){
  return group.find(x=>x.id===p.cuentaId)||null;
 }
 const matches=group.filter(x=>x.nombre===p.nombre);
 return matches.length===1?matches[0]:null;
}

// Modifica el saldo de la deuda al corregir un pago.
// delta positivo = aumenta la deuda.
// delta negativo = disminuye la deuda.
function ajustarSaldo(cuenta,delta){
 const nuevo=round(Number(cuenta.saldo)+delta);
 if(!Number.isFinite(nuevo)||nuevo<0){
  alert("Este cambio dejaría la deuda con saldo negativo. Revisa los pagos.");
  return false;
 }
 cuenta.saldo=nuevo;
 return true;
}

function guardarEdicion(e,origen,ident){
 e.preventDefault();
 const item=findItem(origen,ident);
 if(!item)return;
 const f=new FormData(e.target);
 const monto=round(f.get("monto"));
 const fecha=String(f.get("fecha"));

 if(!validAmount(monto)||!validDate(fecha)){
  alert("Introduce una cantidad y una fecha válidas.");
  return;
 }

 if(origen==="movimiento"){
  const nombre=String(f.get("nombre")).trim();
  if(!nombre)return;
  item.nombre=nombre;
  item.tipo=f.get("tipo");
  item.monto=monto;
  item.fecha=fecha;
 }else{
  const cuenta=cuentaDePago(item);
  if(!cuenta){
   alert("No se encontró la cuenta de este pago. No se puede corregir la deuda automáticamente.");
   return;
  }
  const anterior=Number(item.monto);
  const diferencia=round(monto-anterior);

  if(item.tipo==="vehiculo"){
   const interes=Number(item.interes);
   const capitalAnterior=Number(item.capital);
   if(!Number.isFinite(interes)||!Number.isFinite(capitalAnterior)){
    alert("Este pago antiguo no tiene suficientes datos para editarse con seguridad.");
    return;
   }
   const capitalNuevo=round(capitalAnterior+diferencia);
   if(capitalNuevo<=0){
    alert("El pago corregido no cubre el interés registrado.");
    return;
   }
   if(!ajustarSaldo(cuenta,-diferencia))return;
   item.capital=capitalNuevo;
  }else{
   if(!ajustarSaldo(cuenta,-diferencia))return;
  }
  item.monto=monto;
  item.fecha=fecha;
  item.cuentaId=cuenta.id;
  actualizarSaldosHistorial(cuenta);
 }

 openEdit=null;
 save();
 alert("Cambios guardados correctamente.");
 render();
}

function eliminar(origen,ident){
 const group=origen==="pago"?data.pagos:data.movimientos;
 const index=group.findIndex(x=>x.id===ident);
 if(index<0)return;
 const item=group[index];

 if(!confirm("¿Seguro que deseas eliminar este "+(origen==="pago"?"pago":"movimiento")+"?"))return;

 if(origen==="pago"){
  const cuenta=cuentaDePago(item);
  if(!cuenta){
   alert("No se encontró la cuenta asociada. No se eliminará el pago para evitar descuadrar la deuda.");
   return;
  }
  const devolver=item.tipo==="vehiculo"?
   Number(item.capital):Number(item.monto);
  if(!Number.isFinite(devolver)){
   alert("Este pago no tiene información suficiente para eliminarlo.");
   return;
  }
  if(!ajustarSaldo(cuenta,devolver))return;
  group.splice(index,1);
  actualizarSaldosHistorial(cuenta);
 }else{
  group.splice(index,1);
 }

 openEdit=null;
 save();
 alert("Registro eliminado.");
 render();
}

// Recalcula los saldos históricos cuando se corrigen pagos.
// Los pagos sin datos suficientes muestran "No registrado".
function actualizarSaldosHistorial(cuenta){
 const group=data.pagos.filter(p=>
  p.tipo==="vehiculo"&&cuentaDePago(p)===cuenta
 ).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

 let saldo=Number(cuenta.saldo);
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo+Number(p.capital));
 }
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo-Number(p.capital));
  p.saldoRestante=saldo;
 }
}

   <div class="label">Límite ${money(t.limite)} · APR ${safe(t.apr)}%</div>
   <div class="label">
📅 Vencimiento: ${t.vencimiento ? "Día "+t.vencimiento+" de cada mes" : "Sin configurar"}
</div>
  <button class="secondary" onclick="toggle('venceTarjeta${i}')">
📅 Configurar vencimiento
</button>
<div class="payment hidden" id="venceTarjeta${i}">
<form onsubmit="guardarVencimiento(event,'tarjeta',${i})">
<label class="label">Día de vencimiento mensual</label>
<select name="dia" required>
${Array.from({length:31},(_,j)=>`
<option value="${j+1}" ${Number(t.vencimiento)===j+1?"selected":""}>
Día ${j+1}
</option>
`).join("")}
</select>
<button class="primary">Guardar vencimiento</button>
</form>
</div>
  <button class="secondary" onclick="toggle('tarjeta${i}')">Registrar pago</button>
   <div class="payment hidden" id="tarjeta${i}">
    <form onsubmit="pagarTarjeta(event,${i})">
     <label class="label">Cantidad pagada ($)</label>
     <input name="monto" type="number" min="0.01" step="0.01" required>
     <button class="primary">Confirmar pago</button>
    </form>
   </div>
  </div>
 `).join("")}`;

 document.getElementById("formTarjeta").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  data.tarjetas.push({
   id:id(),nombre:String(f.get("nombre")).trim(),
   saldo:round(f.get("saldo")),
   limite:round(f.get("limite")),
   apr:Number(f.get("apr")),
vencimiento:Number(f.get("vencimiento"))
  });
  save();render();
 };
}

function guardarVencimiento(e,tipo,i){
e.preventDefault();

const dia=Number(new FormData(e.target).get("dia"));

if(!Number.isInteger(dia)||dia<1||dia>31){
alert("Selecciona un día válido.");
return;
}

const cuenta=tipo==="tarjeta"
?data.tarjetas[i]
:data.vehiculos[i];

if(!cuenta){
alert("No se encontró la cuenta.");
return;
}

cuenta.vencimiento=dia;
save();
render();

alert("Vencimiento guardado: día "+dia+" de cada mes.");
}
function toggle(ident){
 const element=document.getElementById(ident);
 if(element)element.classList.toggle("hidden");
}

function pagarAuto(e,i){
 e.preventDefault();
 const v=data.vehiculos[i];
 const monto=round(new FormData(e.target).get("monto"));
 const saldo=Number(v.saldo);
 const interes=round(saldo*Number(v.apr)/1200);
 const capital=round(monto-interes);

 if(!validAmount(monto))return;
 if(capital<=0){
  alert("El pago no cubre el interés mensual estimado.");
  return;
 }
 if(capital>saldo){
  alert("El pago supera el saldo más el interés estimado.");
  return;
 }
 if(!confirm("¿Registrar pago de "+money(monto)+"?"))return;

 v.saldo=round(saldo-capital);
 data.pagos.push({
  id:id(),cuentaId:v.id,nombre:v.nombre,
  monto,interes,capital,tipo:"vehiculo",
  fecha:today(),saldoRestante:v.saldo
 });
 save();
 alert("Pago registrado.\nInterés estimado: "+money(interes)+
 "\nCapital: "+money(capital)+
 "\nNuevo saldo: "+money(v.saldo));
 render();
}

function pagarTarjeta(e,i){
 e.preventDefault();
 const t=data.tarjetas[i];
 const monto=round(new FormData(e.target).get("monto"));

 if(!validAmount(monto))return;
 if(monto>Number(t.saldo)){
  alert("El pago supera el saldo de la tarjeta.");
  return;
 }
 if(!confirm("¿Registrar pago de "+money(monto)+"?"))return;

 t.saldo=round(Number(t.saldo)-monto);
 data.pagos.push({
  id:id(),cuentaId:t.id,nombre:t.nombre,
  monto,tipo:"tarjeta",fecha:today()
 });
 save();
 alert("Pago registrado. Nuevo saldo: "+money(t.saldo));
 render();
}

 el().innerHTML=`

  <h3>Próximamente</h3>
  <p class="note">Aquí añadiremos límites mensuales para comida, gasolina, compras y otras categorías.</p>
 </div>`;
}

go("inicio");
</script>
