}

function firmaGasto(movimiento) {
  if (movimiento?.tipo !== "gasto") return "";
  const nombre = claveNotaGasto(movimiento.nombre);
  const origen = valorOrigenMovimiento(movimiento);
  const monto = Number(movimiento.monto);
  if (!nombre || !origen || !validAmount(monto) || !validDate(movimiento.fecha)) return "";
  return JSON.stringify([nombre, origen, movimiento.fecha, Math.round(monto * 100)]);
}

function guardarMovimientoBanco(anterior, nuevo) {
  const claveBanco = "amfinance-cuentas-banco";
  const datosPrevios = localStorage.getItem(KEY);
  const bancosPrevios = localStorage.getItem(claveBanco);

  try {
    const cuentas = JSON.parse(bancosPrevios || "[]");

    if (!Array.isArray(cuentas)) {
            throw new Error(textoApp("Cuentas no válidas", "Invalid accounts"));
    }

    const cambios = new Map();

    function acumular(movimiento, signo) {
      if (!movimiento || !movimiento.cuentaId) return;

      const cantidad = Number(movimiento.monto);

      if (
        !validAmount(cantidad) ||
        !["ingreso", "gasto"].includes(movimiento.tipo)
      ) {
                throw new Error(textoApp("Movimiento no válido", "Invalid transaction"));
      }

      const cuentaId = String(movimiento.cuentaId);
      const efecto = movimiento.tipo === "ingreso"
        ? cantidad
        : -cantidad;

      cambios.set(
        cuentaId,
        round((cambios.get(cuentaId) || 0) + efecto * signo)
      );
    }

    acumular(anterior, -1);
    acumular(nuevo, 1);

    for (const [cuentaId, diferencia] of cambios) {
      const cuenta = cuentas.find(
        c => String(c.id) === cuentaId
      );

      if (!cuenta) {
                alert(textoApp("No se encontró la cuenta del movimiento.", "The account for this transaction was not found."));
        return false;
      }

      const saldo = round(Number(cuenta.saldo) + diferencia);

      if (!Number.isFinite(saldo) || saldo < 0) {
                alert(textoApp("La operación dejaría la cuenta sin saldo suficiente.", "The account would have insufficient funds after this operation."));
        return false;
      }

      cuenta.saldo = saldo;
    }

    // Las compras hechas con una tarjeta de crédito aumentan su deuda.
    // Al editar o eliminar un movimiento se revierte el importe anterior.
    const tarjetasActualizadas = data.tarjetas.map(t => ({...t}));
    const deudaPorTarjeta = new Map();
    function ajustarCompraCredito(movimiento, signo) {
      if (!movimiento || !movimiento.tarjetaId) return;
      const tarjeta = tarjetasActualizadas.find(
        t => String(t.id) === String(movimiento.tarjetaId)
      );
      if (!tarjeta || movimiento.tipo !== "gasto" ||
          movimiento.cuentaId || !validAmount(Number(movimiento.monto))) {
        throw new Error("Compra de tarjeta de crédito no válida");
      }
      const tarjetaId = String(tarjeta.id);
      deudaPorTarjeta.set(tarjetaId, round(
        (deudaPorTarjeta.get(tarjetaId) || 0) +
        signo * Number(movimiento.monto)
      ));
    }
    ajustarCompraCredito(anterior, -1);
    ajustarCompraCredito(nuevo, 1);
    for (const [tarjetaId, diferencia] of deudaPorTarjeta) {
      const tarjeta = tarjetasActualizadas.find(
        t => String(t.id) === tarjetaId
      );
      const saldo = round(Number(tarjeta.saldo) + diferencia);
      if (!Number.isFinite(saldo) || saldo < 0) {
        throw new Error("La deuda de la tarjeta no puede ser negativa");
      }
      if (diferencia > 0 && Number(tarjeta.limite)>0 && saldo>Number(tarjeta.limite)) throw new Error(textoApp("Crédito disponible insuficiente", "Insufficient available credit"));
      tarjeta.saldo = saldo;
    }

    const movimientosNuevos = anterior
      ? data.movimientos.filter(m => m.id !== anterior.id)
      : [...data.movimientos];

    if (nuevo) movimientosNuevos.push(nuevo);

    const prestamosActualizados = (data.prestamos || [])
  .map(p => ({...p}));

function ajustarPrestamo(movimiento, signo) {
  if (!movimiento || !movimiento.prestamoId) return;

  const prestamo = prestamosActualizados.find(
    p => String(p.id) === String(movimiento.prestamoId)
  );

  const intereses = Number(movimiento.interesPrestamo || 0);
  const capital = round(Number(movimiento.monto) - intereses);

  if (
    !prestamo ||
    movimiento.tipo !== "gasto" ||
    !Number.isFinite(intereses) ||
    intereses < 0 ||
    !validAmount(capital)
  ) {
    throw new Error("Pago de préstamo no válido");
  }

  const saldo = round(Number(prestamo.saldo) + signo * capital);
  
  if (!Number.isFinite(saldo) || saldo < 0) {
    throw new Error("El capital supera el saldo pendiente");
  }

  prestamo.saldo = saldo;
}

ajustarPrestamo(anterior, 1);
ajustarPrestamo(nuevo, -1);
for (const prestamo of prestamosActualizados) {
  actualizarCalendarioPrestamo(prestamo, movimientosNuevos);
}

const datosNuevos = {
  ...data,
  movimientos: movimientosNuevos,

};

    const firma = firmaGasto(nuevo);

   data.movimientos = movimientosNuevos;
   data.tarjetas = tarjetasActualizadas;

  } catch (error) {

function movimientosTransferenciasBanco() {
  let cuentas;
  try { cuentas = JSON.parse(localStorage.getItem("amfinance-cuentas-banco") || "[]"); }
  catch { return []; }
  if (!Array.isArray(cuentas)) return [];
  const registros = new Map();
  for (const cuenta of cuentas) for (const r of (Array.isArray(cuenta.historial) ? cuenta.historial : [])) {
    if (r.tipo !== "transferencia" || !["salida","entrada"].includes(r.sentido) ||
        !Number.isFinite(Number(r.monto)) || Number(r.monto) <= 0) continue;
    const salida = r.sentido === "salida";
    const origenId = salida ? cuenta.id : r.contraparteId;
    const destinoId = salida ? r.contraparteId : cuenta.id;
    const clave = JSON.stringify([r.id, r.fecha, origenId, destinoId, Number(r.monto)]);
    if (registros.has(clave) && !salida) continue;
    const origen = cuentas.find(c=>String(c.id)===String(origenId));
    const destino = cuentas.find(c=>String(c.id)===String(destinoId));
    const desde = origen?.nombre || (salida ? cuenta.nombre : r.contraparte) || textoApp("Cuenta de origen","Source account");
    const hasta = destino?.nombre || (salida ? r.contraparte : cuenta.nombre) || textoApp("Cuenta de destino","Destination account");
    let fecha = String(r.fecha || "");
    if (fecha.includes("T")) {
      const d = new Date(fecha);
      if (Number.isNaN(d.getTime())) continue;
      fecha = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    if (!validDate(fecha)) continue;
    registros.set(clave, {id:r.id, fecha, instante:String(r.fecha), monto:Number(r.monto),
      tipo:"transferencia", origen:"transferencia", esTransferencia:true,
      origenId, destinoId, nombre:textoApp("Transferencia","Transfer"), ruta:desde+" → "+hasta});
  }
  return Array.from(registros.values());
}
function ordenarMovimientosVista(a,b) {
  return String(b.fecha).localeCompare(String(a.fecha)) ||
    String(b.instante || b.fecha).localeCompare(String(a.instante || a.fecha));
}

function cuentasDelRegistroHistorial(registro) {
  const cuentas = [];
  const agregar = (prefijo, id) => {
    if (id != null && id !== "") cuentas.push(prefijo + String(id));
  };
  if (registro.esTransferencia) {
    agregar("banco:",registro.origenId);
    agregar("banco:",registro.destinoId);
  } else if (registro.esPago) {
    agregar("banco:",registro.bancoId);
    agregar("credito:",registro.fuenteTarjetaId);
    if (registro.pagoTarjeta) agregar("credito:",registro.cuentaId);
  } else {
    agregar("banco:",registro.cuentaId);
    agregar("credito:",registro.tarjetaId);
  }
  return cuentas;
}

function coincideAlcanceHistorial(registro, cuentas, alcance) {
  if (!alcance) return true;
  const {desde,hasta,cuenta,proyecto} = alcance;
  if (proyecto && claveProyecto(registro.proyecto) !== proyecto) return false;
  if (cuenta && !cuentas.includes(cuenta)) return false;
  if (!desde && !hasta) return true;
  const fecha = String(registro.fecha || "").slice(0,10);
  return validDate(fecha) && (!desde || fecha >= desde) && (!hasta || fecha <= hasta);
}

function iniciarHistorialMovimientos() {
 const items=[
  ...movimientosTransferenciasBanco(),
  ...data.movimientos.map(m=>({...m,origen:"movimiento"})),
  ...data.pagos.map(p=>({
   ...movimientoVistaPago(p),origen:"pago"
  }))
 ].sort(ordenarMovimientosVista);

  const normalizar = texto => String(texto ?? "").normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  const indiceBusqueda = items.map((m,i) => ({
    m, i, cuentas:cuentasDelRegistroHistorial(m), texto:normalizar(m.nombre + " " + nombreOrigenPago(m) + " " + (m.proyecto || ""))
  }));
  const lista = document.getElementById("histLista");
  const totalProyecto = document.getElementById("histProyectoTotal");
  const aviso = document.getElementById("histSinResultados");
  const paginacion = document.getElementById("histPaginacion");
  const cantidad = document.getElementById("histCantidad");
  const verMas = document.getElementById("histVerMas");
  const botonBusqueda = document.getElementById("histBuscarBoton");
  const botonFiltrar = document.getElementById("histFiltrarBoton");
  const cajaBusqueda = document.getElementById("histBusqueda");
  const textoBusqueda = document.getElementById("histBuscarTexto");
  const botonesFiltro = document.querySelectorAll("[data-filtro-hist]");
  let coincidencias = [];
  let mostrados = 0;

  function mostrarSiguienteBloque() {
    const desde = mostrados;
    const hasta = Math.min(estadoHistorial.limite,coincidencias.length);
    if (hasta > desde) {
      lista.insertAdjacentHTML("beforeend", coincidencias.slice(desde,hasta).map(({m,i},pos) =>
        filaHistorial(m,i,coincidencias[desde+pos-1]?.m)).join(""));
    }
    mostrados = hasta;
    aviso.hidden = mostrados > 0;
    aviso.textContent = items.length
      ? textoApp("No hay movimientos que coincidan.", "No matching transactions.")
      : textoApp("Sin movimientos", "No transactions");
    paginacion.hidden = coincidencias.length <= TAMANO_PAGINA_HISTORIAL;
    verMas.hidden = mostrados >= coincidencias.length;
    cantidad.textContent = textoApp(
      `Mostrando ${mostrados} de ${coincidencias.length}`, `Showing ${mostrados} of ${coincidencias.length}`);
  }

  function filtrar(reiniciar = true) {
    if (reiniciar) {
      estadoHistorial.limite = TAMANO_PAGINA_HISTORIAL;
      openEdit = null;
    }
    const texto = normalizar(estadoHistorial.busqueda);
    const alcance = estadoHistorial.alcance;
    coincidencias = indiceBusqueda.filter(({m,cuentas,texto:descripcion}) =>
      (estadoHistorial.filtro === "todos" || m.tipo === estadoHistorial.filtro) &&
      descripcion.includes(texto) && coincideAlcanceHistorial(m,cuentas,alcance));
    totalProyecto.hidden = !alcance?.proyecto;
    if (alcance?.proyecto) {
      const centavos = coincidencias.reduce((total, {m}) =>
        m.tipo === "gasto" && !m.esTransferencia && validAmount(Number(m.monto))
          ? total + Math.round(Number(m.monto) * 100) : total, 0);
      totalProyecto.textContent = textoApp("Gasto del proyecto en estos resultados", "Project spending in these results") + " · " + money(centavos / 100);
    }
    const activos = Number(Boolean(alcance?.desde || alcance?.hasta)) + Number(Boolean(alcance?.cuenta)) + Number(Boolean(alcance?.proyecto));
    botonFiltrar.textContent = textoApp("Filtrar","Filter") + (activos ? ` (${activos})` : "");
    lista.replaceChildren();
    mostrados = 0;
    mostrarSiguienteBloque();
  }

  function mostrarBusqueda() {
    cajaBusqueda.classList.toggle("hidden",!estadoHistorial.buscando);
    botonBusqueda.setAttribute("aria-expanded",String(estadoHistorial.buscando));
  }
  textoBusqueda.value = estadoHistorial.busqueda;
  mostrarBusqueda();
  botonBusqueda.onclick = () => {
    estadoHistorial.buscando = !estadoHistorial.buscando;
    mostrarBusqueda();
    if (estadoHistorial.buscando) textoBusqueda.focus();
    else {
      textoBusqueda.value = "";
      estadoHistorial.busqueda = "";
      filtrar();
    }
  };
  botonFiltrar.onclick = () => abrirFiltrosHistorial(filtrar);
  textoBusqueda.oninput = () => {
    estadoHistorial.busqueda = textoBusqueda.value;
    filtrar();
  };
  for (const boton of botonesFiltro) {
    boton.classList.toggle("activo", boton.dataset.filtroHist === estadoHistorial.filtro);
    boton.onclick = () => {
      estadoHistorial.filtro = boton.dataset.filtroHist;
      botonesFiltro.forEach(b => b.classList.toggle("activo",b === boton));
      filtrar();
    };
  }
  verMas.onclick = () => {
    estadoHistorial.limite = mostrados + TAMANO_PAGINA_HISTORIAL;
    mostrarSiguienteBloque();
    if (verMas.hidden) {
      cantidad.tabIndex = -1;
      cantidad.focus({preventScroll:true});
    }
  };
  lista.onclick = evento => {
    const boton = evento.target.closest("[data-hist-menu], [data-hist-editar], [data-hist-duplicar], [data-hist-favorito], [data-hist-recibo], [data-hist-eliminar]");
    if (!boton) return;
    if (boton.dataset.histMenu !== undefined) {
      const opciones = document.getElementById("histOpciones" + boton.dataset.histMenu);
      const abrir = opciones.classList.toggle("hidden") === false;
      boton.setAttribute("aria-expanded",String(abrir));
      return;
    }
    const {histEditar,histDuplicar,histFavorito,histRecibo,histEliminar} = boton.dataset;
    const movimiento = items[Number(histEditar ?? histDuplicar ?? histFavorito ?? histRecibo ?? histEliminar)];
    if (!movimiento || movimiento.esTransferencia) return;
    if (histEditar !== undefined) editar(movimiento.origen,movimiento.id);
    else if (histDuplicar !== undefined) abrirMovVentana(movimiento);
    else if (histFavorito !== undefined) guardarFavoritoGasto(movimiento);
    else if (histRecibo !== undefined) verReciboMovimiento(movimiento);
    else eliminar(movimiento.origen,movimiento.id);
  };
  filtrar(false);
}

function findItem(origen,ident){
 const group=origen==="pago"?data.pagos:data.movimientos;
 return group.find(x=>x.id===ident);
}

function cuentaDePago(p){
 const group=p.tipo==="vehiculo"?data.vehiculos:
             p.tipo==="tarjeta"?data.tarjetas:[];
 if(p.cuentaId){
  return group.find(x=>x.id===p.cuentaId)||null;
 }
 const matches=group.filter(x=>x.nombre===p.nombre);
 return matches.length===1?matches[0]:null;
}

// Modifica el saldo de la deuda al corregir un pago.
// delta positivo = aumenta la deuda.
// delta negativo = disminuye la deuda.
function ajustarSaldo(cuenta,delta){
 const nuevo=round(Number(cuenta.saldo)+delta);
 if(!Number.isFinite(nuevo)||nuevo<0){
    alert(textoApp("Este cambio dejaría la deuda con saldo negativo. Revisa los pagos.", "This change would make the debt balance negative. Check the payments."));
  return false;
 }
 cuenta.saldo=nuevo;
 return true;
}

async function guardarEdicion(e,origen,ident){
 e.preventDefault();
 const formulario = e.currentTarget;
 if (formulario.dataset.procesando) return;
 const datosAnteriores = JSON.stringify(data);
 const item=findItem(origen,ident);
 if(!item)return;
 const f=new FormData(formulario);
 const monto=round(f.get("monto"));
 const fecha=String(f.get("fecha"));

 if(!validAmount(monto)||!validDate(fecha)){
    alert(textoApp("Introduce una cantidad y una fecha válidas.", "Enter a valid amount and date."));
  return;
 }
if (
  origen === "pago" &&
  (item.bancoId || item.fuenteTarjetaId)
) {
  const corregido = {
    ...item,
    monto,
    fecha,
    ...(item.tipo === "vehiculo" ? {capital:round(monto-Number(item.interes))} : {})
  };

  if (!guardarPagoTarjetaBanco(item, corregido)) return;

  openEdit = null;
  render();
    alert(textoApp("Pago corregido y saldos actualizados.", "Payment corrected and balances updated."));
  return;
}

 if(origen==="movimiento"){
  const nombre=String(f.get("nombre")).trim();
  if(!nombre)return;
  let extras;
  formulario.dataset.procesando = "si";
  try {
    extras = await leerExtrasMovimiento(f, f.get("tipo"), item);
  } catch {
    if (formulario.isConnected) mostrarErrorRecibo();
    return;
  } finally { delete formulario.dataset.procesando; }
  if (!formulario.isConnected || findItem(origen,ident) !== item) return;
const corregido = {
  ...item,
  ...extras,
  nombre,
  tipo: f.get("tipo"),
  monto,
  fecha,
  categoria: f.has("categoria") ? String(f.get("categoria")) : item.categoria
};

if (!guardarMovimientoBanco(item, corregido)) return;

openEdit = null;
alert(textoApp("Cambios guardados correctamente.", "Changes saved successfully."));
render();
return;
 }else{
  const cuenta=cuentaDePago(item);
  if(!cuenta){
      alert(textoApp("No se encontró la cuenta de este pago. No se puede corregir la deuda automáticamente.", "The account for this payment was not found. The debt cannot be adjusted automatically."));
   return;
  }
  const anterior=Number(item.monto);
  const diferencia=round(monto-anterior);

  if(item.tipo==="vehiculo"){
   const interes=Number(item.interes);
   const capitalAnterior=Number(item.capital);
   if(!Number.isFinite(interes)||!Number.isFinite(capitalAnterior)){
        alert(textoApp("Este pago antiguo no tiene suficientes datos para editarse con seguridad.", "This older payment does not have enough information to be edited safely."));
    return;
   }
   const capitalNuevo=round(capitalAnterior+diferencia);
   if(capitalNuevo<=0){
        alert(textoApp("El pago corregido no cubre el interés registrado.", "The corrected payment does not cover the recorded interest."));
    return;
   }
   if(!ajustarSaldo(cuenta,-diferencia))return;
   item.capital=capitalNuevo;
  }else{
   if(!ajustarSaldo(cuenta,-diferencia))return;
  }
  item.monto=monto;
  item.fecha=fecha;
  item.cuentaId=cuenta.id;
  actualizarSaldosHistorial(cuenta);
 }

 openEdit=null;
  if (!save()) {
   data = JSON.parse(datosAnteriores);
   return;
 }
   alert(textoApp("Cambios guardados correctamente.", "Changes saved successfully."));
 render();
}

function eliminar(origen,ident){
 const datosAnteriores = JSON.stringify(data);
 const group=origen==="pago"?data.pagos:data.movimientos;
 const index=group.findIndex(x=>x.id===ident);
 if(index<0)return;
 const item=group[index];

   if(!confirm(origen==="pago" ? textoApp("¿Seguro que deseas eliminar este pago?", "Are you sure you want to delete this payment?") : textoApp("¿Seguro que deseas eliminar este movimiento?", "Are you sure you want to delete this transaction?")))return;
 if (
  origen === "pago" &&
  (item.bancoId || item.fuenteTarjetaId)
) {
  if (!guardarPagoTarjetaBanco(item, null)) return;

  openEdit = null;
  render();
    alert(textoApp("Pago eliminado y saldos restaurados.", "Payment deleted and balances restored."));
  return;
}
 if(origen==="pago"){
  const cuenta=cuentaDePago(item);
  if(!cuenta){
      alert(textoApp("No se encontró la cuenta asociada. No se eliminará el pago para evitar descuadrar la deuda.", "The linked account was not found. The payment will not be deleted to keep the debt balance accurate."));
   return;
  }
  const devolver=item.tipo==="vehiculo"?
   Number(item.capital):Number(item.monto);
  if(!Number.isFinite(devolver)){
      alert(textoApp("Este pago no tiene información suficiente para eliminarlo.", "This payment does not have enough information to be deleted."));
   return;
  }
  if(!ajustarSaldo(cuenta,devolver))return;
  group.splice(index,1);
  actualizarSaldosHistorial(cuenta);
 }else{
  if (!guardarMovimientoBanco(item, null)) return;

openEdit = null;
alert(textoApp("Registro eliminado.", "Record deleted."));
render();
return;
 }

 openEdit=null;
  if (!save()) {
   data = JSON.parse(datosAnteriores);
   return;
 }
   alert(textoApp("Registro eliminado.", "Record deleted."));
 render();
}

// Recalcula los saldos históricos cuando se corrigen pagos.
// Los pagos sin datos suficientes muestran "No registrado".
function actualizarSaldosHistorial(cuenta){
 const group=data.pagos.filter(p=>
  p.tipo==="vehiculo"&&cuentaDePago(p)===cuenta
 ).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

 let saldo=Number(cuenta.saldo);
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo+Number(p.capital));
 }
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo-Number(p.capital));
  p.saldoRestante=saldo;
 }
}

  if (!nombre) {
        alert(textoApp("Escribe el nombre del vehículo.", "Enter the vehicle name."));
    return;
  }

  if (foto) {

      if (new URL(foto).protocol !== "https:") throw new Error();
    } catch {
            alert(textoApp("El enlace debe empezar con https://", "The link must start with https://"));
      return;
    }
  }

  if (boton) boton.disabled = true;

  try {
    let fotoGaleria = auto.fotoGaleria || "";

    if (archivo && archivo.size > 0) {
      const url = URL.createObjectURL(archivo);

      try {
        const imagen = new Image();

        await new Promise((resolve, reject) => {
          imagen.onload = resolve;
          imagen.onerror = () => reject(
                        new Error(textoApp("No se pudo abrir la foto. Prueba con JPG o PNG.", "Could not open the photo. Try a JPG or PNG image."))
          );
          imagen.src = url;
        });

        const escala = Math.min(
          1, 900 / Math.max(imagen.naturalWidth, imagen.naturalHeight)
        );

        const lienzo = document.createElement("canvas");
        lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));

        const contexto = lienzo.getContext("2d");
                if (!contexto) throw new Error(textoApp("No se pudo preparar la foto.", "Could not process the photo."));

        contexto.fillStyle = "#ffffff";
        contexto.fillRect(0, 0, lienzo.width, lienzo.height);
        contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
        fotoGaleria = lienzo.toDataURL("image/jpeg", 0.8);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

        const entradaInicial = String(
      campos.get("montoInicial") || ""
    ).trim();

    const montoInicial = entradaInicial
      ? Number(entradaInicial)
      : null;

    if (
      montoInicial !== null &&
      (!Number.isFinite(montoInicial) ||
       montoInicial <= 0 ||
       montoInicial < Number(auto.saldo))
    ) {
            alert(textoApp("El monto inicial debe ser mayor que cero y no menor al saldo pendiente.", "The original loan amount must be greater than zero and cannot be less than the outstanding balance."));
      return;
    }

    const actualizado = {
      ...auto,
      nombre,
      montoInicial,
      modelo: String(campos.get("modelo") || "").trim(),
      anio: String(campos.get("anio") || "").trim(),
      banco: String(campos.get("banco") || "").trim(),
      foto,
      fotoGaleria
    };

    const nuevosDatos = {
      ...data,
      vehiculos: data.vehiculos.map(v => v === auto ? actualizado : v)
    };

    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
    data = nuevosDatos;
    render();
  } catch (error) {
    alert(
      error.name === "QuotaExceededError"
                ? textoApp("No hay espacio suficiente para guardar la foto.", "There is not enough storage space to save the photo.")
                : error.message || textoApp("No se pudieron guardar los datos.", "Could not save the details.")
    );
  } finally {
    if (boton) boton.disabled = false;
  }
}

function bordesFotoCredito(pixeles, ancho, alto, horizontal) {
  const longitud = horizontal ? ancho : alto;
  const profundidad = horizontal ? alto : ancho;
  const inicio = Math.ceil(longitud * .15);
  const fin = Math.floor(longitud * .85);
  if (fin <= inicio) return [0, 0];

  // Omite las esquinas redondeadas al buscar franjas blancas o negras.
  function tonoLinea(linea) {
    let claros = 0;
    let oscuros = 0;
    for (let punto = inicio; punto < fin; punto++) {
      const i = 4 * (horizontal ? linea * ancho + punto : punto * ancho + linea);
      const minimo = Math.min(pixeles[i], pixeles[i + 1], pixeles[i + 2]);
      const maximo = Math.max(pixeles[i], pixeles[i + 1], pixeles[i + 2]);
      if (minimo >= 238 && maximo - minimo <= 12) claros++;
      if (maximo <= 28 && maximo - minimo <= 10) oscuros++;
    }
    const umbral = (fin - inicio) * .95;
    return claros >= umbral ? "claro" : oscuros >= umbral ? "oscuro" : "";
  }

  // La primera línea puede incluir antialiasing o un píxel de fondo.
  const tono = tonoLinea(1);
  if (!tono || tonoLinea(profundidad - 2) !== tono) return [0, 0];

  function medir(desde, paso) {
    const limite = Math.floor(profundidad * .18);
    for (let margen = 2; margen <= limite; margen++) {
      const linea = desde + margen * paso;
      if (tonoLinea(linea) !== tono) {
        return tonoLinea(linea + paso) !== tono ? margen : 0;
      }
    }
    return 0;
  }

  const primero = medir(0, 1);
  const segundo = medir(profundidad - 1, -1);
  return primero && segundo ? [primero, segundo] : [0, 0];
}

function encuadrarFotoCredito(imagen) {
  const escala = Math.min(1, 240 / Math.max(imagen.naturalWidth, imagen.naturalHeight));
  const ancho = Math.round(imagen.naturalWidth * escala);
  const alto = Math.round(imagen.naturalHeight * escala);
  if (ancho < 24 || alto < 24) return;

  const lienzo = document.createElement("canvas");
  lienzo.width = ancho;
  lienzo.height = alto;
  const contexto = lienzo.getContext("2d", {willReadFrequently: true});
  if (!contexto) return;
  contexto.drawImage(imagen, 0, 0, ancho, alto);
  const pixeles = contexto.getImageData(0, 0, ancho, alto).data;
  const [arriba, abajo] = bordesFotoCredito(pixeles, ancho, alto, true);
  const [izquierda, derecha] = bordesFotoCredito(pixeles, ancho, alto, false);
  if (!(arriba || izquierda)) return;

  const anchoUtil = (ancho - izquierda - derecha) / ancho;
  const altoUtil = (alto - arriba - abajo) / alto;
  const proporcionFoto = imagen.naturalWidth / imagen.naturalHeight;
  const proporcionMarco = parseFloat(getComputedStyle(imagen).getPropertyValue("--credito-proporcion"));
  // Centra la zona recortada con la misma proporción que la foto original.
  const anchoImagen = Math.max(1 / anchoUtil, proporcionFoto / (proporcionMarco * altoUtil));
  const altoImagen = anchoImagen * proporcionMarco / proporcionFoto;
  imagen.style.inset = "auto";
  imagen.style.width = (anchoImagen * 100) + "%";
  imagen.style.height = (altoImagen * 100) + "%";
  imagen.style.left = (50 - (izquierda / ancho + anchoUtil / 2) * anchoImagen * 100) + "%";
  imagen.style.top = (50 - (arriba / alto + altoUtil / 2) * altoImagen * 100) + "%";
}

async function prepararImagenCredito(archivo) {
  if (!archivo || !archivo.size) return "";
  if (!String(archivo.type || "").startsWith("image/")) {
    throw new Error(textoApp("Selecciona una imagen válida.", "Select a valid image."));
  }
  if (archivo.size > 15 * 1024 * 1024) {
    throw new Error(textoApp("La imagen debe pesar menos de 15 MB.", "The image must be smaller than 15 MB."));
  }

  const url = URL.createObjectURL(archivo);
  try {
    const imagen = await new Promise((resolve, reject) => {
      const elemento = new Image();
      elemento.onload = () => resolve(elemento);
      elemento.onerror = () => reject(new Error(textoApp(
        "No se pudo abrir esta imagen.", "Could not open this image."
      )));
      elemento.src = url;
    });
    const mayorLado = Math.max(imagen.naturalWidth, imagen.naturalHeight);
    if (!mayorLado) throw new Error(textoApp("Imagen vacía.", "Empty image."));
    const escala = Math.min(1, 900 / mayorLado);
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
    lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));
    const contexto = lienzo.getContext("2d");
    if (!contexto) throw new Error(textoApp("No se pudo preparar la imagen.", "Could not process the image."));
    contexto.fillStyle = "#ffffff";
    contexto.fillRect(0, 0, lienzo.width, lienzo.height);
    contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
    return lienzo.toDataURL("image/jpeg", 0.78);
  } finally {
    URL.revokeObjectURL(url);
  }
}

function metaPagoTarjetaValida(tarjeta) {
  const meta = tarjeta?.metaPago;
  return meta && typeof meta.id === "string" && meta.id &&
    Number.isSafeInteger(meta.objetivoCentavos) && meta.objetivoCentavos > 0 ? meta : null;
}

function resumenMetaPagoTarjeta(tarjeta) {
  const meta = metaPagoTarjetaValida(tarjeta);
  if (!meta) return null;
  const pagado = data.pagos.reduce((total, pago) => {
    const centavos = Math.round(Number(pago.monto) * 100);
    return pago.tipo === "tarjeta" && String(pago.cuentaId) === String(tarjeta.id) &&
      pago.metaPagoId === meta.id && Number.isSafeInteger(centavos) && centavos > 0
      ? total + centavos : total;
  }, 0);
  return {objetivo:meta.objetivoCentavos, pagado, falta:Math.max(0, meta.objetivoCentavos-pagado)};
}

function bloqueMetaPagoTarjeta(tarjeta) {
  const resumen = resumenMetaPagoTarjeta(tarjeta);
  if (!resumen) return "";
  const t = textoApp;
  const {objetivo,pagado,falta} = resumen;
  return `<div class="credito-meta-pago">

    ${barraProgreso(pagado / objetivo * 100)}

      <small>${t("Falta", "Remaining")} ${money(falta / 100)}</small>
    </div>
  </div>`;
}

function abrirMetaPagoTarjeta(indice) {
  const tarjeta = data.tarjetas[indice];
  if (!tarjeta) return;
  const t = textoApp;
  const meta = metaPagoTarjetaValida(tarjeta);
  const ventana = crearVentanaApariencia(t("Meta de pago", "Payment goal"), `
    <form class="cuenta-nueva-form">
      <p class="note"><strong>${safe(tarjeta.nombre)}</strong></p>
      <label>${textoImporte("Cantidad que quieres pagar","Amount you want to pay")}
        <input name="objetivo" type="number" min="0.01" step="0.01" inputmode="decimal"
          placeholder="0.00" value="${meta ? (meta.objetivoCentavos / 100).toFixed(2) : ""}" required>
      </label>
      <p class="note">${t(
        "Suma cada pago que registres para esta tarjeta desde que creas la meta. Puedes abonar cantidades diferentes.",
        "Each payment recorded for this card after you create the goal counts toward it. You can pay different amounts."
      )}</p>
      <p class="cuenta-nueva-error" role="alert" hidden></p>
      <button type="submit" class="cuenta-nueva-guardar">${t("Guardar meta","Save goal")}</button>
      ${meta ? `<button type="button" class="secondary credito-meta-quitar">${t("Quitar meta","Remove goal")}</button>` : ""}
    </form>`, true);
  if (!ventana) return;
  ventana.classList.add("cuenta-nueva");
  const form = ventana.querySelector("form");
  const error = form.querySelector("[role=alert]");
  function guardar(metaNueva) {
    if (form.dataset.guardado) return;
    const actual = data.tarjetas.find(t => String(t.id) === String(tarjeta.id));
    if (!actual || metaPagoTarjetaValida(actual)?.id !== meta?.id) {
      error.textContent = t("La meta cambió. Cierra esta ventana y vuelve a abrirla.", "The goal changed. Close and reopen this window.");
      error.hidden = false;
      return;
    }
    const actualizada = {...actual};
    if (metaNueva) actualizada.metaPago = metaNueva;
    else delete actualizada.metaPago;
    if (!guardarDatosExtra({tarjetas:data.tarjetas.map(t => t === actual ? actualizada : t)})) return;
    form.dataset.guardado = "si";
    cerrarVentanaApariencia(ventana, render);
  }
  form.onsubmit = evento => {
    evento.preventDefault();
    let objetivoCentavos;
    try {
      objetivoCentavos = centavosMeta(form.elements.objetivo.value);
    } catch (e) {
      error.textContent = e.message;
      error.hidden = false;
      return;
    }
    error.hidden = true;
    guardar({id:meta?.id || id(), objetivoCentavos});
  };
  const quitar = form.querySelector(".credito-meta-quitar");
  if (quitar) quitar.onclick = () => {
    if (confirm(t("¿Quitar la meta de pago? Tus pagos registrados se conservarán.", "Remove the payment goal? Your recorded payments will be kept."))) guardar(null);
  };
}

function proximoPagoTarjetaCarrusel(tarjeta) {
  const dia = Number(tarjeta.vencimiento);
  const fecha = Number.isInteger(dia) && dia >= 1 && dia <= 31
    ? siguienteFechaAviso(diasParaVencer(dia)) : "";
  const entrada = String(tarjeta.pagoMinimo ?? "").trim();
  const minimo = entrada ? Number(entrada) : NaN;
  const tieneMinimo = Number.isFinite(minimo) && minimo >= 0;
  if (!fecha && !tieneMinimo) return "";

  const fechaCorta = fecha ? new Date(fecha + "T12:00:00").toLocaleDateString(
    idiomaActual() === "en" ? "en-US" : "es", {day:"numeric",month:"short"}
  ) : "";
  return `<p class="credito-proximo-pago">
    ${fecha ? `<span>${textoApp("Próximo vencimiento", "Next due date")} <strong><time datetime="${fecha}">${fechaCorta}</time></strong></span>` : ""}
    ${tieneMinimo ? `<span>${textoApp("Pago mínimo", "Minimum payment")} <strong>${money(minimo)}</strong></span>` : ""}
  </p>`;
}

function activarCarruselCredito() {
  const lista = document.getElementById("carruselCredito");
  if (!lista || !data.tarjetas.length) return;
  const montos = document.getElementById("carruselCreditoMontos");
  const anterior = el().querySelector("[data-credito-anterior]");
  const siguiente = el().querySelector("[data-credito-siguiente]");
  const posicion = el().querySelector("[data-credito-pos]");
  let indice = Math.max(0, data.tarjetas.findIndex(t => t.id === tarjetaActualCarrusel));

  function actualizar(nuevo) {
    indice = nuevo;
    tarjetaActualCarrusel = data.tarjetas[indice].id;
    lista.querySelector('[aria-current="true"]')?.removeAttribute("aria-current");
    lista.children[indice].setAttribute("aria-current", "true");
    if (!montos) return;
    posicion.textContent = textoApp(`${indice+1} de ${data.tarjetas.length}`, `${indice+1} of ${data.tarjetas.length}`);
    anterior.disabled = indice === 0;
    siguiente.disabled = indice === data.tarjetas.length - 1;
    montos.innerHTML = montosTarjetaCarrusel(data.tarjetas[indice]);
  }
  if (!montos) {
    actualizar(indice);
    return;
  }
  function mover(nuevo) {
    if (nuevo < 0 || nuevo >= data.tarjetas.length) return;
    lista.scrollLeft = nuevo * lista.clientWidth;
    actualizar(nuevo);
  }
  lista.onscroll = () => {
    if (!lista.clientWidth) return;
    const nuevo = Math.max(0, Math.min(data.tarjetas.length - 1, Math.round(lista.scrollLeft / lista.clientWidth)));
    if (nuevo !== indice) actualizar(nuevo);
  };
  anterior.onclick = () => mover(indice-1);
  siguiente.onclick = () => mover(indice+1);
  mover(indice);
}

function abrirTodasTarjetasCredito() {
  const t = textoApp;
  const bancos = [...new Set(data.tarjetas.map(tarjeta => String(tarjeta.banco || "").trim()).filter(Boolean))];
  const ventana = crearVentanaApariencia(t("Mis tarjetas","My cards"), `
    <button type="button" class="primary" data-agregar-credito>+ ${t("Agregar tarjeta","Add card")}</button>
    ${bancos.length ? `<label class="carrusel-filtro" for="carruselBanco">${t("Banco","Bank")}</label>
      <select id="carruselBanco"><option value="">${t("Todos los bancos","All banks")}</option>
        ${bancos.map(banco => `<option value="${safe(banco)}">${safe(banco)}</option>`).join("")}
      </select>` : ""}
    <div class="carrusel-todas" data-lista-credito>
      ${data.tarjetas.map((tarjeta,i) => `<button type="button" class="apariencia-opcion" data-indice-credito="${i}">
        <span>${safe(tarjeta.nombre)}${tarjeta.ultimos4 ? `<small> · •••• ${safe(tarjeta.ultimos4)}</small>` : ""}</span>
        <strong>${money(tarjeta.saldo)}</strong>
      </button>`).join("") || `<p class="note">${t("Aún no tienes tarjetas registradas.","You have no cards added yet.")}</p>`}
    </div>`, true);
  if (!ventana) return;
  const filtro = ventana.querySelector("#carruselBanco");
  const lista = ventana.querySelector("[data-lista-credito]");
  if (filtro) filtro.onchange = () => {
    lista.querySelectorAll("[data-indice-credito]").forEach(fila => {
      fila.hidden = Boolean(filtro.value) && String(data.tarjetas[Number(fila.dataset.indiceCredito)].banco || "").trim() !== filtro.value;
    });
  };
  lista.onclick = e => {
    const fila = e.target.closest("[data-indice-credito]");
    if (fila) cerrarVentanaApariencia(ventana, () => mostrarDetalleCredito(Number(fila.dataset.indiceCredito)));
  };
  ventana.querySelector("[data-agregar-credito]").onclick = () => cerrarVentanaApariencia(ventana, () => {
    const formulario = document.getElementById("formularioNuevaTarjeta");
    formulario.classList.remove("hidden");
    formulario.scrollIntoView({block:"nearest"});
    formulario.querySelector("input").focus({preventScroll:true});
  });
}

function mostrarDetalleCredito(indice) {
  const detalle = document.getElementById("detalleCredito" + indice);
  if (!detalle) return;
  const dialogo = detalle.closest(".carrusel-credito-detalle");
  if (!dialogo) {
    detalle.classList.remove("hidden");
    return;
  }
  tarjetaActualCarrusel = data.tarjetas[indice].id;
  activarCarruselCredito();
  if (!dialogo.open) dialogo.showModal();
}

function cerrarDetalleCredito(boton) {
  const dialogo = boton.closest("dialog");
  if (!dialogo?.open || boton.classList.contains("cerrando")) return;
  boton.classList.add("cerrando");
  const espera = setTimeout(() => {
    if (dialogo.open) dialogo.close();
  }, 170);
  dialogo.addEventListener("close", () => {
    clearTimeout(espera);
    boton.classList.remove("cerrando");
  }, {once:true});
}

function verMovimientosCredito(indice, boton) {
  const tarjeta = data.tarjetas[indice];
  if (!tarjeta) return;
  boton.closest("dialog").close();
  go("historialMovimientos", {cuenta:"credito:" + tarjeta.id});
}

async function guardarDatosTarjeta(event, indice) {
  event.preventDefault();

  const tarjeta = data.tarjetas[indice];
  if (!tarjeta) return;

  const campos = new FormData(event.target);
  const cambios = {};
  if (campos.has("nombre")) {
    cambios.nombre = String(campos.get("nombre")).trim();
    if (!cambios.nombre || cambios.nombre.length > 80) {
      alert(textoApp("Introduce un nombre válido.", "Enter a valid name."));
      return;
    }
    try { cambios.limite = centavosMeta(campos.get("limite"), true) / 100; }
    catch (error) { alert(error.message); return; }
  }
  const modelo = String(campos.get("modelo") || "").trim();
  const ultimos4 = String(campos.get("ultimos4") || "").trim();
  const entrada = String(campos.get("pagoMinimo") || "").trim();
  const pagoMinimo = entrada === "" ? null : Number(entrada);
  const archivo = campos.get("imagenCredito");
  const restaurarImagen = campos.get("restaurarImagen") === "1";

  if (ultimos4 && !/^\d{4}$/.test(ultimos4)) {
        alert(textoApp("Introduce únicamente los últimos cuatro dígitos.", "Enter only the last four digits."));
    return;
  }

  if (
    pagoMinimo !== null &&
    (!Number.isFinite(pagoMinimo) || pagoMinimo < 0)
  ) {
        alert(textoApp("Introduce un pago mínimo válido.", "Enter a valid minimum payment."));
    return;
  }

  const boton = event.submitter || event.target.querySelector('button[type="submit"]');
  if (boton) boton.disabled = true;
  try {
    let imagenPersonalizada = restaurarImagen ? "" : (tarjeta.imagenPersonalizada || "");
    if (archivo && typeof archivo.size === "number" && archivo.size > 0) {
      imagenPersonalizada = await prepararImagenCredito(archivo);
    }

    const indiceVigente = data.tarjetas.findIndex(t => t.id === tarjeta.id);
    if (indiceVigente < 0) return;
    const anterior = data.tarjetas[indiceVigente];
    const actualizado = {
      ...anterior,
      ...cambios,
      banco: String(campos.get("banco") || "").trim(),
      modelo,
      ultimos4,
      pagoMinimo: pagoMinimo === null ? null : round(pagoMinimo)
    };
    if (imagenPersonalizada) actualizado.imagenPersonalizada = imagenPersonalizada;
    else delete actualizado.imagenPersonalizada;

    data.tarjetas[indiceVigente] = actualizado;
    if (!save()) {
      data.tarjetas[indiceVigente] = anterior;
      return;
    }

    render();
    alert(textoApp("Datos de la tarjeta guardados.", "Card details saved."));
  } catch (error) {
    alert(error.message || textoApp("No se pudo cambiar la imagen.", "Could not change the image."));
  } finally {
    if (boton) boton.disabled = false;
  }
}

function pagarAuto(e, i) {
  e.preventDefault();
  if(e.target.dataset.guardado === "si")return;
  const v = data.vehiculos[i];
  if (!v) return;

  const campos = new FormData(e.target);
  const monto = round(campos.get("monto"));
  const fuente=origenPagoSeleccionado(campos.get("origenPago"));
  if (!fuente.cuentaId && !fuente.tarjetaId) {alert(textoApp("Selecciona el origen del pago", "Select payment source"));return;}
  const saldo = Number(v.saldo);
  const apr = Number(v.apr);

  if (!validAmount(monto) ||
      !Number.isFinite(saldo) || saldo < 0 ||
      !Number.isFinite(apr) || apr < 0) {
    alert(textoApp(
      "Revisa el importe, el saldo y la tasa APR.",
      "Check the amount, balance and APR."
    ));
    return;
  }

  const interes = round(saldo * apr / 1200);
  const capital = round(monto - interes);

  if (capital <= 0) {
    alert(textoApp(
      "El pago no cubre el interés mensual estimado.",
      "The payment does not cover the estimated monthly interest."
    ));
    return;
  }

  if (capital > saldo) {
    alert(textoApp(
      "El pago supera el saldo más el interés estimado.",
      "The payment exceeds the balance plus estimated interest."
    ));
    return;
  }

  if (!confirm(
    textoApp("¿Registrar pago de ", "Record a payment of ") +
    money(monto) + "?"
  )) return;

  const saldoNuevo = round(saldo - capital);
  const pago = {
    id: id(),
    cuentaId: v.id,
    ...(fuente.tarjetaId ? {fuenteTarjetaId:fuente.tarjetaId} : {bancoId:fuente.cuentaId}),
    nombre: v.nombre,
    monto,
    interes,
    capital,
    tipo: "vehiculo",
    fecha: today(),
    saldoRestante: saldoNuevo
  };

  if (!guardarPagoConOrigen(null,pago)) return;
  e.target.dataset.guardado = "si";

  alert(
    textoApp(
      "Pago registrado.\nInterés estimado: ",
      "Payment recorded.\nEstimated interest: "
    ) + money(interes) +
    textoApp("\nCapital: ", "\nPrincipal: ") + money(capital) +
    textoApp("\nNuevo saldo: ", "\nNew balance: ") + money(saldoNuevo)
  );

  render();
}

function resumenPreciosSuscripcion(registro) {
  if (registro.categoria === "servicios" && registro.importeVariable) return textoApp("Importe variable · Confirma cada factura en Pagos del mes.", "Variable amount · Confirm each bill in Monthly payments.");
  const monto = Number(registro.monto);
  const mensual = Number(registro.precioMensual);
  const anual = Number(registro.precioAnual);
  const tieneMensual = registro.precioMensual != null && Number.isFinite(mensual) && mensual > 0;
  const tieneAnual = registro.precioAnual != null && Number.isFinite(anual) && anual > 0;
  const frecuencia = registro.frecuencia || "mensual";
  const mes = tieneMensual ? money(mensual)
    : frecuencia === "anual" && Number.isFinite(monto) ? "≈" + money(monto / 12)
    : Number.isFinite(monto) ? money(monto) : "—";
  const anio = tieneAnual ? money(anual)
    : Number.isFinite(monto) ? "≈" + money(monto * (frecuencia === "cada14dias" ? 26 : frecuencia === "anual" ? 1 : 12)) : "—";
  const etiqueta = frecuencia === "cada14dias"
    ? textoApp("Cada 14 días", "Every 14 days") : textoApp("Mes", "Month");
  return `${etiqueta}: ${mes} · ${textoApp("Año", "Year")}: ${anio}`;
}

function activarFormularioSuscripcion(form) {
  const e = form.elements;
  let anualAutomatico = !e.precioAnual.value;
  function actualizar() {
    const servicio = e.categoria.value === "servicios";
    const variable = servicio && e.importeTipo?.value === "variable";
    form.querySelector("[data-servicio-hogar]").hidden = !servicio;
    if (servicio) e.frecuencia.value = "mensual";
    e.frecuencia.disabled = servicio;
    const anual = e.frecuencia.value === "anual";
    e.precioMensual.disabled = variable;
    e.precioAnual.disabled = servicio;
    e.precioMensual.closest("label").hidden = variable;
    e.precioAnual.closest("label").hidden = servicio;
    const mensual = Number(e.precioMensual.value);
    if (anualAutomatico && anual) {
      e.precioAnual.value = Number.isFinite(mensual) && mensual > 0 ? (Math.round(mensual * 1200) / 100).toFixed(2) : "";
    }
    const obligatorio = ["prestamo", "cuotas"].includes(e.categoria.value);
    e.duracion.querySelector('option[value="indefinida"]').disabled = obligatorio;
    if (obligatorio) e.duracion.value = "fecha";
    const sinFin = e.duracion.value === "indefinida" && !obligatorio;
    form.querySelector("[data-fin-suscripcion]").hidden = sinFin;
    e.fin.disabled = sinFin;
    e.fin.required = !sinFin;
    e.precioAnual.required = anual;
    e.precioMensual.required = !anual && !variable;
  }
  form.addEventListener("input", evento => {
    if (evento.target === e.precioAnual) anualAutomatico = !e.precioAnual.value;
    actualizar();
  });
  form.addEventListener("change", actualizar);
  actualizar();
}

function guardarSuscripcionFormulario(form, indice = null) {
  if (form.dataset.guardado === "si") return false;

  const campos = new FormData(form);
  const nombre = String(campos.get("nombre") || "").trim();
  const categoria = String(campos.get("categoria") || "");
  const frecuencia = categoria === "servicios" ? "mensual" : String(campos.get("frecuencia") || "mensual");
  const importeVariable = categoria === "servicios" && campos.get("importeTipo") === "variable";
  const precioMensualTexto = String(campos.get("precioMensual") || "").trim();
  const precioAnualTexto = String(campos.get("precioAnual") || "").trim();
  const precioMensual = precioMensualTexto ? round(precioMensualTexto) : null;
  const precioAnual = precioAnualTexto ? round(precioAnualTexto)
    : frecuencia === "anual" && validAmount(precioMensual) ? round(precioMensual * 12) : null;
  const monto = importeVariable ? 0 : frecuencia === "anual" ? precioAnual : precioMensual;
  const inicio = String(campos.get("inicio") || "");
  const fin = campos.get("duracion") === "indefinida" && !["prestamo", "cuotas"].includes(categoria)
    ? "" : String(campos.get("fin") || "");

  if (!nombre || !validDate(inicio) || (!importeVariable && !validAmount(monto)) ||
      (precioMensual !== null && !validAmount(precioMensual)) ||
      (precioAnual !== null && !validAmount(precioAnual)) ||
      !["mensual", "cada14dias", "anual"].includes(frecuencia) ||
      !["suscripcion", "renta", "prestamo", "cuotas", "servicios"].includes(categoria)) {
    alert(textoApp(
      "Revisa el nombre, la fecha y el precio del período que vas a pagar.",
      "Check the name, date and price for the selected billing period."
    ));
    return false;
  }
  if (fin && (!validDate(fin) || fin < inicio)) {
    alert(textoApp(
      "El último cobro debe ser igual o posterior al primero.",
      "The last charge must be on or after the first."
    ));
    return false;
  }
  if (["prestamo", "cuotas"].includes(categoria) && !fin) {
    alert(textoApp("Indica la fecha del último cobro.", "Enter the last charge date."));
    return false;
  }

  const lista = Array.isArray(data.suscripciones) ? data.suscripciones : [];
  const anterior = Number.isInteger(indice) && indice >= 0 ? lista[indice] : null;
  if (indice !== null && !anterior) return false;
  const nueva = {
    ...(anterior || {}), id:anterior ? anterior.id : id(),
    nombre, monto, precioMensual, precioAnual, inicio, categoria, fin, frecuencia, importeVariable
  };
  const nuevaLista = anterior
    ? lista.map((registro, i) => i === indice ? nueva : registro)
    : [...lista, nueva];
  const nuevosDatos = {...data, suscripciones:nuevaLista};

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp("No se pudo guardar. No se hicieron cambios.",
      "Could not save. No changes were made."));
    return false;
  }
  form.dataset.guardado = "si";
  data = nuevosDatos;
  render();
  return true;
}

function centavosMeta(valor, permitirCero = false) {
  const texto = String(valor ?? "").trim();
  const numero = Number(texto), centavos = Math.round(numero * 100);
  if (!texto || !Number.isFinite(numero) || !Number.isSafeInteger(centavos) ||
      centavos < (permitirCero ? 0 : 1) || Math.abs(numero * 100 - centavos) > .00001)
    throw new Error(textoApp("Introduce un importe válido, con hasta dos decimales.","Enter a valid amount with up to two decimal places."));
  return centavos;
}
function cuentasMetasAhorro() {
  const cuentas=JSON.parse(localStorage.getItem("amfinance-cuentas-banco") || "[]");
  if(!Array.isArray(cuentas))throw new Error(textoApp("No se pudieron leer las cuentas.","Could not read accounts."));
  return cuentas;
}
function planMetaAhorro(meta, falta, hoy = today()) {
  if (!meta.fecha || !validDate(meta.fecha) || !validDate(hoy) || falta<=0) return null;
  const utc=fecha=>{const [a,m,d]=fecha.split('-').map(Number);return Date.UTC(a,m-1,d);};
  const dias=Math.round((utc(meta.fecha)-utc(hoy))/86400000);
  if(dias<=0)return {vencida:dias<0,hoy:dias===0};
  const [a,m,d]=hoy.split('-').map(Number),[af,mf,df]=meta.fecha.split('-').map(Number);
  const semanas=Math.max(1,Math.ceil(dias/7));
  const meses=Math.max(1,(af-a)*12+mf-m+(df>d?1:0));
  const centavos=centavosMeta(falta);
  return {semanas,meses,semanal:Math.ceil(centavos/semanas)/100,mensual:Math.ceil(centavos/meses)/100};
}
function resumenMetaAhorro(meta, cuentas = null) {
  const objetivo = centavosMeta(meta.objetivo);
  const aportes = Array.isArray(meta.aportes) ? meta.aportes : [];
  let ahorrado = aportes.reduce((suma,a) => {
    const monto = centavosMeta(a.monto);
    const total = suma + (a.tipo === "retiro" ? -monto : monto);
    if (!Number.isSafeInteger(total)) throw new Error(textoApp("Importe demasiado grande.","Amount is too large."));
    return total;
  },0);
  if (ahorrado < 0) throw new Error(textoApp("El ahorro no puede quedar negativo.","Savings cannot be negative."));
  let cuenta=null;
  if(meta.cuentaId) {
    cuenta=(cuentas || cuentasMetasAhorro()).find(c=>String(c.id)===String(meta.cuentaId) && c.tipo==="ahorro");
    if(!cuenta)throw new Error(textoApp("La cuenta de ahorro vinculada no está disponible. Edita la meta para revisarla.","The linked savings account is unavailable. Edit the goal to review it."));
    ahorrado=centavosMeta(cuenta.saldo,true);
  }
  return {objetivo:objetivo/100, ahorrado:ahorrado/100, falta:Math.max(0,objetivo-ahorrado)/100,
    porcentaje:Math.min(100,Math.round(ahorrado/objetivo*100)), completa:ahorrado>=objetivo,cuenta,plan:planMetaAhorro(meta,Math.max(0,objetivo-ahorrado)/100)};
}
function prepararCambioMetaAhorro(datos, accion, ident, entrada, cuentas = []) {
  const lista = Array.isArray(datos.metasAhorro) ? JSON.parse(JSON.stringify(datos.metasAhorro)) : [];
  const indice = lista.findIndex(m=>String(m.id)===String(ident));
  if (accion !== "crear" && indice < 0) throw new Error(textoApp("Esta meta ya no está disponible.","This goal is no longer available."));
  if (accion === "crear" || accion === "editar") {
    const nombre = String(entrada.nombre || "").trim();
    const objetivo = centavosMeta(entrada.objetivo)/100;
    const fecha = String(entrada.fecha || "");
    if (!nombre || nombre.length>80 || (fecha && !validDate(fecha)))
      throw new Error(textoApp("Revisa el nombre y la fecha de la meta.","Check the goal name and date."));
    const cuentaId=String(entrada.cuentaId || "");
    if(cuentaId) {
      const cuenta=cuentas.find(c=>String(c.id)===cuentaId && c.tipo==="ahorro");
      if(!cuenta)throw new Error(textoApp("Selecciona una cuenta de ahorro válida.","Select a valid savings account."));
      centavosMeta(cuenta.saldo,true);
      if(lista.some(m=>String(m.id)!==String(ident) && String(m.cuentaId||'')===cuentaId))
        throw new Error(textoApp("Esta cuenta ya está vinculada a otra meta. Usa otra cuenta o desvincula la meta anterior.","This account is already linked to a goal. Use another account or unlink the previous goal."));
    }
    if (accion === "crear") {
      if (!ident || lista.some(m=>String(m.id)===String(ident))) throw new Error(textoApp("No se pudo crear la meta.","Could not create the goal."));
      const inicial = cuentaId ? 0 : centavosMeta(entrada.inicial || "0",true)/100;
      lista.push({id:ident,nombre,objetivo,fecha,cuentaId,creadaEn:today(),aportes:inicial>0
        ? [{id:id(),tipo:"aporte",monto:inicial,fecha:today(),nota:textoApp("Ahorro inicial","Initial savings")}] : []});
    } else {
      const meta=lista[indice];
      if(meta.cuentaId && !cuentaId) {
        // Preserve existing manual entries and carry forward the account's current balance.
        const actual=resumenMetaAhorro(meta,cuentas).ahorrado;
        const manual=resumenMetaAhorro({...meta,cuentaId:""}).ahorrado;
        const diferencia=Math.round(actual*100)-Math.round(manual*100);
        if(diferencia)meta.aportes.push({id:id(),tipo:diferencia>0?"aporte":"retiro",monto:Math.abs(diferencia)/100,fecha:today(),nota:textoApp("Ajuste al desvincular la cuenta","Adjustment after unlinking account")});
      }
      Object.assign(meta,{nombre,objetivo,fecha,cuentaId});
    }
  } else if (accion === "aporte") {
    if(lista[indice].cuentaId)throw new Error(textoApp("El progreso se actualiza desde la cuenta vinculada.","Progress updates from the linked account."));
    if (!["aporte","retiro"].includes(entrada.tipo) || !validDate(String(entrada.fecha)))
      throw new Error(textoApp("Revisa el tipo y la fecha del avance.","Check the entry type and date."));
    const monto = centavosMeta(entrada.monto)/100;
    const meta=lista[indice];
    if (!Array.isArray(meta.aportes)) meta.aportes=[];
    meta.aportes.push({id:id(),tipo:entrada.tipo,monto,fecha:entrada.fecha,nota:String(entrada.nota||"").trim().slice(0,120)});
    resumenMetaAhorro(meta);
  } else if (accion === "quitarAporte") {
    if(lista[indice].cuentaId)throw new Error(textoApp("Desvincula la cuenta antes de modificar el historial manual.","Unlink the account before changing manual history."));
    const meta=lista[indice];
    const aportes = Array.isArray(meta.aportes) ? meta.aportes : [];
    if (!aportes.some(a=>String(a.id)===String(entrada.aporteId))) throw new Error(textoApp("Avance no encontrado.","Entry not found."));
    meta.aportes=aportes.filter(a=>String(a.id)!==String(entrada.aporteId));
    resumenMetaAhorro(meta);
  } else if (accion === "eliminar") lista.splice(indice,1);
  else throw new Error(textoApp("Operación no válida.","Invalid operation."));
  return {...datos,metasAhorro:lista};
}

let mesPagosPendientes = month();

// Consulta los pagos existentes: nunca modifica saldos ni crea movimientos.
// Los pagos de tarjetas y vehículos se agrupan por mes de registro. Si un
// pago se adelantó a otro mes, el usuario debe comprobar el período manualmente.
function obtenerPagosPendientesMes(mesElegido) {
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(mesElegido)) return [];
  const [anio, mes] = mesElegido.split("-").map(Number);
  const ultimoDia = new Date(anio, mes, 0).getDate();
  const registrados = Array.isArray(data.pagos) ? data.pagos : [];
  const hoy = today();
  const eventos = [];

  const fechaVencimiento = dia => {
    const numero = Number(dia);
    if (!Number.isInteger(numero) || numero < 1 || numero > 31) return null;
    return mesElegido + "-" + String(Math.min(numero, ultimoDia)).padStart(2, "0");
  };

  const importeRegistrado = (tipo, cuentaId) => round(registrados
    .filter(p => p.tipo === tipo && String(p.cuentaId) === String(cuentaId) &&
      validDate(String(p.fecha)) && p.fecha.slice(0, 7) === mesElegido)
    .reduce((total, p) => {
      const importe = Number(p.monto);
      return total + (Number.isFinite(importe) && importe > 0 ? importe : 0);
    }, 0));

  const estadoPago = (fecha, esperado, registrado) => {
    if (Number.isFinite(esperado) && esperado > 0 && registrado >= esperado - 0.005) {
      return "pagado";
    }
    if (registrado > 0) return "parcial";
    return fecha < hoy ? "vencido" : fecha === hoy ? "hoy" : "pendiente";
  };

  for (const [tipo, lista] of [
    ["vehiculo", Array.isArray(data.vehiculos) ? data.vehiculos : []],
    ["tarjeta", Array.isArray(data.tarjetas) ? data.tarjetas : []]
  ]) {
    lista.forEach((item, indice) => {
      const fecha = fechaVencimiento(item.vencimiento);
      if (!fecha) return;
      const abonado = importeRegistrado(tipo, item.id);
      if (Number(item.saldo) <= 0 && abonado <= 0) return;
      const importe = Number(tipo === "vehiculo" ? item.pago : item.pagoMinimo);
      const esperado = Number.isFinite(importe) && importe > 0 ? round(importe) : null;
      eventos.push({
        tipo, indice, nombre:String(item.nombre || item.modelo || ""),
        fecha, esperado, abonado,
        estado:estadoPago(fecha, esperado, abonado)
      });
    });
  }

  for (const item of suscripcionesDelMes(mesElegido)) {
    const importe = Number(item.monto);
    eventos.push({
      tipo:"suscripcion", nombre:String(item.nombre || ""), fecha:item.fecha,
      esperado:Number.isFinite(importe) && importe > 0 ? round(importe) : null,
      abonado:0, estado:"programado"
    });
  }

  const prestamos = Array.isArray(data.prestamos) ? data.prestamos : [];
  for (const cuota of prestamosDelMes(mesElegido)) {
    const importe = Number(cuota.monto);
    const esperado = Number.isFinite(importe) && importe > 0 ? round(importe) : null;
    const abonado = Number.isFinite(Number(cuota.importePagado))
      ? round(Math.max(0, Number(cuota.importePagado))) : 0;
    eventos.push({
      tipo:"prestamo", indice:prestamos.findIndex(p => String(p.id) === String(cuota.id)),
      nombre:String(cuota.nombre || ""), fecha:cuota.fecha, esperado, abonado,
      estado:cuota.pagada ? "pagado" : estadoPago(cuota.fecha, esperado, abonado)
    });
  }

  return eventos.sort((a, b) => a.fecha.localeCompare(b.fecha) ||
    a.nombre.localeCompare(b.nombre));
}

function cambiarMesPagosPendientes(paso) {
  if (paso !== -1 && paso !== 1) return;
  const [anio, mes] = mesPagosPendientes.split("-").map(Number);
  const fecha = new Date(anio, mes - 1 + paso, 1, 12);
  if (fecha.getFullYear() < 1000 || fecha.getFullYear() > 9999) return;
  mesPagosPendientes = fecha.getFullYear() + "-" +
    String(fecha.getMonth() + 1).padStart(2, "0");
  pagosPendientes();
}

function filtrarPagosPendientes(filtro) {
  if (filtro !== "todos" && filtro !== "pendientes") return;
  filtroPagosPendientes = filtro;
  pagosPendientes();
}

function abrirPagoPendiente(tipo, indice, fecha) {
  if (tipo === "vehiculo" && data.vehiculos[indice]) {
    go("vehiculos");
    toggle("auto" + indice);
    document.getElementById("auto" + indice)?.scrollIntoView({block:"center",behavior:"smooth"});
  } else if (tipo === "tarjeta" && data.tarjetas[indice]) {
    go("tarjetas");
    mostrarDetalleCredito(indice);
    const boton = document.querySelector(`[aria-controls="tarjeta${indice}"]`);
    if (boton) toggleCreditoPanel(boton, "tarjeta" + indice);
    document.getElementById("tarjeta" + indice)?.scrollIntoView({block:"center",behavior:"smooth"});
  } else if (tipo === "prestamo" && data.prestamos?.[indice] && validDate(fecha)) {
    go("movimientos");
    abrirDiaCalendario(fecha);
  } else if (tipo === "suscripcion") {
    go("suscripciones");
  }
}

function pagosPendientes() {
  const eventos = obtenerPagosPendientesMes(mesPagosPendientes);
  const porAtender = eventos.filter(p => p.estado !== "pagado");
  const registrados = eventos.filter(p => p.estado === "pagado");
  const importeEstimado = round(porAtender.reduce((total, p) =>
    total + (p.esperado === null ? 0 : Math.max(0, p.esperado - p.abonado)), 0));
  const visibles = filtroPagosPendientes === "todos" ? eventos : porAtender;
  const [anio, mes] = mesPagosPendientes.split("-").map(Number);
  const mesTitulo = new Date(anio, mes - 1, 1, 12).toLocaleDateString(
    idiomaActual() === "en" ? "en-US" : "es", {month:"long", year:"numeric"}
  );
  const mesFormateado = mesTitulo.charAt(0).toLocaleUpperCase() + mesTitulo.slice(1);
  const nombres = {
    vehiculo:textoApp("Vehículo", "Vehicle"),
    tarjeta:textoApp("Tarjeta de crédito", "Credit card"),
    suscripcion:textoApp("Suscripción o pago programado", "Scheduled payment"),
    prestamo:textoApp("Cuota de préstamo", "Loan installment")
  };
  const estados = {
    pagado:[textoApp("Registrado", "Recorded"), "#16835a"],
    parcial:[textoApp("Pago parcial", "Partial payment"), "#b27a29"],
    vencido:[textoApp("Fecha vencida", "Overdue date"), "#c54848"],
    hoy:[textoApp("Vence hoy", "Due today"), "#b27a29"],
    pendiente:[textoApp("Pendiente", "Upcoming"), "#7f8a9b"],
    programado:[textoApp("Programado · sin confirmar", "Scheduled · unconfirmed"), "#7f8a9b"]
  };

  el().innerHTML = `
    <section class="pagos-pendientes-pantalla pp28">
      <div class="pp28-heading">
        <h2>${textoApp("Pagos pendientes", "Upcoming payments")}</h2>
        <p>${textoApp("Tus vencimientos, organizados en un solo lugar", "Your upcoming payments in one place")}</p>
      </div>
      <div class="pp28-overview">
        <div class="pp28-month">
          <button type="button" onclick="cambiarMesPagosPendientes(-1)"
            aria-label="${textoApp("Mes anterior", "Previous month")}">‹</button>
          <strong>${safe(mesFormateado)}</strong>
          <button type="button" onclick="cambiarMesPagosPendientes(1)"
            aria-label="${textoApp("Mes siguiente", "Next month")}">›</button>
        </div>
        <div class="pp28-stats">
          <div class="pp28-stat">
            <small>${textoApp("Por atender", "To review")}</small>
            <strong>${porAtender.length}</strong>
          </div>
          <div class="pp28-stat">
            <small>${textoApp("Registrados", "Recorded")}</small>
            <strong>${registrados.length}</strong>
          </div>
        </div>
        <div class="pp28-estimate">
          <span>${textoApp("Estimado por atender", "Estimated outstanding")}</span>
          <strong>${money(importeEstimado)}</strong>
        </div>
      </div>
      <div class="pp28-filters" aria-label="${textoApp("Filtrar pagos", "Filter payments")}">
        <button type="button" class="pp28-filter" onclick="filtrarPagosPendientes('pendientes')"
          aria-pressed="${filtroPagosPendientes === "pendientes"}">${textoApp("Por atender", "To review")} · ${porAtender.length}</button>
        <button type="button" class="pp28-filter" onclick="filtrarPagosPendientes('todos')"
          aria-pressed="${filtroPagosPendientes === "todos"}">${textoApp("Todos", "All")} · ${eventos.length}</button>
      </div>
      <div class="pp28-list">
        ${visibles.map(p => {
          const [estado, color] = estados[p.estado] || estados.pendiente;
          const fecha = new Date(p.fecha + "T12:00:00");
          const dia = fecha.toLocaleDateString(idiomaActual() === "en" ? "en-US" : "es", {day:"2-digit"});
          const mesCorto = fecha.toLocaleDateString(idiomaActual() === "en" ? "en-US" : "es", {month:"short"}).replace(".", "");
          const accion = p.tipo === "prestamo" ? textoApp("Ver cuota", "View installment")
            : p.tipo === "suscripcion" ? textoApp("Administrar", "Manage")
            : p.estado === "pagado" ? textoApp("Ver detalles", "View details")
            : textoApp("Registrar pago", "Record payment");
          const etiquetaImporte = p.esperado === null ? textoApp("Sin importe", "No amount") : money(p.esperado);
          return `
          <button type="button" class="pp28-item"
            aria-label="${safe(p.nombre)}. ${safe(estado)}. ${safe(etiquetaImporte)}. ${safe(accion)}"
            onclick="abrirPagoPendiente('${p.tipo}',${Number.isInteger(p.indice) ? p.indice : -1},'${p.fecha}')">
            <span class="pp28-date" aria-hidden="true"><strong>${safe(dia)}</strong><small>${safe(mesCorto)}</small></span>
            <span class="pp28-info">
              <strong class="pp28-name">${safe(p.nombre)}</strong>
              <span class="pp28-category">${safe(nombres[p.tipo])}</span>
              <span class="pp28-status" style="--pp-status:${color}">
                <span class="pp28-state-label">${safe(estado)}</span>${p.abonado > 0 ? `<em> · ${textoApp("Abonado", "Paid")}: ${money(p.abonado)}</em>` : ""}
              </span>
            </span>
            <span class="pp28-amount"><strong>${etiquetaImporte}</strong><small>${safe(accion)}</small></span>

          </button>`;
        }).join("") || `<div class="pp28-empty">
          <p>${filtroPagosPendientes === "todos"
            ? textoApp("No hay vencimientos programados para este mes.", "No due dates scheduled this month.")
            : textoApp("No hay pagos por revisar este mes.", "No payments to review this month.")}</p>
          <button type="button" onclick="go('tarjetas')">${textoApp("Ver tarjetas", "View cards")}</button>
        </div>`}
      </div>
      <p class="pp28-note">${textoApp(
        "Los estados son estimados según los registros del mes. Los cobros programados no confirman un pago ni descuentan dinero.",
        "Statuses are estimated from this month's records. Scheduled charges do not confirm or deduct a payment."
      )}</p>
    </section>`;
}

// Respaldos completos: lista cerrada de preferencias de esta aplicación.
// La fecha de copia es información LOCAL, no se incluye en los archivos.
const CLAVES_PREFERENCIAS_RESPALDO = Object.freeze([
  "balanceone-orden-inicio-bancos",
  "balanceone-orden-inicio-credito",
  "balanceone-idioma",
  CLAVE_FORMATO_IMPORTES,
  CLAVE_MONEDA_IMPORTES,
  "balanceone-diseno-inicio",
  CLAVE_DISENO_CREDITO,
  CLAVE_TAMANO_CREDITO,
  CLAVE_TARJETAS_INICIO,
  "balanceone-tamano-texto",
  "amfinance-tema",
  "balanceone-progreso",
  "balanceone-color",
  "balanceone-forma",
  "balanceone-listas",
  "balanceone-orden-herramientas"
]);
// Separar la descarga iniciada de la copia que el usuario realmente guardó.
// El identificador antiguo era no verificado: no se considera una copia confirmada.
const CLAVE_ULTIMA_COPIA_ANTERIOR = "balanceone-ultima-copia-preparada";
const CLAVE_ULTIMA_COPIA = "balanceone-ultima-copia-confirmada";
const CLAVE_COPIA_PENDIENTE = "balanceone-copia-descargada-pendiente";
const DIAS_ENTRE_COPIAS = 30;
const DURACION_CONFIRMACION_COPIA_MS = 24*60*60*1000;
let descargaCopiaPendienteEnMemoria = 0;
function ultimaCopiaPreparada() {
  try {
    const valor=localStorage.getItem(CLAVE_ULTIMA_COPIA);
    if (!valor) return null;
    const fecha=new Date(valor);
    return Number.isFinite(fecha.getTime()) && fecha.getTime()<=Date.now()
      ? fecha : null;
  } catch { return null; }
}
function necesitaGuardarCopia() {
  const fecha=ultimaCopiaPreparada();
  return !fecha || Date.now()-fecha.getTime()>=DIAS_ENTRE_COPIAS*86400000;
}
function estadoCopiaSeguridadHTML() {
  const fecha=ultimaCopiaPreparada();
  const textoFecha=fecha ? fecha.toLocaleDateString(idiomaActual()==="en" ? "en-US" : "es-US",{
    day:"numeric",month:"short",year:"numeric"
  }) : "";
  const descripcion=necesitaGuardarCopia()
    ? (fecha ? textoApp("Han pasado 30 días desde la última copia confirmada. Te recomendamos guardar una nueva.",
      "It has been 30 days since your last confirmed backup. We recommend saving a new one.")
      : textoApp("Aún no has confirmado una copia guardada en este dispositivo.",
        "No saved backup has been confirmed on this device yet."))
    : textoApp("Última copia confirmada: "+textoFecha+".","Last confirmed backup: "+textoFecha+".");
  return `<p class="note" style="margin:12px 0 0;padding:12px 14px;border-radius:18px;
    background:rgba(135,145,160,.09);line-height:1.5">${descripcion}</p>`;
}
function preferenciasParaRespaldo() {
  return Object.fromEntries(CLAVES_PREFERENCIAS_RESPALDO.map(clave=>[
    clave,localStorage.getItem(clave)
  ]));
}

// Safari no informa si una descarga termina en Archivos.
// Se muestra una solicitud de confirmación, nunca una fecha automática.
function copiaPendienteDeConfirmar() {
  let fecha=descargaCopiaPendienteEnMemoria;
  try { fecha=Math.max(fecha,Number(sessionStorage.getItem(CLAVE_COPIA_PENDIENTE))||0); }
  catch { /* Sesión sin almacenamiento: funciona mientras la página está abierta. */ }
  return fecha>0 && fecha<=Date.now() && (Date.now()-fecha)<DURACION_CONFIRMACION_COPIA_MS;
}
function limpiarCopiaPendiente() {
  descargaCopiaPendienteEnMemoria=0;
  try { sessionStorage.removeItem(CLAVE_COPIA_PENDIENTE); } catch {}
}
function mensajeConfirmarCopiaHTML() {
  if(!copiaPendienteDeConfirmar()) return "";
  return `<div class="datos-v2-confirmacion" role="status">
    <strong>${textoApp("¿Guardaste el archivo?","Did you save the file?")}</strong>
    <p>${textoApp("Comprueba que Balance-One-Respaldo.json esté en Archivos o en un lugar seguro antes de confirmar.",
      "Check that Balance-One-Respaldo.json is in Files or another safe location before confirming.")}</p>
    <div class="datos-v2-confirmacion-botones">
      <button type="button" class="datos-v2-confirmar" onclick="confirmarCopiaGuardada()">${textoApp("Sí, ya lo guardé","Yes, I saved it")}</button>
      <button type="button" class="datos-v2-posponer" onclick="posponerConfirmacionCopia()">${textoApp("Todavía no","Not yet")}</button>
    </div>
  </div>`;
}
function actualizarEstadoCopiaSeguridad() {
  const estado=document.getElementById("estadoCopiaSeguridad");
  if(estado) estado.innerHTML=estadoCopiaSeguridadHTML();
  const confirmacion=document.getElementById("confirmacionCopiaSeguridad");
  if(confirmacion) confirmacion.innerHTML=mensajeConfirmarCopiaHTML();
}
function confirmarCopiaGuardada() {
  if(!copiaPendienteDeConfirmar()) return;
  try {
    localStorage.setItem(CLAVE_ULTIMA_COPIA,new Date().toISOString());
  } catch {
    alert(textoApp("No se pudo registrar la fecha del respaldo.","Could not save the backup date."));
    return;
  }
  limpiarCopiaPendiente();
  actualizarEstadoCopiaSeguridad();
}
function posponerConfirmacionCopia() {
  limpiarCopiaPendiente();
  actualizarEstadoCopiaSeguridad();
}

function exportarCopia(){
  try {
    const cuentasBanco = JSON.parse(
  localStorage.getItem("amfinance-cuentas-banco") || "[]"
);

if (!Array.isArray(cuentasBanco)) {
    throw new Error(textoApp("Las cuentas bancarias no son válidas.", "The bank accounts are invalid."));
}

const respaldo = {
  aplicacion: "Balance One",
  version: 2,
  fecha: new Date().toISOString(),
  datos: data,
  cuentasBanco: cuentasBanco,
  preferencias: preferenciasParaRespaldo()
};

    const contenido = JSON.stringify(respaldo, null, 2);

    const archivo = new Blob(
      [contenido],
      {type: "application/json"}
    );

    const url = URL.createObjectURL(archivo);
    const enlace = document.createElement("a");

    enlace.href = url;
    enlace.download = "Balance-One-Respaldo.json";

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    // La descarga puede iniciarse sin haberse guardado: pedir confirmación explícita.
    descargaCopiaPendienteEnMemoria=Date.now();
    try { sessionStorage.setItem(CLAVE_COPIA_PENDIENTE,String(descargaCopiaPendienteEnMemoria)); }
    catch { /* La confirmación en pantalla sigue disponible. */ }
    actualizarEstadoCopiaSeguridad();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(error) {
        alert(textoApp("No se pudo crear la copia de seguridad.", "Could not create the backup."));
  }
}
// El archivo se selecciona primero; solo se restaura tras pulsar el botón.
function prepararArchivoCopia(event){
  const archivo=event && event.target && event.target.files && event.target.files[0];
  const nombre=document.getElementById("datosCopiaNombre");
  const boton=document.getElementById("datosCopiaRestaurar");
  if(nombre) nombre.textContent=archivo ? archivo.name : textoApp("Seleccionar archivo JSON","Choose JSON file");
  if(boton) boton.disabled=!archivo;
}
async function restaurarCopia(event){
  const archivo=event.target.files?.[0];
  if(!archivo) return;
  try {
    const respaldo=JSON.parse(await archivo.text());
    const valido=respaldo && respaldo.aplicacion==="Balance One" &&
      [1,2].includes(respaldo.version) && respaldo.datos &&
      Array.isArray(respaldo.datos.movimientos) &&
      Array.isArray(respaldo.datos.pagos) &&
      Array.isArray(respaldo.datos.vehiculos) &&
      Array.isArray(respaldo.datos.tarjetas) &&
      (respaldo.cuentasBanco===undefined || Array.isArray(respaldo.cuentasBanco));
    if(!valido) {
      alert(textoApp("Este archivo no es una copia válida de Balance One.",
        "This file is not a valid Balance One backup."));
      return;
    }

    const categorias = respaldo.datos.categoriasPersonales;
    if (categorias !== undefined) {
      const iconos = trazosCategoriasMovimiento();
      if (!Array.isArray(categorias) || !categorias.every(c => c && typeof c.id === "string" &&
          /^personal-[a-z0-9]{1,40}$/.test(c.id) && typeof c.nombre === "string" &&
          c.nombre.trim() && c.nombre.length <= 40 && iconos.has(c.icono)) ||
          new Set(categorias.map(c => c.id)).size !== categorias.length) throw new Error("Invalid categories");
    }
    const favoritos = respaldo.datos.favoritosGasto;
    if (favoritos !== undefined && (!Array.isArray(favoritos) || !favoritos.every(f => f &&
        typeof f.nombre === "string" && f.nombre.trim() && f.nombre.length <= 80 &&
        typeof f.categoria === "string" && typeof f.origen === "string"))) throw new Error("Invalid favorites");
    if (respaldo.datos.movimientos.some(m => (m?.recibo && !reciboValido(m.recibo)) ||
        (m?.proyecto != null && (typeof m.proyecto !== "string" || m.proyecto.length > 60)))) {
      throw new Error("Invalid transaction attachments");
    }

    if (respaldo.datos.presupuestos !== undefined && !presupuestosValidos(respaldo.datos.presupuestos, respaldo.datos)) {
      alert(textoApp("Los presupuestos de esta copia no son válidos.", "The budgets in this backup are invalid."));
      return;
    }

    if (respaldo.datos.metasAhorro !== undefined) {
      if (!Array.isArray(respaldo.datos.metasAhorro)) throw new Error("Invalid goals");
      const idsMetas = new Set();
      for (const meta of respaldo.datos.metasAhorro) {
        if (!meta || !meta.id || idsMetas.has(String(meta.id)) || typeof meta.nombre !== "string" ||
            !meta.nombre.trim() || meta.nombre.length>80 || (meta.fecha && !validDate(meta.fecha)) || !Array.isArray(meta.aportes)) throw new Error("Invalid goal");
        idsMetas.add(String(meta.id));
        const idsAportes = new Set();
        for (const aporte of meta.aportes) {
          if (!aporte || !aporte.id || idsAportes.has(String(aporte.id)) || !["aporte","retiro"].includes(aporte.tipo) || !validDate(aporte.fecha)) throw new Error("Invalid entry");
          idsAportes.add(String(aporte.id));
        }
        if(meta.cuentaId && (!Array.isArray(respaldo.cuentasBanco) || respaldo.datos.metasAhorro.some(otra=>otra!==meta && String(otra.cuentaId||'')===String(meta.cuentaId)))) throw new Error("Invalid linked account");
        resumenMetaAhorro(meta,respaldo.cuentasBanco || []);
      }
    }

    // Los respaldos antiguos (versión 1) no tienen preferencias.
    // Solo restauramos claves autorizadas y validamos los valores antes de escribir.
    let preferencias={};
    if(respaldo.version===2) {
      if(!respaldo.preferencias || typeof respaldo.preferencias!=="object" ||
         Array.isArray(respaldo.preferencias)) {
        alert(textoApp("Las preferencias del respaldo no son válidas.",
          "Backup preferences are invalid."));
        return;
      }
      for(const clave of CLAVES_PREFERENCIAS_RESPALDO) {
        if(!Object.prototype.hasOwnProperty.call(respaldo.preferencias,clave)) continue;
        const valor=respaldo.preferencias[clave];
        if(valor!==null && (typeof valor!=="string" || valor.length>20000)) {
          alert(textoApp("Las preferencias del respaldo no son válidas.",
            "Backup preferences are invalid."));
          return;
        }
        preferencias[clave]=valor;
      }
    }
    if(!confirm(textoApp(
      "¿Restaurar esta copia? Se reemplazarán los datos actuales de Balance One.",
      "Restore this backup? Your current Balance One data will be replaced."
    ))) return;

    const claveBanco="amfinance-cuentas-banco";
    const cambios={ [KEY]:JSON.stringify(respaldo.datos) };
    if(Array.isArray(respaldo.cuentasBanco)) {
      cambios[claveBanco]=JSON.stringify(respaldo.cuentasBanco);
    }
    for(const [clave,valor] of Object.entries(preferencias)) cambios[clave]=valor;
    // Tras restaurar, no afirmar que se ha guardado una copia del estado actual.
    cambios[CLAVE_ULTIMA_COPIA]=null;
    cambios[CLAVE_ULTIMA_COPIA_ANTERIOR]=null;
    const anteriores=Object.fromEntries(Object.keys(cambios).map(clave=>[
      clave,localStorage.getItem(clave)
    ]));
    try {
      for(const [clave,valor] of Object.entries(cambios)) {
        if(valor===null) localStorage.removeItem(clave);
        else localStorage.setItem(clave,valor);
      }
    } catch(error) {
      for(const [clave,valor] of Object.entries(anteriores)) {
        try {
          if(valor===null) localStorage.removeItem(clave);
          else localStorage.setItem(clave,valor);
        } catch { /* Intento de restauración del estado previo. */ }
      }
      throw error;
    }
    limpiarCopiaPendiente();
    alert(textoApp("Copia restaurada correctamente.","Backup restored successfully."));
    location.reload();
  } catch(error) {
    alert(textoApp("No se pudo restaurar la copia de seguridad.",
      "Could not restore the backup."));
  } finally {
    event.target.value="";
    prepararArchivoCopia(event);
  }
}
