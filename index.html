<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F7;color:#17212e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#F2F2F7;padding:24px 20px 10px;border-bottom:none}
.logo{font-size:23px;font-weight:800}
.logo span{color:#238b91}
.sub{color:#84909d;font-size:13px;margin-top:5px}
main{padding:20px 16px 105px;max-width:650px;margin:auto}
h2{font-size:21px;margin:0 0 17px}
h3{margin:0 0 14px}
.card{background:white;border:1px solid transparent;border-radius:19px;padding:19px;margin-bottom:14px}
.label{font-size:13px;color:#7c8795}
.amount{font-size:34px;font-weight:800;margin:9px 0}
.smallamount{font-size:24px;font-weight:750;margin-top:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.green{color:#13865b}
.red{color:#d44d56}
.primary{background:#172b38;color:white;border:0;border-radius:13px;padding:14px 18px;font-size:15px;font-weight:650;width:100%}
.secondary{background:#e7f2f3;color:#147e86;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:650;width:100%;margin-top:12px}
.danger{background:#fff0f0;color:#bb343e}
.actions{display:flex;gap:9px;margin-top:12px}
.actions button{flex:1;margin:0}
input,select{width:100%;padding:13px;border:1px solid #dce2e7;border-radius:12px;font-size:16px;background:white;margin:7px 0 13px}
button{cursor:pointer}
/* Barra flotante Balance One */
nav {
  position: fixed;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left: 28px;
  right: 28px;
  width: auto;
  padding: 7px;
  border-radius: 999px;
  background: rgba(255,255,255,.78);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 6px 24px rgba(0,0,0,.08);
  display: flex;
  gap: 3px;
  z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform: translateY(150%);
  transition: transform 0.3s ease;
}

nav.navVisible {
  transform: translateY(0);
}

nav button {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #fff;
  padding: 12px 2px;
}

/* Barra adaptable a modo claro y oscuro */
@media (prefers-color-scheme: light) {
  nav {
    background: rgba(235,235,238,.94);
    border-color: rgba(0,0,0,.08);
  }

  nav button {
    color: #252525;
  }

  nav button.active {
    background: #ffffff;
    color: #111111;
  }
}

@media (prefers-color-scheme: dark) and (max-width: 0px) {
  nav {
    background: rgba(35,35,37,.94);
    border-color: rgba(255,255,255,.12);
  }

  nav button {
    color: #ffffff;
  }

  nav button.active {
    background: #ffffff;
    color: #111111;
  }
}

/* Alinear iconos y textos de la barra */
nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  font-size: 11px;
  white-space: nowrap;
}

nav button svg {
  display: block;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}
.item{border-bottom:1px solid #f0f1f3;padding:13px 0}
.item:last-child{border:0}
.note{font-size:12px;color:#89939f;line-height:1.5}
.payment{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.hidden{display:none}
.editbox{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
/* Modo oscuro automático del iPhone */

    background: #101216;
    color: #f5f6f8;
  }

  header, nav {
    background: #191c22;
    border-color: #343943;
  }

  .card {
    background: #20242b;
    border-color: #343943;
  }

  .sub, .label, .note {
    color: #aab3c2;
  }

    border-color: #343943;
  }

    background: #2a3039;
  }

    background: #2a3039;

    border-color: #49515e;
  }

  .secondary {
    background: #343b46;
    color: #ffffff;
  }

  nav button {
    color: #aab3c2;
  }

  .logo span {
    color: #4dd5d0;
  }
}

}

html.tema-claro nav button.active {

html.tema-claro .logo span {

}

#amMenu {

}

#amMenu .amPagina {
  height: 310px;
  align-content: start;
  box-sizing: border-box;
}
#amIndicadores {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}

#amIndicadores span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #a1a1aa;

}

  display: block;

}

#amMenuTirador,

  grid-column: 1 / -1;
}

#amMenu button {
  width: 100%;
  min-width: 0;
  margin: 0;

  min-height: 95px;
  border-radius: 999px;

#amMenu button {

}

@media (prefers-color-scheme: dark) {

}

  visibility: visible;
}

}

/* Calculadora moderna Balance One */
.amCalc {
  padding: 8px 0 30px;
}

.amCalc h2 {
  text-align: center;
  font-size: 23px;
  margin-bottom: 6px;
}

.amCalc > .note {
  text-align: center;
  margin-bottom: 24px;
}

.amCalcTabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin-bottom: 22px;
}

.amCalcTabs button {
  min-width: 0;
  padding: 15px 3px;
  border-radius: 22px;
  font-size: 12px;
  background: #292d36;
  color: white;
  border: 1px solid #454b57;
}

.amCalcTabs button.activo {
  background: #78869d;
  font-weight: 700;
}

.amCalcCampos,
.amCalcResultado {
  border-radius: 28px;
  padding: 22px;
  margin-bottom: 20px;
}

.amCalcCampos label {
  display: block;
  font-weight: 600;
  margin: 14px 0 10px;
}

.amCalcCampos input[type="number"] {
  width: 100%;
  box-sizing: border-box;
  border-radius: 18px;
  padding: 14px;
  font-size: 20px;
  margin-bottom: 14px;
}

.amCalcCampos input[type="range"] {
  display: block;
  width: 100%;
  height: 12px;
  margin: 8px 0 28px;
  accent-color: #8798b7;
  cursor: pointer;
}

.amCalcCampos input[type="range"]::-webkit-slider-thumb {
  width: 28px;
  height: 28px;
}

.amCalcResultado h1 {
  font-size: clamp(36px, 9vw, 54px);
  margin: 8px 0 22px;
  letter-spacing: -1px;
}

.amCalcTotales {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  border-top: 1px solid #7775;
  padding-top: 18px;
}

.amCalcTotales div {
  font-size: 12px;
  min-width: 0;
}

.amCalcTotales strong {
  display: block;
  font-size: 15px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.amCalc > button.primary {
  width: 100%;
  border-radius: 999px;
  padding: 18px;
  margin-bottom: 14px;
}

.amCalcAcciones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.amCalcAcciones button {
  padding: 17px 8px;
  border-radius: 999px;
  background: #292d36;
  color: white;
  border: 1px solid #454b57;
}

/* Diseño compacto de la calculadora */
.amCalcCampos {
  padding: 18px;
}

  font-size: 14px;

}

  font-size: 18px;

  margin: 10px 0;

}

.amCalcCampos input[type="range"] {
  width: 100%;

}

.amCalcCampos input[type="range"]::-webkit-slider-thumb {

  height: 24px;
}

.amCalcTabs button {
  min-height: 65px;
  border-radius: 25px;
  padding: 10px 2px;

}

/* Ajuste compacto de la calculadora */
.amCalcCampos {
  padding: 16px 18px;
}

.amCalcCampos label {
  width: 46%;
  font-size: 13px;
  margin: 5px 0;
}

.amCalcCampos input[type="number"] {
  width: 52%;
  font-size: 16px;
  padding: 10px;

}

.amCalcCampos input[type="range"] {
  height: 8px;
  margin: 8px 0 12px;
}

.amCalcTabs button {
  min-height: 64px;
}

.amCalcTabs button {
  display: flex;

.amCalcTabs button svg {

/* Símbolos dentro de los campos de la calculadora */
.amCalcCampos {

}

body:has(#content .amCalc) > header {

/* Símbolos dentro de los campos */

.balance-principal {

.logo span {

function diasParaVencer(dia){
const hoy=new Date();
hoy.setHours(0,0,0,0);

let fecha=new Date(
hoy.getFullYear(),
hoy.getMonth(),
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+1,0
).getDate())
);

if(fecha<hoy){
fecha=new Date(
hoy.getFullYear(),
hoy.getMonth()+1,
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+2,0
).getDate())
);
}

return Math.round((fecha-hoy)/86400000);
}

function avisosVencimiento(){
const cuentas=[
...data.vehiculos.map(v=>({...v,tipo:"Vehículo"})),
...data.tarjetas.map(t=>({...t,tipo:"Tarjeta"}))
];

return cuentas.map(c=>{
const dia=Number(c.vencimiento);
if(!Number.isInteger(dia)||dia<1||dia>31)return "";

const faltan=diasParaVencer(dia);

if(![7,3,0].includes(faltan))return "";

const mensaje=faltan===0
?"¡Vence hoy!"
:`Faltan ${faltan} días`;

return `
<div class="card">
<strong>🔔 ${safe(c.tipo)}: ${safe(c.nombre)}</strong>
<p>${mensaje} para tu próximo pago.</p>
</div>`;
}).join("");
}

   <select name="tipo">

   nombre:String(f.get("nombre")).trim(),
   monto,fecha
  });

 };

 return `

 </div>`;
}

function editar(origen,ident){
 const key=origen+":"+ident;
 openEdit=openEdit===key?null:key;
 render();
}

function cancelarEdicion(){
 openEdit=null;
 render();
}

function findItem(origen,ident){
 const group=origen==="pago"?data.pagos:data.movimientos;
 return group.find(x=>x.id===ident);
}

function cuentaDePago(p){
 const group=p.tipo==="vehiculo"?data.vehiculos:
             p.tipo==="tarjeta"?data.tarjetas:[];
 if(p.cuentaId){
  return group.find(x=>x.id===p.cuentaId)||null;
 }
 const matches=group.filter(x=>x.nombre===p.nombre);
 return matches.length===1?matches[0]:null;
}

// Modifica el saldo de la deuda al corregir un pago.
// delta positivo = aumenta la deuda.
// delta negativo = disminuye la deuda.
function ajustarSaldo(cuenta,delta){
 const nuevo=round(Number(cuenta.saldo)+delta);
 if(!Number.isFinite(nuevo)||nuevo<0){
  alert("Este cambio dejaría la deuda con saldo negativo. Revisa los pagos.");
  return false;
 }
 cuenta.saldo=nuevo;
 return true;
}

function guardarEdicion(e,origen,ident){
 e.preventDefault();
 const item=findItem(origen,ident);
 if(!item)return;
 const f=new FormData(e.target);
 const monto=round(f.get("monto"));
 const fecha=String(f.get("fecha"));

 if(!validAmount(monto)||!validDate(fecha)){
  alert("Introduce una cantidad y una fecha válidas.");
  return;
 }

 if(origen==="movimiento"){
  const nombre=String(f.get("nombre")).trim();
  if(!nombre)return;
  item.nombre=nombre;
  item.tipo=f.get("tipo");
  item.monto=monto;
  item.fecha=fecha;
 }else{
  const cuenta=cuentaDePago(item);
  if(!cuenta){
   alert("No se encontró la cuenta de este pago. No se puede corregir la deuda automáticamente.");
   return;
  }
  const anterior=Number(item.monto);
  const diferencia=round(monto-anterior);

  if(item.tipo==="vehiculo"){
   const interes=Number(item.interes);
   const capitalAnterior=Number(item.capital);
   if(!Number.isFinite(interes)||!Number.isFinite(capitalAnterior)){
    alert("Este pago antiguo no tiene suficientes datos para editarse con seguridad.");
    return;
   }
   const capitalNuevo=round(capitalAnterior+diferencia);
   if(capitalNuevo<=0){
    alert("El pago corregido no cubre el interés registrado.");
    return;
   }
   if(!ajustarSaldo(cuenta,-diferencia))return;
   item.capital=capitalNuevo;
  }else{
   if(!ajustarSaldo(cuenta,-diferencia))return;
  }
  item.monto=monto;
  item.fecha=fecha;
  item.cuentaId=cuenta.id;
  actualizarSaldosHistorial(cuenta);
 }

 openEdit=null;
 save();
 alert("Cambios guardados correctamente.");
 render();
}

function eliminar(origen,ident){
 const group=origen==="pago"?data.pagos:data.movimientos;
 const index=group.findIndex(x=>x.id===ident);
 if(index<0)return;
 const item=group[index];

 if(!confirm("¿Seguro que deseas eliminar este "+(origen==="pago"?"pago":"movimiento")+"?"))return;

 if(origen==="pago"){
  const cuenta=cuentaDePago(item);
  if(!cuenta){
   alert("No se encontró la cuenta asociada. No se eliminará el pago para evitar descuadrar la deuda.");
   return;
  }
  const devolver=item.tipo==="vehiculo"?
   Number(item.capital):Number(item.monto);
  if(!Number.isFinite(devolver)){
   alert("Este pago no tiene información suficiente para eliminarlo.");
   return;
  }
  if(!ajustarSaldo(cuenta,devolver))return;
  group.splice(index,1);
  actualizarSaldosHistorial(cuenta);
 }else{
  group.splice(index,1);
 }

 openEdit=null;
 save();
 alert("Registro eliminado.");
 render();
}

// Recalcula los saldos históricos cuando se corrigen pagos.
// Los pagos sin datos suficientes muestran "No registrado".
function actualizarSaldosHistorial(cuenta){
 const group=data.pagos.filter(p=>
  p.tipo==="vehiculo"&&cuentaDePago(p)===cuenta
 ).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

 let saldo=Number(cuenta.saldo);
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo+Number(p.capital));
 }
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo-Number(p.capital));
  p.saldoRestante=saldo;
 }
}

function pagarAuto(e,i){
 e.preventDefault();
 const v=data.vehiculos[i];
 const monto=round(new FormData(e.target).get("monto"));
 const saldo=Number(v.saldo);
 const interes=round(saldo*Number(v.apr)/1200);
 const capital=round(monto-interes);

 if(!validAmount(monto))return;
 if(capital<=0){
  alert("El pago no cubre el interés mensual estimado.");
  return;
 }
 if(capital>saldo){
  alert("El pago supera el saldo más el interés estimado.");
  return;

  id:id(),cuentaId:v.id,nombre:v.nombre,
  monto,interes,capital,tipo:"vehiculo",
  fecha:today(),saldoRestante:v.saldo
 });

 render();
}

     function exportarCopia(){
  try {
    const respaldo = {
      aplicacion: "Balance One",
      version: 1,
      fecha: new Date().toISOString(),
      datos: data
    };

    const contenido = JSON.stringify(respaldo, null, 2);

    const archivo = new Blob(
      [contenido],
      {type: "application/json"}
    );

    const url = URL.createObjectURL(archivo);
    const enlace = document.createElement("a");

    enlace.href = url;
    enlace.download = "AM-Finance-Respaldo.json";

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(error) {
    alert("No se pudo crear la copia de seguridad.");
  }
}
async function restaurarCopia(event){
  const archivo = event.target.files[0];
  if(!archivo) return;

  try {
    const texto = await archivo.text();
    const respaldo = JSON.parse(texto);

    if(
      respaldo.aplicacion !== "Balance One" ||
      respaldo.version !== 1 ||
      !respaldo.datos ||
      !Array.isArray(respaldo.datos.movimientos) ||
      !Array.isArray(respaldo.datos.pagos) ||
      !Array.isArray(respaldo.datos.vehiculos) ||
      !Array.isArray(respaldo.datos.tarjetas)
    ){
      alert("Este archivo no es una copia válida de Balance One.");
      return;
    }

    if(!confirm(
      "¿Restaurar esta copia? Se reemplazarán los datos actuales de Balance One."
    )) return;

    localStorage.setItem(
      "amfinance-demo-v1",
      JSON.stringify(respaldo.datos)
    );

    alert("Copia restaurada correctamente.");
    location.reload();

  } catch(error) {
    alert("No se pudo restaurar la copia de seguridad.");
  } finally {
    event.target.value = "";
  }
}

function sincronizarCalc(campo) {
  document.getElementById("calc" + campo).value =
    document.getElementById("calc" + campo + "Barra").value;
  actualizarCalc();
}

function actualizarCalc() {
  const valor = id => Number(document.getElementById(id).value) || 0;
  const monto = Math.max(0, valor("calcMonto"));
  const inicial = Math.min(monto, Math.max(0, valor("calcInicial")));
  const tasa = Math.max(0, valor("calcTasa")) / 1200;
  const meses = Math.max(1, Math.round(valor("calcPlazo")));
  const capital = monto - inicial;
  const mensual = tasa === 0
    ? capital / meses
    : capital * tasa / (1 - Math.pow(1 + tasa, -meses));
  const total = mensual * meses;
  const formato = n => n.toLocaleString("en-US", {
    style: "currency", currency: "USD"
  });

  ["Monto", "Tasa", "Plazo", "Inicial"].forEach(campo => {
    const barra = document.getElementById("calc" + campo + "Barra");
    const numero = document.getElementById("calc" + campo);
    barra.value = numero.value;
  });

  document.getElementById("calcMensual").textContent = formato(mensual);
  document.getElementById("calcFinanciado").textContent = formato(capital);
  document.getElementById("calcIntereses").textContent = formato(total - capital);
  document.getElementById("calcTotal").textContent = formato(total);
}

function cambiarTema(tema){
  if(!["auto","claro","oscuro"].includes(tema)) return;

  localStorage.setItem("amfinance-tema", tema);
  aplicarTema();
}

function aplicarTema(){
  const tema = localStorage.getItem("amfinance-tema") || "auto";

  document.documentElement.classList.toggle(
    "tema-claro", tema === "claro"
  );

  document.documentElement.classList.toggle(
    "tema-oscuro", tema === "oscuro"
  );

  const selector = document.getElementById("temaApp");
  if(selector) selector.value = tema;
}
aplicarTema();
go("inicio");

function abrirNuevaCuenta() {
  const nombre = prompt("Nombre del banco o cuenta:");
  if (nombre === null || !nombre.trim()) return;

  const tipo = prompt("Tipo: cheques o ahorro", "ahorro");
  if (tipo === null) return;
  const t = tipo.trim().toLowerCase();
  if (t !== "cheques" && t !== "ahorro") {
    alert("Escribe cheques o ahorro.");
    return;
  }

  const s = prompt("Saldo inicial en dólares:", "0");
  if (s === null) return;
  const saldo = Number(s);
  if (!s.trim() || !Number.isFinite(saldo) || saldo < 0) {
    alert("Saldo no válido.");
    return;
  }

  const m = prompt("Meta en dólares:", "0");
  if (m === null) return;
  const meta = Number(m);
  if (!m.trim() || !Number.isFinite(meta) || meta < 0) {
    alert("Meta no válida.");
    return;
  }

  const clave = "amfinance-cuentas-banco";
  let cuentas = [];
  try {
    cuentas = JSON.parse(localStorage.getItem(clave) || "[]");
    if (!Array.isArray(cuentas)) cuentas = [];
  } catch (e) {}

  cuentas.push({
    id: Date.now().toString(),
    nombre: nombre.trim(),
    tipo: t,
    saldo: saldo,
    meta: meta
  });

  localStorage.setItem(clave, JSON.stringify(cuentas));
  alert("Cuenta creada correctamente.");
}


function abrirCuentaBanco(id) {
  const clave = "amfinance-cuentas-banco";
  let cuentas;

  try {
    cuentas = JSON.parse(localStorage.getItem(clave) || "[]");
    if (!Array.isArray(cuentas)) return;
  } catch (e) {
    alert("No se pudieron leer las cuentas.");
    return;
  }

  const cuenta = cuentas.find(c => String(c.id) === String(id));
  if (!cuenta) {
    alert("Cuenta no encontrada.");
    return;
  }

  const opcion = prompt(
    cuenta.nombre + "\nSaldo: " + money(cuenta.saldo) +
    "\n\nEscribe:\n1 - Depositar\n2 - Retirar"
  );

  if (opcion === null) return;
  if (opcion !== "1" && opcion !== "2") {
    alert("Selecciona 1 o 2.");
    return;
  }

  const entrada = prompt("Cantidad en dólares:");
  if (entrada === null) return;
  const monto = Number(entrada);

  if (!entrada.trim() || !Number.isFinite(monto) || monto <= 0) {
    alert("Introduce una cantidad válida.");
    return;
  }

  const saldoActual = Number(cuenta.saldo) || 0;

  if (opcion === "2" && monto > saldoActual) {
    alert("Saldo insuficiente.");
    return;
  }

  cuenta.saldo = Math.round(
    (saldoActual + (opcion === "1" ? monto : -monto)) * 100
  ) / 100;

  if (!Array.isArray(cuenta.historial)) cuenta.historial = [];

  cuenta.historial.push({
    fecha: new Date().toISOString(),
    tipo: opcion === "1" ? "deposito" : "retiro",
    monto: monto
  });

  localStorage.setItem(clave, JSON.stringify(cuentas));
  go("inicio");
  alert("Operación realizada. Nuevo saldo: " + money(cuenta.saldo));
}

function abrirAmMenu() {
  document.getElementById("amMenu").classList.add("abierto");
  document.getElementById("amMenuFondo").classList.add("abierto");
}

function cerrarAmMenu() {
  document.getElementById("amMenu").classList.remove("abierto");
  document.getElementById("amMenuFondo").classList.remove("abierto");
}

let inicioDeslizamientoY = 0;

const barraAM = document.querySelector("nav");
const menuAM = document.getElementById("amMenu");

if (barraAM && menuAM) {
  barraAM.addEventListener("touchstart", e => {
    inicioDeslizamientoY = e.touches[0].clientY;
  }, { passive: true });

  barraAM.addEventListener("touchend", e => {
    const distancia = inicioDeslizamientoY -
      e.changedTouches[0].clientY;

    if (distancia > 45) abrirAmMenu();
  }, { passive: true });

  menuAM.addEventListener("touchstart", e => {
    inicioDeslizamientoY = e.touches[0].clientY;
  }, { passive: true });

  menuAM.addEventListener("touchend", e => {
    const distancia = e.changedTouches[0].clientY -
      inicioDeslizamientoY;

    if (distancia > 60) cerrarAmMenu();
  }, { passive: true });
}
const paginasAM = document.getElementById("amPaginas");
const indicadoresAM = document.querySelectorAll("#amIndicadores span");

if (paginasAM && indicadoresAM.length) {
  paginasAM.addEventListener("scroll", () => {
    const pagina = Math.round(
      paginasAM.scrollLeft / paginasAM.clientWidth
    );

    indicadoresAM.forEach((punto, i) => {
      punto.classList.toggle("activo", i === pagina);
    });
  }, { passive: true });
}
</script>
