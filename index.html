      content="default">

<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F7;color:#17212e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#F2F2F7;padding:24px 20px 10px;border-bottom:none}
.logo{font-size:1.4375rem;font-weight:300}
.sub{color:#84909d;font-size:0.8125rem;margin-top:5px}
main{padding:20px 16px 105px;max-width:650px;margin:auto}
h2{font-size:1.3125rem;margin:0 0 17px}
h3{margin:0 0 14px}
.card{background:white;border:1px solid transparent;border-radius:19px;padding:19px;margin-bottom:14px}
.label{font-size:0.8125rem;color:#7c8795}
.amount{font-size:2.125rem;font-weight:800;margin:9px 0}
.smallamount{font-size:1.5rem;font-weight:750;margin-top:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.green{color:#13865b}
.red{color:#d44d56}
.primary{background:#172b38;color:white;border:0;border-radius:13px;padding:14px 18px;font-size:15px;font-weight:650;width:100%}
.secondary{background:#e7f2f3;color:#147e86;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:650;width:100%;margin-top:12px}
input,select{width:100%;padding:13px;border:1px solid #dce2e7;border-radius:12px;font-size:16px;background:white;margin:7px 0 13px}
button{cursor:pointer}
/* Barra flotante Balance One */
nav {
  position: fixed;
  bottom: env(safe-area-inset-bottom);
  left: 28px;
  right: 28px;
  width: auto;
  padding: 5px 7px;
  border-radius: 999px;
  background: rgba(250,251,255,.82);
  border: 1px solid rgba(120,125,135,.25);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.95), 0 4px 14px rgba(0,0,0,.04);
  display: flex;
  gap: 3px;
  z-index: 100;
  backdrop-filter: blur(40px);
-webkit-backdrop-filter: blur(40px);
  transform: translateY(0);
  transition: transform 0.3s ease;
}

nav button {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #fff;
  padding: 7px 2px;
}

/* Burbuja ovalada visible para la pestaña seleccionada, en ambos temas. */
nav button.active {
  background: rgba(155,165,185,.26);
  box-shadow: inset 0 0 0 1px rgba(145,155,175,.12);
}

/* Barra adaptable a modo claro y oscuro */
@media (prefers-color-scheme: light) {
  nav {
    background: rgba(250,251,253,.78);
    border-color: rgba(120,125,135,.25);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.95),
      0 4px 14px rgba(0,0,0,.04);
  }

  nav button {
    color: #252525;
  }

  nav button.active {
    background: rgba(180,180,190,0.25);
    color: #252525;
    padding-left: 14px;
    padding-right: 14px;
    transform: scaleY(1);
  }
}

/* Alinear iconos y textos de la barra */
nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  font-size: 11px;
  white-space: nowrap;
}

/* Iconos monocromáticos, sin círculos de color ni sombras. */
nav button svg {
  display: block;
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  padding: 3px;
  border-radius: 0;
  background: none;
  color: inherit;
  stroke-width: 1.7;
  box-shadow: none;
}

nav button span {
  font-size: 10px;
  line-height: 1.2;
  font-weight: 500;
}
.item{border-bottom:1px solid #f0f1f3;padding:13px 0}
.item:last-child{border:0}
.note{font-size:0.75rem;color:#89939f;line-height:1.5}
/* Balance One: una única cápsula de notificaciones que se expande en sí misma. */
.avisos-fondo {
  position:fixed;
  inset:0;
  z-index:1010;
  background:rgba(17,23,36,.28);
  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
}
.avisos-ancla {position:relative;height:60px;margin:0 0 25px 3px}
.avisos-vencimiento {
  position:absolute;left:0;top:0;
  z-index:1;
  width:min(164px,52vw);
  max-width:100%;
  margin:0;
  border:1px solid rgba(175,183,195,.23);
  border-radius:30px;
  background:rgba(255,255,255,.94);
  color:#17212e;
  box-shadow:0 3px 12px rgba(20,30,50,.035);
  overflow:hidden;
  transition:width .28s ease,border-radius .28s ease,box-shadow .28s ease;
}
/* Si tampoco hace falta respaldo, la cápsula permanece como Todo al día. */
.avisos-vencimiento--vacio:not(.is-abierto) .aviso-vencimiento {justify-content:center}
.avisos-vencimiento--vacio:not(.is-abierto) .aviso-vencimiento-texto {
  flex:0 1 auto;text-align:center;
}
.aviso-lista--vacia {
  padding:18px 14px 22px;
  text-align:center;color:#84909e;font-size:.82rem;
}
html.tema-oscuro .aviso-lista--vacia {color:#b4becb}
.avisos-vencimiento.is-abierto {
  z-index:1011;
  width:min(385px,calc(100vw - 38px));
  border-radius:34px;
  background:rgba(255,255,255,.96);
  box-shadow:0 18px 42px rgba(14,20,36,.21);
}
.aviso-vencimiento {
  display:flex;align-items:center;gap:4px;width:100%;min-height:44px;
  padding:5px 7px;border:0;border-radius:inherit;
  background:transparent;box-shadow:none;
  color:inherit;font:inherit;text-align:left;
}
.aviso-vencimiento:focus-visible,
.aviso-detalle:focus-visible {outline:2px solid var(--balanceone-color,#ff7900);outline-offset:-3px}
.aviso-vencimiento-icono {
  display:grid;place-items:center;flex:0 0 28px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(135,145,160,.09);color:#ff7900;
  position:relative;overflow:hidden;
}
.aviso-vencimiento-icono img {position:absolute;inset:4px;width:20px;height:20px;border-radius:50%;object-fit:contain;opacity:0;transition:opacity .15s ease}
.aviso-icono-base {display:grid;place-items:center;width:100%;height:100%;font-weight:750;font-size:16px}
.aviso-icono-base--apple {color:#1d222a}
html.tema-oscuro .aviso-icono-base--apple {color:#fff}
.aviso-vencimiento-icono svg {width:19px;height:19px}
.aviso-vencimiento-icono--apple {background:transparent}
/* El grupo tiene ancho fijo: las miniaturas se superponen y nunca alargan la cápsula. */
.aviso-miniaturas {display:block;position:relative;flex:0 0 22px;width:22px;height:27px;margin-left:-10px;overflow:visible}
.aviso-miniaturas .aviso-miniatura {
  display:grid;place-items:center;position:absolute;left:0;top:3px;
  width:20px;height:20px;margin:0;border-radius:50%;border:0;
  background:transparent;color:#277cd7;overflow:hidden;
}
.aviso-miniaturas .aviso-miniatura:nth-child(2) {left:3px;top:5px;z-index:2}
.aviso-miniaturas .aviso-miniatura:nth-child(3) {left:6px;top:7px;z-index:3}
.aviso-miniaturas .aviso-miniatura:nth-child(4) {left:8px;top:8px;z-index:4}
.aviso-miniatura img {position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%;opacity:0}
.aviso-miniatura svg {width:13px;height:13px}
.aviso-miniatura--mas {font-size:9px;font-weight:700}
.aviso-vencimiento-texto {display:grid;gap:2px;flex:1;min-width:0}
.aviso-vencimiento-texto strong {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;font-weight:750}
.aviso-vencimiento-texto small {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8792a2;font-size:.65rem}
.aviso-vencimiento-flecha {
  position:relative;display:grid;place-items:center;flex:0 0 23px;
  width:23px;height:23px;border-radius:50%;
  background:rgba(145,153,166,.1);font-size:1.08rem;line-height:1;
}
.aviso-vencimiento-flecha::after {
  content:"";position:absolute;right:0;top:0;width:7px;height:7px;
  border:1px solid #fff;border-radius:50%;background:#ff7900;
}
.avisos-vencimiento.is-abierto .aviso-vencimiento-flecha::after {display:none}
.avisos-vencimiento.is-abierto .aviso-vencimiento {min-height:58px;gap:9px;padding:9px 12px}
/* Los logos aparecen solo en la cápsula cerrada; el encabezado abierto es texto limpio. */
.avisos-vencimiento.is-abierto .aviso-vencimiento > .aviso-vencimiento-icono {display:none}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto strong {font-size:.82rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto small {font-size:.72rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-flecha {flex-basis:29px;width:29px;height:29px;transform:rotate(90deg)}
 .avisos-abierto {display:none}
.avisos-vencimiento.is-abierto .avisos-cerrado {display:none}
.avisos-vencimiento.is-abierto .avisos-abierto {display:inline}
.avisos-vencimiento.is-abierto .aviso-miniaturas {display:none}
.aviso-detalles {max-height:0;opacity:0;visibility:hidden;overflow:hidden;pointer-events:none;
  transition:max-height .29s ease,opacity .20s ease,visibility .2s ease}
.avisos-vencimiento.is-abierto .aviso-detalles {
  max-height:min(62vh,510px);opacity:1;visibility:visible;pointer-events:auto;
}
.aviso-lista {overflow-y:auto;max-height:min(58vh,468px);padding:0 9px 11px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.aviso-detalle {
  width:100%;display:flex;align-items:center;gap:9px;
  padding:10px 9px;margin-top:7px;border:1px solid rgba(149,161,181,.12);
  border-radius:22px;background:rgba(147,158,176,.07);
  color:inherit;text-align:left;font:inherit;min-height:61px;
}
.aviso-detalle .aviso-vencimiento-icono {flex-basis:34px;width:34px;height:34px}
.aviso-detalle .aviso-vencimiento-icono img {width:25px;height:25px}
.aviso-detalle-datos {display:grid;gap:3px;min-width:0;flex:1}
.aviso-detalle-datos strong {font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aviso-detalle-datos small {font-size:.68rem;color:#84909e}
.aviso-detalle-importe {font-size:.75rem;font-weight:700;white-space:nowrap}
.aviso-detalle-chevron {color:#8792a2;font-size:19px}
html.tema-oscuro .avisos-vencimiento,
html.tema-oscuro .avisos-vencimiento.is-abierto {
  color:#f5f6f8;background:rgba(34,39,48,.97);
  border-color:rgba(225,230,240,.17);
}
html.tema-oscuro .aviso-vencimiento-icono {background:#353d49;color:#ff9a45}
html.tema-oscuro .aviso-vencimiento-icono--apple {background:#343b45}
html.tema-oscuro .aviso-miniatura {border:0;background:transparent}
html.tema-oscuro .aviso-vencimiento-texto small,
html.tema-oscuro .aviso-detalle-datos small {color:#b4becb}
html.tema-oscuro .aviso-vencimiento-flecha,
html.tema-oscuro .aviso-detalle {background:rgba(255,255,255,.075)}
html.tema-oscuro .aviso-detalle {border-color:rgba(255,255,255,.07)}
/* Balance One · modelo de ventana Liquid Glass aprobado.
   La forma cambia SOLO al expandir; la cápsula cerrada y los datos no se modifican.
   No se añade pestaña superior, tirador, adorno circular ni logos en el título. */
.avisos-vencimiento.is-abierto {
  width:min(350px,calc(100vw - 48px));
  border-radius:40px;
  border:1px solid rgba(255,255,255,.78);
  background:linear-gradient(150deg,rgba(248,249,253,.87),rgba(229,233,241,.79));
  backdrop-filter:blur(28px) saturate(145%);
  -webkit-backdrop-filter:blur(28px) saturate(145%);
  box-shadow:0 18px 46px rgba(15,24,43,.21),inset 0 1px 0 rgba(255,255,255,.8);
  padding:9px 9px 10px;
}
.avisos-vencimiento.is-abierto > .aviso-vencimiento {
  min-height:58px;
  padding:8px 12px 7px;
  border-radius:30px;
}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto strong {font-size:.87rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto small {font-size:.71rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-flecha {
  background:rgba(255,255,255,.73);
  border:1px solid rgba(255,255,255,.72);
}
.avisos-vencimiento.is-abierto .aviso-lista {padding:1px 4px 4px}
.avisos-vencimiento.is-abierto .aviso-detalle {
  min-height:59px;
  margin-top:6px;
  padding:8px 9px;
  border-radius:27px;
  border:1px solid rgba(255,255,255,.78);
  background:rgba(255,255,255,.64);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 5px rgba(50,65,92,.035);
}
html.tema-oscuro .avisos-vencimiento.is-abierto {
  background:linear-gradient(150deg,rgba(52,58,70,.91),rgba(31,36,47,.86));
  border-color:rgba(255,255,255,.18);
  box-shadow:0 18px 46px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
html.tema-oscuro .avisos-vencimiento.is-abierto .aviso-detalle {
  background:rgba(255,255,255,.095);
  border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
html.tema-oscuro .avisos-vencimiento.is-abierto .aviso-vencimiento-flecha {
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.12);
}
@media (max-width:359px) {
  .avisos-vencimiento.is-abierto {border-radius:37px;padding:8px}
  .avisos-vencimiento.is-abierto .aviso-detalle {border-radius:25px}
}
/* Ajustes → Notificaciones inteligentes · estilos locales, sin afectar Inicio. */
.ajuste-avisos .ajuste-avisos-card {border-radius:25px;padding:17px;margin-bottom:12px}
.ajuste-avisos .ajuste-avisos-card h3 {font-size:.94rem;margin:0 0 8px}
.ajuste-avisos .note {margin:0 0 13px;line-height:1.5}
.ajuste-avisos-dias {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ajuste-aviso-dia {border:1px solid rgba(145,155,170,.16);background:rgba(140,152,172,.08);
  border-radius:999px;padding:11px 3px;font:inherit;font-size:.78rem;font-weight:650;color:inherit}
.ajuste-aviso-dia.seleccionado {background:rgba(255,132,32,.13);border-color:rgba(255,132,32,.35);color:#b65d09}
.ajuste-aviso-dia:focus-visible,.ajuste-aviso-tipo:focus-visible {outline:2px solid #ff7900;outline-offset:3px}
.ajuste-aviso-tipo {width:100%;margin:0;padding:12px 0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;border:0;border-bottom:1px solid rgba(140,151,168,.11);background:transparent;font:inherit;color:inherit;text-align:left}
.ajuste-aviso-tipo:last-child {border-bottom:0;padding-bottom:1px}
.ajuste-aviso-tipo-info {display:grid;gap:4px;flex:1;min-width:0}
.ajuste-aviso-tipo-info strong {font-size:.84rem}
.ajuste-aviso-tipo-info small {font-size:.70rem;color:#8692a0}
.ajuste-aviso-switch {display:flex;align-items:center;width:44px;height:27px;border-radius:999px;padding:3px;flex:0 0 44px;
  background:rgba(134,142,154,.33);transition:background .16s ease}
.ajuste-aviso-switch > span {display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .16s ease}
.ajuste-aviso-switch.activo {background:#26ae79}
.ajuste-aviso-switch.activo > span {transform:translateX(17px)}
.ajuste-avisos .ajuste-aviso-ayuda {padding:4px 10px 18px;color:#8894a1}
html.tema-oscuro .ajuste-aviso-dia {border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.065)}
html.tema-oscuro .ajuste-aviso-dia.seleccionado {background:rgba(255,132,32,.18);color:#ffc58d;border-color:rgba(255,132,32,.44)}
html.tema-oscuro .ajuste-aviso-tipo {border-color:rgba(255,255,255,.09)}
html.tema-oscuro .ajuste-aviso-tipo-info small {color:#aab6c4}
/* Recordatorios pagados: acciones accesibles sin cambiar el tamaño de la barrita cerrada. */
/* Las acciones de pago viven en la misma fila: no aumentan la altura del aviso. */
.avisos-vencimiento.is-abierto .aviso-detalle {
  display:flex;align-items:center;gap:5px;min-height:59px;
}
.aviso-detalle-abrir {display:flex;align-items:center;gap:7px;flex:1;min-width:0;width:auto;padding:0;
  border:0;background:transparent;box-shadow:none;text-align:left;color:inherit;font:inherit}
.aviso-detalle-abrir .aviso-detalle-datos {flex:1;min-width:0}
.aviso-detalle-abrir .aviso-detalle-importe {font-size:.71rem}
.aviso-detalle-acciones {display:flex;align-items:center;justify-content:center;
  margin:0;flex:0 0 28px;min-width:28px}
.aviso-accion-pago {display:grid;place-items:center;width:28px;height:28px;padding:0;
  font:inherit;font-size:16px;font-weight:750;line-height:1;border-radius:50%;
  border:1px solid rgba(25,133,91,.17);color:#157d59;
  background:rgba(27,160,108,.095);cursor:pointer}
.aviso-accion--deshacer {color:#6e7887;border-color:rgba(125,135,153,.21);
  background:rgba(135,146,162,.10)}
.aviso-estado-registrado {font-size:16px;color:#157d59;font-weight:650}
.aviso-detalle--pagado {opacity:.83}
.aviso-pagados-titulo {font-size:.71rem;color:#658172;font-weight:750;
  margin:12px 8px 3px}
.aviso-nota-pagos {font-size:.64rem;line-height:1.4;color:#8895a5;
  margin:10px 8px 5px;text-align:center}
html.tema-oscuro .aviso-accion-pago,html.tema-oscuro .aviso-estado-registrado {color:#81d5ae}
/* El respaldo usa la misma fila compacta, sin botón de marcar como pagado. */
.aviso-detalle--respaldo .aviso-detalle-abrir {min-height:40px}
.aviso-detalle--respaldo .aviso-vencimiento-icono {color:#ee8c26}
html.tema-oscuro .aviso-detalle--respaldo .aviso-vencimiento-icono {color:#ffb86e}
html.tema-oscuro .aviso-accion--deshacer {color:#c2ccd8}
html.tema-oscuro .aviso-nota-pagos {color:#aab6c4}
.aviso-accion-pago:focus-visible,.aviso-detalle-abrir:focus-visible {
  outline:2px solid var(--balanceone-color,#ff7900);outline-offset:1px}
@media (prefers-reduced-motion:reduce) {
  .avisos-vencimiento,.aviso-detalles {transition:none}
}
.payment{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.hidden{display:none}

}

}

html.tema-oscuro .payment,
html.tema-oscuro .editbox,

/* Menú flotante Balance One */
#amMenuFondo {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  opacity: 0;
  visibility: hidden;
  transition: .3s;
  z-index: 9998;
}

#amMenu {
  position: fixed;
  left: 8px;
  right: 8px;
  bottom: max(6px, calc(env(safe-area-inset-bottom) - 8px));
  padding: 18px 10px 34px;
  border-radius: 48px;
  background: rgba(250,251,255,.82);
  color: #17212e;
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(120,125,135,.25);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.95),
    0 4px 14px rgba(0,0,0,.04);
  transform: translateY(120%);
  visibility: hidden;
  transition: transform .35s ease, visibility .35s;
  z-index: 9999;
height: auto;
max-height: calc(100vh - 48px - env(safe-area-inset-bottom));
max-height: calc(100dvh - 48px - env(safe-area-inset-bottom));
box-sizing: border-box;
overflow-y: auto;
overscroll-behavior: contain;
}

#amMenuTirador {
  width: 40px;
  height: 5px;
  border-radius: 20px;
  background: #868f9f;
  margin: 0 auto 14px;
}

#amMenu h3 {
  color: inherit;
  margin: 0 0 26px 16px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -.6px;
}

#amMenu button {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 13px 15px;
  min-height: 121px;
  border-radius: 999px;
  text-align: center;
  white-space: normal;
  color: #17212e;
  font-size: 14px;
  background: rgba(255,255,255,.56);
  border: 1px solid rgba(255,255,255,.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.84), 0 5px 16px rgba(40,54,82,.045);
}

#amMenu .amPagina {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 12px;
  row-gap: 14px;
  height: auto;
  align-content: start;
  box-sizing: border-box;
}

#amPaginas {
  display: flex;
  width: 100%;
  height: auto;
  overflow-x: hidden;
  overflow-y: hidden;
}

#amPaginas .amPagina {
  flex: 0 0 100%;
  width: 100%;
  height: auto;
}
#amPaginas .amPagina button.am-herramienta {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  transform: scale(.96);
  gap: 0;
  padding: 14px 18px 14px 22px;
  text-align: left;
}

#amPaginas .amPagina button svg {
  display: block;
  flex-shrink: 0;
}

#amMenu #amMenuCerrar {
  position: absolute;
  top: 15px;
  right: 20px;
  width: 34px;
  height: 34px;
  min-height: 34px;
  padding: 7px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  border: 1px solid rgba(255,255,255,.85);
  color: #111d32;
  box-shadow: 0 2px 7px rgba(31,43,66,.05);
}

.am-herramienta-icono {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 50%;
  color: inherit;
  background: transparent;
  box-shadow: none;
}
.am-herramienta-icono svg { width: 24px; height: 24px; }

.am-herramienta-flecha {
  position: absolute;
  top: 14px;
  right: 16px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #111d32;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(255,255,255,.96);
  box-shadow: 0 2px 7px rgba(24,42,69,.04);
}
.am-herramienta-flecha svg {width: 16px;height: 16px;}
.am-herramienta-flecha::before {
  content: "";
  width: 7px;
  height: 7px;
  border-top: 2.4px solid currentColor;
  border-right: 2.4px solid currentColor;
  transform: rotate(45deg);
  margin-left: -3px;
}

.am-herramienta-textos {
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
  margin-top: 8px;
  overflow-wrap: break-word;
}
.am-herramienta-titulo {
  color: #101d33;
  font-size: 11.8px;
  font-weight: 750;
  line-height: 1.15;
  letter-spacing: -.2px;
}
.am-herramienta-subtitulo {
  color: #7a879c;
  font-size: 10.8px;
  font-weight: 400;
  line-height: 1.19;
  margin-top: 3px;
  max-width: 140px;
}

@media (max-width: 360px) {
  #amPaginas .amPagina button.am-herramienta {padding-left: 16px;padding-right: 14px;}
  .am-herramienta-titulo {font-size: 10.8px;}
  .am-herramienta-subtitulo {font-size: 9.8px;}
}

/* Ordenar herramientas manteniendo pulsado: sin cambiar su aspecto habitual. */
#amPaginas .amPagina button {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#amPaginas .amPagina button.am-arrastrando {
  border-color: var(--balanceone-color,#ff7900);
  outline: 2px solid var(--balanceone-color,#ff7900);
  outline-offset: -3px;
  opacity: .72;
  pointer-events: none;
}

#amMenuTirador,
#amMenu h3 {
  grid-column: 1 / -1;
}

#amMenu.abierto {
  transform: translateY(0);
  visibility: visible;
}

/* En Safari, acercar el panel al borde visible sin cubrir la barra del navegador.
   Al abrir Balance One desde su icono, se conserva el margen del modo aplicación. */
@media (display-mode: browser) and (max-width: 600px) {
  #amMenu { bottom: 6px; }
}

#amMenuFondo.abierto {
  opacity: 1;
  visibility: visible;
}

  overflow:hidden;isolation:isolate;

  content:"";position:absolute;pointer-events:none;z-index:1;
  width:88px;height:163px;right:17%;top:0;
  border-radius:23px 23px 28px 28px;

const CLAVE_TARJETAS_INICIO = "balanceone-tarjetas-inicio";
function opcionesTarjetasInicio(diseno) {

    pagos:t("Suscripciones y próximos pagos","Subscriptions and upcoming payments")

    deudas:t("Mis deudas pendientes","Outstanding debts"), transacciones:t("Últimas transacciones","Recent transactions"),
    cuentas:t("Cuentas bancarias","Bank accounts"), tarjetas:t("Tarjetas de crédito","Credit cards"),
    vehiculos:t("Vehículos","Vehicles")

}

function preferenciasTarjetasInicio() {
  try {
    const valor = JSON.parse(localStorage.getItem(CLAVE_TARJETAS_INICIO));
    return valor && typeof valor === "object" && !Array.isArray(valor) ? valor : {};
  } catch { return {}; }
}

function ordenTarjetasInicio(diseno, preferencias) {
  const opciones = opcionesTarjetasInicio(diseno);
  const orden = new Map();
  for (const item of Array.isArray(preferencias) ? preferencias : []) {
    if (item && Object.hasOwn(opciones, item.clave) && typeof item.visible === "boolean" && !orden.has(item.clave)) {
      orden.set(item.clave, item.visible);
    }
  }
  for (const clave of Object.keys(opciones)) {
    if (!orden.has(clave)) orden.set(clave, true);
  }
  return [...orden].map(([clave,visible]) => ({clave,visible}));
}

function aplicarTarjetasInicio(diseno) {
  const preferencias = preferenciasTarjetasInicio()[diseno];
  if (!Array.isArray(preferencias)) return;
  const inicio = el().querySelector(diseno === "nuevo" ? ".inicio-nuevo" : ".inicio-adaptable");
  if (!inicio) return;
  const bloques = [...inicio.children].filter(nodo => nodo.hasAttribute("data-bloque-inicio"));
  for (const {clave,visible} of ordenTarjetasInicio(diseno, preferencias)) {
    for (const nodo of bloques.filter(nodo => nodo.dataset.bloqueInicio === clave)) {
      nodo.hidden = !visible;
      inicio.append(nodo);
    }
  }
}

  const ventana = crearVentanaApariencia(t("Tarjetas de Inicio","Home cards"), `
    <p class="note">${t("Elige qué tarjetas ves y en qué orden en el diseño de Inicio que usas ahora.", "Choose which cards you see and their order in your current Home layout.")}</p>
    <div class="bo047-orden"></div>
    <button type="button" class="secondary" data-restablecer>${t("Restablecer","Reset")}</button>
    <button type="button" class="cuenta-nueva-guardar" data-guardar>${t("Guardar tarjetas","Save cards")}</button>
  `, true);
  if (!ventana) return;
  const lista = ventana.querySelector(".bo047-orden");
  const dibujar = conectarOrdenInicio(lista, () => orden, item => opciones[item.clave],
    (item, i) => `<label><input type="checkbox" data-visible="${i}" ${item.visible ? "checked" : ""}> ${safe(opciones[item.clave])}</label>`);
  lista.onchange = event => {
    const item = orden[Number(event.target.dataset.visible)];
    if (item) item.visible = event.target.checked;
  };
  ventana.querySelector("[data-restablecer]").onclick = () => { orden = ordenTarjetasInicio(diseno); dibujar(); };
  ventana.querySelector("[data-guardar]").onclick = () => {
    try {
      localStorage.setItem(CLAVE_TARJETAS_INICIO, JSON.stringify({...preferenciasTarjetasInicio(), [diseno]:orden}));
      cerrarVentanaApariencia(ventana);
    } catch { alert(t("No se pudieron guardar las tarjetas.", "Could not save the cards.")); }
  };
  dibujar();

function conectarOrdenInicio(lista, obtenerOrden, nombre, contenidoFila) {
  const t = textoApp;
  const dibujar = () => {
    const orden = obtenerOrden();
    lista.innerHTML = orden.map((item, i) => `
      <div class="bo047-orden-fila">
        ${contenidoFila(item, i)}
        <button type="button" data-pos="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="${t("Subir","Move up")} ${safe(nombre(item))}">↑</button>
        <button type="button" data-pos="${i}" data-dir="1" ${i === orden.length - 1 ? "disabled" : ""} aria-label="${t("Bajar","Move down")} ${safe(nombre(item))}">↓</button>
      </div>`).join("");
  };
  lista.onclick = event => {
    const boton = event.target.closest("[data-pos]");
    if (!boton || boton.disabled) return;
    const orden = obtenerOrden();
    const i = Number(boton.dataset.pos);
    const siguiente = i + Number(boton.dataset.dir);
    [orden[i], orden[siguiente]] = [orden[siguiente], orden[i]];
    dibujar();
    const destino = lista.querySelector(`[data-pos="${siguiente}"][data-dir="${boton.dataset.dir}"]`);
    (destino.disabled ? destino.parentElement.querySelector("input, button:not(:disabled)") : destino)?.focus();
  };
  return dibujar;
}

function reciboValido(recibo) {
  return typeof recibo === "string" && recibo.length <= 180000 &&
    /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(recibo);
}

async function comprimirRecibo(archivo) {
  if (archivo.size > 20 * 1024 * 1024 || (archivo.type && !archivo.type.startsWith("image/"))) throw new Error();
  const url = URL.createObjectURL(archivo);
  try {
    const foto = new Image();
    foto.src = url;
    await foto.decode();
    const lienzo = document.createElement("canvas");
    const contexto = lienzo.getContext("2d");
    for (const maximo of [1200, 960, 720, 540]) {
      const escala = Math.min(1, maximo / Math.max(foto.naturalWidth, foto.naturalHeight));
      lienzo.width = Math.max(1, Math.round(foto.naturalWidth * escala));
      lienzo.height = Math.max(1, Math.round(foto.naturalHeight * escala));
      contexto.fillStyle = "#fff";
      contexto.fillRect(0,0,lienzo.width,lienzo.height);
      contexto.drawImage(foto,0,0,lienzo.width,lienzo.height);
      for (const calidad of [.82, .66, .50]) {
        const recibo = lienzo.toDataURL("image/jpeg", calidad);
        if (reciboValido(recibo)) return recibo;
      }
    }
    throw new Error();
  } finally { URL.revokeObjectURL(url); }
}

    </div>

}

async function leerExtrasMovimiento(campos, tipo, anterior) {
  const proyecto = String(campos.get("proyecto") || "").trim().slice(0,60);
  const archivo = campos.get("recibo");
  let recibo = !campos.has("quitarRecibo") && reciboValido(anterior?.recibo) ? anterior.recibo : "";
  if (tipo === "gasto" && archivo?.size) recibo = await comprimirRecibo(archivo);
  return {proyecto, recibo};
}

  selector.value = valor;
}

      <summary>${t("Gastos favoritos","Favorite expenses")}</summary>

        <button type="button" data-quitar="${i}" aria-label="${t("Quitar favorito","Remove favorite")} ${safe(f.nombre)}">×</button>
      </div>`).join("")}</div>`;
  };
  panel.open = false;
  panel.onclick = event => {
    const boton = event.target.closest("[data-usar], [data-quitar]");
    if (!boton) return;
    const favoritos = favoritosGasto();
    const favorito = favoritos[Number(boton.dataset.usar ?? boton.dataset.quitar)];
    if (!favorito) return;
    if (boton.hasAttribute("data-quitar")) {
      if (guardarDatosExtra({favoritosGasto:favoritos.filter(f => f !== favorito)})) actualizar();

    nombre.value = favorito.nombre;
    aplicarCategoriaBorrador(categoria, favorito.categoria);
    cuentaId.value = favorito.origen || "";
    actualizarSelectorCategoria();
    actualizarSugerencia();
    panel.open = false;
  };
  actualizar();
  return actualizar;
}

const MONEDAS_IMPORTES = Object.freeze({USD:"$", EUR:"€"});
const FORMATOS_IMPORTES = Object.freeze(["en-US", "es-ES"]);

function monedaActual() {
  const moneda = localStorage.getItem(CLAVE_MONEDA_IMPORTES);
  return Object.hasOwn(MONEDAS_IMPORTES, moneda) ? moneda : "USD";
}

function formatoImportesActual() {
  const formato = localStorage.getItem(CLAVE_FORMATO_IMPORTES);
  return FORMATOS_IMPORTES.includes(formato) ? formato : "en-US";
}

function formateadorImportes(decimales = 2) {
  return new Intl.NumberFormat(formatoImportesActual(), {
    style:"currency",
    currency:monedaActual(),
    useGrouping:true,
    minimumFractionDigits:decimales,
    maximumFractionDigits:decimales
  });
}

function textoImporte(es, en) {
  return textoApp(es, en) + " (" + MONEDAS_IMPORTES[monedaActual()] + ")";
}

const money = n => ocultarImportesAlDibujarInicio
  ? "••••" : formateadorImportes().format(Number(n) || 0);

function formatearBorradorImporte(importe) {
  if (!importe) return money(0);
  const decimales = importe.split(".")[1];
  if (decimales === "") {
    return formateadorImportes(1).formatToParts(Number(importe))
      .filter(parte => parte.type !== "fraction").map(parte => parte.value).join("");
  }
  return formateadorImportes(decimales?.length ?? 0).format(Number(importe));
}

function validAmount(n){
 return Number.isFinite(n)&&n>0;
}

function validDate(s){
 if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
 const fecha=new Date(s+"T12:00:00Z");
 return !Number.isNaN(fecha.getTime())&&
   fecha.toISOString().slice(0,10)===s;
}

function diasParaVencer(dia){
const hoy=new Date();
hoy.setHours(0,0,0,0);

let fecha=new Date(
hoy.getFullYear(),
hoy.getMonth(),
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+1,0
).getDate())
);

if(fecha<hoy){
fecha=new Date(
hoy.getFullYear(),
hoy.getMonth()+1,
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+2,0
).getDate())
);
}

return Math.round((fecha-hoy)/86400000);
}

function claveAviso(tipo, identificador, fecha) {
  return `${tipo}:${String(identificador)}:${fecha}`;
}
function fechaLocalAviso(fecha) {
  return `${fecha.getFullYear()}-${String(fecha.getMonth()+1).padStart(2,"0")}-${String(fecha.getDate()).padStart(2,"0")}`;
}
function siguienteFechaAviso(faltan) {
  const fecha = new Date();
  fecha.setHours(12,0,0,0);
  fecha.setDate(fecha.getDate()+faltan);
  return fechaLocalAviso(fecha);
}
function recordatoriosMarcados() {
  return Array.isArray(data.recordatoriosPagados) ? data.recordatoriosPagados : [];
}
function registradoEnPeriodo(tipo, cuentaId, fecha, importe) {
  if (!Number.isFinite(importe) || importe <= 0) return false;
  const mes = fecha.slice(0,7);
  const abonado = (Array.isArray(data.pagos) ? data.pagos : [])
    .filter(p => p.tipo === tipo && String(p.cuentaId) === String(cuentaId) &&
      validDate(String(p.fecha)) && p.fecha.slice(0,7) === mes)
    .reduce((total,p) => total + (Number(p.monto)>0 ? Number(p.monto) : 0),0);
  return round(abonado) >= round(importe) - 0.005;
}

const OPCIONES_DIAS_AVISOS = [1,3,5,7,10,15];
const TIPOS_AVISOS = ["tarjeta","vehiculo","prestamo","suscripcion"];
function preferenciasAvisos() {
  const anteriores = data.preferenciasAvisos && typeof data.preferenciasAvisos === "object"
    ? data.preferenciasAvisos : {};
  const dias = Number(anteriores.dias);
  const tipos = anteriores.tipos && typeof anteriores.tipos === "object"
    ? anteriores.tipos : {};
  return {
    dias: OPCIONES_DIAS_AVISOS.includes(dias) ? dias : 7,
    tipos: Object.fromEntries(TIPOS_AVISOS.map(tipo=>[tipo,tipos[tipo] !== false]))
  };
}
function guardarPreferenciasAvisos(cambios) {
  const anteriores = preferenciasAvisos();
  const siguientes = {...anteriores,...cambios,
    tipos:{...anteriores.tipos,...(cambios.tipos || {})}};
  if (!OPCIONES_DIAS_AVISOS.includes(siguientes.dias)) return;
  const nuevosDatos = {...data, preferenciasAvisos:siguientes};
  try {
    localStorage.setItem(KEY,JSON.stringify(nuevosDatos));
  } catch(e) {
    alert(textoApp("No se pudieron guardar las notificaciones. Inténtalo de nuevo.",
      "Could not save notification settings. Please try again."));
    return;
  }
  data=nuevosDatos;
  abrirAjuste("avisos");
}
function cambiarDiasAvisos(dias) {

function datosAvisosVencimiento(incluirPagados = false) {
  const preferencias = preferenciasAvisos();
  const marcados = new Set(recordatoriosMarcados().map(r => r.clave));
  const cobros = [
    ...data.tarjetas.map(t => {
      const faltan = diasParaVencer(Number(t.vencimiento));
      const valido = Number.isInteger(Number(t.vencimiento)) && Number(t.vencimiento)>=1 && Number(t.vencimiento)<=31;
      const fecha = valido ? siguienteFechaAviso(faltan) : "";
      const importe = Number(t.pagoMinimo)>0 ? Number(t.pagoMinimo) : null;
      return {
        nombre:String(t.nombre || t.modelo || t.banco || textoApp("Tarjeta", "Card")),
        banco:String(t.banco || ""), tipoAviso:"tarjeta", identificador:t.id,
        faltan, valido, fecha, importe, destino:"tarjetas",
        clave:claveAviso("tarjeta",t.id,fecha),
        pagoRegistrado:registradoEnPeriodo("tarjeta",t.id,fecha,importe)
      };
    }),
    ...data.vehiculos.map(v => {
      const faltan = diasParaVencer(Number(v.vencimiento));
      const valido = Number.isInteger(Number(v.vencimiento)) && Number(v.vencimiento)>=1 && Number(v.vencimiento)<=31;
      const fecha = valido ? siguienteFechaAviso(faltan) : "";
      const importe = Number(v.pago)>0 ? Number(v.pago) : null;
      return {
        nombre:String(v.nombre || v.modelo || textoApp("Vehículo", "Vehicle")),
        tipoAviso:"vehiculo", identificador:v.id,
        marcaNombre:[v.marca,v.nombre,v.modelo].filter(Boolean).join(" "),
        faltan, valido, fecha, importe, destino:"vehiculos",
        clave:claveAviso("vehiculo",v.id,fecha),
        pagoRegistrado:registradoEnPeriodo("vehiculo",v.id,fecha,importe)
      };
    })
  ].filter(c => c.valido && c.faltan >= 0 && c.faltan <= preferencias.dias);

  // Las suscripciones se muestran como cobros previstos, no cargos confirmados.
  const hoy = today();
  const comienzo = new Date(hoy + "T12:00:00");
  for (let i=0;i<2;i++) {
    const mes = new Date(comienzo.getFullYear(),comienzo.getMonth()+i,1);
    const clave = `${mes.getFullYear()}-${String(mes.getMonth()+1).padStart(2,"0")}`;
    for(const s of suscripcionesDelMes(clave)) {
      const fecha = new Date(s.fecha + "T12:00:00");
      const faltan = Math.round((fecha-comienzo)/86400000);
      if(faltan < 0 || faltan > preferencias.dias) continue;
      // Los registros nuevos poseen id; la clave alternativa preserva los antiguos.
      const identificador = s.id || `${s.nombre}|${s.inicio}|${s.frecuencia}|${s.categoria||""}`;
      cobros.push({
        nombre:String(s.nombre || textoApp("Suscripción", "Subscription")),
        tipoAviso:"suscripcion", identificador, faltan, fecha:s.fecha,
        importe:Number(s.monto)>0?Number(s.monto):null, destino:"suscripciones",
        clave:claveAviso("suscripcion",identificador,s.fecha), pagoRegistrado:false
      });
    }
  }
  // Las cuotas de préstamos utilizan su calendario existente; no se crean cargos nuevos.
  if (preferencias.tipos.prestamo) {
    for (let i=0;i<2;i++) {
      const mes = new Date(comienzo.getFullYear(),comienzo.getMonth()+i,1);
      const periodo = `${mes.getFullYear()}-${String(mes.getMonth()+1).padStart(2,"0")}`;
      for (const cuota of prestamosDelMes(periodo)) {
        if (!validDate(String(cuota.fecha))) continue;
        const fecha = new Date(cuota.fecha+"T12:00:00");
        const faltan = Math.round((fecha-comienzo)/86400000);
        if (faltan < 0 || faltan > preferencias.dias) continue;
        const importe = Number(cuota.monto)>0 ? Number(cuota.monto) : null;
        const registrado = Number(cuota.importePagado)||0;
        cobros.push({
          nombre:String(cuota.nombre || textoApp("Préstamo", "Loan")),
          tipoAviso:"prestamo", identificador:cuota.id, faltan, fecha:cuota.fecha,
          importe,destino:"pagosPendientes",
          clave:claveAviso("prestamo",cuota.id,cuota.fecha),
          pagoRegistrado:Boolean(cuota.pagada) || (importe!==null && registrado>=importe-0.005)
        });
      }
    }
  }
  const todos = cobros.filter(c => preferencias.tipos[c.tipoAviso]).map(c => ({
    ...c, marcado:marcados.has(c.clave),
    pagado:marcados.has(c.clave) || c.pagoRegistrado
  })).sort((a,b) => a.faltan-b.faltan || a.nombre.localeCompare(b.nombre));
  return incluirPagados ? todos : todos.filter(c=>!c.pagado);
}
function guardarEstadoRecordatorio(clave, pagado) {
  const disponible = datosAvisosVencimiento(true).find(c=>c.clave===clave);
  if (!disponible || (disponible.pagoRegistrado && !pagado)) return;
  const anterior = recordatoriosMarcados();
  if (pagado && anterior.some(r=>r.clave===clave)) return;
  if (!pagado && !anterior.some(r=>r.clave===clave)) return;
  if (pagado && !confirm(textoApp(
    `¿Marcar «${disponible.nombre}» como pagado?\n\nEsto solo confirma el recordatorio. No registra un pago ni modifica saldos.`,
    `Mark “${disponible.nombre}” as paid?\n\nThis only confirms the reminder. No payment is recorded and balances will not change.`
  ))) return;
  const nuevos = pagado
    ? [...anterior,{clave,fechaMarcado:today()}]
    : anterior.filter(r=>r.clave!==clave);
  const nuevosDatos = {...data,recordatoriosPagados:nuevos};
  try {
    localStorage.setItem(KEY,JSON.stringify(nuevosDatos));
  } catch(e) {
    alert(textoApp("No se pudo guardar el recordatorio. No se hicieron cambios.",
      "Could not save this reminder. No changes were made."));
    return;
  }
  data=nuevosDatos;
  if(page==="inicio") {
    // Conservar la ventana abierta después de marcar o deshacer.
    render();
    abrirPanelAvisos();
  }
}
function marcarAvisoPagado(clave) { guardarEstadoRecordatorio(clave,true); }
function deshacerAvisoPagado(clave) { guardarEstadoRecordatorio(clave,false); }

function abrirPanelAvisos() {
  const panel = document.getElementById("avisosUnificados");
  if (!panel) return;
  const abierto = !panel.classList.contains("is-abierto");
  panel.classList.toggle("is-abierto",abierto);
  panel.querySelector(".aviso-vencimiento")?.setAttribute("aria-expanded",String(abierto));
  panel.querySelector(".aviso-detalles")?.setAttribute("aria-hidden",String(!abierto));
  const fondo=document.getElementById("avisosFondo");
  if(fondo) fondo.hidden=!abierto;
  document.body.style.overflow=abierto?"hidden":"";

function cerrarPanelAvisos() {
  const panel=document.getElementById("avisosUnificados");
  if(panel?.classList.contains("is-abierto")) abrirPanelAvisos();

}
function irDesdeAviso(destino) {

}

let fechaUltimaRevisionAvisos = today();
function refrescarAvisosAlReanudar() {
  const fechaActual = today();
  if (fechaActual === fechaUltimaRevisionAvisos) return;
  fechaUltimaRevisionAvisos = fechaActual;
  if (page !== "inicio") return;
  cerrarPanelAvisos();

}

function pagoCuentaComoGasto(pago) {
  // Abonar una tarjeta liquida deuda: la compra ya se registra como gasto.
  return pago.tipo !== "tarjeta";
}
function movimientoVistaPago(pago) {
  return {...pago, tipoPago:pago.tipo,
    tipo:pagoCuentaComoGasto(pago) ? "gasto" : "pago-tarjeta",
    esPago:true, pagoTarjeta:pago.tipo === "tarjeta",
    nombre:textoApp("Pago: ","Payment: ")+pago.nombre};
}

const aliasCategoriasGasto = new Map([
  ["rent", "renta"], ["alquiler", "renta"],
  ["supermercados", "supermercado"], ["groceries", "supermercado"],
  ["restaurante", "restaurantes"], ["restaurants", "restaurantes"],
  ["food", "alimentacion"], ["transport", "transporte"],
  ["shopping", "compras"], ["home", "hogar"], ["health", "salud"],
  ["work", "trabajo"], ["fuel", "gasolina"], ["utilities", "servicios"],
  ["entertainment", "entretenimiento"], ["insurance", "seguros"],
  ["education", "educacion"], ["subscriptions", "suscripciones"], ["other", "otros"]
]);

function claveCategoriaGasto(valor) {
  const nombre = String(valor || "").normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  return aliasCategoriasGasto.get(nombre) || nombre || "otros";
}

function movimientosGastoDelMes(datos, mes) {
  const registros = [
    ...(datos.movimientos || []).filter(m => m.tipo === "gasto"),
    ...(datos.pagos || []).filter(pagoCuentaComoGasto)
  ];
  return registros.filter(registro => {
    const fecha = String(registro.fecha || "").slice(0,10);
    return fecha.slice(0,7) === mes && validDate(fecha) && validAmount(Number(registro.monto));
  });
}

function resumenCategoriasInicio(datos, mes, registros = movimientosGastoDelMes(datos, mes)) {
  const totales = new Map();
  for (const registro of registros) {
    const original = String(registro.categoria || "").trim();
    const clave = claveCategoriaGasto(original);
    const grupo = totales.get(clave) || {clave, nombre:original, centavos:0};
    grupo.centavos += Math.round(Number(registro.monto) * 100);
    totales.set(clave, grupo);
  }
  const totalCentavos = [...totales.values()].reduce((suma, c) => suma + c.centavos, 0);
  const ordenadas = [...totales.values()].filter(c => c.centavos > 0)
    .sort((a,b) => b.centavos - a.centavos || a.clave.localeCompare(b.clave));
  return {
    total:totalCentavos / 100,
    categorias:ordenadas.map(c => ({
      clave:c.clave, nombre:c.nombre, monto:c.centavos / 100,
      porcentaje:totalCentavos ? c.centavos / totalCentavos * 100 : 0
    }))
  };
}

function detallesCategoriasGasto(datos = data) {
  return {
    renta:[textoApp("Renta", "Rent"), "#28d873"],
    supermercado:[textoApp("Supermercado", "Groceries"), "#ffa20c"],
    restaurantes:[textoApp("Restaurantes", "Restaurants"), "#ae48f2"],
    alimentacion:[textoApp("Alimentación", "Food"), "#e6ad54"],
    transporte:[textoApp("Transporte", "Transport"), "#26a9f5"],
    compras:[textoApp("Compras", "Shopping"), "#d58cc4"],
    hogar:[textoApp("Hogar", "Home"), "#8caa75"],
    salud:[textoApp("Salud", "Health"), "#e18b94"],
    trabajo:[textoApp("Trabajo", "Work"), "#7f91b0"],
    gasolina:[textoApp("Gasolina", "Fuel"), "#679cad"],
    servicios:[textoApp("Servicios", "Utilities"), "#c4a45f"],
    entretenimiento:[textoApp("Entretenimiento", "Entertainment"), "#b783bc"],
    seguros:[textoApp("Seguros", "Insurance"), "#739e86"],
    educacion:[textoApp("Educación", "Education"), "#b89b7e"],
    suscripciones:[textoApp("Suscripciones", "Subscriptions"), "#838cc6"],
    otros:[textoApp("Otros", "Other"), "#a8b1c0"],
    ...Object.fromEntries(categoriasPersonales(datos).map((c,i) =>
      [c.id, [c.nombre, ["#557adb", "#309688", "#ba65a0", "#be7740", "#8872c1"][i % 5]]]))
  };
}

function presupuestosValidos(lista, datos = data) {
  if (!Array.isArray(lista)) return false;
  const categorias = detallesCategoriasGasto(datos);
  const claves = new Set();
  return lista.every(p => {
    if (!p || typeof p.categoria !== "string" || !Object.hasOwn(categorias, p.categoria) ||
        !Number.isSafeInteger(p.limiteCentavos) || p.limiteCentavos < 1 || claves.has(p.categoria)) return false;
    claves.add(p.categoria);
    return true;
  });
}

function resumenPresupuestos(datos, mes) {
  const lista = datos.presupuestos ?? [];
  if (!presupuestosValidos(lista, datos)) return [];
  const gastado = new Map(resumenCategoriasInicio(datos, mes).categorias
    .map(c => [c.clave, Math.round(c.monto * 100)]));
  return lista.map(p => {
    const usado = gastado.get(p.categoria) || 0;
    const disponible = p.limiteCentavos - usado;
    const porcentaje = usado / p.limiteCentavos * 100;
    const estado = disponible < 0 ? "excedido" : disponible === 0 ? "limite" : porcentaje >= 80 ? "cerca" : "normal";
    return {...p, usado, disponible, porcentaje, estado};
  });
}

const LIMITE_PRESUPUESTOS_INICIO = 3;

function presupuestosPorPrioridad() {
  return resumenPresupuestos(data,month()).sort((a,b) => b.porcentaje - a.porcentaje);
}

function filasPresupuestos(lista) {
  const detalles = detallesCategoriasGasto();
  const estados = {
    normal:"",
    cerca:textoApp("Ya usaste el 80 % o más", "80% or more used"),
    limite:textoApp("Límite alcanzado", "Limit reached"),
    excedido:textoApp("Límite superado", "Over budget")
  };
  return lista.map(p => {
      const [nombre, color] = detalles[p.categoria];
      const usado = money(p.usado / 100);
      const limite = money(p.limiteCentavos / 100);
      const diferencia = money(Math.abs(p.disponible) / 100);
      const saldo = p.disponible < 0 ? textoApp(`${diferencia} de más`, `${diferencia} over`) : textoApp(`${diferencia} disponibles`, `${diferencia} left`);
      const colorBarra = p.estado === "cerca" ? "#ff7900" : p.estado === "normal" ? color : "#d44d56";
      return `<article class="presupuestos-fila" data-estado="${p.estado}">
        <div class="presupuestos-fila-cabecera">
          <strong>${safe(nombre)}</strong>
          <button type="button" aria-label="${safe(textoApp(`Editar presupuesto de ${nombre}`, `Edit ${nombre} budget`))}" onclick="abrirPresupuesto('${p.categoria}')">${textoApp("Editar", "Edit")}</button>
        </div>
        <div class="presupuestos-importes"><span>${usado} <small>${textoApp("de", "of")} ${limite}</small></span><small>${Math.floor(p.porcentaje)} %</small></div>
        <div aria-hidden="true">${barraProgreso(p.porcentaje, colorBarra)}</div>
        <div class="presupuestos-pie"><span>${saldo}</span>${estados[p.estado] ? `<span class="presupuestos-estado">${estados[p.estado]}</span>` : ""}</div>
      </article>`;
    }).join("");
}

function widgetPresupuestos() {
  const lista = presupuestosPorPrioridad();

      ${lista.length < Object.keys(detallesCategoriasGasto()).length ? `<button type="button" class="presupuestos-agregar" onclick="abrirPresupuesto()">+ ${textoApp("Agregar", "Add")}</button>` : ""}

function abrirListaPresupuestos() {
  const lista = presupuestosPorPrioridad();

    <p class="label presupuestos-mes">${safe(etiquetaMesComparacion(month()))}</p>

      ${filasPresupuestos(lista) || `<p class="note">${textoApp("Todavía no hay presupuestos.", "No budgets yet.")}</p>`}
    </div>`, true);

function abrirPresupuesto(categoria = "", volverALista = false) {
  const listaAbierta = document.querySelector("dialog.presupuestos-dialogo[open]");
  if (listaAbierta) {
    listaAbierta.addEventListener("close", () => abrirPresupuesto(categoria, true), {once:true});
    listaAbierta.close();
    return;
  }
  const lista = data.presupuestos ?? [];
  if (!presupuestosValidos(lista)) {
    alert(textoApp("No se pudieron leer los presupuestos.", "Could not read budgets."));
    return;
  }
  const actual = lista.find(p => p.categoria === categoria);
  if (categoria && !actual) return;
  const opciones = Object.entries(detallesCategoriasGasto()).filter(([clave]) =>
    clave === categoria || !lista.some(p => p.categoria === clave));
  if (!opciones.length) return;
  const ventana = crearVentanaApariencia(
    actual ? textoApp("Editar presupuesto", "Edit budget") : textoApp("Nuevo presupuesto", "New budget"),
    `<form class="cuenta-nueva-form">
      <label>${textoApp("Categoría", "Category")}<select name="categoria" required>
        ${actual ? "" : `<option value="">${textoApp("Elige una categoría", "Choose a category")}</option>`}
        ${opciones.map(([clave,[nombre]]) => `<option value="${safe(clave)}" ${clave === categoria ? "selected" : ""}>${safe(nombre)}</option>`).join("")}
      </select></label>
      <label>${textoImporte("Límite mensual", "Monthly limit")}<input name="limite" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" value="${actual ? (actual.limiteCentavos / 100).toFixed(2) : ""}" required></label>
      <p class="note">${textoApp("El límite se repite cada mes. La barra se actualiza con tus gastos registrados.", "The limit repeats every month. The bar updates with your recorded expenses.")}</p>
      <p class="cuenta-nueva-error" role="alert" data-presupuesto-error hidden></p>
      <button class="cuenta-nueva-guardar" type="submit">${textoApp("Guardar presupuesto", "Save budget")}</button>
      ${actual ? `<button class="presupuestos-eliminar" type="button" data-eliminar-presupuesto>${textoApp("Eliminar presupuesto", "Delete budget")}</button>` : ""}
    </form>`, true);
  if (!ventana) return;
  ventana.classList.add("cuenta-nueva");
  if (volverALista) ventana.addEventListener("close", abrirListaPresupuestos, {once:true});
  const form = ventana.querySelector("form");
  function guardar(eliminar) {
    if (form.dataset.guardado) return;
    let nuevos;
    try {
      const vigentes = data.presupuestos ?? [];
      let nuevaLista;
      if (eliminar) {
        nuevaLista = vigentes.filter(p => p.categoria !== categoria);
      } else {
        const presupuesto = {
          categoria:form.elements.categoria.value,
          limiteCentavos:centavosMeta(form.elements.limite.value)
        };
        nuevaLista = actual
          ? vigentes.map(p => p.categoria === categoria ? presupuesto : p)
          : [...vigentes, presupuesto];
      }
      if (!presupuestosValidos(nuevaLista)) throw new Error(textoApp("Elige una categoría sin presupuesto.", "Choose a category without a budget."));
      nuevos = {...data, presupuestos:nuevaLista};
      localStorage.setItem(KEY, JSON.stringify(nuevos));
    } catch (error) {
      const aviso = form.querySelector("[data-presupuesto-error]");
      aviso.textContent = error instanceof DOMException ? textoApp("No se pudo guardar el presupuesto.", "Could not save the budget.") : error.message;
      aviso.hidden = false;
      return;
    }
    data = nuevos;
    form.dataset.guardado = "si";
    ventana.close();
    render();
  }
  form.onsubmit = evento => {
    evento.preventDefault();
    if (form.reportValidity()) guardar(false);
  };
  const quitar = form.querySelector("[data-eliminar-presupuesto]");
  if (quitar) quitar.onclick = () => {
    if (confirm(textoApp("¿Eliminar este presupuesto mensual?", "Delete this monthly budget?"))) guardar(true);
  };
}

function graficoCategoriasInicio() {
  const resumen = resumenCategoriasInicio(data, month());
  const detalles = detallesCategoriasGasto();
  const detalle = categoria => Object.prototype.hasOwnProperty.call(detalles, categoria.clave)
    ? detalles[categoria.clave] : [categoria.nombre, "#9988bb"];
  let acumulado = 0;
  const segmentos = resumen.categorias.map((categoria, indice) => {
    const porcentaje = categoria.porcentaje;
    const separacion = resumen.categorias.length > 1 ? Math.min(4, porcentaje * .35) : 0;
    const desplazamiento = -(acumulado + separacion / 2);
    acumulado += porcentaje;
    const color = detalle(categoria)[1];
    return `<defs><linearGradient id="categoriaInicioGrad${indice}" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="${color}" stop-opacity=".7"/><stop offset="1" stop-color="${color}"/>
      </linearGradient></defs>
      <circle cx="50" cy="50" r="41" pathLength="100"
      fill="none" stroke="url(#categoriaInicioGrad${indice})" stroke-width="10"
      stroke-linecap="${porcentaje > 6 && separacion ? 'round' : 'butt'}"
      stroke-dasharray="${porcentaje - separacion} ${100 - porcentaje + separacion}"
      stroke-dashoffset="${desplazamiento}" transform="rotate(-90 50 50)"/>`;
  }).join("");
  const mes = new Date(month() + "-01T12:00:00").toLocaleDateString(
    idiomaActual() === "en" ? "en-US" : "es", {month:"long",year:"numeric"}

          aria-label="${safe(textoApp("Gastos del mes: ", "Monthly expenses: ") + money(resumen.total))}">
          <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(130,140,155,.13)" stroke-width="10"/>
          ${segmentos}
        </svg>
        <div class="inicio-categorias-total" aria-hidden="true">
          <strong>${money(resumen.total)}</strong>
          <span>${textoApp("Gastos", "Expenses")}</span>
          <small class="inicio-categorias-mes">${safe(mes)}</small>
        </div>
      </div>
      <div class="inicio-categorias-panel">
        <h4>${textoApp("Principales categorías", "Top categories")}</h4>
        <ul class="inicio-categorias-leyenda">
          ${resumen.categorias.slice(0,4).map(categoria => {
            const [nombre, color] = detalle(categoria);
            const iconoNombre = categoria.clave === "otros" ? "Otros" : categoria.nombre;
            return `<li style="--categoria-color:${color}">
              <span class="inicio-categoria-barra">

                <i class="inicio-categoria-icono" aria-hidden="true">${iconoCategoriaMovimiento(iconoNombre)}</i>
                <span class="inicio-categoria-nombre">${safe(nombre)}</span>
              </span>
              <strong>${money(categoria.monto)}</strong>
              <span class="inicio-categoria-porcentaje">${categoria.porcentaje.toFixed(1)}%</span>
            </li>`;
          }).join("")}
        </ul>
      </div>
    </div>
    <p class="inicio-categorias-nota">${resumen.total === 0
      ? textoApp("Todavía no hay gastos este mes.", "No expenses this month yet.")
      : textoApp("Las cuatro categorías con más gastos. El gráfico incluye todos los gastos y pagos del mes.", "Your four highest spending categories. The chart includes all expenses and payments this month.")}</p>`;
}

function mesComparacionDesplazado(mes, salto) {
  const [anio, numero] = mes.split("-").map(Number);
  const fecha = new Date(anio, numero - 1 + salto, 1, 12);
  return fecha.getFullYear() + "-" + String(fecha.getMonth() + 1).padStart(2,"0");
}

function etiquetaMesComparacion(mes, corto = false) {
  return new Date(mes + "-01T12:00:00").toLocaleDateString(
    idiomaActual() === "en" ? "en-US" : "es", {month:corto ? "short" : "long", year:"numeric"});
}

function resumenMesRegistrado(datos, mes) {
  const registros = movimientosGastoDelMes(datos, mes);
  const gastos = resumenCategoriasInicio(datos, mes, registros);
  const ingresosRegistrados = (datos.movimientos || []).filter(m => {
    const fecha = String(m.fecha || "").slice(0,10);
    return m.tipo === "ingreso" && fecha.slice(0,7) === mes && validDate(fecha) && validAmount(Number(m.monto));
  });
  const ingresos = ingresosRegistrados.reduce((suma,m) => suma + Math.round(Number(m.monto) * 100),0);
  const gastado = Math.round(gastos.total * 100);
  return {mes, ingresos, gastos:gastado, balance:ingresos - gastado, categorias:gastos.categorias, registros, ingresosRegistrados};
}

function compararMeses(datos, base, elegido) {
  const anterior = resumenMesRegistrado(datos,base);
  const actual = resumenMesRegistrado(datos,elegido);
  const categorias = new Map();
  for (const [lado, resumen] of [["anterior",anterior], ["actual",actual]]) {
    for (const c of resumen.categorias) {
      const fila = categorias.get(c.clave) || {clave:c.clave, nombre:c.nombre, anterior:0, actual:0};
      fila[lado] = Math.round(c.monto * 100);
      categorias.set(c.clave, fila);
    }
  }
  return {anterior, actual, categorias:[...categorias.values()]
    .map(c => ({...c, cambio:c.actual - c.anterior}))
    .sort((a,b) => Math.abs(b.cambio) - Math.abs(a.cambio) || a.clave.localeCompare(b.clave))};
}

function importeCambioMensual(centavos) {
  if (ocultarImportesAlDibujarInicio) return money(0);
  const signo = centavos > 0 ? "+" : centavos < 0 ? "−" : "";
  return signo + money(Math.abs(centavos) / 100);
}

function filasComparacionMensual() {
  return [["ingresos",textoApp("Ingresos","Income")], ["gastos",textoApp("Gastos y pagos","Expenses and payments")], ["balance",textoApp("Balance del mes","Monthly balance")]];
}

function vistaComparacionMensual() {
  const mes = month();
  const {anterior,actual} = compararMeses(data,mesComparacionDesplazado(mes,-1),mes);
  return `<div class="comparacion-resumen">
    <h4>${textoApp("Comparación mensual", "Monthly comparison")}</h4>
    <p class="note">${safe(etiquetaMesComparacion(actual.mes,true))} ${textoApp("en curso frente a", "in progress vs.")} ${safe(etiquetaMesComparacion(anterior.mes,true))}</p>
    <dl>${filasComparacionMensual().map(([clave,nombre]) => `<div><dt>${nombre}</dt><dd>${importeCambioMensual(actual[clave]-anterior[clave])}</dd></div>`).join("")}</dl>
    <button type="button" class="comparacion-enlace" onclick="abrirComparacionMensual()">${textoApp("Ver comparación", "View comparison")} ›</button>
  </div>`;
}

function detalleComparacionMensual(comparacion) {
  const {anterior,actual,categorias} = comparacion;
  const detalles = detallesCategoriasGasto();
  return `
    ${anterior.mes === month() || actual.mes === month() ? `<p class="note">${textoApp("El mes actual sigue en curso. Los importes reflejan los movimientos registrados.", "The current month is still in progress. Amounts reflect recorded transactions.")}</p>` : ""}
    <table class="comparacion-tabla">
      <thead><tr><th scope="col">${textoApp("Concepto", "Metric")}</th><th scope="col">${safe(etiquetaMesComparacion(anterior.mes,true))}</th><th scope="col">${safe(etiquetaMesComparacion(actual.mes,true))}</th><th scope="col">${textoApp("Cambio", "Change")}</th></tr></thead>
      <tbody>${filasComparacionMensual().map(([clave,nombre]) => `<tr><th scope="row">${nombre}</th><td>${money(anterior[clave]/100)}</td><td>${money(actual[clave]/100)}</td><td>${importeCambioMensual(actual[clave]-anterior[clave])}</td></tr>`).join("")}</tbody>
    </table>
    <h3>${textoApp("Cambios por categoría", "Changes by category")}</h3>
    ${categorias.map((c,i) => {
      const nombre = Object.hasOwn(detalles,c.clave) ? detalles[c.clave][0] : c.nombre || c.clave;
      return `<details class="comparacion-categoria" data-categoria-comparacion="${i}">
        <summary><strong>${safe(nombre)}</strong><span>${importeCambioMensual(c.cambio)}</span></summary>
        <div class="comparacion-categoria-totales"><span>${safe(etiquetaMesComparacion(anterior.mes,true))} · ${money(c.anterior/100)}</span><span>${safe(etiquetaMesComparacion(actual.mes,true))} · ${money(c.actual/100)}</span></div>
        <div data-comparacion-movimientos></div>
      </details>`;
    }).join("") || `<p class="note">${textoApp("No hay gastos registrados en estos meses.", "No expenses recorded in these months.")}</p>`}`;
}

function abrirComparacionMensual(seleccion = null) {
  const actual = month();
  const meses = new Set(Array.from({length:12},(_,i) => mesComparacionDesplazado(actual,-i)));
  for (const registro of [...data.movimientos,...data.pagos]) {
    const fecha = String(registro.fecha || "").slice(0,10);
    if (validDate(fecha)) meses.add(fecha.slice(0,7));
  }
  const baseInicial = meses.has(seleccion?.base) ? seleccion.base : mesComparacionDesplazado(actual,-1);
  const mesInicial = meses.has(seleccion?.elegido) ? seleccion.elegido : actual;
  const opciones = seleccionado => [...meses].sort().reverse().map(mes =>
    `<option value="${safe(mes)}" ${mes === seleccionado ? "selected" : ""}>${safe(etiquetaMesComparacion(mes))}</option>`).join("");
  const ventana = crearVentanaApariencia(textoApp("Comparación mensual", "Monthly comparison"), `
    <div class="cuenta-nueva-form comparacion-selectores">
      <label>${textoApp("Mes de referencia", "Reference month")}<select data-mes-base>${opciones(baseInicial)}</select></label>
      <label>${textoApp("Mes a comparar", "Comparison month")}<select data-mes-elegido>${opciones(mesInicial)}</select></label>
    </div>
    <button type="button" class="comparacion-enlace comparacion-ver-anio" data-ver-anio>${textoApp("Ver año", "View year")} ›</button>
    <div data-comparacion-detalle></div>`,true);
  if (!ventana) return;
  ventana.classList.add("comparacion-dialogo");
  const base = ventana.querySelector("[data-mes-base]");
  const elegido = ventana.querySelector("[data-mes-elegido]");
  const contenido = ventana.querySelector("[data-comparacion-detalle]");
  ventana.querySelector("[data-ver-anio]").onclick = () => {
    const regreso = {base:base.value,elegido:elegido.value};
    ventana.addEventListener("close", () => abrirResumenAnual(elegido.value.slice(0,4),regreso), {once:true});
    ventana.close();
  };
  function actualizar() {
    if (base.value === elegido.value) {
      contenido.innerHTML = `<p class="note" role="status">${textoApp("Elige dos meses distintos.", "Choose two different months.")}</p>`;
      return;
    }
    const comparacion = compararMeses(data,base.value,elegido.value);
    contenido.innerHTML = detalleComparacionMensual(comparacion);
    contenido.querySelectorAll("[data-categoria-comparacion]").forEach(fila => {
      fila.addEventListener("toggle", () => {
        if (!fila.open) return;
        const destino = fila.querySelector("[data-comparacion-movimientos]");
        if (destino.childElementCount) return;
        const categoria = comparacion.categorias[Number(fila.dataset.categoriaComparacion)].clave;
        destino.innerHTML = [comparacion.anterior,comparacion.actual].map(mes => {
          const registros = mes.registros.filter(m => claveCategoriaGasto(m.categoria) === categoria)
            .sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
          return `<section class="comparacion-movimientos">
            <h4>${safe(etiquetaMesComparacion(mes.mes))}</h4>
            ${registros.map(m => `<div><span>${safe(m.nombre || textoApp("Gasto", "Expense"))}<small>${safe(fechaMetaAhorro(String(m.fecha).slice(0,10)))}</small></span><strong>${money(Number(m.monto))}</strong></div>`).join("") || `<p class="note">${textoApp("Sin gastos en esta categoría.", "No expenses in this category.")}</p>`}
          </section>`;
        }).join("");
      });
    });
  }
  base.addEventListener("change",actualizar);
  elegido.addEventListener("change",actualizar);
  actualizar();
}

function resumenAnual(datos, anio) {
  const porMes = new Map(Array.from({length:12},(_,i) => [
    anio + "-" + String(i+1).padStart(2,"0"), {movimientos:[],pagos:[]}
  ]));
  for (const tipo of ["movimientos","pagos"]) {
    for (const registro of datos[tipo] || []) {
      porMes.get(String(registro.fecha || "").slice(0,7))?.[tipo].push(registro);
    }
  }
  const meses = Array.from(porMes, ([mes,grupo]) => resumenMesRegistrado(grupo,mes));
  const ingresos = meses.reduce((suma,mes) => suma + mes.ingresos,0);
  const gastos = meses.reduce((suma,mes) => suma + mes.gastos,0);
  const categorias = new Map();
  let mayorGasto = null;
  for (const mes of meses) {
    if (mes.gastos > (mayorGasto?.gastos || 0)) mayorGasto = mes;
    for (const c of mes.categorias) {
      const centavos = Math.round(c.monto * 100);
      const acumulado = categorias.get(c.clave) || {clave:c.clave,nombre:c.nombre,total:0,mesMayor:mes.mes,maximo:0};
      acumulado.total += centavos;
      if (centavos > acumulado.maximo) {
        acumulado.mesMayor = mes.mes;
        acumulado.maximo = centavos;
      }
      categorias.set(c.clave,acumulado);
    }
  }
  return {meses,ingresos,gastos,balance:ingresos-gastos,mayorGasto,
    categorias:[...categorias.values()].sort((a,b) => b.total-a.total || a.clave.localeCompare(b.clave))};
}

function totalesResumenAnual(resumen) {
  return `<dl class="anual-totales">${[
    ["ingresos",textoApp("Ingresos","Income")],
    ["gastos",textoApp("Gastos y pagos","Expenses and payments")],
    ["balance",textoApp("Balance","Balance")]
  ].map(([clave,nombre]) => `<div><dt>${nombre}</dt><dd>${money(resumen[clave]/100)}</dd></div>`).join("")}</dl>`;
}

function graficoResumenAnual(resumen) {
  const escala = Math.max(1,...resumen.meses.flatMap(m => [m.ingresos,m.gastos]));
  const abreviar = new Intl.DateTimeFormat(idiomaActual() === "en" ? "en-US" : "es",{month:"short"});
  return `
    <div class="anual-leyenda"><span>${textoApp("Ingresos","Income")}</span><span>${textoApp("Gastos y pagos","Expenses and payments")}</span></div>
    <div class="anual-grafico" role="group" aria-label="${textoApp("Ingresos y gastos por mes","Income and expenses by month")}">
      ${resumen.meses.map((m,i) => {
        const titulo = etiquetaMesComparacion(m.mes) + " · " +
          textoApp("Ingresos","Income") + " " + money(m.ingresos/100) + " · " +
          textoApp("Gastos y pagos","Expenses and payments") + " " + money(m.gastos/100);
        return `<button type="button" data-anual-mes="${i}" aria-pressed="false" aria-label="${safe(titulo)}" title="${safe(titulo)}">
          <span class="anual-barras" aria-hidden="true">
            <span style="height:${m.ingresos/escala*100}%"></span>
            <span style="height:${m.gastos/escala*100}%"></span>
          </span>
          <span>${safe(abreviar.format(new Date(m.mes + "-01T12:00:00")))}</span>
        </button>`;
      }).join("")}
    </div>`;
}

function filasCategoriasAnuales(categorias, anual = false) {
  const detalles = detallesCategoriasGasto();
  if (!categorias.length) return `<p class="note">${textoApp("Sin gastos registrados.","No recorded expenses.")}</p>`;
  return categorias.map(c => {
    const nombre = Object.hasOwn(detalles,c.clave) ? detalles[c.clave][0] : c.nombre || c.clave;
    const importe = anual ? c.total/100 : c.monto;
    return `<div class="anual-fila"><span><strong>${safe(nombre)}</strong>
      ${anual ? `<small>${textoApp("Mayor gasto en","Highest spending in")} ${safe(etiquetaMesComparacion(c.mesMayor,true))} · ${money(c.maximo/100)}</small>` : ""}
      </span><strong>${money(importe)}</strong></div>`;
  }).join("");
}

function abrirResumenAnual(anioInicial, regreso) {
  const actual = month().slice(0,4);
  const anios = new Set([actual,anioInicial]);
  for (const registro of [...data.movimientos,...data.pagos]) {
    const fecha = String(registro.fecha || "").slice(0,10);
    if (validDate(fecha)) anios.add(fecha.slice(0,4));
  }
  const ventana = crearVentanaApariencia(textoApp("Resumen anual","Annual summary"), `
    <div class="cuenta-nueva-form anual-selector">
      <label>${textoApp("Año","Year")}<select data-anual-anio>
        ${[...anios].sort().reverse().map(anio => `<option value="${safe(anio)}" ${anio === anioInicial ? "selected" : ""}>${safe(anio)}</option>`).join("")}
      </select></label>
    </div>
    <button type="button" class="comparacion-enlace" data-anual-volver>‹ ${textoApp("Comparación mensual","Monthly comparison")}</button>
    <div data-anual-contenido></div>`,true);
  if (!ventana) return;
  ventana.classList.add("anual-dialogo");
  const selector = ventana.querySelector("[data-anual-anio]");
  const contenido = ventana.querySelector("[data-anual-contenido]");
  ventana.querySelector("[data-anual-volver]").onclick = () => {
    ventana.addEventListener("close", () => abrirComparacionMensual(regreso),{once:true});
    ventana.close();
  };

  function dibujarAnio() {
    const resumen = resumenAnual(data,selector.value);
    const pico = resumen.mayorGasto;
    contenido.innerHTML = `
      ${totalesResumenAnual(resumen)}
      ${selector.value === actual ? `<p class="note">${textoApp("Año en curso · Movimientos registrados", "Year in progress · Recorded transactions")}</p>` : ""}
      <h3>${textoApp("Enero a diciembre","January to December")}</h3>
      ${graficoResumenAnual(resumen)}
      <p class="note">${pico ? textoApp("Mes con más gastos","Highest spending month") + " · " + safe(etiquetaMesComparacion(pico.mes)) + " · " + money(pico.gastos/100) : textoApp("Todavía no hay gastos registrados para este año.","No expenses recorded for this year yet.")}</p>
      <p class="note">${textoApp("Toca un mes para ver sus movimientos y categorías.","Tap a month to see its transactions and categories.")}</p>
      <section data-anual-detalle hidden></section>
      <h3>${textoApp("Gastos del año por categoría","Yearly expenses by category")}</h3>
      <div class="anual-filas">${filasCategoriasAnuales(resumen.categorias,true)}</div>`;
    const detalle = contenido.querySelector("[data-anual-detalle]");
    for (const boton of contenido.querySelectorAll("[data-anual-mes]")) {
      boton.onclick = () => {
        for (const b of contenido.querySelectorAll("[data-anual-mes]")) {
          b.setAttribute("aria-pressed",String(b === boton));
        }
        dibujarDetalleMesAnual(detalle,resumen.meses[Number(boton.dataset.anualMes)]);
      };
    }
  }
  selector.onchange = dibujarAnio;
  dibujarAnio();
}

function dibujarDetalleMesAnual(detalle,mes) {
  const movimientos = [...mes.ingresosRegistrados,...mes.registros].sort(ordenarMovimientosVista);
  detalle.hidden = false;
  detalle.innerHTML = `
    <h3 tabindex="-1">${safe(etiquetaMesComparacion(mes.mes))}</h3>
    ${totalesResumenAnual(mes)}
    <h4>${textoApp("Gastos por categoría","Expenses by category")}</h4>
    <div class="anual-filas">${filasCategoriasAnuales(mes.categorias)}</div>
    <h4>${textoApp("Movimientos del mes","Monthly transactions")}</h4>
    <div class="anual-filas" data-anual-movimientos>${movimientos.length ? "" : `<p class="note">${textoApp("Sin movimientos registrados.","No recorded transactions.")}</p>`}</div>
    <button type="button" class="comparacion-enlace" data-anual-ver-mas hidden>${textoApp("Ver más","Show more")}</button>`;
  const lista = detalle.querySelector("[data-anual-movimientos]");
  const verMas = detalle.querySelector("[data-anual-ver-mas]");
  let mostrados = 0;
  function mostrarBloque() {
    const bloque = movimientos.slice(mostrados,mostrados+TAMANO_PAGINA_HISTORIAL);
    lista.insertAdjacentHTML("beforeend",bloque.map(m => {
      const ingreso = m.tipo === "ingreso";
      return `<div class="anual-fila"><span><strong>${safe(m.nombre || textoApp("Movimiento","Transaction"))}</strong><small>${safe(fechaMetaAhorro(String(m.fecha).slice(0,10)))}</small></span>
        <strong>${ingreso ? "+" : "−"}${money(Number(m.monto))}</strong></div>`;
    }).join(""));
    mostrados += bloque.length;
    verMas.hidden = mostrados >= movimientos.length;
  }
  verMas.onclick = mostrarBloque;
  mostrarBloque();
  detalle.querySelector("h3").focus();
}

function cambiarVistaTransaccionesConTeclado(evento) {
  const carrusel = evento.currentTarget;
  if (evento.target !== carrusel || !["ArrowLeft","ArrowRight"].includes(evento.key) ||
      !carrusel.clientWidth || carrusel.scrollWidth <= carrusel.clientWidth) return;
  evento.preventDefault();
  const actual = Math.round(carrusel.scrollLeft / carrusel.clientWidth);
  irVistaTransacciones(actual + (evento.key === "ArrowRight" ? 1 : -1));
}

function actualizarIndicadoresTransacciones(carrusel) {
  if (!carrusel.clientWidth) return;
  const pagina = Math.round(carrusel.scrollLeft / carrusel.clientWidth);
  carrusel.closest(".inicio-transacciones").querySelectorAll("[data-vista-transacciones]")
    .forEach((boton, indice) => boton.setAttribute("aria-pressed", String(indice === pagina)));

function irVistaTransacciones(pagina) {

const CLAVE_DISENO_INICIO = "balanceone-diseno-inicio";

function disenoInicioActual() {
  try {
    return localStorage.getItem(CLAVE_DISENO_INICIO) === "nuevo"
      ? "nuevo" : "clasico";
  } catch {
    return "clasico";
  }
}

function etiquetaDisenoInicio() {
  return disenoInicioActual() === "nuevo" ? textoApp("Nuevo", "New") : textoApp("Clásico", "Classic");
}

function cambiarDisenoInicio(diseno) {
  if (!["clasico", "nuevo"].includes(diseno)) return;
  localStorage.setItem(CLAVE_DISENO_INICIO, diseno);
}

function inicioNuevo() {
  // Inicio independiente: el inicio clásico se conserva en inicio().
  const avisos = avisosVencimiento();
  let cuentas = [];
  try {
    cuentas = JSON.parse(localStorage.getItem("amfinance-cuentas-banco") || "[]");
    if (!Array.isArray(cuentas)) cuentas = [];
  } catch { cuentas = []; }

  const saldoCuentas = cuentas.reduce((total, cuenta) => {
    const saldo = Number(cuenta.saldo);
    return total + (Number.isFinite(saldo) ? saldo : 0);
  }, 0);
  const saldoTarjetas = data.tarjetas.reduce((total, tarjeta) => {
    const saldo = Number(tarjeta.saldo);
    return total + (Number.isFinite(saldo) ? saldo : 0);
  }, 0);

  const gastosMes = data.movimientos.filter(m =>
    m.tipo === "gasto" && String(m.fecha).slice(0,7) === month()
  );
  const categorias = new Map();
  for (const movimiento of gastosMes) {
    const monto = Number(movimiento.monto);
    if (!Number.isFinite(monto) || monto <= 0) continue;
    const categoria = String(nombreCategoriaPersonal(movimiento.categoria) || movimiento.categoria || textoApp("Otros", "Other"));
    categorias.set(categoria, (categorias.get(categoria) || 0) + monto);
  }
  const totalGastos = [...categorias.values()].reduce((suma, valor) => suma + valor, 0);
  const mayores = [...categorias].sort((a,b) => b[1] - a[1]);
  const segmentos = mayores.slice(0, 4);
  if (mayores.length > 4) {
    segmentos.push([textoApp("Otros", "Other"), mayores.slice(4).reduce((suma, c) => suma + c[1], 0)]);
  }
  const colores = ["#ff8059", "#a996f7", "#ffca8f", "#57d9a4", "#7795ef"];
  let porcentajeAcumulado = 0;
  const tramos = segmentos.map(([nombre, monto], i) => {
    const desde = porcentajeAcumulado;
    porcentajeAcumulado += monto / totalGastos * 100;
    return `${colores[i]} ${desde.toFixed(3)}% ${porcentajeAcumulado.toFixed(3)}%`;
  });
  const grafico = tramos.length
    ? `conic-gradient(${tramos.join(",")})`

function nombreOrigenPago(registro) {
  if (registro.esTransferencia) return registro.ruta;
  const tarjetaId = registro.fuenteTarjetaId || registro.tarjetaId;
  if (tarjetaId) {

  }
  return "";
}
function prepararPagoConOrigen(datos, cuentas, anterior, nuevo) {
  const copia = JSON.parse(JSON.stringify(datos));
  const bancos = JSON.parse(JSON.stringify(cuentas));
  if (!Array.isArray(bancos)) throw new Error(textoApp("Cuentas no válidas", "Invalid accounts"));
  const cambiosTarjeta = new Map();
  const sumarTarjeta = (ident, diferencia) => {
    const t = copia.tarjetas.find(t => String(t.id) === String(ident));
    if (!t) throw new Error(textoApp("Tarjeta no encontrada", "Card not found"));
    cambiosTarjeta.set(String(ident), round((cambiosTarjeta.get(String(ident)) || 0) + diferencia));
  };
  function aplicar(pago, signo) {
    if (!pago) return;
    if (!validAmount(Number(pago.monto)) || !validDate(String(pago.fecha)) || !["vehiculo", "tarjeta"].includes(pago.tipo)) throw new Error(textoApp("Pago no válido", "Invalid payment"));
    if (pago.bancoId && pago.fuenteTarjetaId) throw new Error(textoApp("Selecciona un solo origen", "Select one payment source"));
    const monto = round(Number(pago.monto));
    if (pago.fuenteTarjetaId) {
      if (pago.tipo === "tarjeta" && String(pago.fuenteTarjetaId) === String(pago.cuentaId)) throw new Error(textoApp("No puedes pagar una tarjeta con ella misma.", "A card cannot pay itself."));
      sumarTarjeta(pago.fuenteTarjetaId,signo * monto);
    } else if (pago.bancoId) {
      const banco = bancos.find(b => String(b.id) === String(pago.bancoId));
      if (!banco) throw new Error(textoApp("Cuenta bancaria no encontrada", "Bank account not found"));
      banco.saldo = round(Number(banco.saldo) - signo * monto);
    } else throw new Error(textoApp("Selecciona el origen del pago", "Select the payment source"));
    if (pago.tipo === "tarjeta") sumarTarjeta(pago.cuentaId, -signo * monto);
    else {
      const auto = copia.vehiculos.find(v => String(v.id) === String(pago.cuentaId));
      const capital = Number(pago.capital), interes = Number(pago.interes);
      if (!auto || !validAmount(capital) || !Number.isFinite(interes) || interes < 0 || Math.abs(round(capital + interes) - monto) > .001) throw new Error(textoApp("Capital o intereses no válidos", "Invalid principal or interest"));
      auto.saldo = round(Number(auto.saldo) - signo * capital);
    }
  }
  aplicar(anterior,-1);aplicar(nuevo,1);
  for (const cuenta of bancos) if (!Number.isFinite(Number(cuenta.saldo)) || Number(cuenta.saldo)<0) throw new Error(textoApp("Saldo bancario insuficiente", "Insufficient bank balance"));
  for (const [ident,diferencia] of cambiosTarjeta) {
    const t = copia.tarjetas.find(t => String(t.id) === ident);
    const saldo = round(Number(t.saldo) + diferencia);
    if (!Number.isFinite(saldo) || saldo<0) throw new Error(textoApp("El pago supera la deuda de la tarjeta", "Payment exceeds card debt"));
    if (diferencia > 0 && Number(t.limite)>0 && saldo>Number(t.limite)) throw new Error(textoApp("El pago supera el crédito disponible", "Payment exceeds available credit"));
    t.saldo=saldo;
  }
  for (const auto of copia.vehiculos) if (!Number.isFinite(Number(auto.saldo)) || Number(auto.saldo)<0) throw new Error(textoApp("El pago supera el saldo del vehículo", "Payment exceeds vehicle balance"));
  copia.pagos = anterior ? copia.pagos.filter(p => p.id !== anterior.id) : copia.pagos;
  if (nuevo) {
    const registro = {...nuevo};
    if (registro.tipo === "vehiculo") registro.saldoRestante=copia.vehiculos.find(v => String(v.id)===String(registro.cuentaId)).saldo;
    if (!anterior && registro.tipo === "tarjeta") {
      const tarjeta = copia.tarjetas.find(t => String(t.id) === String(registro.cuentaId));
      const meta = metaPagoTarjetaValida(tarjeta);
      if (meta) registro.metaPagoId = meta.id;
    }
    copia.pagos.push(registro);
  }
  return {datos:copia,cuentas:bancos};
}
function guardarPagoConOrigen(anterior,nuevo) {
  const clave="amfinance-cuentas-banco";
  let antes;
  try {
    antes=localStorage.getItem(clave);
    const resultado=prepararPagoConOrigen(data,JSON.parse(antes || "[]"),anterior,nuevo);
    // Ambas escrituras se completan antes de cambiar el estado en memoria.
    try {
      localStorage.setItem(clave,JSON.stringify(resultado.cuentas));
      localStorage.setItem(KEY,JSON.stringify(resultado.datos));

      if (antes===null) localStorage.removeItem(clave); else localStorage.setItem(clave,antes);
      throw error;
    }
    data=resultado.datos;return true;
  } catch(error) {alert(error.message || textoApp("No se pudo guardar el pago", "Could not save payment"));return false;}
}

function valorOrigenMovimiento(movimiento) {
  if (movimiento.tarjetaId != null && movimiento.tarjetaId !== "") {
