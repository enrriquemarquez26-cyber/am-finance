async function guardarPerfilLocal(event) {
  event.preventDefault();

  const formulario = event.target;
  const campos = new FormData(formulario);
  const nombre = String(campos.get("nombre") || "").trim();
  const archivo = campos.get("foto");
  const boton = formulario.querySelector("button");

  if (!nombre) {
        alert(textoApp("Escribe tu nombre.", "Enter your name."));
    return;
  }

  boton.disabled = true;

  try {
    let foto = data.perfil?.foto || "";

    if (archivo && archivo.size > 0) {
      const url = URL.createObjectURL(archivo);

      try {
        const imagen = new Image();

        await new Promise((resolve, reject) => {
          imagen.onload = resolve;
          imagen.onerror = () => reject(
                        new Error(textoApp("No se pudo abrir la foto. Prueba con JPG o PNG.", "Could not open the photo. Try a JPG or PNG image."))
          );
          imagen.src = url;
        });

        const escala = Math.min(
          1, 400 / Math.max(imagen.naturalWidth, imagen.naturalHeight)
        );

        const lienzo = document.createElement("canvas");
        lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));

        const contexto = lienzo.getContext("2d");
                if (!contexto) throw new Error(textoApp("No se pudo preparar la foto.", "Could not process the photo."));

        contexto.fillStyle = "#ffffff";
        contexto.fillRect(0, 0, lienzo.width, lienzo.height);
        contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
        foto = lienzo.toDataURL("image/jpeg", 0.8);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    const nuevosDatos = {...data, perfil: {nombre, foto}};
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
    data = nuevosDatos;
    perfil();
  } catch (error) {
    alert(
      error.name === "QuotaExceededError"
               ? textoApp("No hay espacio suficiente para guardar la foto.", "There is not enough storage space to save the photo.")
                : error.message || textoApp("No se pudo guardar el perfil.", "Could not save the profile.")
    );
  } finally {
    boton.disabled = false;
  }
}

function guardarMonedaImportes(moneda, desdeAjustes) {
  if (Object.hasOwn(MONEDAS_IMPORTES, moneda)) {
    guardarPreferenciaImportes(CLAVE_MONEDA_IMPORTES, moneda, desdeAjustes);
  }
}

function guardarFormatoImportes(formato, desdeAjustes) {
  if (FORMATOS_IMPORTES.includes(formato)) {
    guardarPreferenciaImportes(CLAVE_FORMATO_IMPORTES, formato, desdeAjustes);
  }
}

function guardarPreferenciaImportes(clave, valor, desdeAjustes) {
  try {
    localStorage.setItem(clave, valor);
  } catch {
    alert(textoApp("No se pudo guardar la preferencia.", "Could not save the preference."));
  }
  preferenciasPerfil(desdeAjustes);
}

// Enlace recibido desde la automatización de Transacción de Atajos.
// Ejemplo: #applepay?monto=12.50&comercio=HEB&tarjeta=Apple%20Card
// El fragmento no se envía a GitHub Pages como parte de la petición HTTP.
function leerEnlaceApplePay(hash) {
  if (typeof hash !== "string" || !hash.startsWith("#applepay?")) return null;
  const parametros = new URLSearchParams(hash.slice("#applepay?".length));
  const importeTexto = String(parametros.get("monto") || "").trim();
  const importe = Number(importeTexto);
  const comercio = String(parametros.get("comercio") || "").trim();
  const tarjeta = String(parametros.get("tarjeta") || "").trim();
  const referencia = String(parametros.get("id") || "").trim();
  const moneda = String(parametros.get("moneda") || "USD").trim().toUpperCase();

  if (!/^\d+(?:\.\d{1,2})?$/.test(importeTexto) ||
      !validAmount(importe) || importe > 1000000 ||
      !comercio || comercio.length > 80 || tarjeta.length > 80 ||
      referencia.length > 120 || moneda !== "USD") {
    return {error: true};
  }
  return {monto:round(importe), comercio, tarjeta, referencia};
}

// Texto simple que crea Atajos con la acción "Texto" y copia al portapapeles.
// BALANCE_ONE_APPLE_PAY\nmonto=12.50\ncomercio=HEB\ntarjeta=Apple Card
function leerTextoApplePay(contenido) {
  const texto = String(contenido || "").trim();
  const enlace = texto.indexOf("#applepay?");
  if (enlace !== -1 && !texto.includes("\n")) {
    return leerEnlaceApplePay(texto.slice(enlace));
  }

  const lineas = texto.replace(/\r/g, "").split("\n");
  if (lineas.shift()?.trim().toUpperCase() !== "BALANCE_ONE_APPLE_PAY") {
    return {error:true};
  }

  const parametros = new URLSearchParams();
  for (const linea of lineas) {
    if (!linea.trim()) continue;
    const campo = /^(monto|comercio|tarjeta|id|moneda)\s*[:=]\s*(.*)$/i.exec(linea);
    if (!campo) return {error:true};
    const clave = campo[1].toLowerCase();
    if (parametros.has(clave)) return {error:true};
    parametros.set(clave, campo[2].trim());
  }
  return leerEnlaceApplePay("#applepay?" + parametros.toString());
}

  formulario.onsubmit = evento => {

function prepararOperacionBanco(cuentas, origenId, operacion, entrada, destinoId, fecha, identificador) {
  const monto = Number(entrada);
  const centavos = Math.round(monto * 100);
  if (!String(entrada).trim() || !Number.isFinite(monto) || monto <= 0 ||
      !Number.isSafeInteger(centavos) || centavos <= 0 || Math.abs(monto * 100 - centavos) > .00001)
    throw new Error(textoApp("Introduce un importe mayor que cero, con hasta dos decimales.", "Enter a positive amount with up to two decimal places."));
  if (!Array.isArray(cuentas) || !["deposito", "retiro", "transferencia"].includes(operacion))
    throw new Error(textoApp("No se pudo validar la operación.", "Could not validate the transaction."));
  const copia = JSON.parse(JSON.stringify(cuentas));
  const origen = copia.find(c => String(c.id) === String(origenId));
  const destino = operacion === "transferencia" ? copia.find(c => String(c.id) === String(destinoId)) : null;
  if (!origen || (operacion === "transferencia" && (!destino || destino === origen)))
    throw new Error(textoApp("Elige una cuenta de destino diferente.", "Choose a different destination account."));
  const saldoCentavos = cuenta => {
    const saldo = Number(cuenta.saldo);
    const valor = Math.round(saldo * 100);
    if (!Number.isFinite(saldo) || !Number.isSafeInteger(valor))
      throw new Error(textoApp("El saldo de la cuenta no es válido.", "The account balance is invalid."));
    return valor;
  };
  const saldo = saldoCentavos(origen);
  if (operacion !== "deposito" && centavos > saldo)
    throw new Error(textoApp("Saldo insuficiente en la cuenta de origen.", "Insufficient funds in the source account."));
  const nuevoOrigen = saldo + (operacion === "deposito" ? centavos : -centavos);
  if (!Number.isSafeInteger(nuevoOrigen)) throw new Error(textoApp("Importe demasiado grande.", "Amount too large."));
  origen.saldo = nuevoOrigen / 100;
  if (!Array.isArray(origen.historial)) origen.historial = [];
  const registro = {id:identificador, fecha, tipo:operacion, monto:centavos / 100};
  if (destino) {
    const nuevoDestino = saldoCentavos(destino) + centavos;
    if (!Number.isSafeInteger(nuevoDestino)) throw new Error(textoApp("Importe demasiado grande.", "Amount too large."));
    destino.saldo = nuevoDestino / 100;
    registro.sentido = "salida";
    registro.contraparteId = destino.id;
    registro.contraparte = destino.nombre;
    if (!Array.isArray(destino.historial)) destino.historial = [];
    destino.historial.push({id:identificador, fecha, tipo:"transferencia", sentido:"entrada",
      monto:centavos / 100, contraparteId:origen.id, contraparte:origen.nombre});
  }
  origen.historial.push(registro);
  return copia;
}

      : transferencia ? textoApp("Guardar transferencia", "Save transfer") : textoApp("Guardar retiro", "Save withdrawal");
    error.hidden = true;
  };
  form.onchange = actualizar;
  form.onsubmit = evento => {
    evento.preventDefault();
    if (form.dataset.guardado || !form.reportValidity()) return;
    error.hidden = true;
    let nuevas;
    try {
      const actuales = JSON.parse(localStorage.getItem(clave) || "[]");
      nuevas = prepararOperacionBanco(actuales, identificador, form.elements.operacion.value,
        form.elements.monto.value, form.elements.destino.value, new Date().toISOString(), id());
    } catch(e) {
      error.textContent = e instanceof SyntaxError ? textoApp("No se pudieron leer las cuentas.", "Could not load accounts.") : e.message;
      error.hidden = false;return;
    }
    try {localStorage.setItem(clave, JSON.stringify(nuevas));}
    catch {error.textContent = textoApp("No se pudo guardar. No se hicieron cambios.", "Could not save. No changes were made.");error.hidden=false;return;}
    form.dataset.guardado = "si";
    ventana.close();go("inicio");
  };
}

function activarOrdenHerramientas() {
  const cuadricula = document.querySelector("#amPaginas .amPagina");
  if (!cuadricula) return;

  const clave = "balanceone-orden-herramientas";
  const botones = [...cuadricula.querySelectorAll("button[data-herramienta]")];
  const disponibles = new Map(
    botones.map(boton => [boton.dataset.herramienta, boton])
  );

  // Recuperar el orden guardado sin eliminar ninguna herramienta nueva.
  try {
    const orden = JSON.parse(localStorage.getItem(clave) || "[]");
    if (Array.isArray(orden)) {
      const vistos = new Set();
      // Primero el orden elegido; las herramientas nuevas van al final.
      [...orden, ...botones.map(boton => boton.dataset.herramienta)]
        .forEach(nombre => {
          const boton = disponibles.get(nombre);
          if (boton && !vistos.has(nombre)) {
            cuadricula.appendChild(boton);
            vistos.add(nombre);
          }
        });
    }
  } catch {}

  let pendiente = null;
  let arrastrado = null;
  let temporizador = null;
  let modo = "";
  let inicioX = 0;
  let inicioY = 0;

  const cancelarTemporizador = () => {
    if (temporizador !== null) clearTimeout(temporizador);
    temporizador = null;
  };

  function iniciar(boton, x, y, tipo) {
    cancelarTemporizador();
    if (arrastrado) arrastrado.classList.remove("am-arrastrando");
    pendiente = boton;
    arrastrado = null;
    modo = tipo;
    inicioX = x;
    inicioY = y;
    temporizador = setTimeout(() => {
      temporizador = null;
      if (!pendiente) return;
      arrastrado = pendiente;
      arrastrado.classList.add("am-arrastrando");
      ultimoArrastreHerramientas = Date.now();
    }, 450);
  }

  function mover(x, y, tipo) {
    if (!pendiente || modo !== tipo) return;
    if (!arrastrado) {
      if (Math.hypot(x - inicioX, y - inicioY) > 10) {
        cancelarTemporizador();
        pendiente = null;
      }
      return;
    }

    const destino = document.elementFromPoint(x, y)
      ?.closest("#amPaginas .amPagina button[data-herramienta]");
    if (!destino || destino === arrastrado) return;

    const elementos = [...cuadricula.children];
    if (elementos.indexOf(arrastrado) < elementos.indexOf(destino)) {
      destino.after(arrastrado);
    } else {
      destino.before(arrastrado);
    }
  }

  function terminar(tipo) {
    if (modo !== tipo || !pendiente) return;
    cancelarTemporizador();
    if (arrastrado) {
      arrastrado.classList.remove("am-arrastrando");
      ultimoArrastreHerramientas = Date.now();
      try {
        const orden = [...cuadricula.querySelectorAll("button[data-herramienta]")]
          .map(boton => boton.dataset.herramienta);
        localStorage.setItem(clave, JSON.stringify(orden));
      } catch {
        alert(textoApp(
          "No se pudo guardar el nuevo orden.",
          "Could not save the new order."
        ));
      }
    }
    pendiente = null;
    arrastrado = null;
    modo = "";
  }

  cuadricula.addEventListener("touchstart", evento => {
    if (evento.touches.length !== 1) return;
    const boton = evento.target.closest("button[data-herramienta]");
    if (!boton) return;
    const toque = evento.touches[0];
    iniciar(boton, toque.clientX, toque.clientY, "tactil");
  }, { passive: true });

  cuadricula.addEventListener("touchmove", evento => {
    if (modo !== "tactil" || !pendiente) return;
    if (evento.touches.length !== 1) {
      cancelarTemporizador();
      pendiente = null;
      return;
    }
    const toque = evento.touches[0];
    if (arrastrado) evento.preventDefault();
    mover(toque.clientX, toque.clientY, "tactil");
  }, { passive: false });

  cuadricula.addEventListener("touchend", () => terminar("tactil"));
  cuadricula.addEventListener("touchcancel", () => terminar("tactil"));

  cuadricula.addEventListener("pointerdown", evento => {
    if (evento.pointerType === "touch" || evento.button !== 0) return;
    const boton = evento.target.closest("button[data-herramienta]");
    if (boton) iniciar(boton, evento.clientX, evento.clientY, "raton");
  });

  document.addEventListener("pointermove", evento => {
    if (modo === "raton") mover(evento.clientX, evento.clientY, "raton");
  });
  document.addEventListener("pointerup", () => terminar("raton"));
  document.addEventListener("pointercancel", () => terminar("raton"));

  // Al soltar tras mantener pulsado, no ejecutar el botón como un toque normal.
  cuadricula.addEventListener("click", evento => {
    if (Date.now() - ultimoArrastreHerramientas < 650) {
      evento.preventDefault();
      evento.stopImmediatePropagation();
    }
  }, true);

  cuadricula.addEventListener("contextmenu", evento => {
    if (evento.target.closest("button[data-herramienta]")) {
      evento.preventDefault();
    }
  });
}

function activarOrdenCuentasInicio() {
  let pendiente = null, activo = null, lista = null, timer = null, modo = "";
  let x0 = 0, y0 = 0, bloquearHasta = 0, previo = [];
  const cancelarTimer = () => { clearTimeout(timer); timer = null; };
  const guardar = contenedor => {
    try {
      guardarOrdenElementosInicio(contenedor.dataset.ordenLista,
        [...contenedor.children].map(n => n.dataset.ordenId));
    } catch {
      previo.forEach(n => contenedor.appendChild(n));
      alert(textoApp("No se pudo guardar el orden.", "Could not save the order."));
    }
  };
  function iniciar(evento, x, y, tipo) {
    const fila = evento.target.closest("[data-orden-id]");
    if (!fila || !evento.target.closest(".banco-card") || fila.classList.contains("abierta")) return;
    const contenedor = fila.closest("[data-orden-lista]");
    if (!contenedor || contenedor.children.length < 2) return;
    cancelarTimer(); pendiente = fila; lista = contenedor; modo = tipo; x0=x; y0=y;
    previo = [...lista.children];
    timer = setTimeout(() => {
      if (!pendiente || !pendiente.isConnected) return;
      activo = pendiente; activo.classList.add("inicio-orden-activo");
      gestoBanco = null;
      bloquearHasta = Date.now() + 700;
    },450);
  }
  function mover(evento,x,y,tipo) {
    if (!pendiente || modo !== tipo) return;
    if (!activo) {
      if (Math.hypot(x-x0,y-y0)>10) {cancelarTimer();pendiente=null;}
      return;
    }
    if (evento.cancelable) evento.preventDefault();
    gestoBanco = null;
    const destino = document.elementFromPoint(x,y)?.closest("[data-orden-id]");
    if (!destino || destino === activo || destino.parentElement !== lista) return;
    const filas = [...lista.children];
    if (filas.indexOf(activo)<filas.indexOf(destino)) destino.after(activo);
    else destino.before(activo);
  }
  function terminar(tipo, cancelar=false) {
    if (modo !== tipo) return;
    cancelarTimer();
    if (activo) {
      activo.classList.remove("inicio-orden-activo");
      bloquearHasta=Date.now()+700;
      gestoBanco=null;
      if (cancelar) previo.forEach(n => lista.appendChild(n));
      else guardar(lista);
    }
    pendiente=activo=lista=null;modo="";
  }
  document.addEventListener("touchstart", e => {
    if (e.touches.length!==1) {terminar("touch",true);return;}
    iniciar(e,e.touches[0].clientX,e.touches[0].clientY,"touch");
  },{passive:true});
  document.addEventListener("touchmove",e => {
    if(e.touches.length!==1) {terminar("touch",true);return;}
    mover(e,e.touches[0].clientX,e.touches[0].clientY,"touch");
  },{passive:false});
  document.addEventListener("touchend",()=>terminar("touch"));
  document.addEventListener("touchcancel",()=>terminar("touch",true));
  document.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch" && e.button===0) iniciar(e,e.clientX,e.clientY,"mouse");
  });
  document.addEventListener("pointermove",e=>{
    if(e.pointerType!=="touch") mover(e,e.clientX,e.clientY,"mouse");
  },{passive:false});
  document.addEventListener("pointerup",()=>terminar("mouse"));
  document.addEventListener("pointercancel",()=>terminar("mouse",true));
  document.addEventListener("click",e=>{
    if(e.target.closest("[data-orden-lista]") && Date.now()<bloquearHasta){
      e.preventDefault();e.stopImmediatePropagation();
    }
  },true);
  document.addEventListener("contextmenu",e=>{
    if(e.target.closest("[data-orden-lista] .banco-card")) e.preventDefault();
  });
  document.addEventListener("keydown",e=>{
    if(!e.altKey || !["ArrowUp","ArrowDown"].includes(e.key)) return;
    const fila=e.target.closest("[data-orden-id]");
    const contenedor=fila?.closest("[data-orden-lista]");
    if(!contenedor) return;
    e.preventDefault();previo=[...contenedor.children];
    if(e.key==="ArrowUp") fila.previousElementSibling?.before(fila);
    else fila.nextElementSibling?.after(fila);
    guardar(contenedor);e.target.focus();
  });
}

function claveNotaGasto(nota) {
  return String(nota ?? "").normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/['’]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
}

function gastosRecientesPorNota(movimientos) {
  const gastos = new Map();
  for (const movimiento of movimientos) {
    if (movimiento.tipo !== "gasto" || !validDate(movimiento.fecha) ||
        !validAmount(Number(movimiento.monto))) continue;
    const clave = claveNotaGasto(movimiento.nombre);
    if (!clave) continue;
    const anterior = gastos.get(clave);
    if (!anterior || ordenarMovimientosVista(movimiento, anterior) <= 0) {
      gastos.set(clave, movimiento);
    }
  }
  return gastos;
}

function prepararSugerenciaGasto(form) {
  const {nombre:nota, tipo, categoria, cuentaId:cuenta} = form.elements;
  const boton = form.querySelector("#movVentanaSugerencia");
  let gastosPorNota;
  function actualizar() {
    boton.hidden = true;
    boton.onclick = null;
    if (tipo.value !== "gasto") return;
    const clave = claveNotaGasto(nota.value);
    if (!clave) return;
    gastosPorNota ??= gastosRecientesPorNota(data.movimientos);
    const gasto = gastosPorNota.get(clave);
    if (!gasto) return;
    const categoriaGuardada = gasto.categoria && claveCategoriaGasto(gasto.categoria);
    const opcionCategoria = categoriaGuardada && [...categoria.options].find(o =>
      o.value && o.value !== categoria.value && !o.disabled &&
      claveCategoriaGasto(o.value) === categoriaGuardada);
    const origenGuardado = valorOrigenMovimiento(gasto);
    const opcionCuenta = [...cuenta.options].find(o =>
      o.value && o.value === origenGuardado && o.value !== cuenta.value && !o.disabled);
    const sugerencias = [];
    if (opcionCategoria) sugerencias.push(opcionCategoria.textContent);
    if (opcionCuenta) {
      const partes = opcionCuenta.textContent.split(" · ");
      sugerencias.push(partes.length > 1 ? partes.slice(0,-1).join(" · ") : partes[0]);
    }
    if (!sugerencias.length) return;
    boton.textContent = textoApp("Usar ", "Use ") + sugerencias.join(" · ");
    boton.hidden = false;
    boton.onclick = () => {
      if (opcionCategoria) {
        categoria.value = opcionCategoria.value;
        actualizarSelectorCategoria();
      }
      if (opcionCuenta) cuenta.value = opcionCuenta.value;
      document.getElementById("movCategoriaResumen").focus({preventScroll:true});
      actualizar();
    };
  }
  nota.oninput = actualizar;
  categoria.onchange = actualizar;
  cuenta.onchange = actualizar;
  actualizar();
  return actualizar;
}

document.getElementById("movVentanaForm").onsubmit = async event => {

    y: event.touches[0].clientY,
    distancia: 0
  };

document.addEventListener("touchmove", event => {
  if (!gestoMovimiento) return;
  if (page !== "inicio") { gestoMovimiento = null; return; }
  if (event.touches.length !== 1) {
    gestoMovimiento = null;
    return;
  }

  const dx = event.touches[0].clientX - gestoMovimiento.x;
  const dy = event.touches[0].clientY - gestoMovimiento.y;

  if (dy < -10 || Math.abs(dx) > Math.max(20, Math.abs(dy))) {

  gestoMovimiento.distancia = dy;

let gestoBanco = null;
const clicBancoBloqueado = new WeakMap();

document.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0) return;

  const tarjeta = event.target.closest(
    ".banco-deslizable > .banco-card"
  );
  if (!tarjeta) return;

  gestoBanco = {
    tarjeta,
    fila: tarjeta.parentElement,
    id: event.pointerId,
    x: event.clientX,
    y: event.clientY,
    dx: 0,
    horizontal: false
  };
});

document.addEventListener("pointermove", event => {
  const g = gestoBanco;
  if (!g || event.pointerId !== g.id) return;

  const dx = event.clientX - g.x;
  const dy = event.clientY - g.y;

  if (!g.horizontal) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
      gestoBanco = null;
      return;
    }

    if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy)) {
      return;
    }

    g.horizontal = true;
    g.tarjeta.setPointerCapture(event.pointerId);
  }

  g.dx = dx;
  if (event.cancelable) event.preventDefault();
}, {passive: false});

document.addEventListener("pointerup", event => {
  const g = gestoBanco;
  if (!g || event.pointerId !== g.id) return;
  gestoBanco = null;

  if (!g.horizontal) return;

  clicBancoBloqueado.set(g.tarjeta, performance.now() + 600);

  if (g.dx < -35) mostrarAccionesBanco(g.fila, true);
  if (g.dx > 35) mostrarAccionesBanco(g.fila, false);
});

document.addEventListener("pointercancel", () => {
  gestoBanco = null;
});

document.addEventListener("click", event => {
  const tarjeta = event.target.closest(
    ".banco-deslizable > .banco-card"
  );

  if (tarjeta) {
    const bloqueado = clicBancoBloqueado.get(tarjeta) || 0;
    const abierta = tarjeta.parentElement.classList.contains("abierta");

    if (performance.now() < bloqueado || abierta) {
      event.preventDefault();
      event.stopImmediatePropagation();

      if (performance.now() >= bloqueado) {
        mostrarAccionesBanco(tarjeta.parentElement, false);
      }
      return;
    }
  }

  if (!event.target.closest(".banco-deslizable")) {
    mostrarAccionesBanco(null, false);
  }
}, true);

document.addEventListener("keydown", event => {

});

function eliminarCuentaBanco(identificador) {
  const clave = "amfinance-cuentas-banco";

  try {
    const cuentas = JSON.parse(localStorage.getItem(clave) || "[]");
    if (!Array.isArray(cuentas)) throw new Error();

    const cuenta = cuentas.find(
      c => String(c.id) === String(identificador)
    );

    if (!cuenta) {
      alert(textoApp("Cuenta no encontrada.", "Account not found."));
      return;
    }

    if((data.metasAhorro||[]).some(m=>String(m.cuentaId||'')===String(cuenta.id))) {
      alert(textoApp("Desvincula esta cuenta de su meta de ahorro antes de eliminarla.","Unlink this account from its savings goal before deleting it."));return;
    }
    const tieneMovimientos = data.movimientos.some(
      m => String(m.cuentaId) === String(cuenta.id)
    );

    const tienePagos = data.pagos.some(
      p => String(p.bancoId) === String(cuenta.id)
    );

    if (tieneMovimientos || tienePagos) {
      alert(textoApp(
        "Esta cuenta tiene movimientos o pagos vinculados y no se puede eliminar.",
        "This account has linked transactions or payments and cannot be deleted."
      ));
      return;
    }

    const mensaje = textoApp(
      "¿Eliminar la cuenta ",
      "Delete account "
    ) + cuenta.nombre + "?\n\n" + textoApp(

      "The account and its deposit and withdrawal history will be removed from Balance One. This cannot be undone."
    );

    if (!confirm(mensaje)) return;

    const restantes = cuentas.filter(
      c => String(c.id) !== String(cuenta.id)
    );

    localStorage.setItem(clave, JSON.stringify(restantes));
    go("inicio");

    alert(textoApp(
      "Cuenta eliminada.",
      "Account deleted."
    ));
  } catch (error) {
    alert(textoApp(
      "No se pudo eliminar la cuenta.",
      "Could not delete the account."
    ));
  }
}

function cerrarVentanaApariencia(ventana, despues) {
  if (!ventana.open || ventana.classList.contains("ajustes-ventana-saliendo")) return;

  const cerrar = () => {
    if (!ventana.open) return;
    ventana.close();
    despues?.();
  };
  if (!ventana.classList.contains("ajustes-ventana") ||
      typeof ventana.animate !== "function" ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    cerrar();
    return;
  }

  const estilo = getComputedStyle(ventana);
  const inicio = {opacity:estilo.opacity, translate:estilo.getPropertyValue("translate") || "none"};
  ventana.classList.add("ajustes-ventana-saliendo");
  ventana.inert = true;
  const salida = ventana.animate([inicio, {opacity:0, translate:"0 10px"}],
    {duration:150, easing:"ease-in", fill:"forwards"});
  salida.finished.then(cerrar, cerrar);
}

function crearVentanaApariencia(titulo, contenido, sinTeclado = false) {
  if (document.querySelector(".apariencia-ventana")) return null;

  const ventana = document.createElement("dialog");
  ventana.className = "apariencia-ventana";
  if (el().querySelector("[data-animar-ajustes]")) {
    ventana.classList.add("ajustes-ventana");
    ventana.addEventListener("cancel", event => {
      event.preventDefault();
      cerrarVentanaApariencia(ventana);
    });
  }
  ventana.setAttribute("aria-labelledby", "aparienciaTitulo");

  ventana.innerHTML = `
    <div class="apariencia-tirador" aria-hidden="true"></div>
    <h2 id="aparienciaTitulo">${safe(titulo)}</h2>

    <div class="apariencia-contenido">
      ${contenido}
    </div>

    <p class="note" data-aviso-apariencia
      role="status" aria-live="polite" hidden></p>

    <button type="button" class="apariencia-listo">
      ${textoApp("Listo", "Done")}
    </button>
  `;

  const focoAnterior = document.activeElement;
  const overflowAnterior = document.body.style.overflow;

  ventana.querySelector(".apariencia-listo").onclick = () => cerrarVentanaApariencia(ventana);

  ventana.addEventListener("close", () => {
    document.body.style.overflow = overflowAnterior;
    ventana.remove();

    if (focoAnterior && focoAnterior.isConnected) {
      focoAnterior.focus();
    }
  }, {once: true});
   if (sinTeclado) {
    const tituloVentana = ventana.querySelector("h2");
    tituloVentana.tabIndex = -1;
    tituloVentana.setAttribute("autofocus", "");
      tituloVentana.style.outline = "none";
}
  document.body.appendChild(ventana);
  document.body.style.overflow = "hidden";
  ventana.showModal();

  return ventana;
}

function barraProgreso(valor, color = "#ff7900", diseno) {
  const estilos = ["clasica", "fina", "capsula", "segmentada", "3d"];
  let estilo = diseno;

  if (!estilo) {
    try {
      estilo = localStorage.getItem("balanceone-progreso");
    } catch {}
  }

  if (!estilos.includes(estilo)) estilo = "clasica";
  if (!/^#[0-9a-f]{6}$/i.test(color)) color = "#ff7900";
  if (color.toLowerCase() === "#ff7900") {
    color = "var(--balanceone-color, #ff7900)";
  }

  const numero = Number(valor);
  const porcentaje = Number.isFinite(numero)
    ? Math.min(100, Math.max(0, numero))
    : 0;

  const alto = estilo === "fina" ? 3
    : estilo === "capsula" || estilo === "3d" ? 10 : 6;

  const fondo = "rgba(130,140,155,.22)";
  let interior;

  if (estilo === "segmentada") {
    interior = Array.from({length: 12}, (_, i) => {
      const relleno = Math.min(100, Math.max(
        0, (porcentaje / 100 * 12 - i) * 100
      ));

      return `<span style="display:block;flex:1;height:6px;
        border-radius:999px;background:linear-gradient(to right,
        ${color} ${relleno}%,${fondo} ${relleno}%)"></span>`;
    }).join("");
  } else {
    const brillo = estilo === "3d"
      ? "box-shadow:inset 0 2px 2px rgba(255,255,255,.5),inset 0 -2px 2px rgba(0,0,0,.2);"
      : estilo === "capsula"
        ? "box-shadow:0 2px 5px rgba(0,0,0,.2);"
        : "";

    interior = `<span style="display:block;height:100%;
      width:${porcentaje}%;border-radius:inherit;
      background:${color};${brillo}"></span>`;
  }

  return `<div data-progreso="${estilo}"
    data-valor="${porcentaje}" data-color="${color}"
    role="progressbar"
    aria-label="${textoApp("Progreso", "Progress")}"
    aria-valuemin="0" aria-valuemax="100"
    aria-valuenow="${porcentaje}"
    style="display:${estilo === "segmentada" ? "flex" : "block"};
    gap:3px;width:100%;height:${alto}px;border-radius:999px;
    background:${estilo === "segmentada" ? "transparent" : fondo}">
    ${interior}
  </div>`;
}

function aplicarEstiloProgreso(estilo) {
  if (!["clasica", "fina", "capsula", "segmentada", "3d"].includes(estilo)) {

  localStorage.setItem("balanceone-progreso", estilo);

function calcularSimulacion(tipo, v) {
  const error = (es, en) => ({error: textoApp(es, en)});
  const redondear = n =>
    Math.round((n + Number.EPSILON) * 100) / 100;

  const monto = Number(v.monto);
  const tasa = Number(v.tasa);

  if (!Number.isFinite(monto) || monto < 0 || monto > 1e9 ||
      !Number.isFinite(tasa) || tasa < 0 || tasa > 100) {
    return error(
      "Revisa el importe y la tasa anual (0 a 100%).",
      "Check the amount and annual rate (0 to 100%)."
    );
  }

  const r = tasa / 1200;

  if (tipo === "prestamo" || tipo === "hipoteca") {
    const plazo = Number(v.plazo);
    const meses = tipo === "hipoteca" ? plazo * 12 : plazo;

    if (monto <= 0 || !Number.isInteger(plazo) ||
        plazo <= 0 || meses > 600) {
      return error(
        "Revisa el monto y el plazo (máximo 50 años).",
        "Check the amount and term (50 years maximum)."
      );
    }

    const mensual = r === 0 ? monto / meses
      : monto * r / (1 - Math.pow(1 + r, -meses));

    const total = mensual * meses;

    return {
      principal: monto, mensual, meses, total,
      intereses: Math.max(0, total - monto)
    };
  }

  if (tipo === "tarjeta") {
    const pago = redondear(Number(v.pago));
    let saldo = redondear(monto);

    if (saldo <= 0 || !Number.isFinite(pago) || pago <= 0) {
      return error(
        "Introduce una deuda y un pago mensual mayores que cero.",
        "Enter a debt and monthly payment greater than zero."
      );
    }

    const principal = saldo;
    let total = 0, intereses = 0, meses = 0;

    while (saldo > 0 && meses < 1200) {
      const interes = redondear(saldo * r);

      if (pago <= interes) {
        return error(
          "Ese pago no reduce la deuda. Aumenta el pago mensual.",
          "That payment does not reduce the debt. Increase the monthly payment."
        );
      }

      const abono = Math.min(pago, redondear(saldo + interes));
      saldo = redondear(saldo + interes - abono);
      total = redondear(total + abono);
      intereses = redondear(intereses + interes);
      meses++;
    }

    if (saldo > 0) return error(
      "El plazo supera 100 años. Aumenta el pago mensual.",
      "The payoff term exceeds 100 years. Increase the monthly payment."
    );

    return {principal, mensual: pago, meses, total, intereses};
  }

  if (tipo === "ahorro") {
    const aporte = Number(v.aporte);
    const plazo = Number(v.plazo);

    if (!Number.isFinite(aporte) || aporte < 0 || aporte > 1e9 ||
        !Number.isInteger(plazo) || plazo < 1 || plazo > 50) {
      return error(
        "Revisa la aportación y el plazo (1 a 50 años).",
        "Check the contribution and term (1 to 50 years)."
      );
    }

    const meses = plazo * 12;
    const aportado = monto + aporte * meses;
    const factor = Math.pow(1 + r, meses);

    const total = r === 0 ? aportado
      : monto * factor + aporte * (factor - 1) / r;

    if (!Number.isFinite(total) || total > 1e12) return error(
      "El resultado es demasiado grande. Revisa los valores.",
      "The result is too large. Check the values."
    );

    return {
      principal: aportado, mensual: aporte, meses, total,
      intereses: Math.max(0, total - aportado)
    };
  }

  return error("Calculadora no válida.", "Invalid calculator.");
}

    const toque = event.touches[0];

    deslizamiento = {
      x: toque.clientX,
      y: toque.clientY,

    deslizamiento.distancia = dy;

function actualizarSimulacion(ventana, tipo) {
  const resultado = ventana.querySelector("[data-resultado-simulacion]");
  if (!resultado) return;

  const valores = {};
  const inputs = [...ventana.querySelectorAll(
    "[data-campos-simulacion] input"
  )];

  if (inputs.some(input =>
      !input.validity.valid || !Number.isFinite(input.valueAsNumber))) {
    resultado.textContent = textoApp(
      "Completa los campos con valores válidos.",
      "Complete the fields with valid values."
    );
    return;
  }

  inputs.forEach(input => {
    valores[input.name] = input.valueAsNumber;
  });

  const r = calcularSimulacion(tipo, valores);

  if (r.error) {
    resultado.textContent = r.error;
    return;
  }

  const ahorro = tipo === "ahorro";
  const tarjeta = tipo === "tarjeta";

  const titulo = ahorro
    ? textoApp("Ahorro estimado", "Estimated savings")
    : tarjeta
      ? textoApp("Plazo para pagar", "Time to pay off")
      : textoApp("Pago mensual estimado", "Estimated monthly payment");

  const principal = tarjeta
    ? r.meses + " " + textoApp(
        r.meses === 1 ? "mes" : "meses",
        r.meses === 1 ? "month" : "months"
      )
    : money(ahorro ? r.total : r.mensual);

  const filas = ahorro ? [
    [textoApp("Total aportado", "Total contributed"), money(r.principal)],
    [textoApp("Intereses estimados", "Estimated interest"), money(r.intereses)]
  ] : [
    [textoApp("Intereses estimados", "Estimated interest"), money(r.intereses)],
    [textoApp("Total a pagar", "Total to pay"), money(r.total)]
  ];

  if (tarjeta) filas.unshift([
    textoApp("Pago mensual fijo", "Fixed monthly payment"),
    money(r.mensual)
  ]);

  const porcentaje = r.total > 0
    ? Math.min(100, Math.max(0, r.principal / r.total * 100))
    : 0;

  resultado.innerHTML = `
    <p class="label" style="margin:0 0 8px">${titulo}</p>

    <strong style="display:block;font-size:1.9rem;
      color:var(--balanceone-color,#ff7900);

      <div style="display:flex;justify-content:space-between;
        gap:12px;margin:10px 0;font-size:.85rem">
        <span>${etiqueta}</span>
        <strong style="text-align:right;overflow-wrap:anywhere">
          ${importe}
        </strong>
      </div>
    `).join("")}

      ${barraProgreso(porcentaje)}
    </div>

    <div class="label" style="display:flex;
      justify-content:space-between;gap:10px;
      margin-top:7px;font-size:.68rem">
      <span>
        ${ahorro
          ? textoApp("Aportaciones", "Contributions")
          : textoApp("Capital", "Principal")}
        ${Math.round(porcentaje)}%
      </span>
      <span>
        ${textoApp("Intereses", "Interest")}
        ${r.total > 0 ? 100 - Math.round(porcentaje) : 0}%
      </span>
    </div>
  `;
}
function eliminarTarjetaCredito(indice) {
  const tarjeta = data.tarjetas[indice];
  if (!tarjeta) return;

  const tieneComprasVinculadas = data.movimientos.some(m =>
    m.tarjetaId && String(m.tarjetaId) === String(tarjeta.id)
  );
  const tienePagos = data.pagos.some(p =>
    p.tipo === "tarjeta" && (
      p.cuentaId
        ? String(p.cuentaId) === String(tarjeta.id)
        : p.nombre === tarjeta.nombre
    )
  );

  if (tienePagos || tieneComprasVinculadas || data.pagos.some(p => String(p.fuenteTarjetaId) === String(tarjeta.id))) {
    alert(textoApp(
      "Esta tarjeta tiene compras o pagos registrados y no se puede eliminar para conservar su historial y los saldos vinculados.",
      "This card has recorded purchases or payments and cannot be deleted, to preserve its history and linked balances."
    ));
    return;
  }

  const mensaje = textoApp(
    "¿Eliminar de Balance One la tarjeta ",
    "Delete this card from Balance One: "
  ) + tarjeta.nombre + "?\n\n" + textoApp(
    "Se quitará su registro y su deuda del resumen. Esto no cancela la tarjeta ni la deuda con el banco.",
    "Its record and debt will be removed from the summary. This does not cancel the card or the debt with the bank."
  );

  if (!confirm(mensaje)) return;

  const nuevosDatos = {
    ...data,
    tarjetas: data.tarjetas.filter((t, i) => i !== indice)
  };

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp(
      "No se pudo eliminar la tarjeta. No se hicieron cambios.",
      "Could not delete the card. No changes were made."
    ));
    return;
  }

  data = nuevosDatos;
  render();
  alert(textoApp("Tarjeta eliminada.", "Card deleted."));
}
let mesCalendario = month();
let diaCalendario = today();

let periodoCalendario = "mes";
let rangoCalendarioInicio = "";
let rangoCalendarioFin = "";

function limitesPeriodoCalendario(modo, mes, dia, inicio, fin) {
  const [anio, numeroMes] = mes.split("-").map(Number);
  const ultimo = new Date(Date.UTC(anio, numeroMes, 0)).getUTCDate();
  const inicioMes = mes + "-01";
  const finMes = mes + "-" + String(ultimo).padStart(2, "0");
  if (modo === "rango" && validDate(inicio) && validDate(fin) && inicio <= fin) {
    return {desde:inicio, hasta:fin};
  }
  if (modo === "7" || modo === "15") {
    const hasta = validDate(dia) && dia.slice(0,7) === mes ? dia : finMes;
    const fecha = new Date(hasta + "T12:00:00Z");
    fecha.setUTCDate(fecha.getUTCDate() - (Number(modo) - 1));
    return {desde:fecha.toISOString().slice(0,10), hasta};
  }
  return {desde:inicioMes, hasta:finMes};
}

function sumarPeriodoCalendario(datos, desde, hasta) {
  let ingresos = 0;
  let gastos = 0;
  const agregar = (registro, pago) => {
    const fecha = String(registro.fecha || "").slice(0,10);
    const monto = Number(registro.monto);
    if (!validDate(fecha) || fecha < desde || fecha > hasta ||
        !Number.isFinite(monto) || monto <= 0) return;
    if (!pago && registro.tipo === "ingreso") ingresos += monto;
    else gastos += monto;
  };
  (datos.movimientos || []).forEach(m => agregar(m, false));
  (datos.pagos || []).filter(pagoCuentaComoGasto).forEach(p => agregar(p, true));
  return {ingresos:round(ingresos), gastos:round(gastos)};
}

function cambiarPeriodoCalendario(periodo) {
  if (!["7", "15", "mes", "rango"].includes(periodo)) return;
  periodoCalendario = periodo;
  transferencias();
  document.querySelector('[data-periodo-cal="' + periodo + '"]')
    ?.focus({preventScroll:true});
}

function aplicarRangoCalendario(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const inicio = form.elements.desde.value;
  const fin = form.elements.hasta.value;
  const campoFin = form.elements.hasta;
  campoFin.setCustomValidity("");
  if (!validDate(inicio) || !validDate(fin) || inicio > fin) {
    campoFin.setCustomValidity(textoApp(
      "La fecha final debe ser igual o posterior a la inicial.",
      "The end date must be on or after the start date."
    ));
    campoFin.reportValidity();
    return;
  }
  rangoCalendarioInicio = inicio;
  rangoCalendarioFin = fin;
  periodoCalendario = "rango";
  transferencias();
  document.querySelector('[data-periodo-cal="rango"]')?.focus({preventScroll:true});
}

        "7 and 15 days end on the selected day. Expenses include recorded payments, except credit card repayments."
      )}</p>

function resumenDiaCalendario(fecha) {
  const registros = [
    ...movimientosTransferenciasBanco().map(m=>({...m,origenCalendario:"transferencia"})),
    ...data.movimientos.map(m => ({
      ...m,
      origenCalendario: "movimiento"
    })),
    ...data.pagos.map(p => ({
      ...movimientoVistaPago(p), origenCalendario:"pago"
    }))
  ].filter(registro =>
    String(registro.fecha).slice(0, 10) === fecha &&
    Number.isFinite(Number(registro.monto)) &&
    Number(registro.monto) > 0
  );

  const ingresos = round(registros
    .filter(r => r.tipo === "ingreso")
    .reduce((total, r) => total + Number(r.monto), 0));

  const gastos = round(registros
    .filter(r => r.tipo === "gasto")
    .reduce((total, r) => total + Number(r.monto), 0));

  return {
    registros,
    ingresos,
    gastos,
    balance: round(ingresos - gastos)
  };
}

function cambiarMesCalendario(paso) {
  if (![1, -1].includes(paso)) return;

  const [anio, mes] = mesCalendario.split("-").map(Number);
  const fecha = new Date(anio, mes - 1 + paso, 1, 12);
  const nuevoAnio = fecha.getFullYear();

  if (nuevoAnio < 1000 || nuevoAnio > 9999) return;

  mesCalendario = nuevoAnio + "-" +
    String(fecha.getMonth() + 1).padStart(2, "0");

  diaCalendario = mesCalendario + "-01";
  transferencias();
}

function activarGestosDiaCalendario(ventana) {
  const cabecera = ventana.querySelector(".cal-dia-cabecera");
  const boton = ventana.querySelector("[data-ampliar-dia]");
  let gesto = null;

  const ampliar = activo => {
    ventana.classList.toggle("cal-expandida", activo);
    boton.setAttribute("aria-expanded", String(activo));

    boton.setAttribute("aria-label", activo
      ? textoApp("Reducir ventana", "Collapse window")
      : textoApp("Ampliar ventana", "Expand window"));
  };

  boton.onclick = () => {
    ampliar(!ventana.classList.contains("cal-expandida"));
  };

  cabecera.addEventListener("pointerdown", event => {
    gesto = null;

    if (!event.isPrimary || event.button !== 0 ||
        event.target.closest("button,input,select,textarea")) return;

    gesto = {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY
    };

    cabecera.setPointerCapture(event.pointerId);
    if (event.cancelable) event.preventDefault();
  });

  cabecera.addEventListener("pointerup", event => {
    if (!gesto || event.pointerId !== gesto.id) return;

    const dx = event.clientX - gesto.x;
    const dy = event.clientY - gesto.y;
    gesto = null;

    if (Math.abs(dy) < 55 ||
        Math.abs(dx) >= Math.abs(dy)) return;

    if (dy < 0) {
      ampliar(true);
    } else if (ventana.classList.contains("cal-expandida")) {
      ampliar(false);
    } else {
      ventana.close();
    }
  });

  cabecera.addEventListener("pointercancel", () => {
    gesto = null;
  });

  ampliar(false);
}
function conectarFormularioDia(ventana, fecha) {
  if (page !== "movimientos") return;

  const formulario = document.querySelector(".mov-formulario");
  if (!formulario) return;

  const contenido = ventana.querySelector(".cal-dia-contenido");
  const listo = contenido.querySelector("[data-listo-dia]");
  const posicionOriginal = document.createComment("formulario-movimiento");
  formulario.before(posicionOriginal);

  const agregar = document.createElement("button");
  agregar.type = "button";
  agregar.textContent = textoApp(
    "＋ Agregar movimiento",
    "＋ Add transaction"
  );
  agregar.style.cssText = `
    width:100%;margin-top:16px;padding:14px;
    border:0;border-radius:999px;
    background:var(--balanceone-color,#ff7900);
    color:white;font:inherit;
  `;
  contenido.insertBefore(agregar, listo);

  agregar.onclick = () => {
    agregar.hidden = true;
    formulario.style.display = "block";
    contenido.insertBefore(formulario, listo);

    const campoFecha = formulario.querySelector('[name="fecha"]');
    campoFecha.value = fecha;
    campoFecha.dispatchEvent(new Event("change", {bubbles:true}));

    ventana.classList.add("cal-expandida");
    const ampliar = ventana.querySelector("[data-ampliar-dia]");
    ampliar.setAttribute("aria-expanded", "true");
    ampliar.setAttribute(
      "aria-label",
      textoApp("Reducir ventana", "Collapse window")
    );

    formulario.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  };

  const form = formulario.querySelector("form");
  const comprobarGuardado = () => {
    const cantidadAnterior = data.movimientos.length;
    queueMicrotask(() => {
      if (data.movimientos.length > cantidadAnterior && ventana.open) {
        ventana.close();
      }
    });
  };
  form.addEventListener("submit", comprobarGuardado, true);

  ventana.addEventListener("close", () => {
    form.removeEventListener("submit", comprobarGuardado, true);
    formulario.style.display = "none";
    if (posicionOriginal.isConnected) {
      posicionOriginal.replaceWith(formulario);
    }
  }, {once:true});
}
function conectarAccionesDia(ventana, fecha, registros) {
  function actualizarDia() {
    ventana.addEventListener("close", () => {
      setTimeout(() => {
        if (page === "movimientos" || page === "transferencias") {
          abrirDiaCalendario(fecha);
        }
      }, 0);
    }, {once:true});
    ventana.close();
  }

  ventana.querySelectorAll("[data-registro-dia]").forEach((fila, i) => {
    const registro = registros[i];
    if (!registro || registro.esTransferencia) return;

    const origen = registro.origenCalendario === "pago"
      ? "pago" : "movimiento";
    const ident = registro.id;
    const acciones = document.createElement("div");

    acciones.className = "cal-dia-transaccion-acciones";
    acciones.hidden = true;
    const mostrarAcciones = fila.querySelector("[data-acciones-dia-toggle]");
    if (mostrarAcciones) {
      mostrarAcciones.onclick = () => {
        acciones.hidden = !acciones.hidden;
        mostrarAcciones.setAttribute("aria-expanded", String(!acciones.hidden));
      };
    }

    function crearBoton(es, en, color) {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.textContent = textoApp(es, en);
      boton.style.cssText = `
        flex:1;padding:10px;border:0;border-radius:999px;
        background:rgba(130,140,155,.12);
        color:${color};font:inherit;
      `;
      acciones.appendChild(boton);
      return boton;
    }

    const editarBoton = crearBoton("Editar", "Edit", "inherit");
    const borrarBoton = crearBoton("Eliminar", "Delete", "#d44d56");

    borrarBoton.onclick = () => {
      if (!findItem(origen, ident)) return;
      eliminar(origen, ident);
      if (!findItem(origen, ident)) actualizarDia();
    };

    editarBoton.onclick = () => {
      if (fila.querySelector(".editbox")) return;

      const original = findItem(origen, ident);
      if (!original) return;

      const caja = document.createElement("div");
      caja.className = "cal-dia-transaccion-editor";
      caja.innerHTML = editor({...original, origen});
      fila.appendChild(caja);
      acciones.hidden = true;

      const form = caja.querySelector("form");
      const cancelar = form.querySelector('[type="button"]');
      cancelar.removeAttribute("onclick");
      cancelar.onclick = () => {
        caja.remove();
        acciones.hidden = false;
      };

      form.removeAttribute("onsubmit");
      form.onsubmit = event => {
        event.preventDefault();
        const anterior = JSON.stringify(findItem(origen, ident));

        guardarEdicion(event, origen, ident);

        const posterior = JSON.stringify(findItem(origen, ident));
        if (anterior !== posterior) {
          actualizarDia();
        }
      };

      ventana.querySelector("[data-ampliar-dia]")
        .getAttribute("aria-expanded") === "false" &&
        ventana.querySelector("[data-ampliar-dia]").click();

      caja.scrollIntoView({behavior:"smooth", block:"nearest"});
    };

    fila.appendChild(acciones);
  });
}

  const pagos = [
    ...data.tarjetas.map(t => ({

      nombre: t.nombre,
      dia: Number(t.vencimiento),
      monto: t.pagoMinimo,
      saldo: Number(t.saldo),
      destino: "tarjetas",
      tipo: textoApp("Tarjeta", "Credit card")
    })),
    ...data.vehiculos.map(v => ({
      identificador: v.id,
      nombre: v.nombre,
      marcaNombre:[v.marca,v.nombre,v.modelo].filter(Boolean).join(" "),
      dia: Number(v.vencimiento),
      monto: v.pago,
      saldo: Number(v.saldo),
      destino: "vehiculos",
      tipo: textoApp("Auto", "Vehicle")
    }))
  ].filter(p =>
    p.saldo > 0 &&
    Number.isInteger(p.dia) &&
    p.dia >= 1 &&
    p.dia <= 31
  ).map(p => ({
    ...p,
    dia: Math.min(p.dia, ultimoDia)
  })).sort((a, b) => a.dia - b.dia);

  pagos.push(...suscripcionesDelMes(mesCalendario).filter(s => s.categoria === "servicios").map(s => ({identificador:s.id,nombre:s.nombre,dia:Number(s.fecha.slice(8,10)),monto:s.monto,destino:"servicios",tipo:textoApp("Servicio", "Utility")})));
  pagos.sort((a,b) => a.dia-b.dia);
  const importes = pagos.map(p => Number(p.monto));
  const total = importes.reduce((suma, monto) =>
    suma + (Number.isFinite(monto) && monto > 0 ? Math.round(monto * 100) : 0), 0) / 100;
  const incompleto = importes.some(monto => !Number.isFinite(monto) || monto <= 0);

  const paginas = Array.from({length:Math.ceil(pagos.length / 6)}, (_, i) => pagos.slice(i*6,i*6+6));

      <div class="cal-pagos-paginas" onscroll="actualizarPaginaPagosMes(this)" role="region" aria-label="${textoApp('Pagos programados del mes','Scheduled monthly payments')}" tabindex="0">
        ${paginas.map((grupo, indice) => `<div class="cal-pagos-lista cal-pagos-cuadricula" role="group" aria-label="${textoApp('Página','Page')} ${indice+1}">
        ${grupo.map(p => {
          const configurado = p.monto !== null &&
            p.monto !== undefined &&
            p.monto !== "" &&
            Number.isFinite(Number(p.monto)) &&
            Number(p.monto) > 0;
          return `
            <button type="button" class="cal-pago-fila" title="${safe(p.nombre)}" onclick="abrirDetallePagoDelMes('${p.destino}', ${safe(JSON.stringify(String(p.identificador)))})">
              <span class="cal-pago-icono" aria-hidden="true">
                ${p.destino === "vehiculos" ? "🚘" : p.destino === "servicios" ? iconoCategoriaMovimiento("Servicios") : "💳"}
                ${imagenCompania(p.marcaNombre || p.nombre)}
              </span>
              <span class="cal-pago-info">
                <strong>${safe(p.nombre)}</strong>
                <small>${p.tipo} · ${textoApp("Día ", "Day ")}${p.dia}</small>
              </span>
              <strong class="cal-pago-monto">${configurado
                ? money(p.monto)
                : textoApp("Sin importe", "Amount not set")}</strong>
              <span class="cal-pago-chevron" aria-hidden="true">›</span>
            </button>
          `;
        }).join("")}</div>`).join("") || `
          <p class="note">${textoApp(

            "No due dates configured. Set them in Cards or Vehicles."
          )}</p>

      </div>
      ${paginas.length > 1 ? `<div class="cal-pagos-paginacion" role="group" aria-label="${textoApp('Páginas de pagos','Payment pages')}">${paginas.map((_,i) => `<button type="button" aria-label="${textoApp('Página','Page')} ${i+1}" aria-pressed="${i===0}" onclick="cambiarPaginaPagosMes(this,${i})">${i+1}</button>`).join('')}</div>` : ''}
    </div>
  `;
}
function suscripcionesDelMes(
  mesElegido,
  registros = data.suscripciones
) {
  const [anio, mes] = mesElegido.split("-").map(Number);
  const ultimo = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
  const inicioMes = mesElegido + "-01";
  const finMes = mesElegido + "-" + String(ultimo).padStart(2,"0");
  const lista = Array.isArray(registros) ? registros : [];
  const eventos = [];

  for (const s of lista) {
    if (!validDate(String(s.inicio))) continue;

    const limite = [finMes, s.fin, s.canceladaEn].filter(Boolean).sort()[0];
    if (s.inicio > limite || limite < inicioMes) continue;

    if (s.frecuencia === "anual") {
      const [anioInicio, mesInicio, diaInicio] = s.inicio.split("-").map(Number);
      if (anio < anioInicio || mes !== mesInicio) continue;
      const fecha = mesElegido + "-" + String(Math.min(diaInicio, ultimo)).padStart(2, "0");
      if (fecha >= s.inicio && fecha <= limite) eventos.push({...s, fecha});
    } else if (s.frecuencia === "cada14dias") {
      const convertir = fecha => {
        const [a,m,d] = fecha.split("-").map(Number);
        return Date.UTC(a,m-1,d);
      };

      const primero = convertir(s.inicio);
      const salto = 14 * 86400000;
      const comienzo = convertir(inicioMes);
      const final = convertir(limite);

      const pasos = Math.max(0, Math.ceil(
        (comienzo - primero) / salto
      ));

      for (
        let instante = primero + pasos * salto;
        instante <= final;
        instante += salto
      ) {
        eventos.push({
          ...s,
          fecha: new Date(instante).toISOString().slice(0,10)
        });
      }
    } else {
      const dia = Math.min(Number(s.inicio.slice(8,10)), ultimo);
      const fecha = mesElegido + "-" + String(dia).padStart(2,"0");

      if (fecha >= s.inicio && fecha <= limite) {
        eventos.push({...s, fecha});
      }
    }
  }

  return eventos.map(evento => {
    const factura = evento.facturas?.[evento.fecha];
    return evento.categoria === "servicios" && validAmount(factura) ? {...evento,monto:Number(factura)} : evento;
  }).sort((a,b) => a.fecha.localeCompare(b.fecha));
}

function prepararFacturaServicio(datos, identificador, fecha, importe) {
  const indice = (datos.suscripciones || []).findIndex(s => String(s.id) === String(identificador) && s.categoria === "servicios");
  if (indice < 0 || !validDate(fecha) || !validAmount(importe) || Math.abs(Number(importe)*100-Math.round(Number(importe)*100)) > .00001) throw new Error(textoApp("Introduce un importe válido con hasta dos decimales.", "Enter a valid amount with up to two decimal places."));
  if (!suscripcionesDelMes(fecha.slice(0,7), [datos.suscripciones[indice]]).some(s => s.fecha === fecha)) throw new Error(textoApp("La factura no corresponde a un vencimiento.", "The bill does not match a due date."));
  const suscripciones = datos.suscripciones.map((s,i) => i === indice ? {...s,facturas:{...s.facturas,[fecha]:round(importe)}} : s);
  return {...datos,suscripciones};
}
function abrirFacturaServicio(identificador, fecha) {
  const evento = suscripcionesDelMes(fecha.slice(0,7)).find(s => String(s.id) === String(identificador) && s.fecha === fecha && s.categoria === "servicios");
  if (!evento) return;

  form.onsubmit=e=>{e.preventDefault();guardar(false);};

}
function registrarCobroProgramado(identificador, fecha) {

    const movimiento={id:id(),nombre:registro.nombre,tipo:"gasto",categoria:registro.categoria==="renta"?"Renta":registro.categoria==="servicios"?"Servicios":"Suscripciones",monto,fecha,suscripcionId:registro.id,vencimientoSuscripcion:fecha,...origenPagoSeleccionado(origen)};
    if(!guardarMovimientoBanco(null,movimiento))return;
    form.dataset.guardado="si";ventana.close();render();
  };
}

function desgloseCuotaPrestamo(prestamo, vencimiento) {
  const pagos = (data.movimientos || []).filter(m =>
    m.tipo === "gasto" &&
    m.prestamoId != null &&
    String(m.prestamoId) === String(prestamo.id) &&
    m.vencimientoPrestamo === vencimiento
  );

  const pagado = round(pagos.reduce(
    (total, m) => total + Number(m.monto), 0
  ));
  const interesesPagados = round(pagos.reduce(
    (total, m) => total + Number(m.interesPrestamo || 0), 0
  ));
  const capitalPagado = round(pagado - interesesPagados);
  const tasaGuardada = prestamo.contrato?.tasaAnual ??
    prestamo.tasaAnualInicial;
  const tasa = tasaGuardada === undefined || tasaGuardada === null ||
    String(tasaGuardada).trim() === "" ? null : Number(tasaGuardada);

  let interesPendiente = 0;
  let interesEstimado = null;

  if (tasa !== null && Number.isFinite(tasa) && tasa >= 0 && tasa <= 100) {
    const tasaPeriodo = prestamo.frecuencia === "cada14dias"
      ? tasa / 100 * 14 / 365
      : tasa / 1200;
    // Reconstituye el capital al inicio de la cuota para no cobrar
    // los mismos intereses otra vez en un segundo pago parcial.
    const capitalInicial = round(
      Number(prestamo.saldo) + capitalPagado
    );
    interesEstimado = round(capitalInicial * tasaPeriodo);
    interesPendiente = round(Math.max(
      0, interesEstimado - interesesPagados
    ));
  }

  const cuotaPendiente = round(Math.max(
    0, Number(prestamo.cuota) - pagado
  ));
  const maximo = round(Number(prestamo.saldo) + interesPendiente);
  const sugerido = round(Math.min(
    cuotaPendiente > 0 ? cuotaPendiente : Number(prestamo.cuota),
    maximo
  ));

  return {pagado, cuotaPendiente, interesPendiente, interesEstimado, sugerido};
}

function eliminarRegistroProgramado(tipo, indice) {
  const clave = tipo === "prestamo" ? "prestamos"
    : tipo === "suscripcion" ? "suscripciones" : null;
  if (!clave) return;

  const lista = Array.isArray(data[clave]) ? data[clave] : [];
  const registro = lista[indice];
  if (!registro) return;

  if (
    tipo === "prestamo" &&
    data.movimientos.some(m =>
      m.prestamoId != null &&
      String(m.prestamoId) === String(registro.id)
    )
  ) {
    alert(textoApp(
      "Este préstamo tiene pagos registrados. Conservaremos el registro para poder corregir esos pagos sin descuadrar los saldos. Después añadiremos Archivar.",
      "This loan has recorded payments. Keep it so those payments can be corrected without affecting balance accuracy. An Archive option will be added later."
    ));
    return;
  }

  const mensaje = tipo === "prestamo"
    ? textoApp(
        "¿Eliminar este préstamo de Balance One? No cancela la deuda con el banco o aplicación.",
        "Delete this loan from Balance One? This does not cancel the debt with the bank or app."
      )
    : textoApp(
        "¿Eliminar este pago programado? No cancela el servicio ni borra gastos ya registrados.",
        "Delete this scheduled payment? This does not cancel the service or delete recorded expenses."
      );

  if (!confirm(mensaje + "\n\n" + registro.nombre)) return;

  const nuevosDatos = {
    ...data,
    [clave]: lista.filter((_, i) => i !== indice)
  };

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp(
      "No se pudo eliminar. No se hicieron cambios.",
      "Could not delete. No changes were made."
    ));
    return;
  }

  data = nuevosDatos;

  const ventana = document.querySelector(".apariencia-ventana");
  if (ventana) ventana.close();

  render();
}
function estimarSaldoAnterior(
  montoOriginal,
  tasaAnual,
  cuota,
  pagosRealizados
) {
  const valores = [
    montoOriginal, tasaAnual, cuota, pagosRealizados
  ];

  if (
    !valores.every(v => Number.isFinite(v)) ||
    montoOriginal <= 0 ||
    cuota <= 0 ||
    tasaAnual < 0 ||
    tasaAnual > 100 ||
    !Number.isInteger(pagosRealizados) ||
    pagosRealizados < 0 ||
    pagosRealizados > 1200
  ) {
    throw new Error("datos");
  }

  let saldo = round(montoOriginal);
  const tasaMensual = tasaAnual / 1200;

  for (
    let i = 0;
    i < pagosRealizados && saldo > 0;
    i++
  ) {
    const interes = round(saldo * tasaMensual);

    if (cuota <= interes) {
      throw new Error("cuota");
    }

    const capital = round(cuota - interes);
    saldo = round(Math.max(0, saldo - capital));
  }

  return saldo;
}

function proyectarInteresesPrestamo(p) {
  const tasaGuardada = p.tasaAnualInicial;

  if (
    tasaGuardada === undefined ||
    tasaGuardada === null ||
    String(tasaGuardada).trim() === ""
  ) return {error:"tasa"};

  const tasa = Number(tasaGuardada);
  const cuota = Number(p.cuota);
  let saldo = round(p.saldo);

  if (
    !Number.isFinite(tasa) || tasa < 0 || tasa > 100 ||
    !Number.isFinite(saldo) || saldo < 0 ||
    !validAmount(cuota)
  ) return {error:"datos"};

  if (p.frecuencia !== "mensual") {
    return {error:"frecuencia"};
  }

  let total = 0;
  let intereses = 0;
  let cuotas = 0;

  while (saldo > 0 && cuotas < 1200) {
    const interes = round(saldo * tasa / 1200);

    if (cuota <= interes) return {error:"cuota"};

    const pago = round(Math.min(cuota, saldo + interes));

    saldo = round(Math.max(0, saldo - (pago - interes)));
    total = round(total + pago);
    intereses = round(intereses + interes);
    cuotas++;
  }

  if (saldo > 0) return {error:"plazo"};

  return {tasa, total, intereses, cuotas};
}

          "text", 'maxlength="80" required'
        )}

        <div class="prestamo-dos">
          ${campo(
            "original", "Monto original", "Original amount",
            "number", 'min="0.01" step="0.01" required'
          )}
          ${campo(
  "tasa", "APR (%)", "APR (%)",
  "number", 'min="0" step="any" required'
)}
<input name="intereses" type="hidden">
        </div>

        <div style="display:flex;justify-content:space-between;
          align-items:center;gap:10px;padding:12px;border-radius:18px;
          background:rgba(255,121,0,.09);
          color:var(--balanceone-color,#ff7900)">
          <span>${textoApp("Total estimado a pagar", "Estimated total to pay")}</span>
          <strong data-total-contrato role="status">—</strong>
        </div>

        <small data-intereses-apr class="note" role="status"></small>
        <div class="prestamo-dos">
          ${campo(
            "cuota", "Cuota", "Installment",
            "number", 'min="0.01" step="0.01" required'
          )}
          <label style="min-width:0">
            <span class="label">${textoApp("Frecuencia", "Frequency")}</span>
            <select name="frecuencia" style="width:100%;
              box-sizing:border-box;min-width:0;margin-top:5px;
              padding:10px 12px;border-radius:16px">
              <option value="mensual">${textoApp("Mensual","Monthly")}</option>
              <option value="cada14dias">
                ${textoApp("Cada 14 días","Every 14 days")}
              </option>
            </select>
          </label>
        </div>

        <details data-fechas>
          <summary>${textoApp("Fechas del préstamo", "Loan dates")}</summary>
          ${campo("inicio","Fecha de inicio","Start date","date","required")}
          ${campo("proximo","Próximo pago","Next payment","date","required")}
          ${campo("fin","Último pago previsto","Expected final payment","date","required")}
          
        </details>

        <details data-anterior>
          <summary>${textoApp(
            "¿Ya empezaste a pagarlo?",
            "Already started paying?"
          )}</summary>

          <label style="display:block;margin:10px 0">
            <input name="empezado" type="checkbox"
              style="width:auto;margin-right:8px">
            ${textoApp("Sí, ya hice pagos", "Yes, I already made payments")}
          </label>

          <div data-saldo-anterior hidden>
            ${campo(
              "saldoActual",
              "Capital pendiente actual",
              "Current outstanding principal",
              "number",'min="0.01" step="0.01"'
            )}
            <p class="note">${textoApp(
              "Introduce el capital que aún debes según el banco. Los pagos anteriores no se descuentan otra vez de tu cuenta.",
              "Enter the principal still owed according to your lender. Previous payments will not be deducted from your account again."
            )}</p>
          </div>
        </details>

        <button type="submit" class="primary"
          style="background:var(--balanceone-color,#ff7900);
          border-radius:999px">
          ${textoApp("Guardar préstamo", "Save loan")}
        </button>
      </form>
    `,
    true
  );

  if (!ventana) return;

  const estilo = document.createElement("style");
  estilo.textContent = `
    #prestamoCompactoNuevo {display:grid;gap:12px}
    #prestamoCompactoNuevo .prestamo-dos {
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
    }
    #prestamoCompactoNuevo details {
      padding:12px;border-radius:18px;
      border:1px solid rgba(130,140,155,.2);
    }
    #prestamoCompactoNuevo summary {cursor:pointer;font-weight:600}
    #prestamoCompactoNuevo details > label {margin-top:10px}
    #prestamoCompactoNuevo input,
    #prestamoCompactoNuevo select {max-width:100%}
  `;
  ventana.appendChild(estilo);

  const cerrar = ventana.querySelector(".apariencia-listo");
  cerrar.textContent = textoApp("Cancelar", "Cancel");
  cerrar.style.cssText +=
    ";background:transparent;color:inherit;padding:8px;margin-top:8px";

  const form = ventana.querySelector("form");
  const f = form.elements;

  function actualizarTotal() {
  const salida = ventana.querySelector("[data-total-contrato]");
  const detalle = ventana.querySelector("[data-intereses-apr]");

  f.intereses.value = "";
  salida.textContent = "—";
  detalle.textContent = "";

  if (
    f.original.value === "" ||
    f.tasa.value === "" ||
    f.cuota.value === ""
  ) return;

  let saldo = round(f.original.value);
  const tasa = Number(f.tasa.value);
  const cuota = round(f.cuota.value);
  const frecuencia = f.frecuencia.value;

  if (
    !validAmount(saldo) ||
    !validAmount(cuota) ||
    !Number.isFinite(tasa) ||
    tasa < 0 ||
    !["mensual","cada14dias"].includes(frecuencia)
  ) return;

  const tasaPeriodo = frecuencia === "mensual"
    ? tasa / 1200
    : tasa / 100 * 14 / 365;

  let intereses = 0;
  let total = 0;
  let cuotas = 0;

  while (saldo > 0 && cuotas < 1200) {
    const interes = round(saldo * tasaPeriodo);

    if (!Number.isFinite(interes) || cuota <= interes) {
      detalle.textContent = textoApp(
        "La cuota debe superar los intereses.",
        "The installment must exceed interest."
      );
      return;
    }

    const pago = round(Math.min(cuota, saldo + interes));
    saldo = round(Math.max(0, saldo - (pago - interes)));
    intereses = round(intereses + interes);
    total = round(total + pago);
    cuotas++;
  }

  if (saldo > 0 || !Number.isFinite(total)) return;

  f.intereses.value = intereses.toFixed(2);
  salida.textContent = money(total);

  detalle.textContent = textoApp(
    "Intereses estimados: ",
    "Estimated interest: "
  ) + money(intereses) + " · " + cuotas + textoApp(
    " cuotas",
    " installments"
  );
}

f.original.oninput = actualizarTotal;
f.tasa.oninput = actualizarTotal;
f.cuota.oninput = actualizarTotal;
f.frecuencia.onchange = actualizarTotal;

form.addEventListener("submit", event => {
  actualizarTotal();

  if (f.intereses.value === "") {
    event.preventDefault();
    event.stopImmediatePropagation();
    alert(textoApp(
      "Revisa el monto, APR y cuota para calcular el total.",
      "Check the amount, APR and installment to calculate the total."
    ));
  }
}, true);

  f.empezado.onchange = () => {
    form.querySelector("[data-saldo-anterior]").hidden =
      !f.empezado.checked;
    f.saldoActual.required = f.empezado.checked;
  };

  form.addEventListener("invalid", event => {
    const seccion = event.target.closest("details");
    if (seccion) seccion.open = true;
  }, true);

  form.onsubmit = event => {
    event.preventDefault();
    if (form.dataset.guardado === "si") return;

    const nombre = f.nombre.value.trim();
    const montoOriginal = round(f.original.value);
    const interesesTotales = round(f.intereses.value);
    const cuota = round(f.cuota.value);
    const tasaAnual = f.tasa.value === "" ? null : Number(f.tasa.value);
    const inicio = f.inicio.value;
    const proximo = f.proximo.value;
    const fin = f.fin.value;
    const frecuencia = f.frecuencia.value;
    const saldo = f.empezado.checked
      ? round(f.saldoActual.value) : montoOriginal;

    if (
      !nombre || !validAmount(montoOriginal) ||
      !Number.isFinite(interesesTotales) || interesesTotales < 0 ||
      !Number.isFinite(round(montoOriginal + interesesTotales)) ||
      !validAmount(cuota) || !validAmount(saldo) ||
      !validDate(inicio) || !validDate(proximo) || !validDate(fin) ||
      proximo < inicio || fin < proximo ||
      !["mensual","cada14dias"].includes(frecuencia) ||
      (tasaAnual !== null &&
        (!Number.isFinite(tasaAnual) || tasaAnual < 0))
    ) {
      alert(textoApp(
        "Revisa los importes y las fechas.",
        "Check the amounts and dates."
      ));
      return;
    }

    const prestamo = {
      id:id(), nombre, saldo, saldoInicial:saldo,
      montoOriginal, fechaInicio:inicio,
      cuota, proximo, fin, frecuencia,
      contrato:{
  montoOriginal, interesesTotales, tasaAnual,
  estimado:true
}
    };

    const nuevosDatos = {
      ...data,
      prestamos:[
        ...(Array.isArray(data.prestamos) ? data.prestamos : []),
        prestamo
      ]
    };

    try {
      localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
    } catch {
      alert(textoApp(
        "No se pudo guardar. No se hicieron cambios.",
        "Could not save. No changes were made."
      ));
      return;
    }

    form.dataset.guardado = "si";
    data = nuevosDatos;
    ventana.close();
    render();
  };
}
function actualizarCalendarioPrestamo(p, movimientos) {
  const inicio = p.calendarioInicio || p.proximo;
  if (!validDate(inicio) || !validDate(p.fin)) return;

  p.calendarioInicio = inicio;

  const [anio, mes, dia] = inicio.split("-").map(Number);
  const base = Date.UTC(anio, mes - 1, dia);
  const pagado = new Map();

  for (const m of movimientos) {
    if (
      String(m.prestamoId) !== String(p.id) ||
      m.tipo !== "gasto" ||
      !validDate(String(m.vencimientoPrestamo))
    ) continue;

    const fecha = m.vencimientoPrestamo;

    pagado.set(
      fecha,
      round((pagado.get(fecha) || 0) + Number(m.monto))
    );
  }

  p.cuotasPagadas = [];
  let siguiente = null;

  for (let i = 0; i < 1200; i++) {
    let fecha;

    if (p.frecuencia === "cada14dias") {
      fecha = new Date(
        base + i * 14 * 86400000
      ).toISOString().slice(0,10);
    } else {
      const ultimo = new Date(
        Date.UTC(anio, mes + i, 0)
      ).getUTCDate();

      fecha = new Date(
        Date.UTC(anio, mes - 1 + i, Math.min(dia, ultimo))
      ).toISOString().slice(0,10);
    }

    if (fecha > p.fin) break;

    const suma = pagado.get(fecha) || 0;
    const cubierta = suma >= Number(p.cuota) ||
      (Number(p.saldo) === 0 && suma > 0);

    if (cubierta) {
      p.cuotasPagadas.push(fecha);
    } else if (!siguiente) {
      siguiente = fecha;
    }
  }

  p.calendarioCompleto = Number(p.saldo) === 0 || !siguiente;
  p.proximo = siguiente || p.fin;
}
function pagarCuotaDesdeCalendario(indice, fecha) {
  const ventana = document.querySelector(".cal-dia-ventana");

  if (ventana) {
    ventana.addEventListener("close", () => {
      setTimeout(() => abrirPagoPrestamo(indice, fecha), 0);
    }, {once:true});
    ventana.close();
  } else {
    abrirPagoPrestamo(indice, fecha);
  }
}

function simplificarPagoPrestamo(form) {
  const detalles = document.createElement("details");
  detalles.style.cssText = `
    margin:12px 0;padding:12px;border-radius:18px;
    background:rgba(130,140,155,.07);
  `;

  const titulo = document.createElement("summary");
  titulo.textContent = textoApp(
    "Otros detalles: fecha e intereses",
    "Other details: date and interest"
  );
  detalles.appendChild(titulo);

  const guardar = form.querySelector('[type="submit"]');
  form.insertBefore(detalles, guardar);

  ["intereses", "fecha"].forEach(nombre => {
    const campo = form.elements[nombre];
    const etiqueta = form.querySelector(
      'label[for="' + campo.id + '"]'
    );

    if (etiqueta) detalles.appendChild(etiqueta);
    detalles.appendChild(campo);
  });

  const aviso = form.querySelector("p.note");
  if (aviso) detalles.appendChild(aviso);

  detalles.addEventListener("invalid", () => {
    detalles.open = true;
  }, true);

  const ventana = form.closest("dialog");
  const cerrar = ventana.querySelector(".apariencia-listo");

  cerrar.textContent = textoApp("Cancelar", "Cancel");
  cerrar.style.cssText +=
    ";background:transparent;color:inherit;padding:8px;margin-top:8px";
}
