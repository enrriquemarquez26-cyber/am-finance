
<!DOCTYPE html>

      content="black-translucent">

<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F7;color:#17212e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#F2F2F7;padding:24px 20px 10px;border-bottom:none}
.logo{font-size:1.4375rem;font-weight:300}
.sub{color:#84909d;font-size:0.8125rem;margin-top:5px}
main{padding:20px 16px 105px;max-width:650px;margin:auto}
h2{font-size:1.3125rem;margin:0 0 17px}
h3{margin:0 0 14px}
.card{background:white;border:1px solid transparent;border-radius:19px;padding:19px;margin-bottom:14px}
.label{font-size:0.8125rem;color:#7c8795}
.amount{font-size:2.125rem;font-weight:800;margin:9px 0}
.smallamount{font-size:1.5rem;font-weight:750;margin-top:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.green{color:#13865b}
.red{color:#d44d56}
.primary{background:#172b38;color:white;border:0;border-radius:13px;padding:14px 18px;font-size:15px;font-weight:650;width:100%}
.secondary{background:#e7f2f3;color:#147e86;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:650;width:100%;margin-top:12px}
input,select{width:100%;padding:13px;border:1px solid #dce2e7;border-radius:12px;font-size:16px;background:white;margin:7px 0 13px}
button{cursor:pointer}
/* Barra flotante Balance One */
nav {
  position: fixed;
  bottom: env(safe-area-inset-bottom);
  left: 28px;
  right: 28px;
  width: auto;
  padding: 5px 7px;
  border-radius: 999px;
  background: rgba(250,251,255,.82);
  border: 1px solid rgba(120,125,135,.25);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.95), 0 4px 14px rgba(0,0,0,.04);
  display: flex;
  gap: 3px;
  z-index: 100;
  backdrop-filter: blur(40px);
-webkit-backdrop-filter: blur(40px);
  transform: translateY(0);
  transition: transform 0.3s ease;
}

nav button {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #fff;
  padding: 7px 2px;
}

/* Burbuja ovalada visible para la pestaña seleccionada, en ambos temas. */
nav button.active {
  background: rgba(155,165,185,.26);
  box-shadow: inset 0 0 0 1px rgba(145,155,175,.12);
}

/* Barra adaptable a modo claro y oscuro */
@media (prefers-color-scheme: light) {
  nav {
    background: rgba(250,251,253,.78);
    border-color: rgba(120,125,135,.25);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.95),
      0 4px 14px rgba(0,0,0,.04);
  }

  nav button {
    color: #252525;
  }

  nav button.active {
    background: rgba(180,180,190,0.25);
    color: #F28C28;
    padding-left: 14px;
    padding-right: 14px;
    transform: scaleY(1);
  }
}

/* Alinear iconos y textos de la barra */
nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  font-size: 11px;
  white-space: nowrap;
}

nav button svg {
  display: block;
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  padding: 6px;
  border-radius: 50%;
  color: #fff;
  stroke-width: 2.2;
  box-shadow: 0 4px 9px rgba(0,0,0,.14);
}

/* Iconos redondos como los de la ventana de Herramientas. */
#nav-inicio svg {background: linear-gradient(145deg,#54c9ff,#0087f7);}
#nav-transferencias svg {background: linear-gradient(145deg,#ffaa54,#ff6a2e);}
#nav-vehiculos svg {background: linear-gradient(145deg,#65e6a4,#00bd5a);}
#nav-tarjetas svg {background: linear-gradient(145deg,#d45bff,#8e16eb);}
#nav-perfil svg {background: linear-gradient(145deg,#55575d,#191b20);}

nav button span {
  font-size: 10px;
  line-height: 1.2;
  font-weight: 500;
}
.item{border-bottom:1px solid #f0f1f3;padding:13px 0}
.item:last-child{border:0}
.note{font-size:0.75rem;color:#89939f;line-height:1.5}
/* Balance One: una única cápsula de notificaciones que se expande en sí misma. */
.avisos-fondo {
  position:fixed;
  inset:0;
  z-index:1010;
  background:rgba(17,23,36,.28);
  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
}
.avisos-ancla {position:relative;height:60px;margin:0 0 25px 3px}
.avisos-vencimiento {
  position:absolute;left:0;top:0;
  z-index:1;
  width:min(164px,52vw);
  max-width:100%;
  margin:0;
  border:1px solid rgba(175,183,195,.23);
  border-radius:30px;
  background:rgba(255,255,255,.94);
  color:#17212e;
  box-shadow:0 3px 12px rgba(20,30,50,.035);
  overflow:hidden;
  transition:width .28s ease,border-radius .28s ease,box-shadow .28s ease;
}
/* Si tampoco hace falta respaldo, la cápsula permanece como Todo al día. */
.avisos-vencimiento--vacio:not(.is-abierto) .aviso-vencimiento {justify-content:center}
.avisos-vencimiento--vacio:not(.is-abierto) .aviso-vencimiento-texto {
  flex:0 1 auto;text-align:center;
}
.aviso-lista--vacia {
  padding:18px 14px 22px;
  text-align:center;color:#84909e;font-size:.82rem;
}
html.tema-oscuro .aviso-lista--vacia {color:#b4becb}
.avisos-vencimiento.is-abierto {
  z-index:1011;
  width:min(385px,calc(100vw - 38px));
  border-radius:34px;
  background:rgba(255,255,255,.96);
  box-shadow:0 18px 42px rgba(14,20,36,.21);
}
.aviso-vencimiento {
  display:flex;align-items:center;gap:4px;width:100%;min-height:44px;
  padding:5px 7px;border:0;border-radius:inherit;
  background:transparent;box-shadow:none;
  color:inherit;font:inherit;text-align:left;
}
.aviso-vencimiento:focus-visible,
.aviso-detalle:focus-visible {outline:2px solid var(--balanceone-color,#ff7900);outline-offset:-3px}
.aviso-vencimiento-icono {
  display:grid;place-items:center;flex:0 0 28px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(135,145,160,.09);color:#ff7900;
  position:relative;overflow:hidden;
}
.aviso-vencimiento-icono img {position:absolute;inset:4px;width:20px;height:20px;border-radius:50%;object-fit:contain;opacity:0;transition:opacity .15s ease}
.aviso-icono-base {display:grid;place-items:center;width:100%;height:100%;font-weight:750;font-size:16px}
.aviso-icono-base--apple {color:#1d222a}
html.tema-oscuro .aviso-icono-base--apple {color:#fff}
.aviso-vencimiento-icono svg {width:19px;height:19px}
.aviso-vencimiento-icono--apple {background:#fff}
/* El grupo tiene ancho fijo: las miniaturas se superponen y nunca alargan la cápsula. */
.aviso-miniaturas {display:block;position:relative;flex:0 0 22px;width:22px;height:27px;margin-left:-10px;overflow:visible}
.aviso-miniaturas .aviso-miniatura {
  display:grid;place-items:center;position:absolute;left:0;top:3px;
  width:20px;height:20px;margin:0;border-radius:50%;border:1.5px solid #fff;
  background:#eef2f9;color:#277cd7;overflow:hidden;
}
.aviso-miniaturas .aviso-miniatura:nth-child(2) {left:3px;top:5px;z-index:2}
.aviso-miniaturas .aviso-miniatura:nth-child(3) {left:6px;top:7px;z-index:3}
.aviso-miniaturas .aviso-miniatura:nth-child(4) {left:8px;top:8px;z-index:4}
.aviso-miniatura img {position:absolute;inset:1px;width:16px;height:16px;object-fit:contain;border-radius:50%;opacity:0}
.aviso-miniatura svg {width:13px;height:13px}
.aviso-miniatura--mas {font-size:9px;font-weight:700}
.aviso-vencimiento-texto {display:grid;gap:2px;flex:1;min-width:0}
.aviso-vencimiento-texto strong {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;font-weight:750}
.aviso-vencimiento-texto small {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8792a2;font-size:.65rem}
.aviso-vencimiento-flecha {
  position:relative;display:grid;place-items:center;flex:0 0 23px;
  width:23px;height:23px;border-radius:50%;
  background:rgba(145,153,166,.1);font-size:1.08rem;line-height:1;
}
.aviso-vencimiento-flecha::after {
  content:"";position:absolute;right:0;top:0;width:7px;height:7px;
  border:1px solid #fff;border-radius:50%;background:#ff7900;
}
.avisos-vencimiento.is-abierto .aviso-vencimiento-flecha::after {display:none}
.avisos-vencimiento.is-abierto .aviso-vencimiento {min-height:58px;gap:9px;padding:9px 12px}
/* Los logos aparecen solo en la cápsula cerrada; el encabezado abierto es texto limpio. */
.avisos-vencimiento.is-abierto .aviso-vencimiento > .aviso-vencimiento-icono {display:none}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto strong {font-size:.82rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto small {font-size:.72rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-flecha {flex-basis:29px;width:29px;height:29px;transform:rotate(90deg)}
 .avisos-abierto {display:none}
.avisos-vencimiento.is-abierto .avisos-cerrado {display:none}
.avisos-vencimiento.is-abierto .avisos-abierto {display:inline}
.avisos-vencimiento.is-abierto .aviso-miniaturas {display:none}
.aviso-detalles {max-height:0;opacity:0;visibility:hidden;overflow:hidden;pointer-events:none;
  transition:max-height .29s ease,opacity .20s ease,visibility .2s ease}
.avisos-vencimiento.is-abierto .aviso-detalles {
  max-height:min(62vh,510px);opacity:1;visibility:visible;pointer-events:auto;
}
.aviso-lista {overflow-y:auto;max-height:min(58vh,468px);padding:0 9px 11px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.aviso-detalle {
  width:100%;display:flex;align-items:center;gap:9px;
  padding:10px 9px;margin-top:7px;border:1px solid rgba(149,161,181,.12);
  border-radius:22px;background:rgba(147,158,176,.07);
  color:inherit;text-align:left;font:inherit;min-height:61px;
}
.aviso-detalle .aviso-vencimiento-icono {flex-basis:34px;width:34px;height:34px}
.aviso-detalle .aviso-vencimiento-icono img {width:25px;height:25px}
.aviso-detalle-datos {display:grid;gap:3px;min-width:0;flex:1}
.aviso-detalle-datos strong {font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aviso-detalle-datos small {font-size:.68rem;color:#84909e}
.aviso-detalle-importe {font-size:.75rem;font-weight:700;white-space:nowrap}
.aviso-detalle-chevron {color:#8792a2;font-size:19px}
html.tema-oscuro .avisos-vencimiento,
html.tema-oscuro .avisos-vencimiento.is-abierto {
  color:#f5f6f8;background:rgba(34,39,48,.97);
  border-color:rgba(225,230,240,.17);
}
html.tema-oscuro .aviso-vencimiento-icono {background:#353d49;color:#ff9a45}
html.tema-oscuro .aviso-vencimiento-icono--apple {background:#343b45}
html.tema-oscuro .aviso-miniatura {border-color:#2b3039;background:#45505f}
html.tema-oscuro .aviso-vencimiento-texto small,
html.tema-oscuro .aviso-detalle-datos small {color:#b4becb}
html.tema-oscuro .aviso-vencimiento-flecha,
html.tema-oscuro .aviso-detalle {background:rgba(255,255,255,.075)}
html.tema-oscuro .aviso-detalle {border-color:rgba(255,255,255,.07)}
/* Balance One · modelo de ventana Liquid Glass aprobado.
   La forma cambia SOLO al expandir; la cápsula cerrada y los datos no se modifican.
   No se añade pestaña superior, tirador, adorno circular ni logos en el título. */
.avisos-vencimiento.is-abierto {
  width:min(350px,calc(100vw - 48px));
  border-radius:40px;
  border:1px solid rgba(255,255,255,.78);
  background:linear-gradient(150deg,rgba(248,249,253,.87),rgba(229,233,241,.79));
  backdrop-filter:blur(28px) saturate(145%);
  -webkit-backdrop-filter:blur(28px) saturate(145%);
  box-shadow:0 18px 46px rgba(15,24,43,.21),inset 0 1px 0 rgba(255,255,255,.8);
  padding:9px 9px 10px;
}
.avisos-vencimiento.is-abierto > .aviso-vencimiento {
  min-height:58px;
  padding:8px 12px 7px;
  border-radius:30px;
}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto strong {font-size:.87rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-texto small {font-size:.71rem}
.avisos-vencimiento.is-abierto .aviso-vencimiento-flecha {
  background:rgba(255,255,255,.73);
  border:1px solid rgba(255,255,255,.72);
}
.avisos-vencimiento.is-abierto .aviso-lista {padding:1px 4px 4px}
.avisos-vencimiento.is-abierto .aviso-detalle {
  min-height:59px;
  margin-top:6px;
  padding:8px 9px;
  border-radius:27px;
  border:1px solid rgba(255,255,255,.78);
  background:rgba(255,255,255,.64);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 5px rgba(50,65,92,.035);
}
html.tema-oscuro .avisos-vencimiento.is-abierto {
  background:linear-gradient(150deg,rgba(52,58,70,.91),rgba(31,36,47,.86));
  border-color:rgba(255,255,255,.18);
  box-shadow:0 18px 46px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
html.tema-oscuro .avisos-vencimiento.is-abierto .aviso-detalle {
  background:rgba(255,255,255,.095);
  border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
html.tema-oscuro .avisos-vencimiento.is-abierto .aviso-vencimiento-flecha {
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.12);
}
@media (max-width:359px) {
  .avisos-vencimiento.is-abierto {border-radius:37px;padding:8px}
  .avisos-vencimiento.is-abierto .aviso-detalle {border-radius:25px}
}
/* Ajustes → Notificaciones inteligentes · estilos locales, sin afectar Inicio. */
.ajuste-avisos .ajuste-avisos-card {border-radius:25px;padding:17px;margin-bottom:12px}
.ajuste-avisos .ajuste-avisos-card h3 {font-size:.94rem;margin:0 0 8px}
.ajuste-avisos .note {margin:0 0 13px;line-height:1.5}
.ajuste-avisos-dias {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ajuste-aviso-dia {border:1px solid rgba(145,155,170,.16);background:rgba(140,152,172,.08);
  border-radius:999px;padding:11px 3px;font:inherit;font-size:.78rem;font-weight:650;color:inherit}
.ajuste-aviso-dia.seleccionado {background:rgba(255,132,32,.13);border-color:rgba(255,132,32,.35);color:#b65d09}
.ajuste-aviso-dia:focus-visible,.ajuste-aviso-tipo:focus-visible {outline:2px solid #ff7900;outline-offset:3px}
.ajuste-aviso-tipo {width:100%;margin:0;padding:12px 0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;border:0;border-bottom:1px solid rgba(140,151,168,.11);background:transparent;font:inherit;color:inherit;text-align:left}
.ajuste-aviso-tipo:last-child {border-bottom:0;padding-bottom:1px}
.ajuste-aviso-tipo-info {display:grid;gap:4px;flex:1;min-width:0}
.ajuste-aviso-tipo-info strong {font-size:.84rem}
.ajuste-aviso-tipo-info small {font-size:.70rem;color:#8692a0}
.ajuste-aviso-switch {display:flex;align-items:center;width:44px;height:27px;border-radius:999px;padding:3px;flex:0 0 44px;
  background:rgba(134,142,154,.33);transition:background .16s ease}
.ajuste-aviso-switch > span {display:block;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .16s ease}
.ajuste-aviso-switch.activo {background:#26ae79}
.ajuste-aviso-switch.activo > span {transform:translateX(17px)}
.ajuste-avisos .ajuste-aviso-ayuda {padding:4px 10px 18px;color:#8894a1}
html.tema-oscuro .ajuste-aviso-dia {border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.065)}
html.tema-oscuro .ajuste-aviso-dia.seleccionado {background:rgba(255,132,32,.18);color:#ffc58d;border-color:rgba(255,132,32,.44)}
html.tema-oscuro .ajuste-aviso-tipo {border-color:rgba(255,255,255,.09)}
html.tema-oscuro .ajuste-aviso-tipo-info small {color:#aab6c4}
/* Recordatorios pagados: acciones accesibles sin cambiar el tamaño de la barrita cerrada. */
/* Las acciones de pago viven en la misma fila: no aumentan la altura del aviso. */
.avisos-vencimiento.is-abierto .aviso-detalle {
  display:flex;align-items:center;gap:5px;min-height:59px;
}
.aviso-detalle-abrir {display:flex;align-items:center;gap:7px;flex:1;min-width:0;width:auto;padding:0;
  border:0;background:transparent;box-shadow:none;text-align:left;color:inherit;font:inherit}
.aviso-detalle-abrir .aviso-detalle-datos {flex:1;min-width:0}
.aviso-detalle-abrir .aviso-detalle-importe {font-size:.71rem}
.aviso-detalle-acciones {display:flex;align-items:center;justify-content:center;
  margin:0;flex:0 0 28px;min-width:28px}
.aviso-accion-pago {display:grid;place-items:center;width:28px;height:28px;padding:0;
  font:inherit;font-size:16px;font-weight:750;line-height:1;border-radius:50%;
  border:1px solid rgba(25,133,91,.17);color:#157d59;
  background:rgba(27,160,108,.095);cursor:pointer}
.aviso-accion--deshacer {color:#6e7887;border-color:rgba(125,135,153,.21);
  background:rgba(135,146,162,.10)}
.aviso-estado-registrado {font-size:16px;color:#157d59;font-weight:650}
.aviso-detalle--pagado {opacity:.83}
.aviso-pagados-titulo {font-size:.71rem;color:#658172;font-weight:750;
  margin:12px 8px 3px}
.aviso-nota-pagos {font-size:.64rem;line-height:1.4;color:#8895a5;
  margin:10px 8px 5px;text-align:center}
html.tema-oscuro .aviso-accion-pago,html.tema-oscuro .aviso-estado-registrado {color:#81d5ae}
/* El respaldo usa la misma fila compacta, sin botón de marcar como pagado. */
.aviso-detalle--respaldo .aviso-detalle-abrir {min-height:40px}
.aviso-detalle--respaldo .aviso-vencimiento-icono {color:#ee8c26}
html.tema-oscuro .aviso-detalle--respaldo .aviso-vencimiento-icono {color:#ffb86e}
html.tema-oscuro .aviso-accion--deshacer {color:#c2ccd8}
html.tema-oscuro .aviso-nota-pagos {color:#aab6c4}
.aviso-accion-pago:focus-visible,.aviso-detalle-abrir:focus-visible {
  outline:2px solid var(--balanceone-color,#ff7900);outline-offset:1px}
@media (prefers-reduced-motion:reduce) {
  .avisos-vencimiento,.aviso-detalles {transition:none}
}
.payment{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.hidden{display:none}
.editbox{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.editbox input,
.editbox select,
.editbox button {
  border-radius: 999px;
}
.editbox input[type="date"] {
  -webkit-appearance: none;

  display: block;

  min-width: 0;

  padding: 11px 16px;
  border-radius: 999px;
  font: inherit;

.editbox input[type="date"]::-webkit-date-and-time-value {

/* Modo oscuro automático del iPhone */
/* Modo oscuro seleccionado manualmente */
html.tema-oscuro body {
  background: #101216;
  color: #f5f6f8;
}

html.tema-oscuro header {
  background: #101216;
  border-color: transparent;
}

html.tema-oscuro nav {
  background: rgba(30,32,38,.78);
  border-color: rgba(255,255,255,.14);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.08),
    0 4px 14px rgba(0,0,0,.2);
}

html.tema-oscuro .card {
  background: #20242b;
  border-color: #343943;
}

html.tema-oscuro .sub,
html.tema-oscuro .label,
html.tema-oscuro .note {
  color: #aab3c2;
}

html.tema-oscuro .item {
  border-color: #343943;
}

html.tema-oscuro .payment,
html.tema-oscuro .editbox,
html.tema-oscuro input,
html.tema-oscuro select,
html.tema-oscuro textarea {
  background: #2a3039;
  color: #ffffff;
  border-color: #49515e;
}

html.tema-oscuro .secondary {
  background: #343b46;

/* Menú flotante Balance One */
#amMenuFondo {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  opacity: 0;
  visibility: hidden;
  transition: .3s;
  z-index: 9998;
}

#amMenu {
  position: fixed;
  left: 8px;
  right: 8px;
  bottom: calc(24px + env(safe-area-inset-bottom));
  padding: 18px 8px 24px;
  border-radius: 48px;
  background: rgba(250,251,255,.82);
  color: #17212e;
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(120,125,135,.25);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.95),
    0 4px 14px rgba(0,0,0,.04);
  transform: translateY(120%);
  visibility: hidden;
  transition: transform .35s ease, visibility .35s;
  z-index: 9999;
height: 486px;
box-sizing: border-box;
overflow: hidden;
}

#amMenuTirador {
  width: 40px;
  height: 5px;
  border-radius: 20px;
  background: #868f9f;
  margin: 0 auto 14px;
}

#amMenu h3 {
  color: inherit;
  margin: 0 0 18px 16px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -.6px;
}

#amMenu button {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 13px 15px;
  min-height: 121px;
  border-radius: 999px;
  text-align: center;
  white-space: normal;
  color: #17212e;
  font-size: 14px;
  background: rgba(255,255,255,.56);
  border: 1px solid rgba(255,255,255,.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.84), 0 5px 16px rgba(40,54,82,.045);
}

#amMenu .amPagina {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 8px;
  row-gap: 12px;
  height: 387px;
  align-content: start;
  box-sizing: border-box;
}

#amPaginas {
  display: flex;
  width: 100%;
  height: 387px;
  overflow-x: hidden;
  overflow-y: hidden;
}

#amPaginas .amPagina {
  flex: 0 0 100%;
  width: 100%;
  height: 387px;
}
#amPaginas .amPagina button.am-herramienta {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  transform: scale(.97);
  gap: 0;
  padding: 14px 18px 14px 22px;
  text-align: left;
}

#amPaginas .amPagina button svg {
  display: block;
  flex-shrink: 0;
}

#amMenu #amMenuCerrar {
  position: absolute;
  top: 15px;
  right: 20px;
  width: 34px;
  height: 34px;
  min-height: 34px;
  padding: 7px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  border: 1px solid rgba(255,255,255,.85);
  color: #111d32;
  box-shadow: 0 2px 7px rgba(31,43,66,.05);
}

.am-herramienta-icono {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 50%;
  color: #fff;
  box-shadow: 0 4px 9px rgba(0,0,0,.14);
}
.am-herramienta-icono svg { width: 18px; height: 18px; }
.am-icono--suscripciones { background: linear-gradient(145deg,#54c9ff,#0087f7); }
.am-icono--pagos { background: linear-gradient(145deg,#ffaa54,#ff6a2e); }
.am-icono--metas { background: linear-gradient(145deg,#65e6a4,#00bd5a); }
.am-icono--calculadora { background: linear-gradient(145deg,#d45bff,#8e16eb); }
.am-icono--deudas { background: linear-gradient(145deg,#ff6e88,#f3234d); }
.am-icono--apple { background: linear-gradient(145deg,#55575d,#191b20); }

.am-herramienta-flecha {
  position: absolute;
  top: 22px;
  right: 16px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #111d32;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(255,255,255,.96);
  box-shadow: 0 2px 7px rgba(24,42,69,.04);
}
.am-herramienta-flecha svg {width: 16px;height: 16px;}
.am-herramienta-flecha::before {
  content: "";
  width: 7px;
  height: 7px;
  border-top: 2.4px solid currentColor;
  border-right: 2.4px solid currentColor;
  transform: rotate(45deg);
  margin-left: -3px;
}

.am-herramienta-textos {
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
  margin-top: 8px;
  overflow-wrap: break-word;
}
.am-herramienta-titulo {
  color: #101d33;
  font-size: 11.8px;
  font-weight: 750;
  line-height: 1.15;
  letter-spacing: -.2px;
}
.am-herramienta-subtitulo {
  color: #7a879c;
  font-size: 10.8px;
  font-weight: 400;
  line-height: 1.19;
  margin-top: 3px;
  max-width: 140px;
}

@media (max-width: 360px) {
  #amPaginas .amPagina button.am-herramienta {padding-left: 16px;padding-right: 14px;}
  .am-herramienta-titulo {font-size: 10.8px;}
  .am-herramienta-subtitulo {font-size: 9.8px;}
}

/* Ordenar herramientas manteniendo pulsado: sin cambiar su aspecto habitual. */
#amPaginas .amPagina button {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

#amPaginas .amPagina button.am-arrastrando {
  border-color: var(--balanceone-color,#ff7900);
  outline: 2px solid var(--balanceone-color,#ff7900);
  outline-offset: -3px;
  opacity: .72;
  pointer-events: none;
}

#amMenuTirador,
#amMenu h3 {
  grid-column: 1 / -1;
}

#amMenu.abierto {
  transform: translateY(0);
  visibility: visible;
}

/* En Safari, acercar el panel al borde visible sin cubrir la barra del navegador.
   Al abrir Balance One desde su icono, se conserva el margen del modo aplicación. */
@media (display-mode: browser) and (max-width: 600px) {
  #amMenu { bottom: 18px; }
}

#amMenuFondo.abierto {
  opacity: 1;
  visibility: visible;
}

  align-items: center;
  gap: 8px;
  margin: 3px 0 16px;
  color: inherit;
  font-size: .8rem;
}
.credito-restaurar-imagen input[type="checkbox"] {
  width: auto;
  margin: 0;
  flex: 0 0 auto;
}

/* Opciones de las tarjetas: filas compactas que despliegan sus propios formularios. */
.tarjeta-detalle.credito-detalle {
  padding: 18px 15px 14px;
  border: 1px solid rgba(214, 218, 226, .45);
  box-shadow: 0 6px 22px rgba(28, 38, 59, .025);
}
.credito-detalle-cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 15px;
}
.credito-detalle-cabecera h3 {
  margin: 3px 0 0;
  font-size: 1.04rem;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.credito-detalle-sobretitulo {
  color: #8a94a4;
  font-size: .65rem;
  font-weight: 650;
  letter-spacing: .065em;
  text-transform: uppercase;
}
.credito-detalle-apr {
  flex: 0 0 auto;
  padding: 8px 11px;
  border: 1px solid #ebedf2;
  border-radius: 999px;
  background: #f7f8fa;
  color: #636f7e;
  font-size: .69rem;
  font-weight: 650;
  white-space: nowrap;
}
.credito-acciones {display: grid;gap: 9px;}
.credito-accion {
  min-width: 0;
  background: #f7f8fb;
  border: 1px solid #edf0f4;
  border-radius: 23px;
}
.credito-accion-boton {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 65px;
  padding: 10px 12px;
  border: 0;
  border-radius: 23px;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
}
.credito-accion-boton:focus-visible,
.credito-eliminar:focus-visible,
.credito-cargar-foto:focus-within {
  outline: 2px solid #ff8a26;
  outline-offset: 2px;
}
.credito-accion-icono {
  display: grid;
  place-items: center;
  flex: 0 0 39px;
  width: 39px;
  height: 39px;
  border-radius: 15px;
  background: #e9e8fa;
  color: #6961c8;
}
.credito-accion-icono svg {width: 20px;height: 20px;stroke-width: 1.8;}
.credito-accion--fecha .credito-accion-icono {background: #fff0e3;color: #e98530;}
.credito-accion--pago .credito-accion-icono {background: #e3f5ec;color: #25865e;}
.credito-accion-copy {display: grid;gap: 3px;flex: 1;min-width: 0;}
.credito-accion-copy strong {font-size: .81rem;font-weight: 710;line-height: 1.3;}
.credito-accion-copy small {color: #8a94a2;font-size: .67rem;line-height: 1.25;}
.credito-accion-flecha {
  display: grid;
  place-items: center;
  flex: 0 0 27px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #fff;
  color: #7d8898;
  transition: transform .2s ease;
}
.credito-accion-flecha svg {width: 15px;height: 15px;}
.credito-accion-boton[aria-expanded="true"] .credito-accion-flecha {transform: rotate(180deg);}
.credito-accion .credito-form-panel {
  margin: 0 9px 9px;
  padding: 14px 11px 12px;
  border-top: 1px solid #e5e8ee;
  border-radius: 0 0 17px 17px;
  background: transparent;
}
.credito-accion .credito-form-panel.hidden {display: none;}
.credito-config-form,
.credito-form-panel form {display: grid;gap: 11px;}
.credito-form-campo {display: grid;gap: 6px;min-width: 0;}
.tarjeta-detalle .credito-form-campo > label {
  display: block;
  margin: 0;
  color: #657182;
  font-size: .72rem;
  font-weight: 650;
}
.tarjeta-detalle .credito-form-campo > input,
.tarjeta-detalle .credito-form-campo > select {
  height: 44px;
  min-width: 0;
  margin: 0;
  padding: 9px 13px;
  border: 1px solid #e2e5ed;
  border-radius: 16px;
  background: #fff;
  font-size: .88rem;
}
.credito-form-doble {display: grid;grid-template-columns: minmax(0,1fr) minmax(0,1fr);gap: 10px;}
.tarjeta-detalle .credito-form-panel .primary {
  min-height: 44px;
  margin: 3px 0 0;
  border-radius: 16px;
  font-size: .8rem;
  font-weight: 700;
}
.credito-cargar-foto {
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  min-width: 0;
  min-height: 45px;
  margin: 0 !important;
  padding: 8px 10px;
  border: 1px dashed #cbd2dd;
  border-radius: 16px;
  background: #fff;
  cursor: pointer;
}
.credito-cargar-foto strong {flex: 0 0 auto;color: #ed790f;font-size: .73rem;}
.credito-cargar-foto span {min-width: 0;overflow: hidden;text-overflow: ellipsis;white-space: nowrap;color: #7b8594;font-size: .68rem;font-weight: 500;}
.tarjetas-pantalla .credito-form-campo > .credito-input-archivo {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: 0;
  opacity: 0;
  overflow: hidden;
  clip-path: inset(50%);
}
.credito-form-campo:has(.credito-input-archivo:focus-visible) .credito-cargar-foto {outline: 2px solid #ff8a26;outline-offset: 2px;}
.tarjeta-detalle .credito-foto-ayuda {margin: -3px 1px 0;font-size: .65rem;}
.tarjeta-detalle .credito-restaurar-imagen {margin: 0;font-size: .7rem;}
.tarjeta-detalle .credito-restaurar-imagen input {width: 18px;height: 18px;}
.credito-eliminar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  margin-top: 14px;
  padding: 9px 12px;
  border: 0;
  border-radius: 16px;
  background: transparent;
  color: #c55b65;
  font: inherit;
  font-size: .74rem;
  font-weight: 650;
}
.credito-eliminar svg {width: 16px;height: 16px;stroke-width: 1.8;}
html.tema-oscuro .tarjeta-detalle.credito-detalle {border-color: #373d48;}
html.tema-oscuro .credito-accion {background: #292f39;border-color: #373f4b;}
html.tema-oscuro .credito-detalle-apr {background: #292f39;color: #c2cad5;border-color: #373f4b;}
html.tema-oscuro .credito-accion-flecha,
html.tema-oscuro .credito-cargar-foto {background: #363e49;color: #d9dfe8;border-color: #515969;}
html.tema-oscuro .credito-accion .credito-form-panel {border-color: #404753;}
html.tema-oscuro .tarjeta-detalle .credito-form-campo > label {color: #b3bdca;}
html.tema-oscuro .tarjeta-detalle .credito-form-campo > input,
html.tema-oscuro .tarjeta-detalle .credito-form-campo > select {background: #333b46;color: #fff;border-color: #505b6b;}
html.tema-oscuro .credito-accion-copy small {color: #a4aebc;}

.credito-marca {
  font-size: .85rem;
  font-weight: 750;
  overflow-wrap: anywhere;
}

.credito-modelo {
  font-size: .7rem;
  opacity: .9;
  overflow-wrap: anywhere;
}

.credito-final {
  font-size: .7rem;

}

.credito-datos {

}

.credito-etiqueta {

}

.credito-deuda {

.credito-texto {

}

.credito-texto {

.credito-resumen {

.credito-resumen strong {

html.tema-oscuro .credito-fila,
html.tema-oscuro .credito-resumen {

html.tema-oscuro .credito-agregar {

html.tema-oscuro #amMenu {

/* Paneles de vehículos */
.vehiculo-panel {
  border-radius: 30px;

}

#formAuto .primary,

/* Ventana flotante para movimientos */
#movVentanaFondo {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(15,20,30,.28);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#movVentana {
  position: fixed;
  left: 14px;
  right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 10001;
  width: auto;
  max-width: 440px;
  max-height: calc(100dvh - 70px - env(safe-area-inset-bottom));
  margin: 0 auto;
  padding: 20px 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-radius: 38px;
  background: rgba(245,247,255,.55);
  color: #17212e;
  border: 1px solid rgba(255,255,255,.65);
  backdrop-filter: blur(40px) saturate(150%);
  -webkit-backdrop-filter: blur(40px) saturate(150%);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    0 18px 60px rgba(0,0,0,.2);
}

#movVentana input,
#movVentana select {
  min-width: 0;
  max-width: 100%;
  border-radius: 999px;
  background: rgba(255,255,255,.38);
  color: inherit;
  border-color: rgba(130,140,155,.25);
}

#movVentana button {
  font: inherit;
}

#movVentana .mov-guardar {
  background: #ff7900;
  border-radius: 999px;
  color: #fff;
}

html.tema-oscuro #movVentana {
  background: rgba(35,40,50,.65);
  color: #f5f6f8;
  border-color: rgba(255,255,255,.18);
}

html.tema-oscuro #movVentana input,
html.tema-oscuro #movVentana select {
  background: rgba(255,255,255,.08);
}
/* Ventana compacta */
#movVentana {
  padding: 16px;
  border-radius: 34px;
  background: rgba(245,247,255,.36);
}

#movVentanaFondo {
  background: rgba(15,20,30,.18);
}

#movVentanaForm {
  display: grid;
  grid-template-columns: 76px minmax(0,1fr);
  align-items: center;
  gap: 7px 10px;
  min-width: 0;
}

#movVentanaMonto,
#movVentanaTeclado,
#movVentanaForm > .mov-guardar {
  grid-column: 1 / -1;
}

#movVentanaMonto {
  padding: 9px !important;
  margin-bottom: 3px !important;
  font-size: 1.8rem !important;
}

#movVentanaTeclado {
  gap: 6px !important;
  margin-bottom: 5px !important;
}

#movVentanaTeclado button {
  padding: 8px !important;
  min-height: 38px;
  font-size: 1.25rem !important;
}

#movVentanaForm > label {
  font-size: .78rem;
  color: inherit;
}

#movVentanaForm > input,
#movVentanaForm > select {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  height: 38px;
  margin: 0;
  padding: 7px 11px;
  font-size: 16px;
}

#movVentanaFecha {
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
  text-align: left;
}

#movVentanaFecha::-webkit-date-and-time-value {
  min-width: 0;
  text-align: left;
}

#movVentana .mov-guardar {
  margin-top: 5px;
  padding: 12px;
}

html.tema-oscuro #movVentana {
  background: rgba(35,40,50,.48);
}
/* Ventana más pequeña, ovalada y centrada */
#movVentana {
  left: 22px;
  right: 22px;
  top: 50%;
  bottom: auto;
  transform: translateY(-50%);
  max-width: 370px;
  max-height: calc(100dvh - 48px);
  padding: 18px;
  border-radius: 46px;
  background: rgba(245,247,255,.28);
}

#movVentanaTitulo {
  font-size: .9rem !important;
}

#movVentanaMonto {
  font-size: 1.65rem !important;
  padding: 8px !important;
}

#movVentanaTeclado button {
  min-height: 35px;
  padding: 7px !important;
  border-radius: 999px;
  font-size: 1.2rem !important;
}

html.tema-oscuro #movVentana {
  background: rgba(35,40,50,.38);
}
/* Título por encima de la ventana */
#movVentana {
  overflow: visible;
  max-height: calc(100dvh - 140px);
}

#movVentanaTitulo {
  position: absolute;
  top: -38px;
  left: 0;

  text-align: center;
  font-size: 1rem !important;

}

#movVentana > .row {
  justify-content: flex-end;
  margin-bottom: 8px !important;
}

#movVentanaForm {
  max-height: calc(100dvh - 220px);
  overflow-y: auto;
  overscroll-behavior: contain;
}

}

.ajustes-subtitulo {

}

  gap: 13px;

  margin-bottom: 14px;
}

.perfil-avatar {

}

html.tema-oscuro .perfil-camara {

.banco-deslizable {
  position: relative;
  overflow: hidden;
  background: #fff;
}

.banco-acciones {
  position: absolute;
  inset: 0 12px 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.banco-acciones button {
  width: 62px;
  height: 64px;
  border-radius: 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font: inherit;
  font-size: .7rem;
  cursor: pointer;
}

.banco-editar {
  background: rgba(255, 140, 30, .12);
  border: 1px solid rgba(255, 140, 30, .25);
  color: #f28c28;
}

.banco-eliminar {
  background: rgba(235, 65, 80, .12);
  border: 1px solid rgba(235, 65, 80, .25);
  color: #eb4150;
}

.banco-deslizable > .banco-card {
  position: relative;
  z-index: 1;
  background: #fff;
  transition: transform .22s ease;
  touch-action: pan-y;
}

.banco-deslizable.abierta > .banco-card {
  transform: translateX(-152px);
}

html.tema-oscuro .banco-deslizable,
html.tema-oscuro .banco-deslizable > .banco-card {
  background: #20242b;
}

@media (prefers-reduced-motion: reduce) {
  .banco-deslizable > .banco-card {
    transition: none;
  }
}

html.tema-oscuro .banco-dialogo input,

.apariencia-ventana {
  width: calc(100% - 28px);
  max-width: 420px;
  max-height: calc(100dvh - 60px);
  box-sizing: border-box;
  position: fixed;
  inset: auto 0 14px;
  margin: 0 auto;
  padding: 22px;
  border: 1px solid rgba(130,140,155,.2);
  border-radius: 36px;
  background: #f8f9fb;
  color: #1c2733;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.apariencia-ventana[open] {

}

.apariencia-ventana::backdrop {
  background: rgba(15,20,28,.35);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

 const fecha=new Date(s+"T12:00:00Z");
 return !Number.isNaN(fecha.getTime())&&

function diasParaVencer(dia){
const hoy=new Date();
hoy.setHours(0,0,0,0);

let fecha=new Date(
hoy.getFullYear(),
hoy.getMonth(),
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+1,0
).getDate())
);

if(fecha<hoy){
fecha=new Date(
hoy.getFullYear(),
hoy.getMonth()+1,
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+2,0
).getDate())
);
}

return Math.round((fecha-hoy)/86400000);
}

// 0.2.7 Beta: los estados de recordatorios se guardan con los demás datos
// para que las copias de seguridad existentes los incluyan.
// No constituyen una transacción financiera ni descuentan saldos.
function claveAviso(tipo, identificador, fecha) {
  return `${tipo}:${String(identificador)}:${fecha}`;
}
function fechaLocalAviso(fecha) {
  return `${fecha.getFullYear()}-${String(fecha.getMonth()+1).padStart(2,"0")}-${String(fecha.getDate()).padStart(2,"0")}`;
}
function siguienteFechaAviso(faltan) {
  const fecha = new Date();
  fecha.setHours(12,0,0,0);
  fecha.setDate(fecha.getDate()+faltan);
  return fechaLocalAviso(fecha);
}
function recordatoriosMarcados() {
  return Array.isArray(data.recordatoriosPagados) ? data.recordatoriosPagados : [];
}
function registradoEnPeriodo(tipo, cuentaId, fecha, importe) {
  if (!Number.isFinite(importe) || importe <= 0) return false;
  const mes = fecha.slice(0,7);
  const abonado = (Array.isArray(data.pagos) ? data.pagos : [])
    .filter(p => p.tipo === tipo && String(p.cuentaId) === String(cuentaId) &&
      validDate(String(p.fecha)) && p.fecha.slice(0,7) === mes)
    .reduce((total,p) => total + (Number(p.monto)>0 ? Number(p.monto) : 0),0);
  return round(abonado) >= round(importe) - 0.005;
}
// 0.2.7 Beta · Configuración de notificaciones internas, incluida en las copias de datos.
const OPCIONES_DIAS_AVISOS = [1,3,5,7,10,15];
const TIPOS_AVISOS = ["tarjeta","vehiculo","prestamo","suscripcion"];
function preferenciasAvisos() {
  const anteriores = data.preferenciasAvisos && typeof data.preferenciasAvisos === "object"
    ? data.preferenciasAvisos : {};
  const dias = Number(anteriores.dias);
  const tipos = anteriores.tipos && typeof anteriores.tipos === "object"
    ? anteriores.tipos : {};
  return {
    dias: OPCIONES_DIAS_AVISOS.includes(dias) ? dias : 7,
    tipos: Object.fromEntries(TIPOS_AVISOS.map(tipo=>[tipo,tipos[tipo] !== false]))
  };
}
function guardarPreferenciasAvisos(cambios) {
  const anteriores = preferenciasAvisos();
  const siguientes = {...anteriores,...cambios,
    tipos:{...anteriores.tipos,...(cambios.tipos || {})}};
  if (!OPCIONES_DIAS_AVISOS.includes(siguientes.dias)) return;
  const nuevosDatos = {...data, preferenciasAvisos:siguientes};
  try {
    localStorage.setItem(KEY,JSON.stringify(nuevosDatos));
  } catch(e) {
    alert(textoApp("No se pudieron guardar las notificaciones. Inténtalo de nuevo.",
      "Could not save notification settings. Please try again."));
    return;
  }
  data=nuevosDatos;
  abrirAjuste("avisos");
}
function cambiarDiasAvisos(dias) {
  const numero=Number(dias);
  if (!OPCIONES_DIAS_AVISOS.includes(numero)) return;
  guardarPreferenciasAvisos({dias:numero});
}
function alternarTipoAvisos(tipo) {
  if (!TIPOS_AVISOS.includes(tipo)) return;
  const actual=preferenciasAvisos();
  guardarPreferenciasAvisos({tipos:{[tipo]:!actual.tipos[tipo]}});
}
function interfazPreferenciasAvisos() {
  const t=textoApp;
  const preferencias=preferenciasAvisos();
  const titulos={
    tarjeta:[t("Tarjetas de crédito","Credit cards"),t("Pagos mínimos y fechas límite","Minimum payments and due dates")],
    vehiculo:[t("Vehículos","Vehicles"),t("Cuotas de tus vehículos","Vehicle installments")],
    prestamo:[t("Préstamos","Loans"),t("Cuotas de préstamos programadas","Scheduled loan installments")],
    suscripcion:[t("Suscripciones","Subscriptions"),t("Renovaciones y cobros previstos","Renewals and planned charges")]
  };
  return `<div class="ajuste-avisos">
    <section class="card ajuste-avisos-card">
      <h3>${t("Avisar con anticipación","Remind me in advance")}</h3>
      <p class="note">${t("Muestra los próximos vencimientos en Inicio desde los días que elijas.",
        "Show upcoming due dates on Home starting this many days in advance.")}</p>
      <div class="ajuste-avisos-dias" role="group" aria-label="${t("Días de anticipación","Days in advance")}">
        ${OPCIONES_DIAS_AVISOS.map(d=>`<button type="button" class="ajuste-aviso-dia ${d===preferencias.dias?"seleccionado":""}"
          aria-pressed="${d===preferencias.dias}" onclick="cambiarDiasAvisos(${d})">${d} ${d===1?t("día","day"):t("días","days")}</button>`).join("")}
      </div>
    </section>
    <section class="card ajuste-avisos-card">
      <h3>${t("Tipos de avisos","Reminder categories")}</h3>
      <p class="note">${t("Activa únicamente los recordatorios que deseas ver.",
        "Enable only the reminders you want to see.")}</p>
      ${TIPOS_AVISOS.map(tipo=>`<button type="button" class="ajuste-aviso-tipo"
        role="switch" aria-checked="${preferencias.tipos[tipo]}"
        onclick="alternarTipoAvisos('${tipo}')">
        <span class="ajuste-aviso-tipo-info"><strong>${titulos[tipo][0]}</strong><small>${titulos[tipo][1]}</small></span>
        <span class="ajuste-aviso-switch ${preferencias.tipos[tipo]?"activo":""}" aria-hidden="true"><span></span></span>
      </button>`).join("")}
    </section>
    <p class="note ajuste-aviso-ayuda">${t(
      "Esta configuración afecta los avisos dentro de Balance One. Los pagos reales, saldos y fechas guardadas no se modifican. Las notificaciones en la pantalla bloqueada del iPhone aún no están disponibles.",
      "These settings affect reminders inside Balance One. Recorded payments, balances and due dates are unchanged. iPhone lock-screen notifications are not yet available."
    )}</p>
  </div>`;
}
function datosAvisosVencimiento(incluirPagados = false) {
  const preferencias = preferenciasAvisos();
  const marcados = new Set(recordatoriosMarcados().map(r => r.clave));
  const cobros = [
    ...data.tarjetas.map(t => {
      const faltan = diasParaVencer(Number(t.vencimiento));
      const valido = Number.isInteger(Number(t.vencimiento)) && Number(t.vencimiento)>=1 && Number(t.vencimiento)<=31;
      const fecha = valido ? siguienteFechaAviso(faltan) : "";
      const importe = Number(t.pagoMinimo)>0 ? Number(t.pagoMinimo) : null;
      return {
        nombre:String(t.nombre || t.modelo || t.banco || textoApp("Tarjeta", "Card")),
        banco:String(t.banco || ""), tipoAviso:"tarjeta", identificador:t.id,
        faltan, valido, fecha, importe, destino:"tarjetas",
        clave:claveAviso("tarjeta",t.id,fecha),
        pagoRegistrado:registradoEnPeriodo("tarjeta",t.id,fecha,importe)
      };
    }),
    ...data.vehiculos.map(v => {
      const faltan = diasParaVencer(Number(v.vencimiento));
      const valido = Number.isInteger(Number(v.vencimiento)) && Number(v.vencimiento)>=1 && Number(v.vencimiento)<=31;
      const fecha = valido ? siguienteFechaAviso(faltan) : "";
      const importe = Number(v.pago)>0 ? Number(v.pago) : null;
      return {
        nombre:String(v.nombre || v.modelo || textoApp("Vehículo", "Vehicle")),
        tipoAviso:"vehiculo", identificador:v.id,
        faltan, valido, fecha, importe, destino:"vehiculos",
        clave:claveAviso("vehiculo",v.id,fecha),
        pagoRegistrado:registradoEnPeriodo("vehiculo",v.id,fecha,importe)
      };
    })
  ].filter(c => c.valido && c.faltan >= 0 && c.faltan <= preferencias.dias);

  // Las suscripciones se muestran como cobros previstos, no cargos confirmados.
  const hoy = today();
  const comienzo = new Date(hoy + "T12:00:00");
  for (let i=0;i<2;i++) {
    const mes = new Date(comienzo.getFullYear(),comienzo.getMonth()+i,1);
    const clave = `${mes.getFullYear()}-${String(mes.getMonth()+1).padStart(2,"0")}`;
    for(const s of suscripcionesDelMes(clave)) {
      const fecha = new Date(s.fecha + "T12:00:00");
      const faltan = Math.round((fecha-comienzo)/86400000);
      if(faltan < 0 || faltan > preferencias.dias) continue;
      // Los registros nuevos poseen id; la clave alternativa preserva los antiguos.
      const identificador = s.id || `${s.nombre}|${s.inicio}|${s.frecuencia}|${s.categoria||""}`;
      cobros.push({
        nombre:String(s.nombre || textoApp("Suscripción", "Subscription")),
        tipoAviso:"suscripcion", identificador, faltan, fecha:s.fecha,
        importe:Number(s.monto)>0?Number(s.monto):null, destino:"suscripciones",
        clave:claveAviso("suscripcion",identificador,s.fecha), pagoRegistrado:false
      });
    }
  }
  // Las cuotas de préstamos utilizan su calendario existente; no se crean cargos nuevos.
  if (preferencias.tipos.prestamo) {
    for (let i=0;i<2;i++) {
      const mes = new Date(comienzo.getFullYear(),comienzo.getMonth()+i,1);
      const periodo = `${mes.getFullYear()}-${String(mes.getMonth()+1).padStart(2,"0")}`;
      for (const cuota of prestamosDelMes(periodo)) {
        if (!validDate(String(cuota.fecha))) continue;
        const fecha = new Date(cuota.fecha+"T12:00:00");
        const faltan = Math.round((fecha-comienzo)/86400000);
        if (faltan < 0 || faltan > preferencias.dias) continue;
        const importe = Number(cuota.monto)>0 ? Number(cuota.monto) : null;
        const registrado = Number(cuota.importePagado)||0;
        cobros.push({
          nombre:String(cuota.nombre || textoApp("Préstamo", "Loan")),
          tipoAviso:"prestamo", identificador:cuota.id, faltan, fecha:cuota.fecha,
          importe,destino:"pagosPendientes",
          clave:claveAviso("prestamo",cuota.id,cuota.fecha),
          pagoRegistrado:Boolean(cuota.pagada) || (importe!==null && registrado>=importe-0.005)
        });
      }
    }
  }
  const todos = cobros.filter(c => preferencias.tipos[c.tipoAviso]).map(c => ({
    ...c, marcado:marcados.has(c.clave),
    pagado:marcados.has(c.clave) || c.pagoRegistrado
  })).sort((a,b) => a.faltan-b.faltan || a.nombre.localeCompare(b.nombre));
  return incluirPagados ? todos : todos.filter(c=>!c.pagado);
}
function guardarEstadoRecordatorio(clave, pagado) {
  const disponible = datosAvisosVencimiento(true).find(c=>c.clave===clave);
  if (!disponible || (disponible.pagoRegistrado && !pagado)) return;
  const anterior = recordatoriosMarcados();
  if (pagado && anterior.some(r=>r.clave===clave)) return;
  if (!pagado && !anterior.some(r=>r.clave===clave)) return;
  if (pagado && !confirm(textoApp(
    `¿Marcar «${disponible.nombre}» como pagado?\n\nEsto solo confirma el recordatorio. No registra un pago ni modifica saldos.`,
    `Mark “${disponible.nombre}” as paid?\n\nThis only confirms the reminder. No payment is recorded and balances will not change.`
  ))) return;
  const nuevos = pagado
    ? [...anterior,{clave,fechaMarcado:today()}]
    : anterior.filter(r=>r.clave!==clave);
  const nuevosDatos = {...data,recordatoriosPagados:nuevos};
  try {
    localStorage.setItem(KEY,JSON.stringify(nuevosDatos));
  } catch(e) {
    alert(textoApp("No se pudo guardar el recordatorio. No se hicieron cambios.",
      "Could not save this reminder. No changes were made."));
    return;
  }
  data=nuevosDatos;
  if(page==="inicio") {
    // Conservar la ventana abierta después de marcar o deshacer.
    render();
    abrirPanelAvisos();
  }
}
function marcarAvisoPagado(clave) { guardarEstadoRecordatorio(clave,true); }
function deshacerAvisoPagado(clave) { guardarEstadoRecordatorio(clave,false); }

function textoPlazoAviso(faltan) {
  return faltan===0 ? textoApp("Vence hoy","Due today")
    : faltan===1 ? textoApp("Falta 1 día","1 day left")
    : textoApp(`Faltan ${faltan} días`,`${faltan} days left`);
}

function abrirPanelAvisos() {
  const panel = document.getElementById("avisosUnificados");
  if (!panel) return;
  const abierto = !panel.classList.contains("is-abierto");
  panel.classList.toggle("is-abierto",abierto);
  panel.querySelector(".aviso-vencimiento")?.setAttribute("aria-expanded",String(abierto));
  panel.querySelector(".aviso-detalles")?.setAttribute("aria-hidden",String(!abierto));
  const fondo=document.getElementById("avisosFondo");
  if(fondo) fondo.hidden=!abierto;
  document.body.style.overflow=abierto?"hidden":"";
}
function cerrarPanelAvisos() {
  const panel=document.getElementById("avisosUnificados");
  if(panel?.classList.contains("is-abierto")) abrirPanelAvisos();
  document.body.style.overflow="";
}
function irDesdeAviso(destino) {
  cerrarPanelAvisos();
  if(["tarjetas","vehiculos","suscripciones","pagosPendientes"].includes(destino)) go(destino);
}
// El aviso de respaldo abre la opción que ya existe en Ajustes.
function abrirDatosYCopiasDesdeAviso() {
  cerrarPanelAvisos();
  go("ajustes");
  abrirAjuste("datos");
}
document.addEventListener("keydown", event => {
  if(event.key === "Escape") cerrarPanelAvisos();
});

// Si cambia el día mientras Balance One queda suspendida en el iPhone,
// recalcular los recordatorios al regresar, sin modificar datos financieros.
let fechaUltimaRevisionAvisos = today();
function refrescarAvisosAlReanudar() {
  const fechaActual = today();
  if (fechaActual === fechaUltimaRevisionAvisos) return;
  fechaUltimaRevisionAvisos = fechaActual;
  if (page !== "inicio") return;
  cerrarPanelAvisos();
  render();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refrescarAvisosAlReanudar();
});
window.addEventListener("pageshow", evento => {
  if (evento.persisted) refrescarAvisosAlReanudar();
});

function avisosVencimiento() {

    nombre:textoApp("Copia de seguridad","Backup"),

      ? textoApp("Hace 30 días que no guardas una copia","Time to save a new backup")

    tipoAviso:"respaldo", destino:"datos", importe:null, faltan:0

  // Un único menú para vencimientos financieros y recordatorios de respaldo.
  // Si también hay pagos, conservar el principal financiero que el usuario conoce.
  const proximos=respaldoPendiente ? [...pagosProximos,respaldoPendiente] : pagosProximos;
  const pagados=todos.filter(c=>c.pagado);
  const contenido=`<div class="aviso-lista">
    ${proximos.map(c=>tarjetaRecordatorio(c,false)).join("") || `<div class="aviso-lista--vacia">${textoApp("No tienes avisos pendientes","You have no pending reminders")}</div>`}
    ${pagados.length?`<div class="aviso-pagados-titulo">✓ ${textoApp("Marcados como pagados", "Marked as paid")}</div>
      ${pagados.map(c=>tarjetaRecordatorio(c,true)).join("")}`:""}
    ${todos.length ? `<p class="aviso-nota-pagos">${textoApp("Marcar pagado solo confirma el recordatorio; no descuenta dinero ni registra transacciones.",
      "Mark as paid only confirms the reminder; it does not deduct money or record transactions.")}</p>` : ""}
  </div>`;
  const fondo=`<div id="avisosFondo" class="avisos-fondo" hidden onclick="cerrarPanelAvisos()"></div>`;
  if(!proximos.length) {
    return `${fondo}<div class="avisos-ancla"><section id="avisosUnificados"
      class="avisos-vencimiento avisos-vencimiento--vacio"
      aria-label="${textoApp("Notificaciones","Notifications")}">

      </span>` : ""}
      <span class="aviso-vencimiento-texto">

          ? textoApp("Guardar copia","Save backup") : principal.nombre)}</span><span class="avisos-abierto">${textoApp("Notificaciones","Notifications")}</span></strong>

        <span class="avisos-abierto">${textoApp(`${proximos.length} ${proximos.length===1 ? "aviso pendiente" : "avisos pendientes"}`,

}

function guardarMovimientoBanco(anterior, nuevo) {
  const claveBanco = "amfinance-cuentas-banco";
  const datosPrevios = localStorage.getItem(KEY);
  const bancosPrevios = localStorage.getItem(claveBanco);

  try {
    const cuentas = JSON.parse(bancosPrevios || "[]");

    if (!Array.isArray(cuentas)) {
            throw new Error(textoApp("Cuentas no válidas", "Invalid accounts"));
    }

    const cambios = new Map();

    function acumular(movimiento, signo) {
      if (!movimiento || !movimiento.cuentaId) return;

      const cantidad = Number(movimiento.monto);

      if (
        !validAmount(cantidad) ||
        !["ingreso", "gasto"].includes(movimiento.tipo)
      ) {
                throw new Error(textoApp("Movimiento no válido", "Invalid transaction"));
      }

      const cuentaId = String(movimiento.cuentaId);
      const efecto = movimiento.tipo === "ingreso"
        ? cantidad
        : -cantidad;

      cambios.set(
        cuentaId,
        round((cambios.get(cuentaId) || 0) + efecto * signo)
      );
    }

    acumular(anterior, -1);
    acumular(nuevo, 1);

    for (const [cuentaId, diferencia] of cambios) {
      const cuenta = cuentas.find(
        c => String(c.id) === cuentaId
      );

      if (!cuenta) {
                alert(textoApp("No se encontró la cuenta del movimiento.", "The account for this transaction was not found."));
        return false;
      }

      const saldo = round(Number(cuenta.saldo) + diferencia);

      if (!Number.isFinite(saldo) || saldo < 0) {
                alert(textoApp("La operación dejaría la cuenta sin saldo suficiente.", "The account would have insufficient funds after this operation."));
        return false;
      }

      cuenta.saldo = saldo;
    }

    // Las compras hechas con una tarjeta de crédito aumentan su deuda.
    // Al editar o eliminar un movimiento se revierte el importe anterior.
    const tarjetasActualizadas = data.tarjetas.map(t => ({...t}));
    const deudaPorTarjeta = new Map();
    function ajustarCompraCredito(movimiento, signo) {
      if (!movimiento || !movimiento.tarjetaId) return;
      const tarjeta = tarjetasActualizadas.find(
        t => String(t.id) === String(movimiento.tarjetaId)
      );
      if (!tarjeta || movimiento.tipo !== "gasto" ||
          movimiento.cuentaId || !validAmount(Number(movimiento.monto))) {
        throw new Error("Compra de tarjeta de crédito no válida");
      }
      const tarjetaId = String(tarjeta.id);
      deudaPorTarjeta.set(tarjetaId, round(
        (deudaPorTarjeta.get(tarjetaId) || 0) +
        signo * Number(movimiento.monto)
      ));
    }
    ajustarCompraCredito(anterior, -1);
    ajustarCompraCredito(nuevo, 1);
    for (const [tarjetaId, diferencia] of deudaPorTarjeta) {
      const tarjeta = tarjetasActualizadas.find(
        t => String(t.id) === tarjetaId
      );
      const saldo = round(Number(tarjeta.saldo) + diferencia);
      if (!Number.isFinite(saldo) || saldo < 0) {
        throw new Error("La deuda de la tarjeta no puede ser negativa");
      }
      tarjeta.saldo = saldo;
    }

    const movimientosNuevos = anterior
      ? data.movimientos.filter(m => m.id !== anterior.id)
      : [...data.movimientos];

    if (nuevo) movimientosNuevos.push(nuevo);

    const prestamosActualizados = (data.prestamos || [])
  .map(p => ({...p}));

function ajustarPrestamo(movimiento, signo) {
  if (!movimiento || !movimiento.prestamoId) return;

  const prestamo = prestamosActualizados.find(
    p => String(p.id) === String(movimiento.prestamoId)
  );

  const intereses = Number(movimiento.interesPrestamo || 0);
  const capital = round(Number(movimiento.monto) - intereses);

  if (
    !prestamo ||
    movimiento.tipo !== "gasto" ||
    !Number.isFinite(intereses) ||
    intereses < 0 ||
    !validAmount(capital)
  ) {
    throw new Error("Pago de préstamo no válido");
  }

  const saldo = round(Number(prestamo.saldo) + signo * capital);
  
  if (!Number.isFinite(saldo) || saldo < 0) {
    throw new Error("El capital supera el saldo pendiente");
  }

  prestamo.saldo = saldo;
}

function cuentaDePago(p){
 const group=p.tipo==="vehiculo"?data.vehiculos:
             p.tipo==="tarjeta"?data.tarjetas:[];
 if(p.cuentaId){
  return group.find(x=>x.id===p.cuentaId)||null;
 }
 const matches=group.filter(x=>x.nombre===p.nombre);

}

// Modifica el saldo de la deuda al corregir un pago.
// delta positivo = aumenta la deuda.
// delta negativo = disminuye la deuda.
function ajustarSaldo(cuenta,delta){
 const nuevo=round(Number(cuenta.saldo)+delta);
 if(!Number.isFinite(nuevo)||nuevo<0){
    alert(textoApp("Este cambio dejaría la deuda con saldo negativo. Revisa los pagos.", "This change would make the debt balance negative. Check the payments."));
  return false;
 }
 cuenta.saldo=nuevo;
 return true;
}

function guardarEdicion(e,origen,ident){
 e.preventDefault();
 const datosAnteriores = JSON.stringify(data);
 const item=findItem(origen,ident);
 if(!item)return;
 const f=new FormData(e.target);
 const monto=round(f.get("monto"));
 const fecha=String(f.get("fecha"));

 if(!validAmount(monto)||!validDate(fecha)){
    alert(textoApp("Introduce una cantidad y una fecha válidas.", "Enter a valid amount and date."));
  return;
 }
if (
  origen === "pago" &&
  item.tipo === "tarjeta" &&
  item.bancoId
) {
  const corregido = {
    ...item,
    monto,
    fecha
  };

  if (!guardarPagoTarjetaBanco(item, corregido)) return;

  openEdit = null;
  render();
    alert(textoApp("Pago corregido y saldos actualizados.", "Payment corrected and balances updated."));
  return;
}

 if(origen==="movimiento"){
  const nombre=String(f.get("nombre")).trim();
  if(!nombre)return;
const corregido = {
  ...item,
  nombre,
  tipo: f.get("tipo"),
  monto,
  fecha
};

if (!guardarMovimientoBanco(item, corregido)) return;

openEdit = null;
alert(textoApp("Cambios guardados correctamente.", "Changes saved successfully."));
render();
return;
 }else{
  const cuenta=cuentaDePago(item);
  if(!cuenta){
      alert(textoApp("No se encontró la cuenta de este pago. No se puede corregir la deuda automáticamente.", "The account for this payment was not found. The debt cannot be adjusted automatically."));
   return;
  }
  const anterior=Number(item.monto);
  const diferencia=round(monto-anterior);

  if(item.tipo==="vehiculo"){
   const interes=Number(item.interes);
   const capitalAnterior=Number(item.capital);
   if(!Number.isFinite(interes)||!Number.isFinite(capitalAnterior)){
        alert(textoApp("Este pago antiguo no tiene suficientes datos para editarse con seguridad.", "This older payment does not have enough information to be edited safely."));
    return;
   }
   const capitalNuevo=round(capitalAnterior+diferencia);
   if(capitalNuevo<=0){
        alert(textoApp("El pago corregido no cubre el interés registrado.", "The corrected payment does not cover the recorded interest."));
    return;
   }
   if(!ajustarSaldo(cuenta,-diferencia))return;
   item.capital=capitalNuevo;
  }else{
   if(!ajustarSaldo(cuenta,-diferencia))return;
  }
  item.monto=monto;
  item.fecha=fecha;
  item.cuentaId=cuenta.id;
  actualizarSaldosHistorial(cuenta);
 }

 openEdit=null;
  if (!save()) {
   data = JSON.parse(datosAnteriores);
   return;
 }
   alert(textoApp("Cambios guardados correctamente.", "Changes saved successfully."));
 render();
}

 openEdit=null;

// Recalcula los saldos históricos cuando se corrigen pagos.
// Los pagos sin datos suficientes muestran "No registrado".
function actualizarSaldosHistorial(cuenta){
 const group=data.pagos.filter(p=>
  p.tipo==="vehiculo"&&cuentaDePago(p)===cuenta
 ).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

 let saldo=Number(cuenta.saldo);
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo+Number(p.capital));
 }
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo-Number(p.capital));
  p.saldoRestante=saldo;
 }
}

async function guardarDatosAuto(event, i) {
  event.preventDefault();

  const auto = data.vehiculos[i];
  if (!auto) return;

  const formulario = event.target;
  const boton = formulario.querySelector('button[type="submit"], button.primary');
  const campos = new FormData(formulario);
  const nombre = String(campos.get("nombre") || "").trim();
  const foto = String(campos.get("foto") || "").trim();
  const archivo = campos.get("fotoArchivo");

  if (!nombre) {
        alert(textoApp("Escribe el nombre del vehículo.", "Enter the vehicle name."));
    return;
  }

  if (foto) {
    try {
      if (new URL(foto).protocol !== "https:") throw new Error();
    } catch {
            alert(textoApp("El enlace debe empezar con https://", "The link must start with https://"));
      return;
    }
  }

  if (boton) boton.disabled = true;

  try {
    let fotoGaleria = auto.fotoGaleria || "";

    if (archivo && archivo.size > 0) {
      const url = URL.createObjectURL(archivo);

      try {
        const imagen = new Image();

        await new Promise((resolve, reject) => {
          imagen.onload = resolve;
          imagen.onerror = () => reject(
                        new Error(textoApp("No se pudo abrir la foto. Prueba con JPG o PNG.", "Could not open the photo. Try a JPG or PNG image."))
          );
          imagen.src = url;
        });

        const escala = Math.min(
          1, 900 / Math.max(imagen.naturalWidth, imagen.naturalHeight)
        );

        const lienzo = document.createElement("canvas");
        lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));

        const contexto = lienzo.getContext("2d");
                if (!contexto) throw new Error(textoApp("No se pudo preparar la foto.", "Could not process the photo."));

        contexto.fillStyle = "#ffffff";
        contexto.fillRect(0, 0, lienzo.width, lienzo.height);
        contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
        fotoGaleria = lienzo.toDataURL("image/jpeg", 0.8);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

        const entradaInicial = String(
      campos.get("montoInicial") || ""
    ).trim();

    const montoInicial = entradaInicial
      ? Number(entradaInicial)
      : null;

    if (
      montoInicial !== null &&
      (!Number.isFinite(montoInicial) ||
       montoInicial <= 0 ||
       montoInicial < Number(auto.saldo))
    ) {
            alert(textoApp("El monto inicial debe ser mayor que cero y no menor al saldo pendiente.", "The original loan amount must be greater than zero and cannot be less than the outstanding balance."));
      return;
    }

    const actualizado = {
      ...auto,
      nombre,
      montoInicial,
      modelo: String(campos.get("modelo") || "").trim(),
      anio: String(campos.get("anio") || "").trim(),
      banco: String(campos.get("banco") || "").trim(),
      foto,
      fotoGaleria
    };

    const nuevosDatos = {
      ...data,
      vehiculos: data.vehiculos.map(v => v === auto ? actualizado : v)
    };

    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
    data = nuevosDatos;
    render();
  } catch (error) {
    alert(
      error.name === "QuotaExceededError"
                ? textoApp("No hay espacio suficiente para guardar la foto.", "There is not enough storage space to save the photo.")
                : error.message || textoApp("No se pudieron guardar los datos.", "Could not save the details.")
    );
  } finally {
    if (boton) boton.disabled = false;
  }
}

  const normalizar = texto => String(texto || "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");

  const banco = normalizar(tarjeta.banco || tarjeta.nombre);
  const modelo = normalizar(tarjeta.modelo);

  const imagenes = {
  americanexpress: {

  },

    freedomunlimited:

  },

    savor:
      "https://ecm.capitalone.com/WCM/card/products/new-savor-card-art/mobile.png",

    venturex:
      "https://ecm.capitalone.com/WCM/card/products/venture-x-card-art/mobile.png"
   },

  // Apple Card se dibuja individualmente para no usar una foto promocional
  // que contiene varias tarjetas y nombres ajenos.
  apple: {}
};

  const claveBanco = banco === "amex"

}

function imagenMostradaCredito(tarjeta) {
  const personalizada = tarjeta?.imagenPersonalizada;
  if (typeof personalizada === "string" &&
      /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(personalizada)) {
    return personalizada;
  }
  return imagenCredito(tarjeta);
}

function mostrarAppleCardAutomatica(tarjeta) {
  if (imagenMostradaCredito(tarjeta)) return false;
  const banco = String(tarjeta?.banco || tarjeta?.nombre || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const modelo = String(tarjeta?.modelo || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  return (banco === "apple" || banco === "applecard") && (modelo === "applecard" || !modelo);
}

async function prepararImagenCredito(archivo) {
  if (!archivo || !archivo.size) return "";
  if (!String(archivo.type || "").startsWith("image/")) {
    throw new Error(textoApp("Selecciona una imagen válida.", "Select a valid image."));
  }
  if (archivo.size > 15 * 1024 * 1024) {
    throw new Error(textoApp("La imagen debe pesar menos de 15 MB.", "The image must be smaller than 15 MB."));
  }

  const url = URL.createObjectURL(archivo);
  try {
    const imagen = await new Promise((resolve, reject) => {
      const elemento = new Image();
      elemento.onload = () => resolve(elemento);
      elemento.onerror = () => reject(new Error(textoApp(
        "No se pudo abrir esta imagen.", "Could not open this image."
      )));
      elemento.src = url;
    });
    const mayorLado = Math.max(imagen.naturalWidth, imagen.naturalHeight);
    if (!mayorLado) throw new Error(textoApp("Imagen vacía.", "Empty image."));
    const escala = Math.min(1, 900 / mayorLado);
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
    lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));
    const contexto = lienzo.getContext("2d");
    if (!contexto) throw new Error(textoApp("No se pudo preparar la imagen.", "Could not process the image."));
    contexto.fillStyle = "#ffffff";
    contexto.fillRect(0, 0, lienzo.width, lienzo.height);
    contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
    return lienzo.toDataURL("image/jpeg", 0.78);
  } finally {
    URL.revokeObjectURL(url);
  }
}

function actualizarModelosCredito(indice) {
  const banco = document.getElementById(
    "bancoCredito" + indice
  );
  const modelo = document.getElementById(
    "modeloCredito" + indice
  );
  const lista = document.getElementById(
    "modelosCredito" + indice
  );

  if (!banco || !modelo || !lista) return;

  lista.replaceChildren();

  modelosCredito(banco.value).forEach(nombre => {
    const opcion = document.createElement("option");
    opcion.value = nombre;
    lista.appendChild(opcion);
  });

  modelo.value = "";
}

async function guardarDatosTarjeta(event, indice) {
  event.preventDefault();

  const tarjeta = data.tarjetas[indice];
  if (!tarjeta) return;

  const campos = new FormData(event.target);
  const modelo = String(campos.get("modelo") || "").trim();
  const ultimos4 = String(campos.get("ultimos4") || "").trim();
  const entrada = String(campos.get("pagoMinimo") || "").trim();
  const pagoMinimo = entrada === "" ? null : Number(entrada);
  const archivo = campos.get("imagenCredito");
  const restaurarImagen = campos.get("restaurarImagen") === "1";

  if (ultimos4 && !/^\d{4}$/.test(ultimos4)) {
        alert(textoApp("Introduce únicamente los últimos cuatro dígitos.", "Enter only the last four digits."));
    return;
  }

  if (
    pagoMinimo !== null &&
    (!Number.isFinite(pagoMinimo) || pagoMinimo < 0)
  ) {
        alert(textoApp("Introduce un pago mínimo válido.", "Enter a valid minimum payment."));
    return;
  }

  const boton = event.submitter || event.target.querySelector('button[type="submit"]');
  if (boton) boton.disabled = true;
  try {
    let imagenPersonalizada = restaurarImagen ? "" : (tarjeta.imagenPersonalizada || "");
    if (archivo && typeof archivo.size === "number" && archivo.size > 0) {
      imagenPersonalizada = await prepararImagenCredito(archivo);
    }

    const indiceVigente = data.tarjetas.findIndex(t => t.id === tarjeta.id);
    if (indiceVigente < 0) return;
    const anterior = data.tarjetas[indiceVigente];
    const actualizado = {
      ...anterior,
      banco: String(campos.get("banco") || "").trim(),
      modelo,
      ultimos4,
      pagoMinimo: pagoMinimo === null ? null : round(pagoMinimo)
    };
    if (imagenPersonalizada) actualizado.imagenPersonalizada = imagenPersonalizada;
    else delete actualizado.imagenPersonalizada;

    data.tarjetas[indiceVigente] = actualizado;
    if (!save()) {
      data.tarjetas[indiceVigente] = anterior;
      return;
    }

    render();
    alert(textoApp("Datos de la tarjeta guardados.", "Card details saved."));
  } catch (error) {
    alert(error.message || textoApp("No se pudo cambiar la imagen.", "Could not change the image."));
  } finally {
    if (boton) boton.disabled = false;
  }
}

function guardarVencimiento(e,tipo,i){
e.preventDefault();

const dia=Number(new FormData(e.target).get("dia"));

if(!Number.isInteger(dia)||dia<1||dia>31){
alert(textoApp("Selecciona un día válido.", "Select a valid day."));
return;
}

const cuenta=tipo==="tarjeta"
?data.tarjetas[i]
:data.vehiculos[i];

if(!cuenta){
alert(textoApp("No se encontró la cuenta.", "Account not found."));
return;
}

cuenta.vencimiento=dia;
save();
render();

alert(textoApp("Vencimiento guardado: día "+dia+" de cada mes.", "Due date saved: day "+dia+" of each month."));
}
function toggle(ident){
 const element=document.getElementById(ident);
 if(element)element.classList.toggle("hidden");

function toggleCreditoPanel(boton, ident) {
  const panel = document.getElementById(ident);
  if (!panel) return;
  const abrir = panel.classList.contains("hidden");
  const detalle = boton.closest(".credito-detalle");
  if (abrir && detalle) {
    detalle.querySelectorAll('.credito-accion-boton[aria-expanded="true"]').forEach(otro => {
      if (otro === boton) return;
      const anterior = document.getElementById(otro.getAttribute("aria-controls"));
      if (anterior) anterior.classList.add("hidden");
      otro.setAttribute("aria-expanded", "false");
    });
  }
  panel.classList.toggle("hidden", !abrir);
  boton.setAttribute("aria-expanded", String(abrir));
}

function pagarAuto(e, i) {
  e.preventDefault();
  const v = data.vehiculos[i];
  if (!v) return;

  const monto = round(new FormData(e.target).get("monto"));
  const saldo = Number(v.saldo);
  const apr = Number(v.apr);

  if (!validAmount(monto) ||
      !Number.isFinite(saldo) || saldo < 0 ||
      !Number.isFinite(apr) || apr < 0) {
    alert(textoApp(
      "Revisa el importe, el saldo y la tasa APR.",
      "Check the amount, balance and APR."
    ));
    return;
  }

  const interes = round(saldo * apr / 1200);
  const capital = round(monto - interes);

  if (capital <= 0) {
    alert(textoApp(
      "El pago no cubre el interés mensual estimado.",
      "The payment does not cover the estimated monthly interest."
    ));
    return;
  }

  if (capital > saldo) {
    alert(textoApp(
      "El pago supera el saldo más el interés estimado.",
      "The payment exceeds the balance plus estimated interest."
    ));
    return;
  }

  if (!confirm(
    textoApp("¿Registrar pago de ", "Record a payment of ") +
    money(monto) + "?"
  )) return;

  const saldoNuevo = round(saldo - capital);
  const pago = {
    id: id(),
    cuentaId: v.id,
    nombre: v.nombre,
    monto,
    interes,
    capital,
    tipo: "vehiculo",
    fecha: today(),
    saldoRestante: saldoNuevo
  };

  const nuevosDatos = {
    ...data,
    vehiculos: data.vehiculos.map((auto, indice) =>
      indice === i ? {...auto, saldo: saldoNuevo} : auto
    ),
    pagos: [...data.pagos, pago]
  };

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp(
      "No se pudo guardar el pago. Inténtalo de nuevo.",
      "Could not save the payment. Please try again."
    ));
    return;
  }

  data = nuevosDatos;

  alert(
    textoApp(
      "Pago registrado.\nInterés estimado: ",
      "Payment recorded.\nEstimated interest: "
    ) + money(interes) +
    textoApp("\nCapital: ", "\nPrincipal: ") + money(capital) +
    textoApp("\nNuevo saldo: ", "\nNew balance: ") + money(saldoNuevo)
  );

  render();
}

function guardarPagoTarjetaBanco(anterior, nuevo) {
  const pago = nuevo || anterior;
  const claveBanco = "amfinance-cuentas-banco";

  try {
    const bancosPrevios = localStorage.getItem(claveBanco);
    const datosPrevios = localStorage.getItem(KEY);
    const cuentas = JSON.parse(bancosPrevios || "[]");

    if (!Array.isArray(cuentas) || !pago) {
            throw new Error(textoApp("Datos no válidos", "Invalid data"));
    }

    const cuenta = cuentas.find(
      c => String(c.id) === String(pago.bancoId)
    );

    const tarjeta = data.tarjetas.find(
      t => t.id === pago.cuentaId
    );

    if (!cuenta || !tarjeta) {
            alert(textoApp("No se encontró la cuenta bancaria o la tarjeta.", "The bank account or card was not found."));
      return false;
    }

    const diferencia = round(
      (nuevo ? Number(nuevo.monto) : 0) -
      (anterior ? Number(anterior.monto) : 0)
    );

    const saldoBanco = round(Number(cuenta.saldo) - diferencia);
    const deudaTarjeta = round(Number(tarjeta.saldo) - diferencia);

    if (
      !Number.isFinite(saldoBanco) ||
      !Number.isFinite(deudaTarjeta) ||
      saldoBanco < 0 ||
      deudaTarjeta < 0
    ) {
            alert(textoApp("Revisa el saldo de la cuenta y la deuda de la tarjeta.", "Check the account balance and the card debt."));
      return false;
    }

    cuenta.saldo = saldoBanco;

    const pagos = anterior
      ? data.pagos.filter(p => p.id !== anterior.id)
      : [...data.pagos];

    if (nuevo) pagos.push(nuevo);

    const tarjetas = data.tarjetas.map(t =>
      t.id === tarjeta.id ? {...t, saldo: deudaTarjeta} : t
    );

    const datosNuevos = {...data, tarjetas, pagos};

    try {
      localStorage.setItem(claveBanco, JSON.stringify(cuentas));
      localStorage.setItem(KEY, JSON.stringify(datosNuevos));
    } catch (error) {
      if (bancosPrevios === null) {
        localStorage.removeItem(claveBanco);
      } else {
        localStorage.setItem(claveBanco, bancosPrevios);
      }

      if (datosPrevios === null) {
        localStorage.removeItem(KEY);
      } else {
        localStorage.setItem(KEY, datosPrevios);
      }

      throw error;
    }

    data = datosNuevos;
    return true;
  } catch (error) {
        alert(textoApp("No se pudieron guardar los cambios del pago.", "Could not save the payment changes."));
    return false;
  }
}

function pagarTarjeta(e, i) {
  e.preventDefault();

  const tarjeta = data.tarjetas[i];
  if (!tarjeta) return;

  const campos = new FormData(e.target);
  const monto = round(campos.get("monto"));
  const bancoId = String(campos.get("bancoId") || "");

  if (!validAmount(monto)) {
        alert(textoApp("Introduce una cantidad válida.", "Enter a valid amount."));
    return;
  }

  if (!bancoId) {
        alert(textoApp("Selecciona la cuenta de origen.", "Select the source account."));
    return;
  }

  if (monto > Number(tarjeta.saldo)) {
        alert(textoApp("El pago supera la deuda de la tarjeta.", "The payment exceeds the card debt."));
    return;
  }

    if (!confirm(textoApp("¿Registrar pago de ", "Record a payment of ") + money(monto) + "?")) {
    return;
  }

  const pago = {
    id: id(),
    cuentaId: tarjeta.id,
    bancoId,
    nombre: tarjeta.nombre,
    monto,
    tipo: "tarjeta",
    fecha: today()
  };

  if (!guardarPagoTarjetaBanco(null, pago)) return;

  render();
    alert(textoApp("Pago registrado y descontado de la cuenta elegida.", "Payment recorded and deducted from the selected account."));
}

function resumenPreciosSuscripcion(registro) {
  const monto = Number(registro.monto);
  const mensual = Number(registro.precioMensual);
  const anual = Number(registro.precioAnual);
  const tieneMensual = registro.precioMensual != null && Number.isFinite(mensual) && mensual > 0;
  const tieneAnual = registro.precioAnual != null && Number.isFinite(anual) && anual > 0;
  const frecuencia = registro.frecuencia || "mensual";
  const mes = tieneMensual ? money(mensual)
    : frecuencia === "anual" && Number.isFinite(monto) ? "≈" + money(monto / 12)
    : Number.isFinite(monto) ? money(monto) : "—";
  const anio = tieneAnual ? money(anual)
    : Number.isFinite(monto) ? "≈" + money(monto * (frecuencia === "cada14dias" ? 26 : frecuencia === "anual" ? 1 : 12)) : "—";
  const etiqueta = frecuencia === "cada14dias"
    ? textoApp("Cada 14 días", "Every 14 days") : textoApp("Mes", "Month");
  return `${etiqueta}: ${mes} · ${textoApp("Año", "Year")}: ${anio}`;
}

function guardarSuscripcionFormulario(form, indice = null) {
  if (form.dataset.guardado === "si") return false;

  const campos = new FormData(form);
  const nombre = String(campos.get("nombre") || "").trim();
  const frecuencia = String(campos.get("frecuencia") || "mensual");
  const categoria = String(campos.get("categoria") || "");
  const precioMensualTexto = String(campos.get("precioMensual") || "").trim();
  const precioAnualTexto = String(campos.get("precioAnual") || "").trim();
  const precioMensual = precioMensualTexto ? round(precioMensualTexto) : null;
  const precioAnual = precioAnualTexto ? round(precioAnualTexto) : null;
  const monto = frecuencia === "anual" ? precioAnual : precioMensual;
  const inicio = String(campos.get("inicio") || "");
  const fin = String(campos.get("fin") || "");

  if (!nombre || !validDate(inicio) || !validAmount(monto) ||
      (precioMensual !== null && !validAmount(precioMensual)) ||
      (precioAnual !== null && !validAmount(precioAnual)) ||
      !["mensual", "cada14dias", "anual"].includes(frecuencia) ||
      !["suscripcion", "renta", "prestamo", "cuotas"].includes(categoria)) {
    alert(textoApp(
      "Revisa el nombre, la fecha y el precio del período que vas a pagar.",
      "Check the name, date and price for the selected billing period."
    ));
    return false;
  }
  if (fin && (!validDate(fin) || fin < inicio)) {
    alert(textoApp(
      "El último cobro debe ser igual o posterior al primero.",
      "The last charge must be on or after the first."
    ));
    return false;
  }
  if (["prestamo", "cuotas"].includes(categoria) && !fin) {
    alert(textoApp("Indica la fecha del último cobro.", "Enter the last charge date."));
    return false;
  }

  const lista = Array.isArray(data.suscripciones) ? data.suscripciones : [];
  const anterior = Number.isInteger(indice) && indice >= 0 ? lista[indice] : null;
  if (indice !== null && !anterior) return false;
  const nueva = {
    ...(anterior || {}), id:anterior ? anterior.id : id(),
    nombre, monto, precioMensual, precioAnual, inicio, categoria, fin, frecuencia
  };
  const nuevaLista = anterior
    ? lista.map((registro, i) => i === indice ? nueva : registro)
    : [...lista, nueva];
  const nuevosDatos = {...data, suscripciones:nuevaLista};

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp("No se pudo guardar. No se hicieron cambios.",
      "Could not save. No changes were made."));
    return false;
  }
  form.dataset.guardado = "si";
  data = nuevosDatos;
  render();
  return true;
}
