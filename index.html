body{margin:0;background:#F2F2F7;color:#17212e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.logo{font-size:1.4375rem;font-weight:300}
.sub{color:#84909d;font-size:0.8125rem;margin-top:5px}

/* Barra flotante Balance One */
nav {
  position: fixed;
  bottom: calc(3px + env(safe-area-inset-bottom));
  left: 28px;
  right: 28px;
  width: auto;
  padding: 5px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,.65);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 6px 24px rgba(0,0,0,.08);
  display: flex;
  gap: 3px;
  z-index: 100;
  backdrop-filter: blur(40px);
-webkit-backdrop-filter: blur(40px);
  transform: translateY(0);
  transition: transform 0.3s ease;
}

nav button {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #fff;
  padding: 12px 2px;
}

/* Barra adaptable a modo claro y oscuro */
@media (prefers-color-scheme: light) {
  nav {
    background: rgba(250,251,253,.78);
    border-color: rgba(120,125,135,.25);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.95),
      0 4px 14px rgba(0,0,0,.04);
  }

  nav button {
    color: #252525;
  }

  nav button.active {
    background: rgba(180,180,190,0.25);
    color: #F28C28;
    padding-left: 14px;
    padding-right: 14px;
    transform: scaleY(1);
  }
}

/* Alinear iconos y textos de la barra */
nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  font-size: 11px;
  white-space: nowrap;
}

nav button svg {
  display: block;
  flex-shrink: 0;
  width: 21px;
  height: 21px;
}

nav button span {
  font-size: 10px;
  line-height: 1.2;
  font-weight: 500;
}
.item{border-bottom:1px solid #f0f1f3;padding:13px 0}
.item:last-child{border:0}
.note{font-size:0.75rem;color:#89939f;line-height:1.5}
.payment{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.hidden{display:none}
.editbox{background:#f5f8f9;border-radius:13px;padding:14px;margin-top:12px}
.editbox input,
.editbox select,
.editbox button {
  border-radius: 999px;
}
.editbox input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  height: 46px;
  padding: 11px 16px;
  border-radius: 999px;
  font: inherit;
  font-size: 16px;
  text-align: left;
}

.editbox input[type="date"]::-webkit-date-and-time-value {
  min-width: 0;
  text-align: left;
}

}

/* Menú flotante Balance One */
#amMenuFondo {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  opacity: 0;
  visibility: hidden;
  transition: .3s;
  z-index: 9998;
}

#amMenu {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  padding: 22px 18px 32px;
  border-radius: 50px;
  background: rgba(250,251,253,.78);
  color: #17212e;
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(120,125,135,.25);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.95),
    0 4px 14px rgba(0,0,0,.04);
  transform: translateY(120%);
  visibility: hidden;
  transition: transform .35s ease, visibility .35s;
  z-index: 9999;
height: 430px;
box-sizing: border-box;
overflow: hidden;
}

#amMenuTirador {
  width: 42px;
  height: 5px;
  border-radius: 20px;
  background: #9ca3af;
  margin: 0 auto 20px;
}

#amMenu h3 {
  color: inherit;
  margin: 0 0 16px;
  font-size: 20px;
}

#amMenu button {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 18px 10px;
  min-height: 95px;
  border-radius: 999px;
  text-align: center;
  white-space: normal;
  color: #17212e;
  font-size: 14px;
  background: rgba(255,255,255,.42);
  border: 1px solid rgba(255,255,255,.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 4px 16px rgba(0,0,0,.04);
}

#amMenu .amPagina {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 12px;
  row-gap: 10px;
  height: 310px;
  align-content: start;
  box-sizing: border-box;
}

#amIndicadores {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}

#amIndicadores span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #a1a1aa;
  opacity: 0.4;
  transition: all 0.25s ease;
}

#amIndicadores span.activo {
  width: 16px;
  border-radius: 999px;
  background: #64748b;
  opacity: 1;
}
#amPaginas {
  display: flex;
  width: 100%;
  height: 310px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

#amPaginas::-webkit-scrollbar {
  display: none;
}

#amPaginas .amPagina {
  flex: 0 0 100%;
  width: 100%;
  height: 310px;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
#amPaginas .amPagina button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#amPaginas .amPagina button svg {
  display: block;
  flex-shrink: 0;
}

#amMenuTirador,
#amMenu h3 {
  grid-column: 1 / -1;
}

#amMenu.abierto {
  transform: translateY(0);
  visibility: visible;
}

#amMenuFondo.abierto {
  opacity: 1;
  visibility: visible;
}

/* Calculadora moderna Balance One */
.amCalc {
  padding: 8px 0 30px;
}

.amCalc h2 {
  text-align: center;
  font-size: 1.4375rem;
  margin-bottom: 6px;
}

.amCalc > .note {
  text-align: center;
  margin-bottom: 24px;
}

.amCalcTabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin-bottom: 22px;
}

.amCalcTabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 68px;
  padding: 9px 4px;
  gap: 5px;
  border-radius: 999px;
  font-size: 12px;
  background: #292d36;
  color: white;
  border: 1px solid #454b57;
}

.amCalcTabs button.activo {
  background: #78869d;
  font-weight: 700;
}

.amCalcCampos,
.amCalcResultado {
  border-radius: 28px;
  padding: 22px;
  margin-bottom: 20px;
}

.amCalcCampos input[type="range"] {
  display: block;
  width: 100%;
  height: 8px;
  margin: 8px 0 12px;
  accent-color: #8798b7;
  cursor: pointer;
}

.amCalcResultado h1 {
  font-size: clamp(36px, 9vw, 54px);
  margin: 8px 0 22px;
  letter-spacing: -1px;
}

.amCalcTotales {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  border-top: 1px solid #7775;
  padding-top: 18px;
}

.amCalcTotales div {
  font-size: 12px;
  min-width: 0;
}

.amCalcTotales strong {
  display: block;
  font-size: 15px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.amCalc > button.primary {
  width: 100%;
  border-radius: 999px;
  padding: 18px;
  margin-bottom: 14px;
}

.amCalcAcciones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.amCalcAcciones button {
  padding: 17px 8px;
  border-radius: 999px;
  background: #292d36;
  color: white;
  border: 1px solid #454b57;
}

/* Diseño compacto de la calculadora */

.amCalcCampos label {
  display: inline-block;
  position: relative;
  width: 46%;
  vertical-align: middle;
  font-size: 13px;
  font-weight: 500;
  margin: 5px 0;
}

.amCalcCampos input[type="range"]::-webkit-slider-thumb {
  width: 24px;
  height: 24px;
}

/* Ajuste compacto de la calculadora */
.amCalcCampos {
  padding: 16px 18px;
  position: relative;
}

.amCalcTabs button svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Símbolos dentro de los campos de la calculadora */

/* Tamaños refinados de la calculadora */

.amCalcCampos input[type="number"] {
  display: inline-block;
  vertical-align: middle;
  text-align: center;
  box-sizing: border-box;
  width: 44%;
  padding: 9px 12px;
  margin: 5px 0;
  font-size: 15px;
  border-radius: 18px;
}

body:has(#content .amCalc) > header {
  display: none;
}

/* Símbolos dentro de los campos */
.amCalcInput {
  position: relative;
  display: flex;
  align-items: center;
  width: 44%;
}

.amCalcInput span {
  position: absolute;
  left: 14px;
  color: #7b8494;
  font-size: 15px;
  font-weight: 600;
  pointer-events: none;
}

.amCalcInput input[type="number"] {
  width: 100%;
  box-sizing: border-box;
  padding-left: 34px;
}
.balance-principal {
  border-radius: 36px;
  overflow: hidden;
  padding: 22px;
}

.balance-principal .amount {
  font-size: 30px;
  font-weight: 800;
  margin-top: 8px;
}

.resumen-ovalado {
  border-radius: 40px;
  padding: 22px 18px;
  min-width: 0;
  box-sizing: border-box;
}

.logo span {
  font-weight: 700;

}

 data={movimientos:[],vehiculos:[],tarjetas:[],pagos:[]};

function idiomaActual() {
  return localStorage.getItem("balanceone-idioma") === "en"

    : "es";
}

  return idiomaActual() === "en" ? ingles : espanol;
}

function aplicarIdiomaGeneral() {
  const ingles = idiomaActual() === "en";
  document.documentElement.lang = ingles ? "en" : "es";
  traducirMenusVentana();
  const nombres = ingles
    ? ["Home", "Transactions", "Vehicles", "Cards", "Profile"]
    : ["Inicio", "Movimientos", "Vehículos", "Tarjetas", "Perfil"];

  document.querySelectorAll("nav button span").forEach((texto, i) => {
    if (nombres[i]) texto.textContent = nombres[i];
  });

  const subtitulo = document.querySelector("header .sub");
  if (subtitulo) {
    subtitulo.textContent = textoApp(
      "Control inteligente de tus finanzas · 0.2.1 Beta",
      "Smart control of your finances · 0.2.1 Beta"
    );
  }
}

function guardarIdiomaApp(idioma) {
  if (!["es", "en"].includes(idioma)) return;

  try {
    localStorage.setItem("balanceone-idioma", idioma);
  } catch {
    alert(textoApp(
      "No se pudo guardar el idioma.",
      "Could not save the language."
    ));
    return;
  }

  aplicarIdiomaGeneral();
  preferenciasPerfil();
}

const money = n => {
  const preferencia = localStorage.getItem(
    "balanceone-formato-importes"
  );

  const formato = ["en-US", "es-ES"].includes(preferencia)
    ? preferencia
    : "en-US";

  return new Intl.NumberFormat(formato, {
    style: "currency",
    currency: "USD"
  }).format(Number(n) || 0);
};

const round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;

const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));

 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function diasParaVencer(dia){
const hoy=new Date();
hoy.setHours(0,0,0,0);

let fecha=new Date(
hoy.getFullYear(),
hoy.getMonth(),
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+1,0
).getDate())
);

if(fecha<hoy){
fecha=new Date(
hoy.getFullYear(),
hoy.getMonth()+1,
Math.min(dia,new Date(
hoy.getFullYear(),hoy.getMonth()+2,0
).getDate())
);
}

return Math.round((fecha-hoy)/86400000);
}

function avisosVencimiento() {
  const cuentas = [
    ...data.vehiculos.map(v => ({
      ...v, tipo: textoApp("Vehículo", "Vehicle")
    })),
    ...data.tarjetas.map(t => ({
      ...t, tipo: textoApp("Tarjeta", "Card")
    }))
  ];

  return cuentas.map(c => {
    const dia = Number(c.vencimiento);
    if (!Number.isInteger(dia) || dia < 1 || dia > 31) return "";

    const faltan = diasParaVencer(dia);
    if (![7, 3, 0].includes(faltan)) return "";

    const mensaje = faltan === 0
      ? textoApp("¡Tu pago vence hoy!", "Your payment is due today!")
      : textoApp(
          `Faltan ${faltan} días para tu próximo pago.`,
          `Your next payment is due in ${faltan} days.`
        );

    return `
      <div class="card">
        <strong>🔔 ${safe(c.tipo)}: ${safe(c.nombre)}</strong>
        <p>${mensaje}</p>
      </div>
    `;
  }).join("");
}

function guardarMovimientoBanco(anterior, nuevo) {
  const claveBanco = "amfinance-cuentas-banco";
  const datosPrevios = localStorage.getItem(KEY);
  const bancosPrevios = localStorage.getItem(claveBanco);

  try {
    const cuentas = JSON.parse(bancosPrevios || "[]");

    if (!Array.isArray(cuentas)) {
            throw new Error(textoApp("Cuentas no válidas", "Invalid accounts"));
    }

    const cambios = new Map();

    function acumular(movimiento, signo) {
      if (!movimiento || !movimiento.cuentaId) return;

      const cantidad = Number(movimiento.monto);

      if (
        !validAmount(cantidad) ||
        !["ingreso", "gasto"].includes(movimiento.tipo)
      ) {
                throw new Error(textoApp("Movimiento no válido", "Invalid transaction"));
      }

      const cuentaId = String(movimiento.cuentaId);
      const efecto = movimiento.tipo === "ingreso"
        ? cantidad
        : -cantidad;

      cambios.set(
        cuentaId,
        round((cambios.get(cuentaId) || 0) + efecto * signo)
      );
    }

    acumular(anterior, -1);
    acumular(nuevo, 1);

    for (const [cuentaId, diferencia] of cambios) {
      const cuenta = cuentas.find(
        c => String(c.id) === cuentaId
      );

      if (!cuenta) {
                alert(textoApp("No se encontró la cuenta del movimiento.", "The account for this transaction was not found."));
        return false;
      }

      const saldo = round(Number(cuenta.saldo) + diferencia);

      if (!Number.isFinite(saldo) || saldo < 0) {
                alert(textoApp("La operación dejaría la cuenta sin saldo suficiente.", "The account would have insufficient funds after this operation."));
        return false;
      }

      cuenta.saldo = saldo;
    }

    const movimientosNuevos = anterior
      ? data.movimientos.filter(m => m.id !== anterior.id)
      : [...data.movimientos];

    if (nuevo) movimientosNuevos.push(nuevo);

    const prestamosActualizados = (data.prestamos || [])
  .map(p => ({...p}));

function ajustarPrestamo(movimiento, signo) {
  if (!movimiento || !movimiento.prestamoId) return;

  const prestamo = prestamosActualizados.find(
    p => String(p.id) === String(movimiento.prestamoId)
  );

  const intereses = Number(movimiento.interesPrestamo || 0);
  const capital = round(Number(movimiento.monto) - intereses);

  if (
    !prestamo ||
    movimiento.tipo !== "gasto" ||
    !Number.isFinite(intereses) ||
    intereses < 0 ||
    !validAmount(capital)
  ) {
    throw new Error("Pago de préstamo no válido");
  }

  const saldo = round(Number(prestamo.saldo) + signo * capital);
  
  if (!Number.isFinite(saldo) || saldo < 0) {
    throw new Error("El capital supera el saldo pendiente");
  }

  prestamo.saldo = saldo;
}

ajustarPrestamo(anterior, 1);
ajustarPrestamo(nuevo, -1);

const datosNuevos = {
  ...data,
  movimientos: movimientosNuevos,
  prestamos: prestamosActualizados
};

    try {
      localStorage.setItem(
        claveBanco,
        JSON.stringify(cuentas)
      );

      localStorage.setItem(
        KEY,
        JSON.stringify(datosNuevos)
      );
    } catch (error) {
      if (bancosPrevios === null) {
        localStorage.removeItem(claveBanco);
      } else {
        localStorage.setItem(claveBanco, bancosPrevios);
      }

      if (datosPrevios === null) {
        localStorage.removeItem(KEY);
      } else {
        localStorage.setItem(KEY, datosPrevios);
      }

      throw error;
    }

   data.movimientos = movimientosNuevos;
   data.prestamos = prestamosActualizados;
    return true;
  } catch (error) {
        alert(textoApp("No se pudieron guardar los cambios del movimiento.", "Could not save the transaction changes."));
    return false;
  }
}

const registrosHistorial = document.querySelectorAll(".hist-registro");
const avisoHistorial = document.getElementById("histSinResultados");

let filtroHistorial = "todos";

const normalizarBusqueda = texto => String(texto)
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "")
  .toLowerCase()
  .trim();

function filtrarHistorial() {
  const busqueda = normalizarBusqueda(textoBusqueda.value);
  let visibles = 0;

  registrosHistorial.forEach(registro => {
    const coincideTipo = filtroHistorial === "todos" ||
      registro.dataset.histTipo === filtroHistorial;

    const coincideTexto = normalizarBusqueda(
      registro.dataset.histNombre
    ).includes(busqueda);

    registro.hidden = !(coincideTipo && coincideTexto);

    if (!registro.hidden) visibles++;
  });

  avisoHistorial.hidden = visibles > 0;
  avisoHistorial.textContent = items.length
    ? textoApp("No hay movimientos que coincidan.", "No matching transactions.")
    : textoApp("Sin movimientos", "No transactions");
}

  if (abrir) {

    filtrarHistorial();

function findItem(origen,ident){
 const group=origen==="pago"?data.pagos:data.movimientos;
 return group.find(x=>x.id===ident);
}

function cuentaDePago(p){
 const group=p.tipo==="vehiculo"?data.vehiculos:
             p.tipo==="tarjeta"?data.tarjetas:[];
 if(p.cuentaId){
  return group.find(x=>x.id===p.cuentaId)||null;
 }
 const matches=group.filter(x=>x.nombre===p.nombre);
 return matches.length===1?matches[0]:null;
}

// Modifica el saldo de la deuda al corregir un pago.
// delta positivo = aumenta la deuda.
// delta negativo = disminuye la deuda.
function ajustarSaldo(cuenta,delta){
 const nuevo=round(Number(cuenta.saldo)+delta);
 if(!Number.isFinite(nuevo)||nuevo<0){
    alert(textoApp("Este cambio dejaría la deuda con saldo negativo. Revisa los pagos.", "This change would make the debt balance negative. Check the payments."));
  return false;
 }
 cuenta.saldo=nuevo;
 return true;
}

function guardarEdicion(e,origen,ident){
 e.preventDefault();
 const datosAnteriores = JSON.stringify(data);
 const item=findItem(origen,ident);
 if(!item)return;
 const f=new FormData(e.target);
 const monto=round(f.get("monto"));
 const fecha=String(f.get("fecha"));

 if(!validAmount(monto)||!validDate(fecha)){
    alert(textoApp("Introduce una cantidad y una fecha válidas.", "Enter a valid amount and date."));
  return;
 }
if (
  origen === "pago" &&
  item.tipo === "tarjeta" &&
  item.bancoId
) {
  const corregido = {
    ...item,
    monto,
    fecha
  };

  if (!guardarPagoTarjetaBanco(item, corregido)) return;

  openEdit = null;
  render();
    alert(textoApp("Pago corregido y saldos actualizados.", "Payment corrected and balances updated."));
  return;
}

 if(origen==="movimiento"){
  const nombre=String(f.get("nombre")).trim();
  if(!nombre)return;
const corregido = {
  ...item,
  nombre,
  tipo: f.get("tipo"),
  monto,
  fecha
};

if (!guardarMovimientoBanco(item, corregido)) return;

openEdit = null;
alert(textoApp("Cambios guardados correctamente.", "Changes saved successfully."));
render();
return;
 }else{
  const cuenta=cuentaDePago(item);
  if(!cuenta){
      alert(textoApp("No se encontró la cuenta de este pago. No se puede corregir la deuda automáticamente.", "The account for this payment was not found. The debt cannot be adjusted automatically."));
   return;
  }
  const anterior=Number(item.monto);
  const diferencia=round(monto-anterior);

  if(item.tipo==="vehiculo"){
   const interes=Number(item.interes);
   const capitalAnterior=Number(item.capital);
   if(!Number.isFinite(interes)||!Number.isFinite(capitalAnterior)){
        alert(textoApp("Este pago antiguo no tiene suficientes datos para editarse con seguridad.", "This older payment does not have enough information to be edited safely."));
    return;
   }
   const capitalNuevo=round(capitalAnterior+diferencia);
   if(capitalNuevo<=0){
        alert(textoApp("El pago corregido no cubre el interés registrado.", "The corrected payment does not cover the recorded interest."));
    return;
   }
   if(!ajustarSaldo(cuenta,-diferencia))return;
   item.capital=capitalNuevo;
  }else{
   if(!ajustarSaldo(cuenta,-diferencia))return;
  }
  item.monto=monto;
  item.fecha=fecha;
  item.cuentaId=cuenta.id;
  actualizarSaldosHistorial(cuenta);
 }

 openEdit=null;
  if (!save()) {
   data = JSON.parse(datosAnteriores);
   return;
 }
   alert(textoApp("Cambios guardados correctamente.", "Changes saved successfully."));
 render();
}

function eliminar(origen,ident){
 const datosAnteriores = JSON.stringify(data);
 const group=origen==="pago"?data.pagos:data.movimientos;
 const index=group.findIndex(x=>x.id===ident);
 if(index<0)return;
 const item=group[index];

   if(!confirm(origen==="pago" ? textoApp("¿Seguro que deseas eliminar este pago?", "Are you sure you want to delete this payment?") : textoApp("¿Seguro que deseas eliminar este movimiento?", "Are you sure you want to delete this transaction?")))return;
 if (
  origen === "pago" &&
  item.tipo === "tarjeta" &&
  item.bancoId
) {
  if (!guardarPagoTarjetaBanco(item, null)) return;

  openEdit = null;
  render();
    alert(textoApp("Pago eliminado y saldos restaurados.", "Payment deleted and balances restored."));
  return;
}
 if(origen==="pago"){
  const cuenta=cuentaDePago(item);
  if(!cuenta){
      alert(textoApp("No se encontró la cuenta asociada. No se eliminará el pago para evitar descuadrar la deuda.", "The linked account was not found. The payment will not be deleted to keep the debt balance accurate."));
   return;
  }
  const devolver=item.tipo==="vehiculo"?
   Number(item.capital):Number(item.monto);
  if(!Number.isFinite(devolver)){
      alert(textoApp("Este pago no tiene información suficiente para eliminarlo.", "This payment does not have enough information to be deleted."));
   return;
  }
  if(!ajustarSaldo(cuenta,devolver))return;
  group.splice(index,1);
  actualizarSaldosHistorial(cuenta);
 }else{
  if (!guardarMovimientoBanco(item, null)) return;

openEdit = null;
alert(textoApp("Registro eliminado.", "Record deleted."));
render();
return;
 }

 openEdit=null;
  if (!save()) {
   data = JSON.parse(datosAnteriores);
   return;
 }
   alert(textoApp("Registro eliminado.", "Record deleted."));
 render();
}

// Recalcula los saldos históricos cuando se corrigen pagos.
// Los pagos sin datos suficientes muestran "No registrado".
function actualizarSaldosHistorial(cuenta){
 const group=data.pagos.filter(p=>
  p.tipo==="vehiculo"&&cuentaDePago(p)===cuenta
 ).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

 let saldo=Number(cuenta.saldo);
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo+Number(p.capital));
 }
 for(const p of group){
  if(!Number.isFinite(Number(p.capital))){
   delete p.saldoRestante;
   continue;
  }
  saldo=round(saldo-Number(p.capital));
  p.saldoRestante=saldo;
 }
}

async function guardarDatosAuto(event, i) {
  event.preventDefault();

  const auto = data.vehiculos[i];
  if (!auto) return;

  const formulario = event.target;
  const boton = formulario.querySelector('button[type="submit"], button.primary');
  const campos = new FormData(formulario);
  const nombre = String(campos.get("nombre") || "").trim();
  const foto = String(campos.get("foto") || "").trim();
  const archivo = campos.get("fotoArchivo");

  if (!nombre) {
        alert(textoApp("Escribe el nombre del vehículo.", "Enter the vehicle name."));
    return;
  }

  if (foto) {
    try {
      if (new URL(foto).protocol !== "https:") throw new Error();
    } catch {
            alert(textoApp("El enlace debe empezar con https://", "The link must start with https://"));
      return;
    }
  }

  if (boton) boton.disabled = true;

  try {
    let fotoGaleria = auto.fotoGaleria || "";

    if (archivo && archivo.size > 0) {
      const url = URL.createObjectURL(archivo);

      try {
        const imagen = new Image();

        await new Promise((resolve, reject) => {
          imagen.onload = resolve;
          imagen.onerror = () => reject(
                        new Error(textoApp("No se pudo abrir la foto. Prueba con JPG o PNG.", "Could not open the photo. Try a JPG or PNG image."))
          );
          imagen.src = url;
        });

        const escala = Math.min(
          1, 900 / Math.max(imagen.naturalWidth, imagen.naturalHeight)
        );

        const lienzo = document.createElement("canvas");
        lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));

        const contexto = lienzo.getContext("2d");
                if (!contexto) throw new Error(textoApp("No se pudo preparar la foto.", "Could not process the photo."));

        contexto.fillStyle = "#ffffff";
        contexto.fillRect(0, 0, lienzo.width, lienzo.height);
        contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
        fotoGaleria = lienzo.toDataURL("image/jpeg", 0.8);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

        const entradaInicial = String(
      campos.get("montoInicial") || ""
    ).trim();

    const montoInicial = entradaInicial
      ? Number(entradaInicial)
      : null;

    if (
      montoInicial !== null &&
      (!Number.isFinite(montoInicial) ||
       montoInicial <= 0 ||
       montoInicial < Number(auto.saldo))
    ) {
            alert(textoApp("El monto inicial debe ser mayor que cero y no menor al saldo pendiente.", "The original loan amount must be greater than zero and cannot be less than the outstanding balance."));
      return;
    }

    const actualizado = {
      ...auto,
      nombre,
      montoInicial,
      modelo: String(campos.get("modelo") || "").trim(),
      anio: String(campos.get("anio") || "").trim(),
      banco: String(campos.get("banco") || "").trim(),
      foto,
      fotoGaleria
    };

    const nuevosDatos = {
      ...data,
      vehiculos: data.vehiculos.map(v => v === auto ? actualizado : v)
    };

    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
    data = nuevosDatos;
    render();
  } catch (error) {
    alert(
      error.name === "QuotaExceededError"
                ? textoApp("No hay espacio suficiente para guardar la foto.", "There is not enough storage space to save the photo.")
                : error.message || textoApp("No se pudieron guardar los datos.", "Could not save the details.")
    );
  } finally {
    if (boton) boton.disabled = false;
  }
}

function pagarAuto(e, i) {
  e.preventDefault();
  const v = data.vehiculos[i];
  if (!v) return;

  const monto = round(new FormData(e.target).get("monto"));
  const saldo = Number(v.saldo);
  const apr = Number(v.apr);

  if (!validAmount(monto) ||
      !Number.isFinite(saldo) || saldo < 0 ||
      !Number.isFinite(apr) || apr < 0) {
    alert(textoApp(
      "Revisa el importe, el saldo y la tasa APR.",
      "Check the amount, balance and APR."
    ));
    return;
  }

  const interes = round(saldo * apr / 1200);
  const capital = round(monto - interes);

  if (capital <= 0) {
    alert(textoApp(
      "El pago no cubre el interés mensual estimado.",
      "The payment does not cover the estimated monthly interest."
    ));
    return;
  }

  if (capital > saldo) {
    alert(textoApp(
      "El pago supera el saldo más el interés estimado.",
      "The payment exceeds the balance plus estimated interest."
    ));
    return;
  }

  if (!confirm(
    textoApp("¿Registrar pago de ", "Record a payment of ") +
    money(monto) + "?"
  )) return;

  const saldoNuevo = round(saldo - capital);
  const pago = {
    id: id(),
    cuentaId: v.id,
    nombre: v.nombre,
    monto,
    interes,
    capital,
    tipo: "vehiculo",
    fecha: today(),
    saldoRestante: saldoNuevo
  };

  const nuevosDatos = {
    ...data,
    vehiculos: data.vehiculos.map((auto, indice) =>
      indice === i ? {...auto, saldo: saldoNuevo} : auto
    ),
    pagos: [...data.pagos, pago]
  };

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp(
      "No se pudo guardar el pago. Inténtalo de nuevo.",
      "Could not save the payment. Please try again."
    ));
    return;
  }

  data = nuevosDatos;

  alert(
    textoApp(
      "Pago registrado.\nInterés estimado: ",
      "Payment recorded.\nEstimated interest: "
    ) + money(interes) +
    textoApp("\nCapital: ", "\nPrincipal: ") + money(capital) +
    textoApp("\nNuevo saldo: ", "\nNew balance: ") + money(saldoNuevo)
  );

  render();
}

function guardarPagoTarjetaBanco(anterior, nuevo) {
  const pago = nuevo || anterior;
  const claveBanco = "amfinance-cuentas-banco";

  try {
    const bancosPrevios = localStorage.getItem(claveBanco);
    const datosPrevios = localStorage.getItem(KEY);
    const cuentas = JSON.parse(bancosPrevios || "[]");

    if (!Array.isArray(cuentas) || !pago) {
            throw new Error(textoApp("Datos no válidos", "Invalid data"));
    }

    const cuenta = cuentas.find(
      c => String(c.id) === String(pago.bancoId)
    );

    const tarjeta = data.tarjetas.find(
      t => t.id === pago.cuentaId
    );

    if (!cuenta || !tarjeta) {
            alert(textoApp("No se encontró la cuenta bancaria o la tarjeta.", "The bank account or card was not found."));
      return false;
    }

    const diferencia = round(
      (nuevo ? Number(nuevo.monto) : 0) -
      (anterior ? Number(anterior.monto) : 0)
    );

    const saldoBanco = round(Number(cuenta.saldo) - diferencia);
    const deudaTarjeta = round(Number(tarjeta.saldo) - diferencia);

    if (
      !Number.isFinite(saldoBanco) ||
      !Number.isFinite(deudaTarjeta) ||
      saldoBanco < 0 ||
      deudaTarjeta < 0
    ) {
            alert(textoApp("Revisa el saldo de la cuenta y la deuda de la tarjeta.", "Check the account balance and the card debt."));
      return false;
    }

    cuenta.saldo = saldoBanco;

    const pagos = anterior
      ? data.pagos.filter(p => p.id !== anterior.id)
      : [...data.pagos];

    if (nuevo) pagos.push(nuevo);

    const tarjetas = data.tarjetas.map(t =>
      t.id === tarjeta.id ? {...t, saldo: deudaTarjeta} : t
    );

    const datosNuevos = {...data, tarjetas, pagos};

    try {
      localStorage.setItem(claveBanco, JSON.stringify(cuentas));
      localStorage.setItem(KEY, JSON.stringify(datosNuevos));
    } catch (error) {
      if (bancosPrevios === null) {
        localStorage.removeItem(claveBanco);
      } else {
        localStorage.setItem(claveBanco, bancosPrevios);
      }

      if (datosPrevios === null) {
        localStorage.removeItem(KEY);
      } else {
        localStorage.setItem(KEY, datosPrevios);
      }

      throw error;
    }

    data = datosNuevos;
    return true;
  } catch (error) {
        alert(textoApp("No se pudieron guardar los cambios del pago.", "Could not save the payment changes."));
    return false;
  }
}

async function restaurarCopia(event){
  const archivo = event.target.files[0];
  if(!archivo) return;

  try {
    const texto = await archivo.text();
    const respaldo = JSON.parse(texto);

    if(
      respaldo.aplicacion !== "Balance One" ||
      respaldo.version !== 1 ||
      !respaldo.datos ||
      !Array.isArray(respaldo.datos.movimientos) ||
      !Array.isArray(respaldo.datos.pagos) ||
      !Array.isArray(respaldo.datos.vehiculos) ||
      !Array.isArray(respaldo.datos.tarjetas)
    ){
            alert(textoApp("Este archivo no es una copia válida de Balance One.", "This file is not a valid Balance One backup."));
      return;
    }

    if(!confirm(
            textoApp("¿Restaurar esta copia? Se reemplazarán los datos actuales de Balance One.", "Restore this backup? Your current Balance One data will be replaced.")
    )) return;

    if (
  respaldo.cuentasBanco !== undefined &&
  !Array.isArray(respaldo.cuentasBanco)
) {
    alert(textoApp("Las cuentas bancarias del respaldo no son válidas.", "The bank accounts in the backup are invalid."));
  return;
}

const claveBanco = "amfinance-cuentas-banco";
const anteriores = [
  [KEY, localStorage.getItem(KEY)],
  [claveBanco, localStorage.getItem(claveBanco)]
];

try {
  localStorage.setItem(
    KEY,
    JSON.stringify(respaldo.datos)
  );

  if (Array.isArray(respaldo.cuentasBanco)) {
    localStorage.setItem(
      claveBanco,
      JSON.stringify(respaldo.cuentasBanco)
    );
  }
} catch (error) {
  for (const [clave, valor] of anteriores) {
    if (valor === null) {
      localStorage.removeItem(clave);
    } else {
      localStorage.setItem(clave, valor);
    }
  }
  throw error;
}
        alert(textoApp("Copia restaurada correctamente.", "Backup restored successfully."));
    location.reload();

  } catch(error) {
        alert(textoApp("No se pudo restaurar la copia de seguridad.", "Could not restore the backup."));
  } finally {
    event.target.value = "";
  }
}

  const monto = Math.max(0, valor("calcMonto"));
  const inicial = Math.min(monto, Math.max(0, valor("calcInicial")));
  const tasa = Math.max(0, valor("calcTasa")) / 1200;
  const meses = Math.max(1, Math.round(valor("calcPlazo")));
  const capital = monto - inicial;
  const mensual = tasa === 0
    ? capital / meses
    : capital * tasa / (1 - Math.pow(1 + tasa, -meses));
  const total = mensual * meses;
  const formato = money;

  ["Monto", "Tasa", "Plazo", "Inicial"].forEach(campo => {
    const barra = document.getElementById("calc" + campo + "Barra");
    const numero = document.getElementById("calc" + campo);
    barra.value = numero.value;
  });

  document.getElementById("calcMensual").textContent = formato(mensual);
  document.getElementById("calcFinanciado").textContent = formato(capital);
  document.getElementById("calcIntereses").textContent = formato(total - capital);
  document.getElementById("calcTotal").textContent = formato(total);
}

function abrirNuevoPrestamo() {
  const campos = [
    ["nombre", "Banco o aplicación", "Bank or app", "text"],
    ["saldo", "Saldo pendiente ($)", "Outstanding balance ($)", "number"],
    ["cuota", "Importe de la cuota ($)", "Installment amount ($)", "number"],
    ["proximo", "Próximo vencimiento", "Next due date", "date"],
    ["fin", "Último pago previsto", "Expected final payment", "date"]
  ];

  const ventana = crearVentanaApariencia(
    textoApp("Agregar préstamo", "Add loan"),
    `
      <form id="formPrestamoCompacto">
        ${campos.map(([nombre, es, en, tipo]) => `
          <label for="prestamo-${nombre}">${textoApp(es, en)}</label>

            type="${tipo}" required

          style="background:var(--balanceone-color,#ff7900)">
          ${textoApp("Guardar préstamo", "Save loan")}
        </button>
      </form>

    true
  );

  if (!ventana) return;
  const form = ventana.querySelector("form");

  form.onsubmit = event => {
    event.preventDefault();
    if (form.dataset.guardado === "si") return;

    const f = new FormData(form);

    if (
      !nombre || !validAmount(saldo) || !validAmount(cuota) ||
      !validDate(proximo) || !validDate(fin) || fin < proximo ||
      !["mensual", "cada14dias"].includes(frecuencia)

      return;

    const lista = Array.isArray(data.prestamos)
      ? data.prestamos : [];

    const nuevosDatos = {
      ...data,
      prestamos:[...lista, {
        id:id(), nombre, saldo, saldoInicial:saldo,
        cuota, proximo, fin, frecuencia
      }]

    try {

    } catch {
      alert(textoApp(
        "No se pudo guardar. No se hicieron cambios.",
        "Could not save. No changes were made."
      ));
      return;
    }

    form.dataset.guardado = "si";
    data = nuevosDatos;
    ventana.close();
    render();
  };
}

async function guardarPerfilLocal(event) {
  event.preventDefault();

  const formulario = event.target;
  const campos = new FormData(formulario);
  const nombre = String(campos.get("nombre") || "").trim();
  const archivo = campos.get("foto");
  const boton = formulario.querySelector("button");

  if (!nombre) {
        alert(textoApp("Escribe tu nombre.", "Enter your name."));
    return;
  }

  boton.disabled = true;

  try {
    let foto = data.perfil?.foto || "";

    if (archivo && archivo.size > 0) {
      const url = URL.createObjectURL(archivo);

      try {
        const imagen = new Image();

        await new Promise((resolve, reject) => {
          imagen.onload = resolve;
          imagen.onerror = () => reject(
                        new Error(textoApp("No se pudo abrir la foto. Prueba con JPG o PNG.", "Could not open the photo. Try a JPG or PNG image."))
          );
          imagen.src = url;
        });

        const escala = Math.min(
          1, 400 / Math.max(imagen.naturalWidth, imagen.naturalHeight)
        );

        const lienzo = document.createElement("canvas");
        lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));

        const contexto = lienzo.getContext("2d");
                if (!contexto) throw new Error(textoApp("No se pudo preparar la foto.", "Could not process the photo."));

        contexto.fillStyle = "#ffffff";
        contexto.fillRect(0, 0, lienzo.width, lienzo.height);
        contexto.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
        foto = lienzo.toDataURL("image/jpeg", 0.8);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    const nuevosDatos = {...data, perfil: {nombre, foto}};
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
    data = nuevosDatos;
    perfil();
  } catch (error) {
    alert(
      error.name === "QuotaExceededError"
               ? textoApp("No hay espacio suficiente para guardar la foto.", "There is not enough storage space to save the photo.")
                : error.message || textoApp("No se pudo guardar el perfil.", "Could not save the profile.")
    );
  } finally {
    boton.disabled = false;
  }
}

function abrirNuevaCuenta() {
    const nombre = prompt(textoApp("Nombre del banco o cuenta:", "Bank or account name:"));
  if (nombre === null || !nombre.trim()) return;

    const tipo = prompt(textoApp("Tipo: cheques o ahorro", "Type: checking or savings"), textoApp("ahorro", "savings"));
  if (tipo === null) return;
    const t = tipo.trim().toLowerCase().replace(/^checking$/, "cheques").replace(/^savings$/, "ahorro");
  if (t !== "cheques" && t !== "ahorro") {
        alert(textoApp("Escribe cheques o ahorro.", "Enter checking or savings."));
    return;
  }

    const s = prompt(textoApp("Saldo inicial en dólares:", "Starting balance in dollars:"));
  if (s === null) return;
  const saldo = Number(s);
  if (!s.trim() || !Number.isFinite(saldo) || saldo < 0) {
        alert(textoApp("Saldo no válido.", "Invalid balance."));
    return;
  }

    const m = prompt(textoApp("Meta en dólares:", "Savings goal in dollars:"), "0");
  if (m === null) return;
  const meta = Number(m);
  if (!m.trim() || !Number.isFinite(meta) || meta < 0) {
        alert(textoApp("Meta no válida.", "Invalid savings goal."));
    return;
  }

  const clave = "amfinance-cuentas-banco";
  let cuentas = [];
  try {
    cuentas = JSON.parse(localStorage.getItem(clave) || "[]");
    if (!Array.isArray(cuentas)) cuentas = [];
  } catch (e) {}

  cuentas.push({
    id: Date.now().toString(),
    nombre: nombre.trim(),
    tipo: t,
    saldo: saldo,
    meta: meta
  });

  localStorage.setItem(clave, JSON.stringify(cuentas));
  go("inicio");
    alert(textoApp("Cuenta creada correctamente.", "Account created successfully."));
}


function abrirCuentaBanco(id) {
  const clave = "amfinance-cuentas-banco";
  let cuentas;

  try {
    cuentas = JSON.parse(localStorage.getItem(clave) || "[]");
    if (!Array.isArray(cuentas)) return;
  } catch (e) {
        alert(textoApp("No se pudieron leer las cuentas.", "Could not load accounts."));
    return;
  }

  const cuenta = cuentas.find(c => String(c.id) === String(id));
  if (!cuenta) {
        alert(textoApp("Cuenta no encontrada.", "Account not found."));
    return;
  }

  const opcion = prompt(
        cuenta.nombre + textoApp("\nSaldo: ", "\nBalance: ") + money(cuenta.saldo) +
    textoApp("\n\nEscribe:\n1 - Depositar\n2 - Retirar", "\n\nEnter:\n1 - Deposit\n2 - Withdraw")
  );

  if (opcion === null) return;
  if (opcion !== "1" && opcion !== "2") {
        alert(textoApp("Selecciona 1 o 2.", "Select 1 or 2."));
    return;
  }

    const entrada = prompt(textoApp("Cantidad en dólares:", "Amount in dollars:"));
  if (entrada === null) return;
  const monto = Number(entrada);

  if (!entrada.trim() || !Number.isFinite(monto) || monto <= 0) {
        alert(textoApp("Introduce una cantidad válida.", "Enter a valid amount."));
    return;
  }

  const saldoActual = Number(cuenta.saldo) || 0;

  if (opcion === "2" && monto > saldoActual) {
        alert(textoApp("Saldo insuficiente.", "Insufficient funds."));
    return;
  }

  cuenta.saldo = Math.round(
    (saldoActual + (opcion === "1" ? monto : -monto)) * 100
  ) / 100;

  if (!Array.isArray(cuenta.historial)) cuenta.historial = [];

  cuenta.historial.push({
    fecha: new Date().toISOString(),
    tipo: opcion === "1" ? "deposito" : "retiro",
    monto: monto
  });

  localStorage.setItem(clave, JSON.stringify(cuentas));
  go("inicio");
    alert(textoApp("Operación realizada. Nuevo saldo: ", "Transaction completed. New balance: ") + money(cuenta.saldo));
}

      "button, input, select"
    )].filter(c => !c.disabled);
    const primero = campos[0];
    const ultimo = campos[campos.length - 1];

    if (event.shiftKey && document.activeElement === primero) {
      event.preventDefault();
      ultimo.focus();

      event.preventDefault();

let gestoMovimiento = null;

document.addEventListener("touchstart", event => {
  gestoMovimiento = null;

  if (
    event.touches.length !== 1 ||
    window.scrollY > 0 ||
    event.touches[0].clientY > 140 ||
    event.target.closest(
      "input,select,textarea,button,a,nav,#amMenu,#movVentana,#movVentanaFondo"
    ) ||
    document.getElementById("amMenu").classList.contains("abierto") ||
    !document.getElementById("movVentana").classList.contains("hidden")
  ) return;

  gestoMovimiento = {
    x: event.touches[0].clientX,
    y: event.touches[0].clientY,
    distancia: 0
  };
}, {passive: true});

document.addEventListener("touchmove", event => {
  if (!gestoMovimiento) return;
  if (event.touches.length !== 1) {
    gestoMovimiento = null;
    return;
  }

  const dx = event.touches[0].clientX - gestoMovimiento.x;
  const dy = event.touches[0].clientY - gestoMovimiento.y;

  if (dy < -10 || Math.abs(dx) > Math.max(20, Math.abs(dy))) {
    gestoMovimiento = null;
    return;
  }

  gestoMovimiento.distancia = dy;
  if (dy > 12 && event.cancelable) event.preventDefault();
}, {passive: false});

document.addEventListener("touchend", () => {
  const abrir = gestoMovimiento && gestoMovimiento.distancia > 70;
  gestoMovimiento = null;
  if (abrir) abrirMovVentana();
}, {passive: true});

document.addEventListener("touchcancel", () => {
  gestoMovimiento = null;
}, {passive: true});

  const g = gestoBanco;
  if (!g || event.pointerId !== g.id) return;

  const dx = event.clientX - g.x;
  const dy = event.clientY - g.y;

  if (!g.horizontal) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
      gestoBanco = null;
      return;
    }

    if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy)) {
      return;
    }

    g.horizontal = true;
    g.tarjeta.setPointerCapture(event.pointerId);
  }

  g.dx = dx;
  if (event.cancelable) event.preventDefault();
}, {passive: false});

document.addEventListener("pointerup", event => {
  const g = gestoBanco;
  if (!g || event.pointerId !== g.id) return;
  gestoBanco = null;

  if (!g.horizontal) return;

  clicBancoBloqueado.set(g.tarjeta, performance.now() + 600);

  if (g.dx < -35) mostrarAccionesBanco(g.fila, true);
  if (g.dx > 35) mostrarAccionesBanco(g.fila, false);
});

document.addEventListener("pointercancel", () => {
  gestoBanco = null;
});

document.addEventListener("click", event => {
  const tarjeta = event.target.closest(
    ".banco-deslizable > .banco-card"
  );

  if (tarjeta) {
    const bloqueado = clicBancoBloqueado.get(tarjeta) || 0;
    const abierta = tarjeta.parentElement.classList.contains("abierta");

    if (performance.now() < bloqueado || abierta) {
      event.preventDefault();
      event.stopImmediatePropagation();

      if (performance.now() >= bloqueado) {
        mostrarAccionesBanco(tarjeta.parentElement, false);
      }
      return;
    }
  }

  if (!event.target.closest(".banco-deslizable")) {
    mostrarAccionesBanco(null, false);
  }
}, true);

document.addEventListener("keydown", event => {
  const tarjeta = event.target.closest(
    ".banco-deslizable > .banco-card"
  );

  if (tarjeta && event.key === "ArrowLeft") {
    event.preventDefault();
    mostrarAccionesBanco(tarjeta.parentElement, true);

    const fila = document.querySelector(".banco-deslizable.abierta");

      mostrarAccionesBanco(fila, false);

});

function eliminarCuentaBanco(identificador) {
  const clave = "amfinance-cuentas-banco";

  try {
    const cuentas = JSON.parse(localStorage.getItem(clave) || "[]");
    if (!Array.isArray(cuentas)) throw new Error();

    const cuenta = cuentas.find(
      c => String(c.id) === String(identificador)
    );

    if (!cuenta) {
      alert(textoApp("Cuenta no encontrada.", "Account not found."));
      return;
    }

    const tieneMovimientos = data.movimientos.some(
      m => String(m.cuentaId) === String(cuenta.id)
    );

    const tienePagos = data.pagos.some(
      p => String(p.bancoId) === String(cuenta.id)
    );

    if (tieneMovimientos || tienePagos) {
      alert(textoApp(
        "Esta cuenta tiene movimientos o pagos vinculados y no se puede eliminar.",
        "This account has linked transactions or payments and cannot be deleted."
      ));
      return;
    }

    const mensaje = textoApp(
      "¿Eliminar la cuenta ",
      "Delete account "
    ) + cuenta.nombre + "?\n\n" + textoApp(
      "Se eliminarán de Balance One la cuenta y su historial de depósitos y retiros. Esta acción no se puede deshacer.",
      "The account and its deposit and withdrawal history will be removed from Balance One. This cannot be undone."
    );

    if (!confirm(mensaje)) return;

    const restantes = cuentas.filter(
      c => String(c.id) !== String(cuenta.id)
    );

    localStorage.setItem(clave, JSON.stringify(restantes));
    go("inicio");

    alert(textoApp(
      "Cuenta eliminada.",
      "Account deleted."
    ));
  } catch (error) {
    alert(textoApp(
      "No se pudo eliminar la cuenta.",
      "Could not delete the account."
    ));
  }
}

function barraProgreso(valor, color = "#ff7900", diseno) {
  const estilos = ["clasica", "fina", "capsula", "segmentada", "3d"];
  let estilo = diseno;

  if (!estilo) {
    try {
      estilo = localStorage.getItem("balanceone-progreso");
    } catch {}
  }

  if (!estilos.includes(estilo)) estilo = "clasica";
  if (!/^#[0-9a-f]{6}$/i.test(color)) color = "#ff7900";
  if (color.toLowerCase() === "#ff7900") {
    color = "var(--balanceone-color, #ff7900)";
  }

  const numero = Number(valor);
  const porcentaje = Number.isFinite(numero)
    ? Math.min(100, Math.max(0, numero))
    : 0;

  const alto = estilo === "fina" ? 3
    : estilo === "capsula" || estilo === "3d" ? 10 : 6;

  const fondo = "rgba(130,140,155,.22)";
  let interior;

  if (estilo === "segmentada") {
    interior = Array.from({length: 12}, (_, i) => {
      const relleno = Math.min(100, Math.max(
        0, (porcentaje / 100 * 12 - i) * 100
      ));

      return `<span style="display:block;flex:1;height:6px;
        border-radius:999px;background:linear-gradient(to right,
        ${color} ${relleno}%,${fondo} ${relleno}%)"></span>`;
    }).join("");
  } else {
    const brillo = estilo === "3d"
      ? "box-shadow:inset 0 2px 2px rgba(255,255,255,.5),inset 0 -2px 2px rgba(0,0,0,.2);"
      : estilo === "capsula"
        ? "box-shadow:0 2px 5px rgba(0,0,0,.2);"
        : "";

    interior = `<span style="display:block;height:100%;
      width:${porcentaje}%;border-radius:inherit;
      background:${color};${brillo}"></span>`;
  }

  return `<div data-progreso="${estilo}"
    data-valor="${porcentaje}" data-color="${color}"
    role="progressbar"
    aria-label="${textoApp("Progreso", "Progress")}"
    aria-valuemin="0" aria-valuemax="100"
    aria-valuenow="${porcentaje}"
    style="display:${estilo === "segmentada" ? "flex" : "block"};
    gap:3px;width:100%;height:${alto}px;border-radius:999px;
    background:${estilo === "segmentada" ? "transparent" : fondo}">
    ${interior}
  </div>`;
}

function aplicarEstiloProgreso(estilo) {
  if (!["clasica", "fina", "capsula", "segmentada", "3d"].includes(estilo)) {
    return;
  }

  localStorage.setItem("balanceone-progreso", estilo);

  document.querySelectorAll("[data-progreso]").forEach(barra => {
    barra.outerHTML = barraProgreso(
      barra.dataset.valor,
      barra.dataset.color,
      estilo
    );
  });
}

function calcularSimulacion(tipo, v) {
  const error = (es, en) => ({error: textoApp(es, en)});
  const redondear = n =>
    Math.round((n + Number.EPSILON) * 100) / 100;

  const monto = Number(v.monto);
  const tasa = Number(v.tasa);

  if (!Number.isFinite(monto) || monto < 0 || monto > 1e9 ||
      !Number.isFinite(tasa) || tasa < 0 || tasa > 100) {
    return error(
      "Revisa el importe y la tasa anual (0 a 100%).",
      "Check the amount and annual rate (0 to 100%)."
    );
  }

  const r = tasa / 1200;

  if (tipo === "prestamo" || tipo === "hipoteca") {
    const plazo = Number(v.plazo);
    const meses = tipo === "hipoteca" ? plazo * 12 : plazo;

    if (monto <= 0 || !Number.isInteger(plazo) ||
        plazo <= 0 || meses > 600) {
      return error(
        "Revisa el monto y el plazo (máximo 50 años).",
        "Check the amount and term (50 years maximum)."
      );
    }

    const mensual = r === 0 ? monto / meses
      : monto * r / (1 - Math.pow(1 + r, -meses));

    const total = mensual * meses;

    return {
      principal: monto, mensual, meses, total,
      intereses: Math.max(0, total - monto)
    };
  }

  if (tipo === "tarjeta") {
    const pago = redondear(Number(v.pago));
    let saldo = redondear(monto);

    if (saldo <= 0 || !Number.isFinite(pago) || pago <= 0) {
      return error(
        "Introduce una deuda y un pago mensual mayores que cero.",
        "Enter a debt and monthly payment greater than zero."
      );
    }

    const principal = saldo;
    let total = 0, intereses = 0, meses = 0;

    while (saldo > 0 && meses < 1200) {
      const interes = redondear(saldo * r);

      if (pago <= interes) {
        return error(
          "Ese pago no reduce la deuda. Aumenta el pago mensual.",
          "That payment does not reduce the debt. Increase the monthly payment."
        );
      }

      const abono = Math.min(pago, redondear(saldo + interes));
      saldo = redondear(saldo + interes - abono);
      total = redondear(total + abono);
      intereses = redondear(intereses + interes);
      meses++;
    }

    if (saldo > 0) return error(
      "El plazo supera 100 años. Aumenta el pago mensual.",
      "The payoff term exceeds 100 years. Increase the monthly payment."
    );

    return {principal, mensual: pago, meses, total, intereses};
  }

  if (tipo === "ahorro") {
    const aporte = Number(v.aporte);
    const plazo = Number(v.plazo);

    if (!Number.isFinite(aporte) || aporte < 0 || aporte > 1e9 ||
        !Number.isInteger(plazo) || plazo < 1 || plazo > 50) {
      return error(
        "Revisa la aportación y el plazo (1 a 50 años).",
        "Check the contribution and term (1 to 50 years)."
      );
    }

    const meses = plazo * 12;
    const aportado = monto + aporte * meses;
    const factor = Math.pow(1 + r, meses);

    const total = r === 0 ? aportado
      : monto * factor + aporte * (factor - 1) / r;

    if (!Number.isFinite(total) || total > 1e12) return error(
      "El resultado es demasiado grande. Revisa los valores.",
      "The result is too large. Check the values."
    );

    return {
      principal: aportado, mensual: aporte, meses, total,
      intereses: Math.max(0, total - aportado)
    };
  }

  return error("Calculadora no válida.", "Invalid calculator.");
}

    ));

      ));

    campos.push(campo(

      tipo === "prestamo"

    ),
    hipoteca: textoApp(
      "Solo capital e intereses. No incluye impuestos, seguros ni comisiones.",
      "Principal and interest only. Excludes taxes, insurance and fees."
    ),
    tarjeta: textoApp(
      "Pago fijo e interés mensual estimado. Sin compras nuevas ni comisiones.",
      "Fixed payment and estimated monthly interest. No new purchases or fees."
    ),
    ahorro: textoApp(
      "Tasa nominal anual con capitalización mensual y aportaciones al final del mes. Sin impuestos ni comisiones.",
      "Nominal annual rate compounded monthly, with contributions at month end. Excludes taxes and fees."
    )

  const ventana = crearVentanaApariencia(
    titulos[tipo],
    `
      <div data-campos-simulacion>
        ${campos.map(c => `
          <label for="sim-${c.nombre}"
            style="display:grid;
            grid-template-columns:minmax(0,1fr) minmax(100px,45%);
            align-items:center;gap:12px;margin:12px 0;
            font-size:.85rem">
            <span>${c.etiqueta}</span>

            <input id="sim-${c.nombre}" name="${c.nombre}"
              type="number" inputmode="decimal" required
              value="${c.valor}" min="${c.minimo}"
              max="${c.maximo}" step="${c.paso}"
              style="margin:0;min-width:0;padding:10px;

          </label>
        `).join("")}
      </div>

      <div data-resultado-simulacion
        aria-live="polite"
        style="margin-top:18px;padding-top:16px;
        border-top:1px solid rgba(130,140,155,.22)">
      </div>

      <p class="note" style="font-size:.72rem;margin-top:16px">
        ${notas[tipo]}
      </p>
       `,
    true
  );

  if (!ventana) return;
   let deslizamiento = null;

  ventana.addEventListener("touchstart", event => {
    deslizamiento = null;

    if (event.touches.length !== 1 ||
        ventana.scrollTop > 0 ||
        event.target.closest("input,select,textarea,button")) return;

    const toque = event.touches[0];
    if (toque.clientY - ventana.getBoundingClientRect().top > 110) return;

    deslizamiento = {
      x: toque.clientX,
      y: toque.clientY,
      distancia: 0

      deslizamiento.distancia > 60;

    deslizamiento = null;

  }, {passive: true});

  }, {passive: true});

    input.addEventListener("input", () => {
      actualizarSimulacion(ventana, tipo);
    });
  });

  actualizarSimulacion(ventana, tipo);
}
function actualizarSimulacion(ventana, tipo) {
  const resultado = ventana.querySelector("[data-resultado-simulacion]");
  if (!resultado) return;

  const valores = {};
  const inputs = [...ventana.querySelectorAll(
    "[data-campos-simulacion] input"
  )];

  if (inputs.some(input =>
      !input.validity.valid || !Number.isFinite(input.valueAsNumber))) {
    resultado.textContent = textoApp(
      "Completa los campos con valores válidos.",
      "Complete the fields with valid values."
    );
    return;
  }

  inputs.forEach(input => {
    valores[input.name] = input.valueAsNumber;
  });

  const r = calcularSimulacion(tipo, valores);

  if (r.error) {
    resultado.textContent = r.error;
    return;
  }

  const ahorro = tipo === "ahorro";
  const tarjeta = tipo === "tarjeta";

  const titulo = ahorro
    ? textoApp("Ahorro estimado", "Estimated savings")
    : tarjeta
      ? textoApp("Plazo para pagar", "Time to pay off")
      : textoApp("Pago mensual estimado", "Estimated monthly payment");

  const principal = tarjeta
    ? r.meses + " " + textoApp(
        r.meses === 1 ? "mes" : "meses",
        r.meses === 1 ? "month" : "months"
      )
    : money(ahorro ? r.total : r.mensual);

  const filas = ahorro ? [
    [textoApp("Total aportado", "Total contributed"), money(r.principal)],
    [textoApp("Intereses estimados", "Estimated interest"), money(r.intereses)]
  ] : [
    [textoApp("Intereses estimados", "Estimated interest"), money(r.intereses)],
    [textoApp("Total a pagar", "Total to pay"), money(r.total)]
  ];

  if (tarjeta) filas.unshift([
    textoApp("Pago mensual fijo", "Fixed monthly payment"),
    money(r.mensual)
  ]);

  const porcentaje = r.total > 0
    ? Math.min(100, Math.max(0, r.principal / r.total * 100))
    : 0;

  resultado.innerHTML = `
    <p class="label" style="margin:0 0 8px">${titulo}</p>

    <strong style="display:block;font-size:1.9rem;
      color:var(--balanceone-color,#ff7900);
      margin-bottom:18px;overflow-wrap:anywhere">
      ${principal}
    </strong>

    ${filas.map(([etiqueta, importe]) => `
      <div style="display:flex;justify-content:space-between;
        gap:12px;margin:10px 0;font-size:.85rem">
        <span>${etiqueta}</span>
        <strong style="text-align:right;overflow-wrap:anywhere">
          ${importe}
        </strong>
      </div>
    `).join("")}

    <div style="margin-top:16px">
      ${barraProgreso(porcentaje)}
    </div>

    <div class="label" style="display:flex;
      justify-content:space-between;gap:10px;
      margin-top:7px;font-size:.68rem">
      <span>
        ${ahorro
          ? textoApp("Aportaciones", "Contributions")
          : textoApp("Capital", "Principal")}
        ${Math.round(porcentaje)}%
      </span>
      <span>
        ${textoApp("Intereses", "Interest")}
        ${r.total > 0 ? 100 - Math.round(porcentaje) : 0}%
      </span>
    </div>
  `;
}
function eliminarTarjetaCredito(indice) {
  const tarjeta = data.tarjetas[indice];
  if (!tarjeta) return;

  const tienePagos = data.pagos.some(p =>
    p.tipo === "tarjeta" && (
      p.cuentaId
        ? String(p.cuentaId) === String(tarjeta.id)
        : p.nombre === tarjeta.nombre
    )
  );

  if (tienePagos) {
    alert(textoApp(
      "Esta tarjeta tiene pagos registrados y no se puede eliminar para conservar su historial y los saldos vinculados.",
      "This card has recorded payments and cannot be deleted, to preserve its history and linked balances."
    ));
    return;
  }

  const mensaje = textoApp(
    "¿Eliminar de Balance One la tarjeta ",
    "Delete this card from Balance One: "
  ) + tarjeta.nombre + "?\n\n" + textoApp(
    "Se quitará su registro y su deuda del resumen. Esto no cancela la tarjeta ni la deuda con el banco.",
    "Its record and debt will be removed from the summary. This does not cancel the card or the debt with the bank."
  );

  if (!confirm(mensaje)) return;

  const nuevosDatos = {
    ...data,
    tarjetas: data.tarjetas.filter((t, i) => i !== indice)
  };

  try {
    localStorage.setItem(KEY, JSON.stringify(nuevosDatos));
  } catch {
    alert(textoApp(
      "No se pudo eliminar la tarjeta. No se hicieron cambios.",
      "Could not delete the card. No changes were made."
    ));
    return;
  }

  data = nuevosDatos;
  render();
  alert(textoApp("Tarjeta eliminada.", "Card deleted."));
}
let mesCalendario = month();
let diaCalendario = today();

function resumenDiaCalendario(fecha) {
  const registros = [
    ...data.movimientos.map(m => ({
      ...m,
      origenCalendario: "movimiento"
    })),
    ...data.pagos.map(p => ({
      ...p,
      tipoPago: p.tipo,
      tipo: "gasto",
      origenCalendario: "pago",
      nombre: textoApp("Pago: ", "Payment: ") + p.nombre
    }))
  ].filter(registro =>
    String(registro.fecha).slice(0, 10) === fecha &&
    Number.isFinite(Number(registro.monto)) &&
    Number(registro.monto) > 0
  );

  const ingresos = round(registros
    .filter(r => r.tipo === "ingreso")
    .reduce((total, r) => total + Number(r.monto), 0));

  const gastos = round(registros
    .filter(r => r.tipo !== "ingreso")
    .reduce((total, r) => total + Number(r.monto), 0));

  return {
    registros,
    ingresos,
    gastos,
    balance: round(ingresos - gastos)
  };
}

function cambiarMesCalendario(paso) {
  if (![1, -1].includes(paso)) return;

  const [anio, mes] = mesCalendario.split("-").map(Number);
  const fecha = new Date(anio, mes - 1 + paso, 1, 12);
  const nuevoAnio = fecha.getFullYear();

  if (nuevoAnio < 1000 || nuevoAnio > 9999) return;

  mesCalendario = nuevoAnio + "-" +
    String(fecha.getMonth() + 1).padStart(2, "0");

  diaCalendario = mesCalendario + "-01";
  transferencias();
}

function volverHoyCalendario() {
  mesCalendario = month();
  diaCalendario = today();
  transferencias();
}

function activarGestosDiaCalendario(ventana) {
  const cabecera = ventana.querySelector(".cal-dia-cabecera");
  const boton = ventana.querySelector("[data-ampliar-dia]");
  let gesto = null;

  const ampliar = activo => {
    ventana.classList.toggle("cal-expandida", activo);
    boton.setAttribute("aria-expanded", String(activo));

    boton.setAttribute("aria-label", activo
      ? textoApp("Reducir ventana", "Collapse window")
      : textoApp("Ampliar ventana", "Expand window"));
  };

  boton.onclick = () => {
    ampliar(!ventana.classList.contains("cal-expandida"));
  };

  cabecera.addEventListener("pointerdown", event => {
    gesto = null;

    if (!event.isPrimary || event.button !== 0 ||
        event.target.closest("button,input,select,textarea")) return;

    gesto = {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY
    };

    cabecera.setPointerCapture(event.pointerId);
    if (event.cancelable) event.preventDefault();
  });

  cabecera.addEventListener("pointerup", event => {
    if (!gesto || event.pointerId !== gesto.id) return;

    const dx = event.clientX - gesto.x;
    const dy = event.clientY - gesto.y;
    gesto = null;

    if (Math.abs(dy) < 55 ||
        Math.abs(dx) >= Math.abs(dy)) return;

    if (dy < 0) {
      ampliar(true);
    } else if (ventana.classList.contains("cal-expandida")) {
      ampliar(false);
    } else {
      ventana.close();
    }
  });

  cabecera.addEventListener("pointercancel", () => {
    gesto = null;
  });

  ampliar(false);
}

    formulario.style.display = "none";

    };

    editarBoton.onclick = () => {
      if (fila.querySelector(".editbox")) return;

      if (!original) return;

      const caja = document.createElement("div");
      caja.style.width = "100%";
      caja.innerHTML = editor({...original, origen});
      fila.appendChild(caja);

      const form = caja.querySelector("form");
      const cancelar = form.querySelector('[type="button"]');
      cancelar.removeAttribute("onclick");

        caja.remove();

      form.removeAttribute("onsubmit");
      form.onsubmit = event => {
        event.preventDefault();
        const anterior = JSON.stringify(findItem(origen, ident));

        guardarEdicion(event, origen, ident);

        const posterior = JSON.stringify(findItem(origen, ident));
        if (anterior !== posterior) {

      ventana.querySelector("[data-ampliar-dia]")
        .getAttribute("aria-expanded") === "false" &&
        ventana.querySelector("[data-ampliar-dia]").click();

      caja.scrollIntoView({behavior:"smooth", block:"nearest"});

    fila.appendChild(acciones);

function suscripcionesDelMes(
  mesElegido,
  registros = data.suscripciones
) {
  const [anio, mes] = mesElegido.split("-").map(Number);
  const ultimo = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
  const inicioMes = mesElegido + "-01";
  const finMes = mesElegido + "-" + String(ultimo).padStart(2,"0");
  const lista = Array.isArray(registros) ? registros : [];
  const eventos = [];

  for (const s of lista) {
    if (!validDate(String(s.inicio))) continue;

    const limite = s.fin && s.fin < finMes ? s.fin : finMes;
    if (s.inicio > limite || limite < inicioMes) continue;

    if (s.frecuencia === "cada14dias") {
      const convertir = fecha => {
        const [a,m,d] = fecha.split("-").map(Number);
        return Date.UTC(a,m-1,d);
      };

      const primero = convertir(s.inicio);
      const salto = 14 * 86400000;
      const comienzo = convertir(inicioMes);
      const final = convertir(limite);

      const pasos = Math.max(0, Math.ceil(
        (comienzo - primero) / salto
      ));

      for (
        let instante = primero + pasos * salto;
        instante <= final;
        instante += salto
      ) {
        eventos.push({
          ...s,
          fecha: new Date(instante).toISOString().slice(0,10)
        });
      }
    } else {
      const dia = Math.min(Number(s.inicio.slice(8,10)), ultimo);
      const fecha = mesElegido + "-" + String(dia).padStart(2,"0");

      if (fecha >= s.inicio && fecha <= limite) {
        eventos.push({...s, fecha});
      }
    }
  }

  return eventos.sort((a,b) => a.fecha.localeCompare(b.fecha));
}

function iconosDiaCalendario(fecha) {
  const [anio, mes] = fecha.slice(0,7).split("-").map(Number);
  const ultimo = new Date(anio, mes, 0, 12).getDate();
  const dia = Number(fecha.slice(8,10));

  const coincide = elemento => {
    const vencimiento = Number(elemento.vencimiento);
    return Number.isInteger(vencimiento) &&
      vencimiento >= 1 && vencimiento <= 31 &&
      Math.min(vencimiento, ultimo) === dia &&
      Number(elemento.saldo) > 0;
  };

  const eventos = [...prestamosDelMes(fecha.slice(0,7))
  .filter(p => p.fecha === fecha)
  .map(p => ({nombre:p.nombre, icono:"💰"})),
    ...suscripcionesDelMes(fecha.slice(0,7))
      .filter(s => s.fecha === fecha)
      .map(s => ({nombre:s.nombre, icono:"↻"})),
    ...data.tarjetas.filter(coincide)
      .map(t => ({nombre:t.nombre, icono:"💳"})),
    ...data.vehiculos.filter(coincide)
      .map(v => ({nombre:v.nombre, icono:"🚘"}))
  ];

  if (!eventos.length) return "";

  return `
    <span style="display:flex;align-items:center;
      justify-content:center;gap:0;margin-top:5px"
      aria-label="${safe(textoApp(
        "Cobros programados: ",

      `).join("")}

      ${eventos.length > 2 ? `
        <span style="font-size:9px">
          +${eventos.length - 2}
        </span>
      ` : ""}
    </span>
  `;
}

    `
      <p><strong>${safe(prestamo.nombre)}</strong></p>
      <p class="note">
        ${textoApp("Deuda pendiente: ", "Outstanding debt: ")}
        ${money(prestamo.saldo)}
      </p>

      <form id="formPagoPrestamo">
        <label for="pagoPrestamoBanco">
          ${textoApp("Cuenta de origen", "Pay from")}
        </label>
        <select id="pagoPrestamoBanco" name="cuentaId" required>
          <option value="">
            ${textoApp("Selecciona una cuenta", "Select an account")}
          </option>
          ${cuentas.map(c => `
            <option value="${safe(String(c.id))}">
              ${safe(c.nombre)} · ${money(c.saldo)}
            </option>
          `).join("")}
        </select>

        <label for="pagoPrestamoMonto">
          ${textoApp("Total pagado ($)", "Total paid ($)")}
        </label>
        <input id="pagoPrestamoMonto" name="monto"
          type="number" min="0.01" step="0.01"
          value="${Number(prestamo.cuota)}" required>

        <label for="pagoPrestamoInteres">
          ${textoApp(
            "Intereses incluidos en el pago ($)",
            "Interest included in this payment ($)"
          )}
        </label>
        <input id="pagoPrestamoInteres" name="intereses"
          type="number" min="0" step="0.01" value="0" required>

        <p class="note">${textoApp(
          "El total sale de tu cuenta. Solo el importe restante después de los intereses reduce la deuda.",
          "The total leaves your account. Only the amount remaining after interest reduces the debt."
        )}</p>

        <label for="pagoPrestamoFecha">
          ${textoApp("Fecha del pago", "Payment date")}
        </label>
        <input id="pagoPrestamoFecha" name="fecha"
          type="date" value="${today()}" required>

        <button type="submit" class="primary"
          style="background:var(--balanceone-color,#ff7900)">
          ${textoApp("Guardar pago", "Save payment")}
        </button>
      </form>
    `,
    true
  );

  if (!ventana) return;
  const form = ventana.querySelector("form");

  form.onsubmit = event => {
    event.preventDefault();
    if (form.dataset.guardado === "si") return;

    const actual = (data.prestamos || []).find(
      p => String(p.id) === String(prestamoId)
    );
    if (!actual) return;

    const f = new FormData(form);
    const cuentaId = String(f.get("cuentaId") || "");
    const monto = round(f.get("monto"));
    const interesPrestamo = round(f.get("intereses"));
    const fecha = String(f.get("fecha"));
    const capital = round(monto - interesPrestamo);

    if (
      !cuentas.some(c => String(c.id) === cuentaId) ||
      !validAmount(monto) ||
      !Number.isFinite(interesPrestamo) ||
      interesPrestamo < 0 ||
      !validAmount(capital) ||
      capital > Number(actual.saldo) ||
      !validDate(fecha)
    ) {
      alert(textoApp(
        "Revisa la cuenta, fecha e importes. El capital debe ser mayor que cero y no superar la deuda.",
        "Check the account, date and amounts. Principal must be positive and cannot exceed the debt."
      ));
      return;
    }

    const movimiento = {
      id:id(),
      cuentaId,
      prestamoId,
      nombre:textoApp("Pago: ", "Payment: ") + actual.nombre,
      tipo:"gasto",
      monto,
      interesPrestamo,
      fecha
    };

    if (!guardarMovimientoBanco(null, movimiento)) return;

    form.dataset.guardado = "si";
    form.querySelector('[type="submit"]').disabled = true;
    ventana.close();
    render();

    alert(textoApp(
      "Pago guardado. Cuenta bancaria y deuda actualizadas.",
      "Payment saved. Bank account and debt updated."
    ));
  };
}
</script>


</body>
</html>
